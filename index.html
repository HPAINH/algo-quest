      in:   1 2 3 4 6\n   1   3 6?         post: 1 3 2 6 4\n<\/code><\/pre>\n<p>Каждый узел посещается один раз: <strong>O(n)<\/strong> времени, память — высота дерева h (стек вызовов): O(log n) у сбалансированного, O(n) у «вытянутого».<\/p>"}, {"title": "Обход по уровням (задача 102)", "html": "<p>Очередь (глава 13): берём ровно столько узлов, сколько было на уровне в начале шага.<\/p>\n<pre><code class=\"language-python\">from collections import deque\n\ndef level_order(root):\n    if not root:\n        return []\n    res, q = [], deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):          # ровно текущий уровень\n            node = q.popleft()\n            level.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(level)\n    return res\n<\/code><\/pre>"}, {"title": "Итеративный in-order и ошибки", "html": "<p>Явный стек вместо рекурсии (глава 4) — когда дерево глубокое:<\/p>\n<pre><code class=\"language-python\">def inorder_iter(root):\n    out, st, cur = [], [], root\n    while cur or st:\n        while cur:                 # уходим влево до упора\n            st.append(cur); cur = cur.left\n        cur = st.pop()\n        out.append(cur.val)\n        cur = cur.right\n    return out\n<\/code><\/pre>\n<ul>\n<li>Забыть базовый случай <code>node is None<\/code>.<\/li>\n<li>В level-order брать <code>len(q)<\/code> внутри цикла, а не один раз до него.<\/li>\n<li>Путать порядок обходов: in-order — «узел посередине».<\/li>\n<\/ul>"}], "viz": "tree", "tasks": [{"id": "16-c1", "type": "choice", "title": "Порядок BST", "q": "Какой обход BST выдаёт значения по возрастанию?", "options": ["pre-order", "in-order", "post-order", "level-order"], "answer": 1, "hints": ["В BST слева меньше, справа больше.", "Нужно: всё левое, потом узел, потом правое.", "Узел посередине.", "Это in-order.", "In-order."], "expl": "In-order: левое → узел → правое — отсортированный порядок для BST."}, {"id": "16-c2", "type": "choice", "title": "Высота", "q": "Какой обход подходит, чтобы посчитать высоту дерева из высот детей?", "options": ["pre-order", "in-order", "post-order", "никакой"], "answer": 2, "hints": ["Высота узла зависит от детей.", "Значит, детей надо обработать раньше.", "Узел обрабатывается последним.", "Это post-order.", "Post-order."], "expl": "Ответ узла собирается из ответов детей — post-order."}, {"id": "16-k1", "type": "code", "title": "In-order по списку", "q": "Дерево задано списком по уровням: детьми узла i являются 2i + 1 и 2i + 2, None — нет узла. Верни in-order обход (значения без None).", "fn": "inorder", "starter": "def inorder(vals):\n    pass\n", "tests": [{"args": [[4, 2, 6, 1, 3, 5, 7]], "exp": [1, 2, 3, 4, 5, 6, 7], "hidden": false, "case": ""}, {"args": [[1, null, 2]], "exp": [1, 2], "hidden": false, "case": ""}, {"args": [[]], "exp": [], "hidden": true, "case": "пустое"}, {"args": [[1, 2, null, 3]], "exp": [3, 2, 1], "hidden": true, "case": "вытянутое влево"}], "ref": "def inorder(vals):\n    out = []\n    def go(i):\n        if i >= len(vals) or vals[i] is None:\n            return\n        go(2 * i + 1)\n        out.append(vals[i])\n        go(2 * i + 2)\n    go(0)\n    return out\n", "hints": ["Дети узла i — индексы 2i + 1 и 2i + 2.", "Базовый случай: индекс за пределами или None.", "In-order: левое, узел, правое.", "Собери значения в список.", "Начни с индекса 0."], "expl": "Рекурсивный in-order по индексам: O(n).", "compare": "exact"}, {"id": "16-k2", "type": "code", "title": "Обход по уровням", "q": "Дерево задано списком по уровням: детьми узла i являются 2i + 1 и 2i + 2, None — нет узла. Верни список уровней (значения без None).", "fn": "level_order", "starter": "from collections import deque\n\ndef level_order(vals):\n    pass\n", "tests": [{"args": [[3, 9, 20, null, null, 15, 7]], "exp": [[3], [9, 20], [15, 7]], "hidden": false, "case": ""}, {"args": [[1]], "exp": [[1]], "hidden": false, "case": ""}, {"args": [[]], "exp": [], "hidden": true, "case": "пустое"}, {"args": [[1, 2, 3, 4]], "exp": [[1], [2, 3], [4]], "hidden": true, "case": "неполный уровень"}], "ref": "from collections import deque\n\ndef level_order(vals):\n    if not vals or vals[0] is None:\n        return []\n    res, q = [], deque([0])\n    while q:\n        level = []\n        for _ in range(len(q)):\n            i = q.popleft()\n            level.append(vals[i])\n            for c in (2 * i + 1, 2 * i + 2):\n                if c < len(vals) and vals[c] is not None:\n                    q.append(c)\n        res.append(level)\n    return res\n", "hints": ["Очередь индексов, старт с 0.", "Каждый шаг — ровно len(q) узлов текущего уровня.", "Добавляй детей, если они существуют.", "Собери уровень в список.", "Пустое дерево — пустой ответ."], "expl": "BFS по уровням: O(n).", "compare": "exact", "leetcode": 102}], "test": [{"q": "Порядок pre-order:", "options": ["левое, узел, правое", "узел, левое, правое", "левое, правое, узел", "по уровням"], "answer": 1}, {"q": "Память рекурсивного обхода:", "options": ["O(1)", "O(h), h — высота", "O(n²)", "O(log n) всегда"], "answer": 1}, {"q": "Обход по уровням использует:", "options": ["стек", "очередь", "кучу", "хеш"], "answer": 1}, {"q": "Сложность любого обхода дерева из n узлов:", "options": ["O(n)", "O(n log n)", "O(log n)", "O(n²)"], "answer": 0}, {"q": "Чтобы обработать уровень целиком, len(q) берут:", "options": ["на каждой итерации", "один раз перед циклом уровня", "после цикла", "не берут"], "answer": 1}]}, {"title": "Глава 17. Задачи на деревья", "short": "Задачи на деревья", "part": "Часть V · Деревья", "cards": [{"title": "Два типа рекурсии по дереву", "html": "<p>Почти любая задача на дерево — одна из двух схем:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Схема<\/th>\n<th>Что делаем<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ответ снизу вверх<\/td>\n<td>функция возвращает значение поддерева, родитель собирает<\/td>\n<td>высота, диаметр, сбалансированность<\/td>\n<\/tr>\n<tr>\n<td>данные сверху вниз<\/td>\n<td>передаём параметр вниз (сумма пути, границы)<\/td>\n<td>путь с суммой, проверка BST<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Три вопроса из главы 4 работают и здесь: что функция возвращает, базовый случай (<code>None<\/code>), как собрать ответ из детей.<\/p>"}, {"title": "Диаметр (задача 543): глобальный ответ", "html": "<p>Диаметр — самый длинный путь между двумя узлами (в рёбрах). Он проходит через какой-то узел как «левая глубина + правая глубина». Функция возвращает <strong>глубину<\/strong>, а по пути обновляет <strong>глобальный<\/strong> максимум.<\/p>\n<pre><code class=\"language-python\">def diameter(root):\n    best = 0\n    def depth(node):\n        nonlocal best\n        if not node:\n            return 0\n        l, r = depth(node.left), depth(node.right)\n        best = max(best, l + r)       # путь через этот узел\n        return 1 + max(l, r)          # глубина для родителя\n    depth(root)\n    return best\n<\/code><\/pre>\n<p>Приём «возвращаю одно, а обновляю другое» решает также 124 (максимальная сумма пути) и 110 (сбалансированность).<\/p>"}, {"title": "Сверху вниз: путь с суммой (112) и LCA (236)", "html": "<p>Передаём остаток суммы вниз:<\/p>\n<pre><code class=\"language-python\">def has_path_sum(node, target):\n    if not node:\n        return False\n    if not node.left and not node.right:          # лист\n        return target == node.val\n    rest = target - node.val\n    return has_path_sum(node.left, rest) or has_path_sum(node.right, rest)\n<\/code><\/pre>\n<p><strong>LCA<\/strong> (ближайший общий предок p и q): если p и q нашлись в разных поддеревьях — текущий узел и есть предок; иначе ответ в том поддереве, где нашлось.<\/p>\n<pre><code class=\"language-python\">def lca(node, p, q):\n    if not node or node is p or node is q:\n        return node\n    l, r = lca(node.left, p, q), lca(node.right, p, q)\n    return node if l and r else (l or r)\n<\/code><\/pre>"}, {"title": "Ошибки", "html": "<ul>\n<li>Путь до <strong>листа<\/strong>: проверять, что у узла нет детей, а не просто <code>node is None<\/code>.<\/li>\n<li>Диаметр в рёбрах или в узлах — уточни.<\/li>\n<li>Возвращать из функции глобальный ответ вместо глубины.<\/li>\n<li>O(n²) вместо O(n): считать высоту заново для каждого узла (задача 110).<\/li>\n<\/ul>"}], "viz": "tree", "tasks": [{"id": "17-c1", "type": "choice", "title": "Диаметр", "q": "Диаметр дерева проходит через узел как:", "options": ["высота узла", "глубина левого + глубина правого", "число листьев", "значение узла"], "answer": 1, "hints": ["Путь идёт вниз в оба поддерева.", "Длина левой части — глубина левого.", "Правой — глубина правого.", "Сложи их.", "l + r."], "expl": "Через узел проходит путь длины l + r; максимум по узлам — диаметр."}, {"id": "17-c2", "type": "choice", "title": "LCA", "q": "В задаче LCA узел — общий предок, если:", "options": ["у него два ребёнка", "p найден в одном поддереве, q — в другом", "он корень", "он лист"], "answer": 1, "hints": ["Где лежат p и q относительно узла?", "Если в разных поддеревьях…", "…то ниже их пути расходятся.", "Значит, этот узел — ближайший общий.", "l и r оба не None."], "expl": "p и q по разные стороны — текущий узел их LCA."}, {"id": "17-k1", "type": "code", "title": "Максимальная глубина", "q": "Дерево задано списком по уровням: детьми узла i являются 2i + 1 и 2i + 2, None — нет узла. Верни глубину (число уровней).", "fn": "max_depth", "starter": "def max_depth(vals):\n    pass\n", "tests": [{"args": [[3, 9, 20, null, null, 15, 7]], "exp": 3, "hidden": false, "case": ""}, {"args": [[1, null, 2]], "exp": 2, "hidden": false, "case": ""}, {"args": [[]], "exp": 0, "hidden": true, "case": "пустое"}, {"args": [[1, 2, null, 3]], "exp": 3, "hidden": true, "case": "вытянутое"}], "ref": "def max_depth(vals):\n    def d(i):\n        if i >= len(vals) or vals[i] is None:\n            return 0\n        return 1 + max(d(2 * i + 1), d(2 * i + 2))\n    return d(0)\n", "hints": ["Что вернуть для пустого?", "0.", "Глубина = 1 + max глубин детей.", "Дети — 2i + 1 и 2i + 2.", "Post-order рекурсия."], "expl": "Снизу вверх: O(n).", "compare": "exact", "leetcode": 104}, {"id": "17-k2", "type": "code", "title": "Диаметр", "q": "Дерево задано списком по уровням: детьми узла i являются 2i + 1 и 2i + 2, None — нет узла. Верни диаметр в рёбрах.", "fn": "diameter", "starter": "def diameter(vals):\n    pass\n", "tests": [{"args": [[1, 2, 3, 4, 5]], "exp": 3, "hidden": false, "case": ""}, {"args": [[1, 2]], "exp": 1, "hidden": false, "case": ""}, {"args": [[1]], "exp": 0, "hidden": true, "case": "один узел"}, {"args": [[1, 2, null, 3, 4, null, null, 5, null, null, null, null, null, null, null, 6]], "exp": 4, "hidden": true, "case": "вся длина в левом поддереве"}], "ref": "def diameter(vals):\n    best = 0\n    def d(i):\n        nonlocal best\n        if i >= len(vals) or vals[i] is None:\n            return 0\n        l, r = d(2 * i + 1), d(2 * i + 2)\n        best = max(best, l + r)\n        return 1 + max(l, r)\n    d(0)\n    return best\n", "hints": ["Функция возвращает глубину.", "По пути обновляй глобальный best.", "Через узел — l + r рёбер.", "nonlocal best.", "Диаметр может не проходить через корень."], "expl": "Глубина вверх + глобальный максимум: O(n).", "compare": "exact", "leetcode": 543}, {"id": "17-k3", "type": "code", "title": "Путь с суммой", "q": "Дерево задано списком по уровням: детьми узла i являются 2i + 1 и 2i + 2, None — нет узла. Есть ли путь от корня до листа с суммой target?", "fn": "has_path_sum", "starter": "def has_path_sum(vals, target):\n    pass\n", "tests": [{"args": [[5, 4, 8, 11, null, 13, 4, 7, 2], 22], "exp": true, "hidden": false, "case": ""}, {"args": [[1, 2, 3], 5], "exp": false, "hidden": false, "case": ""}, {"args": [[], 0], "exp": false, "hidden": true, "case": "пустое"}, {"args": [[1, 2], 1], "exp": false, "hidden": true, "case": "корень не лист"}], "ref": "def has_path_sum(vals, target):\n    def ok(i, rest):\n        if i >= len(vals) or vals[i] is None:\n            return False\n        l, r = 2 * i + 1, 2 * i + 2\n        leaf = (l >= len(vals) or vals[l] is None) and (r >= len(vals) or vals[r] is None)\n        if leaf:\n            return rest == vals[i]\n        return ok(l, rest - vals[i]) or ok(r, rest - vals[i])\n    return ok(0, target)\n", "hints": ["Передавай остаток суммы вниз.", "Ответ проверяется только в листе.", "Лист — узел без детей.", "Пустое дерево — False.", "ok(left, rest − val) or ok(right, rest − val)."], "expl": "Сверху вниз с остатком: O(n). Подвох — корень с одним ребёнком не лист.", "compare": "exact", "leetcode": 112}], "test": [{"q": "Задача «высота / диаметр» — это схема:", "options": ["сверху вниз", "снизу вверх", "по уровням", "двоичный поиск"], "answer": 1}, {"q": "Путь с суммой — параметр передаётся:", "options": ["вверх", "вниз", "в глобальную переменную", "не передаётся"], "answer": 1}, {"q": "Сложность диаметра с глобальным максимумом:", "options": ["O(n²)", "O(n)", "O(n log n)", "O(h)"], "answer": 1}, {"q": "Лист — это узел:", "options": ["с одним ребёнком", "без детей", "корень", "любой"], "answer": 1}, {"q": "Пересчитывать высоту для каждого узла заново даёт:", "options": ["O(n)", "O(n²) в худшем", "O(log n)", "O(1)"], "answer": 1}]}, {"title": "Глава 18. BST", "short": "BST", "part": "Часть V · Деревья", "cards": [{"title": "Свойство BST", "html": "<p>В <strong>дереве поиска<\/strong> у каждого узла все значения левого поддерева меньше, правого — больше. Отсюда:<\/p>\n<ul>\n<li>поиск, вставка, удаление — спуск по одной ветке: <strong>O(h)<\/strong> (O(log n) у сбалансированного, O(n) у вытянутого);<\/li>\n<li>in-order обход — отсортированный порядок.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">def search(node, x):\n    while node and node.val != x:\n        node = node.left if x &lt; node.val else node.right\n    return node\n<\/code><\/pre>"}, {"title": "Проверка BST (задача 98)", "html": "<p>Ловушка: сравнивать узел только с детьми мало. Дерево <code>5 → (4, 6 → (3, 7))<\/code> проходит такую проверку, но 3 в правом поддереве 5 — нарушение. Нужно передавать <strong>границы<\/strong> вниз.<\/p>\n<pre><code class=\"language-python\">def is_valid_bst(node, lo=float('-inf'), hi=float('inf')):\n    if not node:\n        return True\n    if not lo &lt; node.val &lt; hi:\n        return False\n    return (is_valid_bst(node.left, lo, node.val) and\n            is_valid_bst(node.right, node.val, hi))\n<\/code><\/pre>\n<p>Альтернатива — in-order обход должен быть строго возрастающим.<\/p>"}, {"title": "k-й наименьший и LCA в BST", "html": "<p><strong>k-й наименьший<\/strong> (230) — k-й элемент in-order обхода.<\/p>\n<p><strong>LCA в BST<\/strong> (235) проще общего: если p и q оба меньше узла — идём влево, оба больше — вправо, иначе текущий узел — ответ. O(h), без рекурсии по обоим поддеревьям.<\/p>\n<pre><code class=\"language-python\">def lca_bst(node, p, q):\n    while node:\n        if p &lt; node.val and q &lt; node.val: node = node.left\n        elif p &gt; node.val and q &gt; node.val: node = node.right\n        else: return node.val\n<\/code><\/pre>"}, {"title": "Ошибки", "html": "<ul>\n<li>Проверять BST только сравнением с детьми.<\/li>\n<li>Нестрогие неравенства, когда дубликаты запрещены.<\/li>\n<li>Называть операции BST O(log n) без оговорки про несбалансированное дерево.<\/li>\n<\/ul>"}], "viz": "bst", "tasks": [{"id": "18-c1", "type": "choice", "title": "Проверка BST", "q": "Почему сравнения узла только с детьми недостаточно для проверки BST?", "options": ["Дети могут быть None", "Нарушение может быть глубже: элемент правого поддерева меньше предка", "Это слишком медленно", "Достаточно"], "answer": 1, "hints": ["Свойство касается всего поддерева, а не детей.", "Пример: 5 → правое 6 → левое 3.", "3 < 6 — с родителем всё ок.", "Но 3 < 5, а оно справа от 5.", "Нужны границы сверху."], "expl": "Свойство BST — про все значения поддерева; нужны границы lo/hi."}, {"id": "18-c2", "type": "choice", "title": "Поиск в BST", "q": "Сложность поиска в BST высоты h:", "options": ["O(1)", "O(h)", "O(n log n)", "O(n²)"], "answer": 1, "hints": ["Спуск идёт по одной ветке.", "Не больше одного узла на уровень.", "Уровней h.", "O(h).", "У сбалансированного h = log n."], "expl": "Спуск по одной ветке — O(h)."}, {"id": "18-k1", "type": "code", "title": "Проверка BST", "q": "Дерево задано списком по уровням: детьми узла i являются 2i + 1 и 2i + 2, None — нет узла. Верни True, если дерево — BST (значения уникальны, строгие неравенства).", "fn": "is_valid_bst", "starter": "def is_valid_bst(vals):\n    pass\n", "tests": [{"args": [[2, 1, 3]], "exp": true, "hidden": false, "case": ""}, {"args": [[5, 1, 4, null, null, 3, 6]], "exp": false, "hidden": false, "case": ""}, {"args": [[5, 4, 6, null, null, 3, 7]], "exp": false, "hidden": true, "case": "нарушение глубже"}, {"args": [[]], "exp": true, "hidden": true, "case": "пустое"}, {"args": [[1, 1]], "exp": false, "hidden": true, "case": "дубликат"}], "ref": "def is_valid_bst(vals):\n    def ok(i, lo, hi):\n        if i >= len(vals) or vals[i] is None:\n            return True\n        v = vals[i]\n        if not lo < v < hi:\n            return False\n        return ok(2 * i + 1, lo, v) and ok(2 * i + 2, v, hi)\n    return ok(0, float('-inf'), float('inf'))\n", "hints": ["Передавай границы (lo, hi) вниз.", "Корень: (−inf, inf).", "Влево: (lo, v), вправо: (v, hi).", "Строго lo < v < hi.", "Пустое поддерево — True."], "expl": "Границы сверху вниз: O(n).", "compare": "exact", "leetcode": 98}, {"id": "18-k2", "type": "code", "title": "LCA в BST", "q": "BST задано списком по уровням (дети i — 2i + 1 и 2i + 2). p и q есть в дереве. Верни значение их ближайшего общего предка.", "fn": "lca_bst", "starter": "def lca_bst(vals, p, q):\n    pass\n", "tests": [{"args": [[6, 2, 8, 0, 4, 7, 9], 2, 8], "exp": 6, "hidden": false, "case": ""}, {"args": [[6, 2, 8, 0, 4, 7, 9], 2, 4], "exp": 2, "hidden": false, "case": ""}, {"args": [[2, 1], 2, 1], "exp": 2, "hidden": true, "case": "предок — сам узел"}, {"args": [[6, 2, 8, 0, 4, 7, 9], 7, 9], "exp": 8, "hidden": true, "case": "правое поддерево"}], "ref": "def lca_bst(vals, p, q):\n    i = 0\n    while i < len(vals) and vals[i] is not None:\n        v = vals[i]\n        if p < v and q < v:\n            i = 2 * i + 1\n        elif p > v and q > v:\n            i = 2 * i + 2\n        else:\n            return v\n", "hints": ["Используй свойство BST.", "Оба меньше узла — LCA слева.", "Оба больше — справа.", "Иначе они расходятся здесь.", "Текущий узел — ответ."], "expl": "Спуск по одной ветке: O(h).", "compare": "exact", "leetcode": 235}], "test": [{"q": "In-order обход BST даёт:", "options": ["случайный порядок", "отсортированный порядок", "обратный порядок", "по уровням"], "answer": 1}, {"q": "Худший случай поиска в BST:", "options": ["O(log n)", "O(n) у вытянутого дерева", "O(1)", "O(n log n)"], "answer": 1}, {"q": "LCA в BST сложнее общего LCA?", "options": ["Да", "Нет, проще: один спуск по ветке", "Одинаково", "Не существует"], "answer": 1}, {"q": "k-й наименьший в BST — это:", "options": ["k-й в pre-order", "k-й в in-order", "k-й уровень", "k-й лист"], "answer": 1}, {"q": "Границы при спуске вправо от узла v:", "options": ["(lo, v)", "(v, hi)", "(lo, hi)", "(v, v)"], "answer": 1}]}, {"title": "Глава 19. Trie", "short": "Trie", "part": "Часть V · Деревья", "cards": [{"title": "Префиксное дерево", "html": "<p><strong>Trie<\/strong> хранит строки по буквам: путь от корня — префикс, у узла словарь детей и флаг «здесь кончается слово».<\/p>\n<pre><code class=\"language-python\">class Trie:\n    def __init__(self):\n        self.root = {}\n    def insert(self, w):\n        node = self.root\n        for ch in w:\n            node = node.setdefault(ch, {})\n        node['$'] = True              # конец слова\n    def _walk(self, s):\n        node = self.root\n        for ch in s:\n            if ch not in node:\n                return None\n            node = node[ch]\n        return node\n    def search(self, w):\n        node = self._walk(w)\n        return node is not None and '$' in node\n    def starts_with(self, p):\n        return self._walk(p) is not None\n<\/code><\/pre>\n<p>Вставка и поиск — <strong>O(L)<\/strong>, где L — длина слова, независимо от числа слов.<\/p>"}, {"title": "Когда Trie, а не множество", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Почему Trie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>«есть ли слово с префиксом» (208)<\/td>\n<td>у множества пришлось бы перебирать все слова<\/td>\n<\/tr>\n<tr>\n<td>автодополнение<\/td>\n<td>обход поддерева от узла префикса<\/td>\n<\/tr>\n<tr>\n<td>поиск слов на доске (212)<\/td>\n<td>обрываем DFS, как только префикса нет в Trie<\/td>\n<\/tr>\n<tr>\n<td>самый длинный общий префикс<\/td>\n<td>идём, пока у узла один ребёнок и нет конца слова<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ошибки: путать «слово» и «префикс» (флаг конца), хранить конец слова как ребёнка с буквой, которая может встретиться в тексте.<\/p>"}], "viz": "trie", "tasks": [{"id": "19-c1", "type": "choice", "title": "Сложность Trie", "q": "Сложность поиска слова длины L в Trie из n слов:", "options": ["O(n)", "O(L)", "O(n·L)", "O(log n)"], "answer": 1, "hints": ["Спуск идёт по буквам слова.", "На каждую букву — переход по словарю.", "Число слов не важно.", "L шагов.", "O(L)."], "expl": "Один переход на букву: O(L)."}, {"id": "19-c2", "type": "choice", "title": "Флаг конца", "q": "Зачем узлу флаг конца слова?", "options": ["Для скорости", "Отличить слово от префикса другого слова", "Чтобы хранить длину", "Не нужен"], "answer": 1, "hints": ["Вставим «apple».", "Есть ли слово «app»?", "Путь a-p-p существует.", "Но слова «app» не вставляли.", "Флаг различает."], "expl": "Путь существует для любого префикса; флаг говорит, что здесь кончается вставленное слово."}, {"id": "19-k1", "type": "code", "title": "Подсчёт по префиксам", "q": "Даны слова words и префиксы prefixes. Для каждого префикса верни, сколько слов с него начинается. Используй Trie со счётчиком в узлах.", "fn": "count_prefixes", "starter": "def count_prefixes(words, prefixes):\n    pass\n", "tests": [{"args": [["apple", "app", "apricot", "banana"], ["ap", "app", "b", "c"]], "exp": [3, 2, 1, 0], "hidden": false, "case": ""}, {"args": [["a"], [""]], "exp": [1], "hidden": false, "case": ""}, {"args": [[], ["a"]], "exp": [0], "hidden": true, "case": "нет слов"}, {"args": [["aa", "aa"], ["a"]], "exp": [2], "hidden": true, "case": "повтор слова"}], "ref": "def count_prefixes(words, prefixes):\n    root = {'#': 0}\n    for w in words:\n        node = root\n        node['#'] += 1\n        for ch in w:\n            node = node.setdefault(ch, {'#': 0})\n            node['#'] += 1\n    res = []\n    for p in prefixes:\n        node = root\n        for ch in p:\n            node = node.get(ch)\n            if node is None:\n                break\n        res.append(node['#'] if node else 0)\n    return res\n", "hints": ["Узел — словарь детей.", "Храни в узле счётчик слов, проходящих через него.", "При вставке увеличивай счётчик на каждом узле пути.", "Для префикса спустись и возьми счётчик.", "Нет пути — 0."], "expl": "Trie со счётчиками: O(сумма длин).", "compare": "exact"}], "test": [{"q": "Узел Trie хранит:", "options": ["одно слово", "детей по буквам и флаг конца", "хеш слова", "длину"], "answer": 1}, {"q": "Проверка «есть ли слово с префиксом p» стоит:", "options": ["O(n)", "O(|p|)", "O(n log n)", "O(1)"], "answer": 1}, {"q": "Trie выгоднее множества, когда:", "options": ["нужна проверка целого слова", "нужны запросы по префиксам", "слов мало", "никогда"], "answer": 1}, {"q": "Поиск слов на доске с Trie позволяет:", "options": ["сортировать", "обрывать DFS, когда префикса нет", "использовать BFS", "хешировать доску"], "answer": 1}, {"q": "Путь a-p-p есть, флага нет — значит:", "options": ["слово «app» вставлено", "«app» — только префикс", "ошибка", "дерево пустое"], "answer": 1}]}, {"title": "Глава 20. Union-Find", "short": "Union-Find", "part": "Часть V · Деревья", "cards": [{"title": "Система непересекающихся множеств", "html": "<p>DSU отвечает на два вопроса почти за O(1): <strong>объединить<\/strong> два множества и <strong>лежат ли<\/strong> два элемента в одном. Каждое множество — дерево, корень — представитель.<\/p>\n<pre><code class=\"language-python\">class DSU:\n    def __init__(self, n):\n        self.parent = list(range(n))\n        self.size = [1] * n\n    def find(self, x):\n        while self.parent[x] != x:\n            self.parent[x] = self.parent[self.parent[x]]   # сжатие пути\n            x = self.parent[x]\n        return x\n    def union(self, a, b):\n        ra, rb = self.find(a), self.find(b)\n        if ra == rb:\n            return False                                 # уже вместе — цикл\n        if self.size[ra] &lt; self.size[rb]:\n            ra, rb = rb, ra\n        self.parent[rb] = ra                             # меньшее под большее\n        self.size[ra] += self.size[rb]\n        return True\n<\/code><\/pre>\n<p>Сжатие пути + объединение по размеру дают почти константу на операцию (обратная функция Аккермана).<\/p>"}, {"title": "Когда DSU", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Как<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>число компонент связности (323, 547)<\/td>\n<td>n минус число успешных union<\/td>\n<\/tr>\n<tr>\n<td>лишнее ребро, образующее цикл (684)<\/td>\n<td>первое ребро, где union вернул False<\/td>\n<\/tr>\n<tr>\n<td>остовное дерево Крускала (глава 24)<\/td>\n<td>рёбра по возрастанию веса, union<\/td>\n<\/tr>\n<tr>\n<td>«связаны ли» при добавлении рёбер онлайн<\/td>\n<td>find(a) == find(b)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ошибки: сравнивать parent[a] == parent[b] вместо корней; забыть сжатие пути — деревья вырождаются в цепочки O(n).<\/p>"}], "viz": "dsu", "tasks": [{"id": "20-c1", "type": "choice", "title": "Один ли набор", "q": "Как проверить, что a и b в одном множестве?", "options": ["parent[a] == parent[b]", "find(a) == find(b)", "a == b", "size[a] == size[b]"], "answer": 1, "hints": ["parent — не обязательно корень.", "Представитель множества — корень.", "Корень находит find.", "Сравни корни.", "find(a) == find(b)."], "expl": "Сравнивают корни, а не непосредственных родителей."}, {"id": "20-c2", "type": "choice", "title": "Лишнее ребро", "q": "Union вернул False. Что это значит в задаче про лишнее ребро?", "options": ["Ошибка", "Концы ребра уже связаны — ребро создаёт цикл", "Граф пуст", "Ребро новое"], "answer": 1, "hints": ["Когда union возвращает False?", "Когда корни совпадают.", "Значит, путь между вершинами уже есть.", "Новое ребро замыкает цикл.", "Это лишнее ребро."], "expl": "Корни совпали — вершины уже связаны, ребро образует цикл."}, {"id": "20-k1", "type": "code", "title": "Число компонент", "q": "Граф из n вершин (0..n−1) и список рёбер. Верни число компонент связности через DSU.", "fn": "count_components", "starter": "def count_components(n, edges):\n    pass\n", "tests": [{"args": [5, [[0, 1], [1, 2], [3, 4]]], "exp": 2, "hidden": false, "case": ""}, {"args": [5, [[0, 1], [1, 2], [2, 3], [3, 4]]], "exp": 1, "hidden": false, "case": ""}, {"args": [3, []], "exp": 3, "hidden": true, "case": "без рёбер"}, {"args": [2, [[0, 1], [1, 0]]], "exp": 1, "hidden": true, "case": "повторное ребро"}], "ref": "def count_components(n, edges):\n    parent = list(range(n))\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n    comps = n\n    for a, b in edges:\n        ra, rb = find(a), find(b)\n        if ra != rb:\n            parent[ra] = rb\n            comps -= 1\n    return comps\n", "hints": ["Изначально каждая вершина — своя компонента.", "Каждое успешное объединение уменьшает число на 1.", "find с сжатием пути.", "Если корни равны — ничего не меняем.", "Ответ: n − успешные union."], "expl": "DSU: почти O(1) на ребро.", "compare": "exact", "leetcode": 323}, {"id": "20-k2", "type": "code", "title": "Лишнее ребро", "q": "Дерево из n вершин (1..n) с одним лишним ребром. Верни ребро, которое можно удалить; если таких несколько — последнее во входе.", "fn": "find_redundant", "starter": "def find_redundant(edges):\n    pass\n", "tests": [{"args": [[[1, 2], [1, 3], [2, 3]]], "exp": [2, 3], "hidden": false, "case": ""}, {"args": [[[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]]], "exp": [1, 4], "hidden": false, "case": ""}, {"args": [[[1, 2], [2, 1]]], "exp": [2, 1], "hidden": true, "case": "кратное ребро"}], "ref": "def find_redundant(edges):\n    parent = list(range(len(edges) + 1))\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n    for a, b in edges:\n        ra, rb = find(a), find(b)\n        if ra == rb:\n            return [a, b]\n        parent[ra] = rb\n", "hints": ["Добавляй рёбра по порядку.", "Перед добавлением проверь, связаны ли концы.", "Если уже связаны — это ребро замыкает цикл.", "Первое такое ребро и есть ответ (оно последнее в цикле).", "find с сжатием пути."], "expl": "DSU находит первое ребро, замыкающее цикл: O(n·α(n)).", "compare": "exact", "leetcode": 684}], "test": [{"q": "Две оптимизации DSU:", "options": ["сортировка и хеш", "сжатие пути и объединение по размеру", "кеш и стек", "BFS и DFS"], "answer": 1}, {"q": "Сложность операции DSU с оптимизациями:", "options": ["O(n)", "почти O(1)", "O(log² n)", "O(n log n)"], "answer": 1}, {"q": "Число компонент после всех рёбер:", "options": ["число рёбер", "n минус число успешных union", "число корней минус 1", "n"], "answer": 1}, {"q": "Без сжатия пути деревья DSU могут:", "options": ["исчезнуть", "выродиться в цепочки O(n)", "стать сбалансированными", "ничего"], "answer": 1}, {"q": "DSU используется в алгоритме:", "options": ["Дейкстры", "Крускала", "KMP", "бинарного поиска"], "answer": 1}]}, {"title": "Глава 21. BFS и DFS", "short": "BFS и DFS", "part": "Часть VI · Графы", "cards": [{"title": "Граф и его хранение", "html": "<p>Граф — вершины и рёбра. На собесе почти всегда <strong>список смежности<\/strong>:<\/p>\n<pre><code class=\"language-python\">from collections import defaultdict\ng = defaultdict(list)\nfor a, b in edges:\n    g[a].append(b)\n    g[b].append(a)          # для неориентированного\n<\/code><\/pre>\n<p>Сетка (матрица) — тоже граф: соседи клетки <code>(r, c)<\/code> — 4 направления.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обход<\/th>\n<th>Структура<\/th>\n<th>Что даёт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DFS<\/td>\n<td>стек / рекурсия<\/td>\n<td>компоненты, циклы, все пути<\/td>\n<\/tr>\n<tr>\n<td>BFS<\/td>\n<td>очередь<\/td>\n<td><strong>кратчайший путь в рёбрах<\/strong> в невзвешенном графе<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Оба — <strong>O(V + E)<\/strong>. Главное правило: множество <code>seen<\/code>, помечать вершину <strong>при добавлении<\/strong> в очередь, а не при извлечении.<\/p>"}, {"title": "Острова (задача 200): DFS по сетке", "html": "<pre><code class=\"language-python\">def num_islands(grid):\n    R, Cn = len(grid), len(grid[0])\n    def sink(r, c):\n        if not (0 &lt;= r &lt; R and 0 &lt;= c &lt; Cn) or grid[r][c] != '1':\n            return\n        grid[r][c] = '0'                       # пометили посещённой\n        for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)):\n            sink(r + dr, c + dc)\n    count = 0\n    for r in range(R):\n        for c in range(Cn):\n            if grid[r][c] == '1':\n                count += 1\n                sink(r, c)\n    return count\n<\/code><\/pre>\n<p>Каждая клетка «топится» один раз: O(R·C).<\/p>"}, {"title": "BFS: кратчайший путь и многоисточниковый BFS", "html": "<pre><code class=\"language-python\">from collections import deque\n\ndef shortest(grid, start, goal):\n    q, dist = deque([start]), {start: 0}\n    while q:\n        cell = q.popleft()\n        if cell == goal:\n            return dist[cell]\n        r, c = cell\n        for nr, nc in ((r+1,c),(r-1,c),(r,c+1),(r,c-1)):\n            if (nr, nc) not in dist and ok(nr, nc):\n                dist[(nr, nc)] = dist[cell] + 1     # пометка при добавлении\n                q.append((nr, nc))\n    return -1\n<\/code><\/pre>\n<p><strong>Многоисточниковый BFS<\/strong> (994 «гниющие апельсины», 542): кладём в очередь <strong>все<\/strong> источники сразу на шаге 0 — волны расходятся одновременно.<\/p>"}, {"title": "Ошибки", "html": "<ul>\n<li>Помечать при извлечении — вершина попадает в очередь много раз.<\/li>\n<li>DFS-рекурсия на сетке 10⁶ клеток — переполнение стека Python; используй явный стек или BFS.<\/li>\n<li>Искать кратчайший путь DFS-ом — он находит <strong>какой-то<\/strong> путь, не кратчайший.<\/li>\n<li>Забыть проверить границы сетки до обращения к клетке.<\/li>\n<\/ul>"}], "viz": "bfsgrid", "tasks": [{"id": "21-c1", "type": "choice", "title": "Кратчайший путь", "q": "Чем искать кратчайший путь в рёбрах в невзвешенном графе?", "options": ["DFS", "BFS", "Бинарным поиском", "Сортировкой"], "answer": 1, "hints": ["Нужен минимум рёбер.", "Какой обход идёт «волнами» по расстоянию?", "Сначала все на расстоянии 1, потом 2…", "Это BFS.", "BFS."], "expl": "BFS обходит вершины в порядке расстояния — первое попадание и есть кратчайший путь."}, {"id": "21-c2", "type": "choice", "title": "Пометка", "q": "Когда помечать вершину посещённой в BFS?", "options": ["При извлечении из очереди", "При добавлении в очередь", "В конце", "Не помечать"], "answer": 1, "hints": ["Что будет, если пометить поздно?", "Вершину успеют добавить несколько соседей.", "Очередь раздувается.", "Значит, помечаем раньше.", "При добавлении."], "expl": "Пометка при добавлении гарантирует, что вершина попадёт в очередь ровно один раз."}, {"id": "21-k1", "type": "code", "title": "Число островов", "q": "Сетка из строк '1' (суша) и '0' (вода). Верни число островов (соседство по 4 направлениям).", "fn": "num_islands", "starter": "def num_islands(grid):\n    pass\n", "tests": [{"args": [["11000", "11000", "00100", "00011"]], "exp": 3, "hidden": false, "case": ""}, {"args": [["111", "010", "111"]], "exp": 1, "hidden": false, "case": ""}, {"args": [["0"]], "exp": 0, "hidden": true, "case": "только вода"}, {"args": [["101", "010", "101"]], "exp": 5, "hidden": true, "case": "диагональ не соединяет"}], "ref": "def num_islands(grid):\n    g = [list(row) for row in grid]\n    R, Cn = len(g), len(g[0])\n    count = 0\n    for r in range(R):\n        for c in range(Cn):\n            if g[r][c] != '1':\n                continue\n            count += 1\n            st = [(r, c)]\n            g[r][c] = '0'\n            while st:\n                y, x = st.pop()\n                for ny, nx in ((y+1,x),(y-1,x),(y,x+1),(y,x-1)):\n                    if 0 <= ny < R and 0 <= nx < Cn and g[ny][nx] == '1':\n                        g[ny][nx] = '0'\n                        st.append((ny, nx))\n    return count\n", "hints": ["Каждая непосещённая '1' — новый остров.", "Затопи весь остров обходом.", "Строки неизменяемы — сделай список списков.", "Стек или рекурсия по 4 соседям.", "Проверяй границы."], "expl": "DFS-затопление: O(R·C).", "compare": "exact", "leetcode": 200}, {"id": "21-k2", "type": "code", "title": "Кратчайший путь в лабиринте", "q": "Сетка строк: '.' — проход, '#' — стена. Верни число шагов от (0,0) до правого нижнего угла или -1.", "fn": "maze_steps", "starter": "from collections import deque\n\ndef maze_steps(grid):\n    pass\n", "tests": [{"args": [["..", ".."]], "exp": 2, "hidden": false, "case": ""}, {"args": [[".#.", "...", "#.."]], "exp": 4, "hidden": false, "case": ""}, {"args": [[".#", "#."]], "exp": -1, "hidden": true, "case": "нет пути"}, {"args": [["."]], "exp": 0, "hidden": true, "case": "старт = финиш"}, {"args": [["#."]], "exp": -1, "hidden": true, "case": "старт в стене"}], "ref": "from collections import deque\n\ndef maze_steps(grid):\n    R, Cn = len(grid), len(grid[0])\n    if grid[0][0] == '#':\n        return -1\n    dist = {(0, 0): 0}\n    q = deque([(0, 0)])\n    while q:\n        r, c = q.popleft()\n        if (r, c) == (R - 1, Cn - 1):\n            return dist[(r, c)]\n        for nr, nc in ((r+1,c),(r-1,c),(r,c+1),(r,c-1)):\n            if 0 <= nr < R and 0 <= nc < Cn and grid[nr][nc] == '.' and (nr, nc) not in dist:\n                dist[(nr, nc)] = dist[(r, c)] + 1\n                q.append((nr, nc))\n    return -1\n", "hints": ["Кратчайший — значит BFS.", "Храни расстояния в словаре dist.", "Помечай при добавлении.", "Дошёл до угла — верни dist.", "Старт в стене — -1."], "expl": "BFS по сетке: O(R·C).", "compare": "exact", "leetcode": 1091}, {"id": "21-k3", "type": "code", "title": "Гниющие апельсины", "q": "0 — пусто, 1 — свежий, 2 — гнилой. Каждую минуту гниль переходит на соседей. Верни минуты до полного гниения или -1.", "fn": "oranges_rotting", "starter": "from collections import deque\n\ndef oranges_rotting(grid):\n    pass\n", "tests": [{"args": [[[2, 1, 1], [1, 1, 0], [0, 1, 1]]], "exp": 4, "hidden": false, "case": ""}, {"args": [[[2, 1, 1], [0, 1, 1], [1, 0, 1]]], "exp": -1, "hidden": false, "case": ""}, {"args": [[[0, 2]]], "exp": 0, "hidden": true, "case": "свежих нет"}, {"args": [[[2, 1, 1, 1, 2]]], "exp": 2, "hidden": true, "case": "два источника"}], "ref": "from collections import deque\n\ndef oranges_rotting(grid):\n    g = [row[:] for row in grid]\n    R, Cn = len(g), len(g[0])\n    q, fresh = deque(), 0\n    for r in range(R):\n        for c in range(Cn):\n            if g[r][c] == 2: q.append((r, c))\n            elif g[r][c] == 1: fresh += 1\n    minutes = 0\n    while q and fresh:\n        for _ in range(len(q)):\n            r, c = q.popleft()\n            for nr, nc in ((r+1,c),(r-1,c),(r,c+1),(r,c-1)):\n                if 0 <= nr < R and 0 <= nc < Cn and g[nr][nc] == 1:\n                    g[nr][nc] = 2\n                    fresh -= 1\n                    q.append((nr, nc))\n        minutes += 1\n    return minutes if fresh == 0 else -1\n", "hints": ["Все гнилые — источники одновременно.", "Положи их все в очередь сразу.", "Минута — один уровень BFS.", "Считай свежие; ноль — конец.", "Остались свежие — -1."], "expl": "Многоисточниковый BFS по уровням: O(R·C).", "compare": "exact", "leetcode": 994}], "test": [{"q": "Сложность BFS/DFS:", "options": ["O(V·E)", "O(V + E)", "O(V²) всегда", "O(E log V)"], "answer": 1}, {"q": "Многоисточниковый BFS начинается с:", "options": ["одной вершины", "всех источников в очереди сразу", "случайной вершины", "конца"], "answer": 1}, {"q": "DFS найдёт кратчайший путь в невзвешенном графе?", "options": ["Да всегда", "Нет, только какой-то путь", "Только с весами", "Только на сетке"], "answer": 1}, {"q": "Глубокая рекурсия DFS в Python опасна:", "options": ["медленно", "переполнением стека вызовов", "ничем", "неверным ответом всегда"], "answer": 1}, {"q": "Граф на собесе обычно хранят как:", "options": ["матрицу смежности", "список смежности", "строку", "кучу"], "answer": 1}]}, {"title": "Глава 22. Топологическая сортировка", "short": "Топологическая сортировка", "part": "Часть VI · Графы", "cards": [{"title": "Зависимости и порядок", "html": "<p>Ориентированный граф без циклов (DAG) можно выстроить так, что каждое ребро <code>a → b<\/code> идёт слева направо: <code>a<\/code> раньше <code>b<\/code>. Это <strong>топологический порядок<\/strong>. Сигналы: «курсы и пререквизиты», «сборка зависимостей», «порядок задач», «есть ли цикл зависимостей».<\/p>\n<p><strong>Алгоритм Кана<\/strong> (BFS по входящим степеням):<\/p>\n<ol>\n<li>посчитать <code>indeg<\/code> каждой вершины;<\/li>\n<li>в очередь — все с <code>indeg = 0<\/code> (ни от кого не зависят);<\/li>\n<li>достаём вершину, кладём в ответ, у соседей уменьшаем <code>indeg<\/code>; ставшие нулём — в очередь;<\/li>\n<li>если в ответе меньше <code>n<\/code> вершин — <strong>есть цикл<\/strong>.<\/li>\n<\/ol>"}, {"title": "Код (задачи 207, 210)", "html": "<pre><code class=\"language-python\">from collections import deque, defaultdict\n\ndef find_order(n, prereq):\n    g, indeg = defaultdict(list), [0] * n\n    for course, pre in prereq:          # pre → course\n        g[pre].append(course)\n        indeg[course] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    order = []\n    while q:\n        v = q.popleft()\n        order.append(v)\n        for u in g[v]:\n            indeg[u] -= 1\n            if indeg[u] == 0:\n                q.append(u)\n    return order if len(order) == n else []\n<\/code><\/pre>\n<p>O(V + E). Альтернатива — DFS с тремя цветами (белый / серый / чёрный): ребро в серую вершину = цикл.<\/p>"}, {"title": "Ошибки", "html": "<ul>\n<li>Перепутать направление ребра: в <code>[course, pre]<\/code> ребро идёт <strong>из pre в course<\/strong>.<\/li>\n<li>Забыть вершины без рёбер — они тоже должны попасть в ответ.<\/li>\n<li>Искать цикл в ориентированном графе через <code>seen<\/code> как в неориентированном — нужны три цвета или Кан.<\/li>\n<\/ul>"}], "viz": "topo", "tasks": [{"id": "22-c1", "type": "choice", "title": "Неполный порядок", "q": "Кан закончился, в ответе 4 вершины из 6. Что это значит?", "options": ["Ошибка в коде", "В графе есть цикл", "Граф несвязный", "Всё нормально"], "answer": 1, "hints": ["Какие вершины не попали в ответ?", "Их indeg так и не стал 0.", "Почему? Они ждут друг друга.", "Это цикл.", "Есть цикл."], "expl": "Вершины на цикле никогда не получат indeg = 0 — их меньше n."}, {"id": "22-c2", "type": "choice", "title": "Направление", "q": "Пара [1, 0] в задаче курсов означает «чтобы пройти 1, нужен 0». Ребро:", "options": ["1 → 0", "0 → 1", "неориентированное", "петля"], "answer": 1, "hints": ["Что идёт раньше?", "Курс 0.", "Ребро ведёт от раннего к позднему.", "Из 0 в 1.", "0 → 1."], "expl": "Пререквизит раньше — ребро из него в зависимый курс."}, {"id": "22-k1", "type": "code", "title": "Можно ли пройти все курсы", "q": "n курсов, prereq — пары [course, pre]. Верни True, если можно пройти все.", "fn": "can_finish", "starter": "from collections import deque, defaultdict\n\ndef can_finish(n, prereq):\n    pass\n", "tests": [{"args": [2, [[1, 0]]], "exp": true, "hidden": false, "case": ""}, {"args": [2, [[1, 0], [0, 1]]], "exp": false, "hidden": false, "case": ""}, {"args": [3, []], "exp": true, "hidden": true, "case": "без зависимостей"}, {"args": [4, [[1, 0], [2, 1], [3, 2], [1, 3]]], "exp": false, "hidden": true, "case": "цикл не с нуля"}], "ref": "from collections import deque, defaultdict\n\ndef can_finish(n, prereq):\n    g, indeg = defaultdict(list), [0] * n\n    for c, p in prereq:\n        g[p].append(c)\n        indeg[c] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    done = 0\n    while q:\n        v = q.popleft()\n        done += 1\n        for u in g[v]:\n            indeg[u] -= 1\n            if indeg[u] == 0:\n                q.append(u)\n    return done == n\n", "hints": ["Ребро pre → course.", "Посчитай входящие степени.", "Стартуй со всех indeg = 0.", "Считай обработанные вершины.", "Все n — цикла нет."], "expl": "Кан: O(V + E).", "compare": "exact", "leetcode": 207}, {"id": "22-k2", "type": "code", "title": "Порядок курсов", "q": "То же, но верни любой допустимый порядок (проверяется корректность) или [] при цикле. Для детерминизма бери из очереди вершины по возрастанию номера (heapq).", "fn": "find_order", "starter": "import heapq\nfrom collections import defaultdict\n\ndef find_order(n, prereq):\n    pass\n", "tests": [{"args": [4, [[1, 0], [2, 0], [3, 1], [3, 2]]], "exp": [0, 1, 2, 3], "hidden": false, "case": ""}, {"args": [2, [[0, 1]]], "exp": [1, 0], "hidden": false, "case": ""}, {"args": [2, [[0, 1], [1, 0]]], "exp": [], "hidden": true, "case": "цикл"}, {"args": [3, [[0, 2]]], "exp": [1, 2, 0], "hidden": true, "case": "свободная вершина"}], "ref": "import heapq\nfrom collections import defaultdict\n\ndef find_order(n, prereq):\n    g, indeg = defaultdict(list), [0] * n\n    for c, p in prereq:\n        g[p].append(c)\n        indeg[c] += 1\n    h = [i for i in range(n) if indeg[i] == 0]\n    heapq.heapify(h)\n    order = []\n    while h:\n        v = heapq.heappop(h)\n        order.append(v)\n        for u in g[v]:\n            indeg[u] -= 1\n            if indeg[u] == 0:\n                heapq.heappush(h, u)\n    return order if len(order) == n else []\n", "hints": ["Кан, но очередь — min-куча.", "Ответ — порядок извлечения.", "Длина < n — цикл, верни [].", "Не забудь вершины без рёбер.", "heapq.heappush / heappop."], "expl": "Кан с кучей даёт лексикографически минимальный порядок: O((V + E) log V).", "compare": "exact", "leetcode": 210}], "test": [{"q": "Топосортировка существует, только если граф:", "options": ["связный", "без ориентированных циклов", "дерево", "взвешенный"], "answer": 1}, {"q": "Кан начинает с вершин:", "options": ["с max степенью", "с indeg = 0", "с outdeg = 0", "любой"], "answer": 1}, {"q": "Сложность Кана:", "options": ["O(V + E)", "O(V²)", "O(E log E)", "O(V·E)"], "answer": 0}, {"q": "В DFS-поиске цикла ребро в «серую» вершину означает:", "options": ["лист", "цикл", "мост", "ничего"], "answer": 1}, {"q": "Топологический порядок единственен?", "options": ["Всегда", "Не обязательно", "Никогда", "Только для дерева"], "answer": 1}]}, {"title": "Глава 23. Кратчайшие пути", "short": "Кратчайшие пути", "part": "Часть VI · Графы", "cards": [{"title": "Какой алгоритм выбрать", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Граф<\/th>\n<th>Алгоритм<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>без весов<\/td>\n<td>BFS<\/td>\n<td>O(V + E)<\/td>\n<\/tr>\n<tr>\n<td>веса 0 и 1<\/td>\n<td>0-1 BFS (дек)<\/td>\n<td>O(V + E)<\/td>\n<\/tr>\n<tr>\n<td>неотрицательные веса<\/td>\n<td><strong>Дейкстра<\/strong> (куча)<\/td>\n<td>O(E log V)<\/td>\n<\/tr>\n<tr>\n<td>отрицательные веса, ≤ k рёбер<\/td>\n<td>Беллман-Форд<\/td>\n<td>O(k·E)<\/td>\n<\/tr>\n<tr>\n<td>все пары, V ≤ 400<\/td>\n<td>Флойд-Уоршелл<\/td>\n<td>O(V³)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Дейкстра (задача 743)", "html": "<p>Жадно достаём из кучи вершину с минимальным известным расстоянием — для неё расстояние уже окончательное (веса неотрицательны).<\/p>\n<pre><code class=\"language-python\">import heapq\n\ndef dijkstra(n, edges, src):\n    g = [[] for _ in range(n)]\n    for a, b, w in edges:\n        g[a].append((b, w))\n    dist = [float('inf')] * n\n    dist[src] = 0\n    pq = [(0, src)]\n    while pq:\n        d, v = heapq.heappop(pq)\n        if d &gt; dist[v]:\n            continue                     # устаревшая запись — пропускаем\n        for u, w in g[v]:\n            if d + w &lt; dist[u]:\n                dist[u] = d + w\n                heapq.heappush(pq, (dist[u], u))\n    return dist\n<\/code><\/pre>\n<p>Ключевая строка — <code>if d &gt; dist[v]: continue<\/code>: в куче лежат старые записи, их отбрасываем вместо удаления.<\/p>"}, {"title": "Беллман-Форд с ограничением рёбер (787)", "html": "<p>«Самый дешёвый перелёт не более чем с k пересадками»: k + 1 раундов релаксации, каждый раунд — по <strong>копии<\/strong> массива, чтобы за раунд путь удлинился не больше чем на одно ребро.<\/p>\n<pre><code class=\"language-python\">def cheapest(n, flights, src, dst, k):\n    dist = [float('inf')] * n\n    dist[src] = 0\n    for _ in range(k + 1):\n        nd = dist[:]\n        for a, b, w in flights:\n            if dist[a] + w &lt; nd[b]:\n                nd[b] = dist[a] + w\n        dist = nd\n    return dist[dst] if dist[dst] &lt; float('inf') else -1\n<\/code><\/pre>\n<p>Ошибки: Дейкстра с отрицательными весами; отсутствие пропуска устаревших записей (сложность растёт); в Беллмане обновлять тот же массив.<\/p>"}], "viz": "dijkstra", "tasks": [{"id": "23-c1", "type": "choice", "title": "Отрицательные веса", "q": "Почему Дейкстра ломается на отрицательных весах?", "options": ["Куча не работает с минусами", "Извлечённое расстояние может потом уменьшиться через отрицательное ребро", "Медленно", "Не ломается"], "answer": 1, "hints": ["Что гарантирует извлечение из кучи?", "Что расстояние окончательно.", "Это верно, если дальше пути только длиннее.", "Отрицательное ребро может сделать путь короче.", "Гарантия рушится."], "expl": "Жадность Дейкстры опирается на то, что продление пути его не укорачивает."}, {"id": "23-c2", "type": "choice", "title": "Сложность", "q": "Сложность Дейкстры с бинарной кучей:", "options": ["O(V + E)", "O(E log V)", "O(V³)", "O(V·E)"], "answer": 1, "hints": ["Сколько раз push в кучу?", "До одного на ребро.", "Каждая операция — log.", "E · log.", "O(E log V)."], "expl": "До E вставок в кучу по O(log V)."}, {"id": "23-k1", "type": "code", "title": "Время сигнала", "q": "times — рёбра [u, v, w], вершины 1..n, сигнал из k. Верни время, когда сигнал дойдёт до всех, или -1.", "fn": "network_delay", "starter": "import heapq\n\ndef network_delay(times, n, k):\n    pass\n", "tests": [{"args": [[[2, 1, 1], [2, 3, 1], [3, 4, 1]], 4, 2], "exp": 2, "hidden": false, "case": ""}, {"args": [[[1, 2, 1]], 2, 1], "exp": 1, "hidden": false, "case": ""}, {"args": [[[1, 2, 1]], 2, 2], "exp": -1, "hidden": true, "case": "недостижимо"}, {"args": [[[1, 2, 5], [1, 3, 1], [3, 2, 1]], 3, 1], "exp": 2, "hidden": true, "case": "обход короче прямого"}], "ref": "import heapq\n\ndef network_delay(times, n, k):\n    g = [[] for _ in range(n + 1)]\n    for u, v, w in times:\n        g[u].append((v, w))\n    dist = [float('inf')] * (n + 1)\n    dist[k] = 0\n    pq = [(0, k)]\n    while pq:\n        d, v = heapq.heappop(pq)\n        if d > dist[v]:\n            continue\n        for u, w in g[v]:\n            if d + w < dist[u]:\n                dist[u] = d + w\n                heapq.heappush(pq, (dist[u], u))\n    ans = max(dist[1:])\n    return ans if ans < float('inf') else -1\n", "hints": ["Веса неотрицательны — Дейкстра.", "Вершины с 1 — массив n + 1.", "Пропускай устаревшие записи.", "Ответ — максимум расстояний.", "inf — недостижимо, -1."], "expl": "Дейкстра: O(E log V).", "compare": "exact", "leetcode": 743}, {"id": "23-k2", "type": "code", "title": "Перелёт с пересадками", "q": "flights [a, b, цена], найти дешёвый путь src→dst не более чем с k пересадками, иначе -1.", "fn": "cheapest", "starter": "def cheapest(n, flights, src, dst, k):\n    pass\n", "tests": [{"args": [4, [[0, 1, 100], [1, 2, 100], [2, 0, 100], [1, 3, 600], [2, 3, 200]], 0, 3, 1], "exp": 700, "hidden": false, "case": ""}, {"args": [3, [[0, 1, 100], [1, 2, 100], [0, 2, 500]], 0, 2, 1], "exp": 200, "hidden": false, "case": ""}, {"args": [3, [[0, 1, 100], [1, 2, 100], [0, 2, 500]], 0, 2, 0], "exp": 500, "hidden": true, "case": "без пересадок"}, {"args": [3, [[0, 1, 100]], 0, 2, 1], "exp": -1, "hidden": true, "case": "нет пути"}], "ref": "def cheapest(n, flights, src, dst, k):\n    dist = [float('inf')] * n\n    dist[src] = 0\n    for _ in range(k + 1):\n        nd = dist[:]\n        for a, b, w in flights:\n            if dist[a] + w < nd[b]:\n                nd[b] = dist[a] + w\n        dist = nd\n    return dist[dst] if dist[dst] < float('inf') else -1\n", "hints": ["k пересадок = k + 1 рёбер.", "Беллман-Форд на k + 1 раундов.", "Каждый раунд — по копии массива.", "Читай старый dist, пиши в nd.", "inf — -1."], "expl": "Ограниченный Беллман-Форд: O(k·E).", "compare": "exact", "leetcode": 787}], "test": [{"q": "Граф без весов — кратчайший путь:", "options": ["Дейкстра", "BFS", "Флойд", "DFS"], "answer": 1}, {"q": "Строка «if d > dist[v]: continue» нужна, чтобы:", "options": ["обработать отрицательные веса", "пропускать устаревшие записи кучи", "найти цикл", "ускорить push"], "answer": 1}, {"q": "Отрицательные веса и ограничение по числу рёбер:", "options": ["Дейкстра", "Беллман-Форд", "BFS", "Кан"], "answer": 1}, {"q": "Флойд-Уоршелл — это:", "options": ["O(V + E)", "O(V³), все пары", "O(E log V)", "жадный алгоритм"], "answer": 1}, {"q": "В Беллмане по раундам копия массива нужна, чтобы:", "options": ["не тратить память", "за раунд удлинять путь не больше чем на одно ребро", "найти цикл", "ускорить"], "answer": 1}]}, {"title": "Глава 24. Минимальное остовное дерево", "short": "Минимальное остовное дерево", "part": "Часть VI · Графы", "cards": [{"title": "Что такое MST", "html": "<p><strong>Остовное дерево<\/strong> связывает все V вершин V − 1 рёбрами без циклов. <strong>Минимальное<\/strong> — с наименьшей суммой весов. Сигналы: «соединить все точки дешевле всего», «проложить кабель/дороги» (1584).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Алгоритм<\/th>\n<th>Идея<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Крускал<\/strong><\/td>\n<td>рёбра по возрастанию; берём, если не создаёт цикл (DSU)<\/td>\n<td>O(E log E)<\/td>\n<\/tr>\n<tr>\n<td><strong>Прим<\/strong><\/td>\n<td>растим дерево от вершины; куча с рёбрами наружу<\/td>\n<td>O(E log V)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Крускал", "html": "<pre><code class=\"language-python\">def kruskal(n, edges):                 # edges: (w, a, b)\n    parent = list(range(n))\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n    total = used = 0\n    for w, a, b in sorted(edges):\n        ra, rb = find(a), find(b)\n        if ra != rb:                    # разные компоненты — ребро безопасно\n            parent[ra] = rb\n            total += w\n            used += 1\n            if used == n - 1:\n                break\n    return total if used == n - 1 else -1\n<\/code><\/pre>\n<p>Почему жадность верна: самое лёгкое ребро между двумя частями графа всегда можно взять в какое-то MST (свойство разреза).<\/p>\n<p>Ошибки: не проверить связность (used &lt; n − 1), сортировать без веса первым, для полного графа точек (E = V²) Прим без кучи O(V²) бывает быстрее.<\/p>"}], "viz": "kruskal", "tasks": [{"id": "24-c1", "type": "choice", "title": "Пропуск ребра", "q": "Крускал пропускает ребро, если:", "options": ["оно тяжёлое", "его концы уже в одной компоненте", "оно последнее", "вершина листовая"], "answer": 1, "hints": ["Чего нельзя допустить в дереве?", "Цикла.", "Когда ребро создаёт цикл?", "Когда концы уже связаны.", "find(a) == find(b)."], "expl": "Ребро между уже связанными вершинами замыкает цикл."}, {"id": "24-c2", "type": "choice", "title": "Число рёбер", "q": "Сколько рёбер в остовном дереве из V вершин?", "options": ["V", "V − 1", "V + 1", "E"], "answer": 1, "hints": ["Дерево связно и без циклов.", "Для 2 вершин — 1 ребро.", "Для 3 — 2.", "Закономерность.", "V − 1."], "expl": "У дерева на V вершинах ровно V − 1 рёбер."}, {"id": "24-k1", "type": "code", "title": "Соединить точки", "q": "Даны точки [x, y]. Стоимость ребра — манхэттенское расстояние. Верни минимальную стоимость соединить все.", "fn": "min_cost_points", "starter": "def min_cost_points(points):\n    pass\n", "tests": [{"args": [[[0, 0], [2, 2], [3, 10], [5, 2], [7, 0]]], "exp": 20, "hidden": false, "case": ""}, {"args": [[[3, 12], [-2, 5], [-4, 1]]], "exp": 18, "hidden": false, "case": ""}, {"args": [[[0, 0]]], "exp": 0, "hidden": true, "case": "одна точка"}, {"args": [[[0, 0], [1, 1], [1, 0], [-1, 1]]], "exp": 4, "hidden": true, "case": "несколько равных"}], "ref": "def min_cost_points(points):\n    n = len(points)\n    edges = []\n    for i in range(n):\n        for j in range(i + 1, n):\n            d = abs(points[i][0] - points[j][0]) + abs(points[i][1] - points[j][1])\n            edges.append((d, i, j))\n    edges.sort()\n    parent = list(range(n))\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n    total = used = 0\n    for w, a, b in edges:\n        ra, rb = find(a), find(b)\n        if ra != rb:\n            parent[ra] = rb\n            total += w\n            used += 1\n            if used == n - 1:\n                break\n    return total\n", "hints": ["Построй все рёбра между парами точек.", "Отсортируй по весу.", "Крускал с DSU.", "Остановись на n − 1 ребре.", "Одна точка — 0."], "expl": "Крускал на полном графе: O(n² log n).", "compare": "exact", "leetcode": 1584}], "test": [{"q": "Крускал сортирует:", "options": ["вершины", "рёбра по весу", "точки по x", "ничего"], "answer": 1}, {"q": "Структура для проверки цикла в Крускале:", "options": ["стек", "DSU", "куча", "Trie"], "answer": 1}, {"q": "Прим растит дерево:", "options": ["от всех рёбер сразу", "от одной вершины, беря лёгкое ребро наружу", "по уровням", "случайно"], "answer": 1}, {"q": "used < n − 1 после Крускала означает:", "options": ["ошибку", "граф несвязный", "ответ 0", "цикл"], "answer": 1}, {"q": "Сложность Крускала:", "options": ["O(E log E)", "O(V)", "O(V³)", "O(E²)"], "answer": 0}]}, {"title": "Глава 25. Backtracking", "short": "Backtracking", "part": "Часть VII · Перебор и ДП", "cards": [{"title": "Перебор с возвратом", "html": "<p>Строим ответ по шагам; на каждом шаге пробуем варианты, уходим вглубь и <strong>откатываем<\/strong> выбор. Сигналы: «все подмножества / перестановки / комбинации», «расставить», «найти все разбиения», n ≤ 20.<\/p>\n<pre><code class=\"language-python\">def backtrack(path, choices):\n    if готово(path):\n        res.append(path[:])          # копия!\n        return\n    for c in choices:\n        if not допустимо(c): continue\n        path.append(c)               # выбрать\n        backtrack(path, ...)         # углубиться\n        path.pop()                   # откатить\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>подмножества (78)<\/td>\n<td>O(2ⁿ · n)<\/td>\n<\/tr>\n<tr>\n<td>перестановки (46)<\/td>\n<td>O(n! · n)<\/td>\n<\/tr>\n<tr>\n<td>комбинации C(n, k) (77)<\/td>\n<td>O(C(n,k) · k)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Подмножества и перестановки", "html": "<pre><code class=\"language-python\">def subsets(nums):\n    res, path = [], []\n    def go(i):\n        res.append(path[:])\n        for j in range(i, len(nums)):    # берём только элементы правее\n            path.append(nums[j]); go(j + 1); path.pop()\n    go(0)\n    return res\n\ndef permute(nums):\n    res, path, used = [], [], [False] * len(nums)\n    def go():\n        if len(path) == len(nums):\n            res.append(path[:]); return\n        for j in range(len(nums)):\n            if used[j]: continue\n            used[j] = True; path.append(nums[j])\n            go()\n            path.pop(); used[j] = False\n    go()\n    return res\n<\/code><\/pre>\n<p><strong>Дубликаты<\/strong> (90, 47): сортируем и пропускаем <code>nums[j] == nums[j-1]<\/code> на одном уровне (<code>j &gt; i<\/code>).<\/p>"}, {"title": "Отсечения и ошибки", "html": "<p>Отсечение — обрываем ветку, когда она точно не даст ответа: сумма превысила target (39), нет ферзя в столбце (51).<\/p>\n<ul>\n<li><code>res.append(path)<\/code> без копии — все ответы станут одним пустым списком.<\/li>\n<li>Забыть откат (<code>pop<\/code>, <code>used[j] = False<\/code>).<\/li>\n<li>Комбинации повторяются в разном порядке — передавай стартовый индекс.<\/li>\n<\/ul>"}], "viz": "subsets", "tasks": [{"id": "25-p1", "type": "predict", "title": "Без копии", "q": "Что выведет код?", "code": "res, path = [], []\ndef go(i):\n    if i == 2:\n        res.append(path)\n        return\n    path.append(i)\n    go(i + 1)\n    path.pop()\ngo(0)\nprint(res)", "answer": "[[]]", "hints": ["res хранит ссылку на path.", "В конце path снова пуст.", "Добавлен один раз.", "Значит [[]]", "[[]]."], "expl": "Без path[:] в res лежит сам список path, который к концу опустел."}, {"id": "25-c1", "type": "choice", "title": "Число подмножеств", "q": "Сколько подмножеств у множества из n элементов?", "options": ["n²", "2ⁿ", "n!", "n"], "answer": 1, "hints": ["Каждый элемент — взять или нет.", "Два варианта на элемент.", "n независимых выборов.", "2·2·…·2.", "2ⁿ."], "expl": "Каждый элемент независимо входит или нет: 2ⁿ."}, {"id": "25-k1", "type": "code", "title": "Подмножества", "q": "Верни все подмножества nums (элементы уникальны), отсортированные внутри; порядок списков не важен.", "fn": "subsets", "starter": "def subsets(nums):\n    pass\n", "tests": [{"args": [[1, 2, 3]], "exp": [[], [1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]], "hidden": false, "case": ""}, {"args": [[0]], "exp": [[], [0]], "hidden": false, "case": ""}, {"args": [[]], "exp": [[]], "hidden": true, "case": "пустой"}], "ref": "def subsets(nums):\n    res, path = [], []\n    def go(i):\n        res.append(path[:])\n        for j in range(i, len(nums)):\n            path.append(nums[j])\n            go(j + 1)\n            path.pop()\n    go(0)\n    return res\n", "hints": ["На каждом уровне сохраняй текущий path.", "Перебирай элементы с индекса i.", "Выбрал — углубись с j + 1.", "Откати pop.", "Копия path[:]!"], "expl": "Backtracking: O(2ⁿ·n).", "compare": "sorted", "leetcode": 78}, {"id": "25-k2", "type": "code", "title": "Сумма комбинаций", "q": "Кандидаты candidates (уникальны, > 0) можно брать много раз. Верни все комбинации с суммой target (каждая — по возрастанию).", "fn": "combination_sum", "starter": "def combination_sum(candidates, target):\n    pass\n", "tests": [{"args": [[2, 3, 6, 7], 7], "exp": [[2, 2, 3], [7]], "hidden": false, "case": ""}, {"args": [[2, 3, 5], 8], "exp": [[2, 2, 2, 2], [2, 3, 3], [3, 5]], "hidden": false, "case": ""}, {"args": [[2], 1], "exp": [], "hidden": true, "case": "нет решений"}], "ref": "def combination_sum(candidates, target):\n    c = sorted(candidates)\n    res, path = [], []\n    def go(i, rest):\n        if rest == 0:\n            res.append(path[:])\n            return\n        for j in range(i, len(c)):\n            if c[j] > rest:\n                break\n            path.append(c[j])\n            go(j, rest - c[j])\n            path.pop()\n    go(0, target)\n    return res\n", "hints": ["Остаток суммы передавай вниз.", "rest == 0 — ответ.", "Тот же элемент можно снова: go(j, …).", "Отсортируй и обрывай, когда c[j] > rest.", "Откат pop."], "expl": "Backtracking с отсечением.", "compare": "sorted", "leetcode": 39}], "test": [{"q": "Число перестановок n элементов:", "options": ["2ⁿ", "n!", "n²", "C(n, 2)"], "answer": 1}, {"q": "Зачем res.append(path[:])?", "options": ["быстрее", "сохранить снимок, а не ссылку", "сортировка", "не нужно"], "answer": 1}, {"q": "Чтобы не было повторов комбинаций в разном порядке:", "options": ["used[]", "стартовый индекс", "set", "сортировка ответа"], "answer": 1}, {"q": "Отсечение — это:", "options": ["откат", "прекращение заведомо бесполезной ветки", "мемоизация", "BFS"], "answer": 1}, {"q": "Backtracking уместен при n порядка:", "options": ["10⁶", "до ~20", "10⁹", "любом"], "answer": 1}]}, {"title": "Глава 26. Жадные алгоритмы", "short": "Жадные алгоритмы", "part": "Часть VII · Перебор и ДП", "cards": [{"title": "Когда жадность работает", "html": "<p>Жадный алгоритм на каждом шаге делает <strong>локально лучший<\/strong> выбор и не пересматривает его. Работает, когда это доказуемо (обмен: любое оптимальное решение можно превратить в жадное, не ухудшив). Если доказать не можешь — проверь контрпример, иначе это ДП.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Жадный выбор<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>прыжки (55)<\/td>\n<td>максимальная достижимая позиция<\/td>\n<\/tr>\n<tr>\n<td>встречи / интервалы (435)<\/td>\n<td>брать интервал с самым ранним концом<\/td>\n<\/tr>\n<tr>\n<td>бензоколонки (134)<\/td>\n<td>сбросить старт, если бак ушёл в минус<\/td>\n<\/tr>\n<tr>\n<td>распределить конфеты (135)<\/td>\n<td>два прохода слева и справа<\/td>\n<\/tr>\n<tr>\n<td>размен монет 1, 3, 4 на 6<\/td>\n<td><strong>не работает<\/strong>: жадно 4+1+1, оптимально 3+3 → ДП<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Jump Game (55, 45)", "html": "<pre><code class=\"language-python\">def can_jump(nums):\n    reach = 0\n    for i, x in enumerate(nums):\n        if i &gt; reach:\n            return False           # сюда не допрыгнуть\n        reach = max(reach, i + x)\n    return True\n\ndef jump(nums):                    # минимум прыжков\n    jumps = end = far = 0\n    for i in range(len(nums) - 1):\n        far = max(far, i + nums[i])\n        if i == end:               # закончился текущий «уровень»\n            jumps += 1\n            end = far\n    return jumps\n<\/code><\/pre>\n<p>Второй — по сути BFS по уровням: <code>end<\/code> — граница уровня. O(n).<\/p>"}, {"title": "Бензоколонки (134)", "html": "<p>Если сумма <code>gas − cost<\/code> &lt; 0 — ответа нет. Иначе едем, копя бак; ушли в минус на i — никакая станция от старта до i не годится, старт = i + 1.<\/p>\n<pre><code class=\"language-python\">def can_complete(gas, cost):\n    if sum(gas) &lt; sum(cost):\n        return -1\n    tank = start = 0\n    for i in range(len(gas)):\n        tank += gas[i] - cost[i]\n        if tank &lt; 0:\n            tank, start = 0, i + 1\n    return start\n<\/code><\/pre>"}], "viz": "jump", "tasks": [{"id": "26-c1", "type": "choice", "title": "Контрпример", "q": "Монеты [1, 3, 4], сумма 6. Жадно (крупнейшая) даёт:", "options": ["2 монеты", "3 монеты, а оптимум 2", "1 монету", "невозможно"], "answer": 1, "hints": ["Жадно берём 4.", "Остаток 2: 1 + 1.", "Итого 3 монеты.", "А 3 + 3 — две.", "Жадность ошиблась."], "expl": "4 + 1 + 1 = 3 монеты, оптимум 3 + 3 — жадность здесь неверна, нужно ДП."}, {"id": "26-c2", "type": "choice", "title": "Интервалы", "q": "В задаче про максимум непересекающихся интервалов жадно берут интервал:", "options": ["самый длинный", "с самым ранним концом", "с самым ранним началом", "случайный"], "answer": 1, "hints": ["Что оставляет больше места остальным?", "Интервал, который раньше заканчивается.", "Ранний конец освобождает время.", "Сортировка по концу.", "По концу."], "expl": "Ранний конец оставляет максимум места; доказывается обменом."}, {"id": "26-k1", "type": "code", "title": "Прыжки", "q": "nums[i] — максимальная длина прыжка с i. Можно ли добраться до конца?", "fn": "can_jump", "starter": "def can_jump(nums):\n    pass\n", "tests": [{"args": [[2, 3, 1, 1, 4]], "exp": true, "hidden": false, "case": ""}, {"args": [[3, 2, 1, 0, 4]], "exp": false, "hidden": false, "case": ""}, {"args": [[0]], "exp": true, "hidden": true, "case": "уже в конце"}, {"args": [[1, 0, 1]], "exp": false, "hidden": true, "case": "застряли на нуле"}], "ref": "def can_jump(nums):\n    reach = 0\n    for i, x in enumerate(nums):\n        if i > reach:\n            return False\n        reach = max(reach, i + x)\n    return True\n", "hints": ["Храни самую дальнюю достижимую позицию.", "Если i > reach — недостижимо.", "Обновляй reach = max(reach, i + x).", "Один проход.", "Дошли до конца — True."], "expl": "Жадно: O(n).", "compare": "exact", "leetcode": 55}, {"id": "26-k2", "type": "code", "title": "Минимум прыжков", "q": "До конца всегда можно добраться. Верни минимум прыжков.", "fn": "jump", "starter": "def jump(nums):\n    pass\n", "tests": [{"args": [[2, 3, 1, 1, 4]], "exp": 2, "hidden": false, "case": ""}, {"args": [[2, 3, 0, 1, 4]], "exp": 2, "hidden": false, "case": ""}, {"args": [[0]], "exp": 0, "hidden": true, "case": "один элемент"}, {"args": [[1, 1, 1, 1]], "exp": 3, "hidden": true, "case": "по одному"}], "ref": "def jump(nums):\n    jumps = end = far = 0\n    for i in range(len(nums) - 1):\n        far = max(far, i + nums[i])\n        if i == end:\n            jumps += 1\n            end = far\n    return jumps\n", "hints": ["Думай как BFS по уровням.", "end — граница текущего уровня.", "far — самая дальняя точка следующего.", "Дошли до end — прыжок, end = far.", "Цикл до n − 2."], "expl": "Жадный BFS: O(n).", "compare": "exact", "leetcode": 45}, {"id": "26-k3", "type": "code", "title": "Бензоколонки", "q": "Верни индекс старта, с которого можно объехать круг, или -1.", "fn": "can_complete", "starter": "def can_complete(gas, cost):\n    pass\n", "tests": [{"args": [[1, 2, 3, 4, 5], [3, 4, 5, 1, 2]], "exp": 3, "hidden": false, "case": ""}, {"args": [[2, 3, 4], [3, 4, 3]], "exp": -1, "hidden": false, "case": ""}, {"args": [[5], [4]], "exp": 0, "hidden": true, "case": "одна станция"}, {"args": [[3, 1, 1], [1, 2, 2]], "exp": 0, "hidden": true, "case": "старт с нуля"}], "ref": "def can_complete(gas, cost):\n    if sum(gas) < sum(cost):\n        return -1\n    tank = start = 0\n    for i in range(len(gas)):\n        tank += gas[i] - cost[i]\n        if tank < 0:\n            tank, start = 0, i + 1\n    return start\n", "hints": ["Сумма gas < cost — ответа нет.", "Иначе ответ точно есть.", "Копи бак.", "Ушёл в минус — старт за этой станцией.", "Обнули бак."], "expl": "Жадно: O(n).", "compare": "exact", "leetcode": 134}], "test": [{"q": "Жадный алгоритм:", "options": ["перебирает всё", "делает локально лучший выбор без пересмотра", "запоминает подзадачи", "откатывает выбор"], "answer": 1}, {"q": "Если жадность не доказывается и есть контрпример:", "options": ["всё равно сдать", "переходить к ДП", "BFS", "сортировка"], "answer": 1}, {"q": "Jump Game II по сути:", "options": ["DFS", "BFS по уровням", "бинпоиск", "DSU"], "answer": 1}, {"q": "Сложность жадного can_jump:", "options": ["O(n²)", "O(n)", "O(n log n)", "O(2ⁿ)"], "answer": 1}, {"q": "Интервалы для максимума непересекающихся сортируют по:", "options": ["началу", "концу", "длине", "не сортируют"], "answer": 1}]}, {"title": "Глава 27. Основы ДП", "short": "Основы ДП", "part": "Часть VII · Перебор и ДП", "cards": [{"title": "Что такое динамическое программирование", "html": "<p>ДП = рекурсия + запоминание. Работает, когда задача распадается на <strong>перекрывающиеся подзадачи<\/strong> с <strong>оптимальной подструктурой<\/strong>. Сигналы: «сколько способов», «минимум / максимум», «можно ли», и жадность не работает.<\/p>\n<p>Пять шагов:<\/p>\n<ol>\n<li><strong>Состояние<\/strong>: что значит <code>dp[i]<\/code> — словами.<\/li>\n<li><strong>Переход<\/strong>: как <code>dp[i]<\/code> выражается через меньшие.<\/li>\n<li><strong>База<\/strong>: начальные значения.<\/li>\n<li><strong>Порядок<\/strong>: подзадачи раньше задачи.<\/li>\n<li><strong>Ответ<\/strong>: какая ячейка.<\/li>\n<\/ol>"}, {"title": "Сверху вниз и снизу вверх", "html": "<pre><code class=\"language-python\">from functools import lru_cache\n\ndef climb(n):                    # 70: шаги по 1 или 2\n    @lru_cache(None)\n    def f(i):\n        if i &lt;= 1:\n            return 1\n        return f(i - 1) + f(i - 2)\n    return f(n)\n\ndef climb_tab(n):                # таблица + O(1) памяти\n    a, b = 1, 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return b\n<\/code><\/pre>\n<p>Без кеша — O(2ⁿ), с кешем — O(n): каждое состояние считается один раз. Если переход смотрит на 1–2 предыдущих — храни только их.<\/p>"}, {"title": "Грабитель (198) и пример разбора", "html": "<p><strong>Состояние:<\/strong> <code>dp[i]<\/code> — максимум из первых i домов. <strong>Переход:<\/strong> не грабим i-й → <code>dp[i-1]<\/code>; грабим → <code>dp[i-2] + nums[i]<\/code>.<\/p>\n<pre><code class=\"language-python\">def rob(nums):\n    prev2 = prev1 = 0\n    for x in nums:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>nums<\/th>\n<th>2<\/th>\n<th>7<\/th>\n<th>9<\/th>\n<th>3<\/th>\n<th>1<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>dp<\/td>\n<td>2<\/td>\n<td>7<\/td>\n<td>11<\/td>\n<td>11<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ошибки: не сформулировать состояние словами; база не покрывает малые n; рекурсия без кеша.<\/p>"}], "viz": "dp1", "tasks": [{"id": "27-c1", "type": "choice", "title": "Без кеша", "q": "Почему рекурсия Фибоначчи без кеша экспоненциальна?", "options": ["Из-за сложения", "Одни и те же подзадачи считаются много раз", "Из-за стека", "Она линейна"], "answer": 1, "hints": ["Нарисуй дерево вызовов f(5).", "f(3) вызывается дважды.", "f(2) — трижды.", "Повторы растут экспоненциально.", "Перекрывающиеся подзадачи."], "expl": "Перекрывающиеся подзадачи пересчитываются; кеш делает O(n)."}, {"id": "27-k1", "type": "code", "title": "Лестница", "q": "Сколько способов подняться на n ступенек шагами по 1 или 2?", "fn": "climb", "starter": "def climb(n):\n    pass\n", "tests": [{"args": [2], "exp": 2, "hidden": false, "case": ""}, {"args": [3], "exp": 3, "hidden": false, "case": ""}, {"args": [1], "exp": 1, "hidden": true, "case": "одна ступенька"}, {"args": [45], "exp": 1836311903, "hidden": true, "case": "большое n"}], "ref": "def climb(n):\n    a, b = 1, 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return b\n", "hints": ["На ступеньку n приходят с n − 1 или n − 2.", "dp[n] = dp[n−1] + dp[n−2].", "База: dp[0] = dp[1] = 1.", "Храни две переменные.", "Без рекурсии без кеша — иначе таймаут."], "expl": "ДП Фибоначчи: O(n), O(1) памяти.", "compare": "exact", "leetcode": 70}, {"id": "27-k2", "type": "code", "title": "Грабитель", "q": "Нельзя грабить два соседних дома. Верни максимум.", "fn": "rob", "starter": "def rob(nums):\n    pass\n", "tests": [{"args": [[1, 2, 3, 1]], "exp": 4, "hidden": false, "case": ""}, {"args": [[2, 7, 9, 3, 1]], "exp": 12, "hidden": false, "case": ""}, {"args": [[]], "exp": 0, "hidden": true, "case": "пусто"}, {"args": [[2, 1, 1, 2]], "exp": 4, "hidden": true, "case": "пропуск двух подряд"}], "ref": "def rob(nums):\n    prev2 = prev1 = 0\n    for x in nums:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1\n", "hints": ["dp[i] — максимум по первым i домам.", "Не грабим: dp[i−1].", "Грабим: dp[i−2] + x.", "Берём максимум.", "Две переменные."], "expl": "ДП: O(n), O(1).", "compare": "exact", "leetcode": 198}, {"id": "27-k3", "type": "code", "title": "Минимальная стоимость лестницы", "q": "cost[i] — плата за ступеньку i; шаг 1 или 2; старт с 0 или 1. Минимум, чтобы оказаться за последней.", "fn": "min_cost_climb", "starter": "def min_cost_climb(cost):\n    pass\n", "tests": [{"args": [[10, 15, 20]], "exp": 15, "hidden": false, "case": ""}, {"args": [[1, 100, 1, 1, 1, 100, 1, 1, 100, 1]], "exp": 6, "hidden": false, "case": ""}, {"args": [[0, 0]], "exp": 0, "hidden": true, "case": "нули"}], "ref": "def min_cost_climb(cost):\n    a = b = 0\n    for i in range(2, len(cost) + 1):\n        a, b = b, min(b + cost[i - 1], a + cost[i - 2])\n    return b\n", "hints": ["dp[i] — минимум, чтобы встать на i.", "dp[0] = dp[1] = 0.", "dp[i] = min(dp[i−1] + cost[i−1], dp[i−2] + cost[i−2]).", "Ответ dp[n].", "Две переменные."], "expl": "ДП: O(n).", "compare": "exact", "leetcode": 746}], "test": [{"q": "Первый шаг решения ДП:", "options": ["написать цикл", "определить состояние словами", "выбрать язык", "отсортировать"], "answer": 1}, {"q": "Мемоизация — это ДП:", "options": ["снизу вверх", "сверху вниз", "жадное", "по битам"], "answer": 1}, {"q": "Если переход смотрит на 2 предыдущих, памяти нужно:", "options": ["O(n)", "O(1)", "O(n²)", "O(log n)"], "answer": 1}, {"q": "Признак ДП:", "options": ["отсортированный массив", "перекрывающиеся подзадачи", "граф", "строка"], "answer": 1}, {"q": "Грабитель: dp[i] =", "options": ["dp[i−1] + x", "max(dp[i−1], dp[i−2] + x)", "min(...)", "dp[i−2]"], "answer": 1}]}, {"title": "Глава 28. ДП на последовательностях", "short": "ДП на последовательностях", "part": "Часть VII · Перебор и ДП", "cards": [{"title": "Двумерное ДП по двум строкам", "html": "<p><code>dp[i][j]<\/code> — ответ для префиксов <code>a[:i]<\/code> и <code>b[:j]<\/code>. Таблица (n+1)×(m+1), нулевая строка/столбец — пустые префиксы.<\/p>\n<p><strong>LCS<\/strong> (1143), наибольшая общая подпоследовательность:<\/p>\n<pre><code class=\"language-python\">def lcs(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i-1] == b[j-1]:\n                dp[i][j] = dp[i-1][j-1] + 1\n            else:\n                dp[i][j] = max(dp[i-1][j], dp[i][j-1])\n    return dp[n][m]\n<\/code><\/pre>\n<p><strong>Редакционное расстояние<\/strong> (72): совпали — <code>dp[i-1][j-1]<\/code>, иначе <code>1 + min(вставка dp[i][j-1], удаление dp[i-1][j], замена dp[i-1][j-1])<\/code>. База: <code>dp[i][0] = i<\/code>, <code>dp[0][j] = j<\/code>.<\/p>"}, {"title": "Одномерные: LIS и максимальный подмассив", "html": "<p><strong>LIS<\/strong> (300): <code>dp[i]<\/code> — длина возрастающей подпоследовательности, <strong>заканчивающейся<\/strong> в i: O(n²). Быстро — O(n log n) через массив «хвостов» и бинпоиск:<\/p>\n<pre><code class=\"language-python\">from bisect import bisect_left\ndef lis(nums):\n    tails = []\n    for x in nums:\n        k = bisect_left(tails, x)\n        if k == len(tails): tails.append(x)\n        else: tails[k] = x\n    return len(tails)\n<\/code><\/pre>\n<p><strong>Кадане<\/strong> (53): <code>cur = max(x, cur + x)<\/code>, <code>best = max(best, cur)<\/code> — «продолжить или начать заново».<\/p>\n<p><strong>Сетка путей<\/strong> (62, 64): <code>dp[r][c] = dp[r-1][c] + dp[r][c-1]<\/code> (или min + cost).<\/p>\n<p>Ошибки: сдвиг индексов на 1 между строкой и таблицей; путать подпоследовательность (с пропусками) и подстроку (подряд).<\/p>"}], "viz": "lcs", "tasks": [{"id": "28-c1", "type": "choice", "title": "Подпоследовательность", "q": "Чем подпоследовательность отличается от подстроки?", "options": ["Ничем", "Подпоследовательность допускает пропуски, подстрока — подряд", "Подстрока короче", "Подпоследовательность — отсортирована"], "answer": 1, "hints": ["«ace» в «abcde»?", "Как подпоследовательность — да.", "Как подстрока — нет.", "Подстрока — подряд.", "Пропуски — признак подпоследовательности."], "expl": "Подпоследовательность сохраняет порядок с пропусками; подстрока — непрерывна."}, {"id": "28-c2", "type": "choice", "title": "tails", "q": "В LIS за O(n log n) массив tails хранит:", "options": ["саму подпоследовательность", "минимальный хвост для каждой длины", "индексы", "суммы"], "answer": 1, "hints": ["tails[k] — хвост для длины k + 1.", "Меньший хвост лучше для продолжения.", "Поэтому заменяем на меньший.", "Массив возрастает — бинпоиск.", "Минимальные хвосты."], "expl": "tails[k] — минимальный возможный последний элемент возрастающей подпоследовательности длины k + 1."}, {"id": "28-k1", "type": "code", "title": "LCS", "q": "Длина наибольшей общей подпоследовательности строк a и b.", "fn": "lcs", "starter": "def lcs(a, b):\n    pass\n", "tests": [{"args": ["abcde", "ace"], "exp": 3, "hidden": false, "case": ""}, {"args": ["abc", "def"], "exp": 0, "hidden": false, "case": ""}, {"args": ["", "a"], "exp": 0, "hidden": true, "case": "пустая"}, {"args": ["bsbininm", "jmjkbkjkv"], "exp": 1, "hidden": true, "case": "один символ"}], "ref": "def lcs(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i-1] == b[j-1]:\n                dp[i][j] = dp[i-1][j-1] + 1\n            else:\n                dp[i][j] = max(dp[i-1][j], dp[i][j-1])\n    return dp[n][m]\n", "hints": ["dp[i][j] — для префиксов длины i и j.", "Таблица (n+1)×(m+1).", "Совпали — диагональ + 1.", "Иначе максимум сверху/слева.", "Индексы строк i−1, j−1."], "expl": "Двумерное ДП: O(n·m).", "compare": "exact", "leetcode": 1143}, {"id": "28-k2", "type": "code", "title": "Редакционное расстояние", "q": "Минимум вставок, удалений и замен, чтобы a стало b.", "fn": "edit_distance", "starter": "def edit_distance(a, b):\n    pass\n", "tests": [{"args": ["horse", "ros"], "exp": 3, "hidden": false, "case": ""}, {"args": ["intention", "execution"], "exp": 5, "hidden": false, "case": ""}, {"args": ["", "abc"], "exp": 3, "hidden": true, "case": "из пустой"}, {"args": ["abc", "abc"], "exp": 0, "hidden": true, "case": "равные"}], "ref": "def edit_distance(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(n + 1): dp[i][0] = i\n    for j in range(m + 1): dp[0][j] = j\n    for i in
