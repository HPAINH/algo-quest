куче ключ <code>g + h<\/code>, где g — пройденное, h — <strong>оценка<\/strong> до цели, не превышающая реальное расстояние (допустимая эвристика, например манхэттенское расстояние на сетке). Находит тот же кратчайший путь, но обходит меньше вершин. При h = 0 — обычная Дейкстра.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Алгоритм<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>мосты, точки сочленения<\/td>\n<td>DFS с tin/low<\/td>\n<td>O(V + E)<\/td>\n<\/tr>\n<tr>\n<td>SCC<\/td>\n<td>Косараю / Тарьян<\/td>\n<td>O(V + E)<\/td>\n<\/tr>\n<tr>\n<td>путь к одной цели с эвристикой<\/td>\n<td>A*<\/td>\n<td>≤ Дейкстры<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На собесах эти темы редки: достаточно узнать задачу, назвать алгоритм и написать мосты. Глубокая рекурсия в Python — поднимай <code>sys.setrecursionlimit<\/code> или пиши итеративно.<\/p>"}], "viz": "bridges", "tasks": [{"id": "40-c1", "type": "choice", "title": "Условие моста", "q": "Ребро v → u в DFS — мост, если:", "options": ["low[u] < tin[v]", "low[u] > tin[v]", "tin[u] > tin[v]", "u — лист"], "answer": 1, "hints": ["Что значит low[u]?", "Как высоко можно подняться из поддерева u.", "Если не выше u — к v без ребра v-u не вернуться.", "То есть low[u] > tin[v].", "Это мост."], "expl": "Из поддерева u нет обратного ребра к v или выше — ребро единственная связь."}, {"id": "40-c2", "type": "choice", "title": "Эвристика", "q": "Эвристика A* должна:", "options": ["переоценивать расстояние", "не превышать реальное расстояние до цели", "быть случайной", "равняться 0"], "answer": 1, "hints": ["Что будет при переоценке?", "A* может пропустить оптимальный путь.", "Нужна оптимистичная оценка.", "Не больше реального.", "Допустимая эвристика."], "expl": "Допустимая (не переоценивающая) эвристика гарантирует кратчайший путь."}, {"id": "40-k1", "type": "code", "title": "Критические соединения", "q": "Неориентированный связный граф. Верни все мосты, каждый как [меньшая, большая] вершина, отсортированными.", "fn": "critical_connections", "starter": "import sys\n\ndef critical_connections(n, edges):\n    pass\n", "tests": [{"args": [4, [[0, 1], [1, 2], [2, 0], [1, 3]]], "exp": [[1, 3]], "hidden": false, "case": ""}, {"args": [2, [[0, 1]]], "exp": [[0, 1]], "hidden": false, "case": ""}, {"args": [3, [[0, 1], [1, 2], [2, 0]]], "exp": [], "hidden": true, "case": "цикл — мостов нет"}, {"args": [5, [[0, 1], [1, 2], [2, 3], [3, 4]]], "exp": [[0, 1], [1, 2], [2, 3], [3, 4]], "hidden": true, "case": "цепочка"}], "ref": "import sys\n\ndef critical_connections(n, edges):\n    sys.setrecursionlimit(10000)\n    g = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b)\n        g[b].append(a)\n    tin, low, res, t = [-1] * n, [0] * n, [], [0]\n    def dfs(v, parent):\n        tin[v] = low[v] = t[0]\n        t[0] += 1\n        for u in g[v]:\n            if u == parent:\n                continue\n            if tin[u] != -1:\n                low[v] = min(low[v], tin[u])\n            else:\n                dfs(u, v)\n                low[v] = min(low[v], low[u])\n                if low[u] > tin[v]:\n                    res.append(sorted([v, u]))\n    for v in range(n):\n        if tin[v] == -1:\n            dfs(v, -1)\n    return sorted(res)\n", "hints": ["DFS с временем входа tin.", "low[v] — минимум tin по обратным рёбрам из поддерева.", "Ребро к родителю не считается обратным.", "Мост: low[u] > tin[v].", "Нормализуй и отсортируй ответ."], "expl": "Тарьян для мостов: O(V + E).", "compare": "exact", "leetcode": 1192}, {"id": "40-k2", "type": "code", "title": "Число компонент сильной связности", "q": "Ориентированный граф из n вершин. Верни число SCC (Косараю).", "fn": "count_scc", "starter": "def count_scc(n, edges):\n    pass\n", "tests": [{"args": [5, [[0, 1], [1, 2], [2, 0], [1, 3], [3, 4]]], "exp": 3, "hidden": false, "case": ""}, {"args": [3, [[0, 1], [1, 2], [2, 0]]], "exp": 1, "hidden": false, "case": ""}, {"args": [3, []], "exp": 3, "hidden": true, "case": "без рёбер"}, {"args": [4, [[0, 1], [1, 0], [2, 3], [3, 2], [1, 2]]], "exp": 2, "hidden": true, "case": "две компоненты-цикла"}], "ref": "def count_scc(n, edges):\n    g = [[] for _ in range(n)]\n    rg = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b)\n        rg[b].append(a)\n    seen, order = [False] * n, []\n    for s in range(n):\n        if seen[s]:\n            continue\n        seen[s] = True\n        st = [(s, iter(g[s]))]\n        while st:\n            v, it = st[-1]\n            u = next(it, None)\n            if u is None:\n                st.pop()\n                order.append(v)\n            elif not seen[u]:\n                seen[u] = True\n                st.append((u, iter(g[u])))\n    comp = [False] * n\n    cnt = 0\n    for s in reversed(order):\n        if comp[s]:\n            continue\n        cnt += 1\n        comp[s] = True\n        st = [s]\n        while st:\n            v = st.pop()\n            for u in rg[v]:\n                if not comp[u]:\n                    comp[u] = True\n                    st.append(u)\n    return cnt\n", "hints": ["Первый проход: порядок выхода из DFS.", "Построй развёрнутый граф.", "Второй проход по обратному порядку выхода.", "Каждый новый DFS во втором проходе — одна SCC.", "Итеративный DFS избавит от глубокой рекурсии."], "expl": "Косараю: O(V + E).", "compare": "exact"}], "test": [{"q": "Мосты и точки сочленения ищут:", "options": ["BFS", "одним DFS с tin/low", "Дейкстрой", "DSU"], "answer": 1}, {"q": "SCC определены для графа:", "options": ["неориентированного", "ориентированного", "взвешенного", "дерева"], "answer": 1}, {"q": "Косараю делает:", "options": ["один DFS", "два DFS: по графу и по транспонированному", "BFS", "сортировку рёбер"], "answer": 1}, {"q": "A* с эвристикой h = 0 — это:", "options": ["BFS", "Дейкстра", "DFS", "Беллман-Форд"], "answer": 1}, {"q": "Корень DFS — точка сочленения, если у него:", "options": ["1 ребёнок", "≥ 2 детей в дереве DFS", "нет детей", "петля"], "answer": 1}]}], "interview": [{"id": "iv-217", "level": "E", "title": "Есть ли повтор", "leetcode": 217, "statement": "Дан список целых чисел nums. Верни True, если какое-то число встречается хотя бы дважды, иначе False.", "fn": "contains_duplicate", "starter": "def contains_duplicate(nums):\n    pass\n", "clarify": [["Какой максимальный размер nums?", "До 10⁵ элементов.", true], ["Может ли список быть пустым?", "Да — тогда повторов нет, ответ False.", true], ["Могут ли числа быть отрицательными?", "Да, от −10⁹ до 10⁹.", false], ["Нужно ли вернуть сам повторяющийся элемент?", "Нет, только True или False.", false]], "brute": {"options": ["Сравнить все пары (i, j)", "Перебрать все подмножества", "Посчитать сумму"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Множество уже виденных чисел", "Два указателя без сортировки", "Префиксные суммы", "Куча"], "answer": 0, "t": "O(n)", "m": "O(n)"}, "tests": [{"args": [[1, 2, 3, 1]], "exp": true, "hidden": false}, {"args": [[1, 2, 3, 4]], "exp": false, "hidden": false}, {"args": [[]], "exp": false, "hidden": true, "case": "пустой"}, {"args": [[-1, -1]], "exp": true, "hidden": true, "case": "отрицательные"}], "speed": {"gen": "ARGS=[list(range(100000))]"}, "ref": "def contains_duplicate(nums):\n    seen = set()\n    for x in nums:\n        if x in seen:\n            return True\n        seen.add(x)\n    return False\n", "hints": ["Что нужно помнить о прошлых элементах?", "Только то, встречалось ли число.", "Множество отвечает за O(1).", "Проверь x in seen, потом добавь.", "Альтернатива: len(set(nums)) != len(nums)."], "expl": "Множество виденных: O(n) времени и памяти. Без доп. памяти — сортировка и сравнение соседей, O(n log n)."}, {"id": "iv-392", "level": "E", "title": "Подпоследовательность", "leetcode": 392, "statement": "Даны строки s и t. Верни True, если s можно получить из t удалением некоторых символов без изменения порядка остальных.", "fn": "is_subsequence", "starter": "def is_subsequence(s, t):\n    pass\n", "clarify": [["Какие длины строк?", "s до 100, t до 10⁴.", true], ["Может ли s быть пустой?", "Да — пустая строка подпоследовательность любой, ответ True.", true], ["Важен ли регистр?", "Только строчные латинские буквы.", false], ["Можно ли переставлять символы?", "Нет, порядок сохраняется.", false]], "brute": {"options": ["Перебрать все подпоследовательности t", "Отсортировать обе строки", "Посчитать частоты"], "answer": 0, "t": "O(2ⁿ)"}, "tech": {"options": ["Два указателя по двум строкам", "Хеш-таблица частот", "Скользящее окно", "Бинарный поиск по ответу"], "answer": 0, "t": "O(n)", "m": "O(1)"}, "tests": [{"args": ["abc", "ahbgdc"], "exp": true, "hidden": false}, {"args": ["axc", "ahbgdc"], "exp": false, "hidden": false}, {"args": ["", "abc"], "exp": true, "hidden": true, "case": "пустая s"}, {"args": ["aa", "a"], "exp": false, "hidden": true, "case": "s длиннее"}, {"args": ["ab", "ba"], "exp": false, "hidden": true, "case": "порядок"}], "ref": "def is_subsequence(s, t):\n    i = 0\n    for ch in t:\n        if i < len(s) and s[i] == ch:\n            i += 1\n    return i == len(s)\n", "hints": ["Порядок важен — частоты не помогут.", "Иди по t и ищи очередной символ s.", "i — сколько символов s уже найдено.", "Совпало — сдвигай i.", "В конце i == len(s)."], "expl": "Указатель по s двигается при совпадении, по t — всегда: O(|t|), O(1)."}, {"id": "iv-1456", "level": "E", "title": "Гласные в окне", "leetcode": 1456, "statement": "Дана строка s и число k. Верни максимальное число гласных (a, e, i, o, u) среди всех подстрок длины ровно k.", "fn": "max_vowels", "starter": "def max_vowels(s, k):\n    pass\n", "clarify": [["Какая длина s?", "До 10⁵.", true], ["Может ли k быть больше длины s?", "Нет, 1 ≤ k ≤ len(s).", true], ["Какие буквы гласные?", "a, e, i, o, u, только строчные.", false], ["Нужна ли сама подстрока?", "Нет, только число.", false]], "brute": {"options": ["Для каждой подстроки длины k пересчитать гласные", "Перебрать все подмножества", "Отсортировать строку"], "answer": 0, "t": "O(n·k)"}, "tech": {"options": ["Окно фиксированной длины", "Префиксы + словарь", "Два указателя с концов", "Куча"], "answer": 0, "t": "O(n)", "m": "O(1)"}, "tests": [{"args": ["abciiidef", 3], "exp": 3, "hidden": false}, {"args": ["aeiou", 2], "exp": 2, "hidden": false}, {"args": ["leetcode", 3], "exp": 2, "hidden": true, "case": "обычный"}, {"args": ["rhythms", 4], "exp": 0, "hidden": true, "case": "нет гласных"}], "speed": {"gen": "ARGS=['ab'*50000, 50000]"}, "ref": "def max_vowels(s, k):\n    v = set('aeiou')\n    cur = sum(1 for ch in s[:k] if ch in v)\n    best = cur\n    for r in range(k, len(s)):\n        cur += (s[r] in v) - (s[r - k] in v)\n        best = max(best, cur)\n    return best\n", "hints": ["Длина подстроки фиксирована.", "Окно длины k едет по строке.", "При сдвиге: + вошедший символ, − вышедший.", "Состояние — число гласных в окне.", "best = max(best, cur) на каждом шаге."], "expl": "Фиксированное окно: O(n). Пересчёт каждой подстроки — O(n·k), при k = n/2 не проходит."}, {"id": "iv-219", "level": "E", "title": "Повтор рядом", "leetcode": 219, "statement": "Верни True, если в nums есть два одинаковых числа на позициях i ≠ j с |i − j| ≤ k.", "fn": "contains_nearby_duplicate", "starter": "def contains_nearby_duplicate(nums, k):\n    pass\n", "clarify": [["Какой размер nums и k?", "До 10⁵ элементов, 0 ≤ k ≤ 10⁵.", true], ["Что если k = 0?", "Тогда пар нет — ответ False.", true], ["Важно ли, какие именно индексы?", "Нет, только True/False.", false], ["Отсортирован ли массив?", "Нет.", false]], "brute": {"options": ["Для каждого i проверить следующие k элементов", "Отсортировать и сравнить соседей", "Перебрать подмножества"], "answer": 0, "t": "O(n·k)"}, "tech": {"options": ["Словарь «значение → последний индекс»", "Два указателя с концов", "Префиксные суммы", "Куча"], "answer": 0, "t": "O(n)", "m": "O(n)"}, "tests": [{"args": [[1, 2, 3, 1], 3], "exp": true, "hidden": false}, {"args": [[1, 2, 3, 1, 2, 3], 2], "exp": false, "hidden": false}, {"args": [[1, 0, 1, 1], 1], "exp": true, "hidden": true, "case": "соседние"}, {"args": [[1, 1], 0], "exp": false, "hidden": true, "case": "k = 0"}], "speed": {"gen": "ARGS=[list(range(100000)), 100000]"}, "ref": "def contains_nearby_duplicate(nums, k):\n    last = {}\n    for i, x in enumerate(nums):\n        if x in last and i - last[x] <= k:\n            return True\n        last[x] = i\n    return False\n", "hints": ["Для x важен ближайший прошлый такой же x.", "Это последний индекс, где был x.", "Словарь значение → последний индекс.", "Проверь i − last[x] ≤ k, затем обнови last[x].", "Сортировка потеряет индексы."], "expl": "Последний индекс каждого значения: O(n). Достаточно последнего — он ближе всех предыдущих."}, {"id": "iv-1512", "level": "E", "title": "Хорошие пары", "leetcode": 1512, "statement": "Пара (i, j) хорошая, если nums[i] == nums[j] и i < j. Верни число хороших пар.", "fn": "num_identical_pairs", "starter": "def num_identical_pairs(nums):\n    pass\n", "clarify": [["Какой размер nums?", "До 10⁵.", true], ["Может ли список быть пустым?", "Да — 0 пар.", true], ["Считать (i, j) и (j, i) отдельно?", "Нет, только i < j.", false], ["Числа положительные?", "Любые целые.", false]], "brute": {"options": ["Перебрать все пары i < j", "Отсортировать", "Перебрать подмножества"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Counter: новый x образует пары со всеми прошлыми x", "Два указателя", "Скользящее окно", "Бинарный поиск"], "answer": 0, "t": "O(n)", "m": "O(n)"}, "tests": [{"args": [[1, 2, 3, 1, 1, 3]], "exp": 4, "hidden": false}, {"args": [[1, 1, 1, 1]], "exp": 6, "hidden": false}, {"args": [[]], "exp": 0, "hidden": true, "case": "пустой"}, {"args": [[1, 2, 3]], "exp": 0, "hidden": true, "case": "нет пар"}], "speed": {"gen": "ARGS=[[7]*100000]"}, "ref": "def num_identical_pairs(nums):\n    seen = {}\n    ans = 0\n    for x in nums:\n        ans += seen.get(x, 0)\n        seen[x] = seen.get(x, 0) + 1\n    return ans\n", "hints": ["Сколько пар образует новый x?", "Столько, сколько x было раньше.", "Храни счётчик встреч.", "ans += seen[x], затем seen[x] += 1.", "Или формула c·(c − 1)/2 по частотам."], "expl": "Каждый x образует пары со всеми прошлыми x: O(n). Та же схема, что Subarray Sum = K."}, {"id": "iv-525", "level": "M", "title": "Поровну нулей и единиц", "leetcode": 525, "statement": "Массив из 0 и 1. Верни длину самого длинного непрерывного подмассива, где нулей и единиц поровну.", "fn": "find_max_length", "starter": "def find_max_length(nums):\n    pass\n", "clarify": [["Какой размер массива?", "До 10⁵.", true], ["Если такого подмассива нет?", "Верни 0.", true], ["Подмассив — непрерывный?", "Да.", false], ["Есть ли другие числа кроме 0 и 1?", "Нет.", false]], "brute": {"options": ["Перебрать все отрезки и считать нули и единицы", "Отсортировать", "Взять весь массив"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Замена 0 → −1, префиксы + словарь первого индекса", "Скользящее окно", "Два указателя с концов", "Куча"], "answer": 0, "t": "O(n)", "m": "O(n)"}, "tests": [{"args": [[0, 1]], "exp": 2, "hidden": false}, {"args": [[0, 1, 0]], "exp": 2, "hidden": false}, {"args": [[0, 0, 1, 0, 0, 0, 1, 1]], "exp": 6, "hidden": true, "case": "длинный"}, {"args": [[1, 1, 1]], "exp": 0, "hidden": true, "case": "нет ответа"}], "speed": {"gen": "import random\nrandom.seed(8)\nARGS=[[random.randint(0,1) for _ in range(100000)]]"}, "ref": "def find_max_length(nums):\n    first = {0: -1}\n    pref = best = 0\n    for i, x in enumerate(nums):\n        pref += 1 if x == 1 else -1\n        if pref in first:\n            best = max(best, i - first[pref])\n        else:\n            first[pref] = i\n    return best\n", "hints": ["Как превратить «поровну» в условие на сумму?", "Замени 0 на −1: поровну ⇔ сумма 0.", "Сумма отрезка 0 ⇔ два равных префикса.", "Для максимальной длины храни ПЕРВЫЙ индекс каждого префикса.", "first = {0: −1}."], "expl": "0 → −1 сводит задачу к самому длинному отрезку с суммой 0: префиксы + первый индекс, O(n)."}, {"id": "iv-974", "level": "M", "title": "Суммы, кратные k", "leetcode": 974, "statement": "Верни число непрерывных подмассивов nums, сумма которых делится на k (k ≥ 2). Числа могут быть отрицательными.", "fn": "subarrays_div_by_k", "starter": "def subarrays_div_by_k(nums, k):\n    pass\n", "clarify": [["Какой размер nums?", "До 3·10⁴.", true], ["Могут ли числа быть отрицательными?", "Да, от −10⁴ до 10⁴.", true], ["Считать ли 0 делящимся на k?", "Да, 0 делится на любое k.", false], ["k может быть 0?", "Нет, 2 ≤ k ≤ 10⁴.", false]], "brute": {"options": ["Перебрать все отрезки с бегущей суммой", "Отсортировать", "Окно"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Префиксы + словарь остатков", "Скользящее окно", "Два указателя", "Куча"], "answer": 0, "t": "O(n)", "m": "O(k)"}, "tests": [{"args": [[4, 5, 0, -2, -3, 1], 5], "exp": 7, "hidden": false}, {"args": [[5], 9], "exp": 0, "hidden": false}, {"args": [[-1, 2, 9], 2], "exp": 2, "hidden": true, "case": "отрицательные"}, {"args": [[0, 0], 3], "exp": 3, "hidden": true, "case": "нули"}], "speed": {"gen": "import random\nrandom.seed(9)\nARGS=[[random.randint(-100,100) for _ in range(30000)], 7]"}, "ref": "def subarrays_div_by_k(nums, k):\n    count = {0: 1}\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        r = pref % k\n        ans += count.get(r, 0)\n        count[r] = count.get(r, 0) + 1\n    return ans\n", "hints": ["Окно не подойдёт — есть отрицательные.", "Разность двух чисел делится на k ⇔ одинаковые остатки.", "Считай префиксы по остаткам.", "Словарь «остаток → сколько раз», старт {0: 1}.", "В Python % для отрицательных уже даёт [0, k)."], "expl": "Одинаковые остатки префиксов ⇔ отрезок кратен k. O(n) времени, O(k) памяти."}, {"id": "iv-904", "level": "M", "title": "Две корзины фруктов", "leetcode": 904, "statement": "fruits[i] — вид дерева i. Есть две корзины, в каждую — фрукты одного вида. Начав с любого дерева и идя вправо, собирай по фрукту с каждого дерева, пока можешь. Верни максимум фруктов (то есть самый длинный отрезок не больше чем с 2 видами).", "fn": "total_fruit", "starter": "def total_fruit(fruits):\n    pass\n", "clarify": [["Какой размер массива?", "До 10⁵.", true], ["Может ли быть меньше двух видов?", "Да, тогда берём все деревья.", true], ["Можно ли пропускать деревья?", "Нет, отрезок непрерывный.", false], ["Сколько всего видов?", "Любое число.", false]], "brute": {"options": ["Для каждого начала идти вправо, пока видов ≤ 2", "Перебрать подмножества", "Отсортировать"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Окно переменной длины с Counter", "Префиксные суммы", "Два указателя с концов", "Куча"], "answer": 0, "t": "O(n)", "m": "O(1)"}, "tests": [{"args": [[1, 2, 1]], "exp": 3, "hidden": false}, {"args": [[0, 1, 2, 2]], "exp": 3, "hidden": false}, {"args": [[1, 2, 3, 2, 2]], "exp": 4, "hidden": true, "case": "обычный"}, {"args": [[3, 3, 3, 1, 2, 1, 1, 2, 3, 3, 4]], "exp": 5, "hidden": true, "case": "длинный"}, {"args": [[1]], "exp": 1, "hidden": true, "case": "одно дерево"}], "speed": {"gen": "ARGS=[[1, 2] * 50000]"}, "ref": "def total_fruit(fruits):\n    count = {}\n    l = best = 0\n    for r, f in enumerate(fruits):\n        count[f] = count.get(f, 0) + 1\n        while len(count) > 2:\n            count[fruits[l]] -= 1\n            if count[fruits[l]] == 0:\n                del count[fruits[l]]\n            l += 1\n        best = max(best, r - l + 1)\n    return best\n", "hints": ["Это самый длинный отрезок с ≤ 2 видами.", "Условие монотонно — подойдёт окно.", "Состояние — Counter видов в окне.", "Пока видов > 2 — сжимай, удаляя ключи с нулём.", "best = max(best, r − l + 1) после while."], "expl": "Окно «не больше 2 видов»: O(n). Не забывай удалять ключи с нулевой частотой."}, {"id": "iv-16", "level": "M", "title": "Ближайшая сумма трёх", "leetcode": 16, "statement": "Найди в nums три числа (разные позиции), сумма которых ближе всего к target. Верни эту сумму. Ответ единственен.", "fn": "three_sum_closest", "starter": "def three_sum_closest(nums, target):\n    pass\n", "clarify": [["Какой размер nums?", "От 3 до 500 — нужно O(n²).", true], ["Что если две суммы одинаково близки?", "Такого не будет, ответ единственен.", true], ["Отсортирован ли массив?", "Нет, но его можно сортировать.", false], ["Нужны ли индексы?", "Нет, только сумма.", false]], "brute": {"options": ["Перебрать все тройки", "Перебрать пары", "Взять три наименьших"], "answer": 0, "t": "O(n³)"}, "tech": {"options": ["Сортировка + фиксируем i + два указателя", "Хеш-таблица", "Скользящее окно", "Префиксы"], "answer": 0, "t": "O(n²)", "m": "O(1)"}, "tests": [{"args": [[-1, 2, 1, -4], 1], "exp": 2, "hidden": false}, {"args": [[0, 0, 0], 1], "exp": 0, "hidden": false}, {"args": [[1, 1, 1, 0], -100], "exp": 2, "hidden": true, "case": "target далеко"}, {"args": [[4, 0, 5, -5, 3, 3, 0, -4, -5], -2], "exp": -2, "hidden": true, "case": "точное попадание"}], "speed": {"gen": "import random\nrandom.seed(11)\nARGS=[[random.randint(-1000,1000) for _ in range(500)], 10**9]"}, "ref": "def three_sum_closest(nums, target):\n    nums = sorted(nums)\n    best = nums[0] + nums[1] + nums[2]\n    for i in range(len(nums) - 2):\n        l, r = i + 1, len(nums) - 1\n        while l < r:\n            s = nums[i] + nums[l] + nums[r]\n            if abs(s - target) < abs(best - target):\n                best = s\n            if s < target:\n                l += 1\n            elif s > target:\n                r -= 1\n            else:\n                return s\n    return best\n", "hints": ["Брутфорс O(n³) — зафиксируй один элемент.", "Остаток — пара с суммой, близкой к target − nums[i].", "Отсортируй и используй встречные указатели.", "Сумма мала → l += 1, велика → r −= 1.", "На каждом шаге обновляй best по |s − target|."], "expl": "Как 3Sum: сортировка + два указателя, O(n²). Точное попадание можно вернуть сразу."}, {"id": "iv-454", "level": "M", "title": "Четыре суммы", "leetcode": 454, "statement": "Даны четыре списка A, B, C, D одинаковой длины n. Верни число четвёрок (i, j, k, l) с A[i] + B[j] + C[k] + D[l] = 0.", "fn": "four_sum_count", "starter": "def four_sum_count(A, B, C, D):\n    pass\n", "clarify": [["Какое n?", "До 200.", true], ["Могут ли числа быть отрицательными?", "Да.", true], ["Нужны ли сами четвёрки?", "Нет, только количество.", false], ["Одинаковы ли длины?", "Да.", false]], "brute": {"options": ["Перебрать все четвёрки", "Перебрать пары", "Отсортировать каждый"], "answer": 0, "t": "O(n⁴)"}, "tech": {"options": ["Counter сумм пар A+B, поиск −(c + d)", "Два указателя", "Скользящее окно", "Префиксы"], "answer": 0, "t": "O(n²)", "m": "O(n²)"}, "tests": [{"args": [[1, 2], [-2, -1], [-1, 2], [0, 2]], "exp": 2, "hidden": false}, {"args": [[0], [0], [0], [0]], "exp": 1, "hidden": false}, {"args": [[1, 1], [-1, -1], [0, 0], [0, 0]], "exp": 16, "hidden": true, "case": "все комбинации"}], "speed": {"gen": "import random\nrandom.seed(12)\nARGS=[[random.randint(-50,50) for _ in range(200)] for _ in range(4)]"}, "ref": "def four_sum_count(A, B, C, D):\n    ab = {}\n    for a in A:\n        for b in B:\n            ab[a + b] = ab.get(a + b, 0) + 1\n    return sum(ab.get(-(c + d), 0) for c in C for d in D)\n", "hints": ["n⁴ = 1,6·10⁹ — слишком много.", "Раздели четвёрку пополам.", "Сумм пар из A и B — n².", "Запомни их в словаре с количествами.", "Для каждой пары C, D добавь ab[−(c + d)]."], "expl": "Встреча посередине: O(n²) времени и памяти."}, {"id": "iv-713", "level": "M", "title": "Произведение меньше k", "leetcode": 713, "statement": "Числа nums положительные. Верни число непрерывных подмассивов, произведение которых строго меньше k.", "fn": "num_subarray_product_less_than_k", "starter": "def num_subarray_product_less_than_k(nums, k):\n    pass\n", "clarify": [["Какой размер nums?", "До 3·10⁴.", true], ["Что если k ≤ 1?", "Тогда ответ 0 — произведение положительных ≥ 1.", true], ["Числа положительные?", "Да, от 1 до 1000.", false], ["Нужны сами подмассивы?", "Нет, количество.", false]], "brute": {"options": ["Для каждого начала перемножать вправо", "Отсортировать", "Перебрать подмножества"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Окно + прибавлять r − l + 1", "Префиксы + словарь", "Два указателя с концов", "Куча"], "answer": 0, "t": "O(n)", "m": "O(1)"}, "tests": [{"args": [[10, 5, 2, 6], 100], "exp": 8, "hidden": false}, {"args": [[1, 2, 3], 0], "exp": 0, "hidden": false}, {"args": [[1, 1, 1], 2], "exp": 6, "hidden": true, "case": "все единицы"}, {"args": [[5], 5], "exp": 0, "hidden": true, "case": "равно k"}], "speed": {"gen": "ARGS=[[1]*30000, 2]"}, "ref": "def num_subarray_product_less_than_k(nums, k):\n    if k <= 1:\n        return 0\n    prod = 1\n    l = count = 0\n    for r, x in enumerate(nums):\n        prod *= x\n        while prod >= k:\n            prod //= nums[l]\n            l += 1\n        count += r - l + 1\n    return count\n", "hints": ["Сужение отрезка не увеличивает произведение — окно подходит.", "Пока prod ≥ k — делим на nums[l] и двигаем l.", "При валидном [l, r] хороши все отрезки, заканчивающиеся в r.", "Их r − l + 1.", "Не забудь случай k ≤ 1."], "expl": "Окно + подсчёт r − l + 1: O(n). Без проверки k ≤ 1 указатель l уходит за r."}, {"id": "iv-567", "level": "M", "title": "Перестановка в строке", "leetcode": 567, "statement": "Верни True, если строка s2 содержит подстроку, которая является перестановкой s1.", "fn": "check_inclusion", "starter": "def check_inclusion(s1, s2):\n    pass\n", "clarify": [["Какие длины строк?", "До 10⁴.", true], ["Что если s1 длиннее s2?", "Тогда False.", true], ["Только строчные буквы?", "Да.", false], ["Подстрока — непрерывная?", "Да.", false]], "brute": {"options": ["Для каждой подстроки длины len(s1) сравнить частоты заново", "Перебрать все перестановки s1", "Отсортировать s2"], "answer": 0, "t": "O(n·k)"}, "tech": {"options": ["Окно фиксированной длины с частотами", "Два указателя с концов", "Префиксы", "Куча"], "answer": 0, "t": "O(n)", "m": "O(1)"}, "tests": [{"args": ["ab", "eidbaooo"], "exp": true, "hidden": false}, {"args": ["ab", "eidboaoo"], "exp": false, "hidden": false}, {"args": ["abc", "ab"], "exp": false, "hidden": true, "case": "s1 длиннее"}, {"args": ["a", "a"], "exp": true, "hidden": true, "case": "совпадение"}], "speed": {"gen": "import random\nrandom.seed(13)\nARGS=['ab'*2000, ''.join(random.choice('abc') for _ in range(10000))]"}, "ref": "def check_inclusion(s1, s2):\n    k = len(s1)\n    if k > len(s2):\n        return False\n    need = [0] * 26\n    win = [0] * 26\n    for ch in s1:\n        need[ord(ch) - 97] += 1\n    for r, ch in enumerate(s2):\n        win[ord(ch) - 97] += 1\n        if r >= k:\n            win[ord(s2[r - k]) - 97] -= 1\n        if win == need:\n            return True\n    return False\n", "hints": ["Перестановка s1 — подстрока длины len(s1) с теми же частотами.", "Это задача 438, но ответ — да/нет.", "Окно фиксированной длины.", "Храни 26 счётчиков окна и 26 — для s1.", "Совпали массивы — True."], "expl": "Окно с частотами: O(26·n). Сортировка каждой подстроки — O(n·k log k)."}, {"id": "iv-1248", "level": "M", "title": "Ровно k нечётных", "leetcode": 1248, "statement": "Верни число непрерывных подмассивов nums, содержащих ровно k нечётных чисел.", "fn": "number_of_subarrays", "starter": "def number_of_subarrays(nums, k):\n    pass\n", "clarify": [["Какой размер nums?", "До 5·10⁴.", true], ["Может ли k быть больше числа нечётных?", "Да — тогда ответ 0.", true], ["Подмассив непрерывный?", "Да.", false], ["Числа положительные?", "Да.", false]], "brute": {"options": ["Перебрать все отрезки, считая нечётные", "Отсортировать", "Перебрать подмножества"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["не больше k − не больше k − 1 (окно)", "Одно окно «ровно k»", "Два указателя с концов", "Куча"], "answer": 0, "t": "O(n)", "m": "O(1)"}, "tests": [{"args": [[1, 1, 2, 1, 1], 3], "exp": 2, "hidden": false}, {"args": [[2, 4, 6], 1], "exp": 0, "hidden": false}, {"args": [[2, 2, 2, 1, 2, 2, 1, 2, 2, 2], 2], "exp": 16, "hidden": true, "case": "чётные по краям"}, {"args": [[1], 1], "exp": 1, "hidden": true, "case": "один элемент"}], "speed": {"gen": "import random\nrandom.seed(14)\nARGS=[[random.randint(1,4) for _ in range(50000)], 100]"}, "ref": "def number_of_subarrays(nums, k):\n    def at_most(k):\n        if k < 0:\n            return 0\n        odd = l = res = 0\n        for r, x in enumerate(nums):\n            odd += x % 2\n            while odd > k:\n                odd -= nums[l] % 2\n                l += 1\n            res += r - l + 1\n        return res\n    return at_most(k) - at_most(k - 1)\n", "hints": ["«Ровно k» не монотонно — одно окно не подойдёт.", "«Не больше k» монотонно.", "Ровно k = (не больше k) − (не больше k − 1).", "at_most(k): окно, while нечётных > k; res += r − l + 1.", "Два прохода окна — O(n)."], "expl": "Приём «ровно = не больше k − не больше k − 1»: два окна, O(n)."}, {"id": "iv-1047", "level": "E", "title": "Удалить соседние дубли", "leetcode": 1047, "statement": "Дана строка s. Повторяй: если два соседних символа равны — удали их. Верни итоговую строку.", "fn": "remove_duplicates", "starter": "def remove_duplicates(s):\n    pass\n", "clarify": [["Какая длина s?", "До 10⁵.", true], ["Может ли строка стать пустой?", "Да, тогда верни пустую строку.", true], ["Какие символы?", "Строчные латинские буквы.", false], ["Важен ли порядок удалений?", "Нет, ответ единственный.", false]], "brute": {"options": ["Повторять проход и удалять пару, пока есть что удалять", "Отсортировать строку", "Перебрать подстроки"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Стек как результат", "Скользящее окно", "Хеш-таблица частот", "Бинарный поиск"], "answer": 0, "t": "O(n)", "m": "O(n)"}, "tests": [{"args": ["abbaca"], "exp": "ca", "hidden": false, "case": ""}, {"args": ["azxxzy"], "exp": "ay", "hidden": false, "case": ""}, {"args": ["aa"], "exp": "", "hidden": true, "case": "всё схлопнулось"}, {"args": ["abc"], "exp": "abc", "hidden": true, "case": "нечего удалять"}], "speed": {"gen": "ARGS=['ab' * 50000 + 'ba' * 50000]"}, "ref": "def remove_duplicates(s):\n    st = []\n    for ch in s:\n        if st and st[-1] == ch:\n            st.pop()\n        else:\n            st.append(ch)\n    return ''.join(st)\n", "hints": ["Удаление пары может создать новую пару — как это учесть?", "Новая пара — всегда с последним оставшимся символом.", "Храни результат в стеке.", "Совпал с вершиной — pop, иначе push.", "''.join(st)."], "expl": "Стек-результат: каждый символ входит и выходит один раз — O(n)."}, {"id": "iv-110", "level": "E", "title": "Сбалансированное дерево", "leetcode": 110, "statement": "Дерево задано списком по уровням (дети i — 2i + 1 и 2i + 2, None — пусто). Верни True, если у каждого узла высоты поддеревьев отличаются не больше чем на 1.", "fn": "is_balanced", "starter": "def is_balanced(vals):\n    pass\n", "clarify": [["Сколько узлов?", "До 5000.", true], ["Пустое дерево сбалансировано?", "Да.", true], ["Важны ли значения узлов?", "Нет, только форма.", false], ["Это BST?", "Не обязательно.", false]], "brute": {"options": ["Для каждого узла заново считать высоты детей", "Перебрать все пути", "Отсортировать значения"], "answer": 0, "t": "O(n²)"}, "tech": {"options": ["Post-order: высота вверх, -1 как сигнал дисбаланса", "BFS по уровням", "Стек скобок", "Бинарный поиск"], "answer": 0, "t": "O(n)", "m": "O(h)"}, "tests": [{"args": [[3, 9, 20, null, null, 15, 7]], "exp": true, "hidden": false, "case": ""}, {"args": [[1, 2, 2, 3, 3, null, null, 4, 4]], "exp": false, "hidden": false, "case": ""}, {"args": [[]], "exp": true, "hidden": true, "case": "пустое"}, {"args": [[1, 2, 2, 3, null, null, 3, 4, null, null, null, null, null, null, 4]], "exp": false, "hidden": true, "case": "дисбаланс внизу"}], "ref": "def is_balanced(vals):\n    def h(i):\n        if i >= len(vals) or vals[i] is None:\n            return 0\n        l = h(2 * i + 1)\n        if l < 0:\n            return -1\n        r = h(2 * i + 2)\n        if r < 0 or abs(l - r) > 1:\n            return -1\n        return 1 + max(l, r)\n    return h(0) >= 0\n", "hints": ["Проверять только корень мало.", "Нужна высота каждого поддерева.", "Считай высоту снизу вверх.", "Дисбаланс — верни -1 и пробрось вверх.", "Ответ: h(0) >= 0."], "expl": "Одна post-order рекурсия возвращает высоту или -1: O(n)."}, {"id": "iv-547", "level": "M", "title": "Число провинций", "leetcode": 547, "statement": "Матрица is_connected n×n: 1 — города i и j связаны напрямую. Провинция — группа связанных (напрямую или через другие) городов. Верни число провинций.", "fn": "find_circle_num", "starter": "def find_circle_num(is_connected):\n    pass\n", "clarify": [["Какое n?", "До 200.", true], ["Симметрична ли матрица?", "Да, и is_connected[i][i] = 1.", true], ["Есть ли веса?", "Нет, только 0 и 1.", false], ["Нужны ли сами группы?", "Нет, только количество.", false]], "brute": {"options": ["Для каждой пары проверять достижимость отдельным обходом", "Перебрать подмножества городов", "Посчитать единицы"], "answer": 0, "t": "O(n⁴)"}, "tech": {"options": ["DFS/BFS по компонентам или DSU", "Топосортировка", "Дейкстра", "Два указателя"], "answer": 0, "t": "O(n²)", "m": "O(n)"}, "tests": [{"args": [[[1, 1, 0], [1, 1, 0], [0, 0, 1]]], "exp": 2, "hidden": false, "case": ""}, {"args": [[[1, 0, 0], [0, 1, 0], [0, 0, 1]]], "exp": 3, "hidden": false, "case": ""}, {"args": [[[1]]], "exp": 1, "hidden": true, "case": "один город"}, {"args": [[[1, 0, 0, 1], [0, 1, 1, 0], [0, 1, 1, 1], [1, 0, 1, 1]]], "exp": 1, "hidden": true, "case": "связь через цепочку"}, {"args": [[[1, 1, 1], [1, 1, 1], [1, 1, 1]]], "exp": 1, "hidden": true, "case": "треугольник"}], "ref": "def find_circle_num(is_connected):\n    n = len(is_connected)\n    parent = list(range(n))\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n    comps = n\n    for i in range(n):\n        for j in range(i + 1, n):\n            if is_connected[i][j]:\n                a, b = find(i), find(j)\n                if a != b:\n                    parent[a] = b\n                    comps -= 1\n    return comps\n", "hints": ["Это компоненты связности графа.", "Матрица — граф смежности.", "DFS из каждого непосещённого города.", "Или DSU: n минус успешные union.", "Считай только j > i."], "expl": "Компоненты связности: DFS или DSU, O(n²) по матрице."}, {"id": "iv-1926", "level": "M", "title": "Ближайший выход", "leetcode": 1926, "statement": "Лабиринт — строки из '.' (проход) и '+' (стена). Ты в клетке entrance = [r, c]. Выход — клетка '.' на границе, кроме самого входа. Верни минимум шагов до выхода или -1.", "fn": "nearest_exit", "starter": "def nearest_exit(maze, entrance):\n    pass\n", "clarify": [["Какой размер лабиринта?", "До 100×100.", true], ["Считается ли вход выходом?", "Нет, даже если он на границе.", true], ["Можно ли ходить по диагонали?", "Нет, только 4 направления.", false], ["Нужен ли сам путь?", "Нет, только длина.", false]], "brute": {"options": ["DFS перебором всех путей", "Проверить все клетки границы сортировкой", "Жадно идти к ближней стене"], "answer": 0, "t": "O(4^(R·C))"}, "tech": {"options": ["BFS от входа", "Дейкстра с кучей", "DFS с мемоизацией", "Бинарный поиск по ответу"], "answer": 0, "t": "O(R·C)", "m": "O(R·C)"}, "tests": [{"args": [["++.+", "...+", "+++."], [1, 2]], "exp": 1, "hidden": false, "case": ""}, {"args": [["+++", "...", "+++"], [1, 0]], "exp": 2, "hidden": false, "case": ""}, {"args": [[".+"], [0, 0]], "exp": -1, "hidden": true, "case": "вход — единственный край"}, {"args": [["+.+", "+.+", "+++"], [1, 1]], "exp": 1, "hidden": true, "case": "выход сверху"}], "ref": "from collections import deque\n\ndef nearest_exit(maze, entrance):\n    R, C = len(maze), len(maze[0])\n    sr, sc = entrance\n    seen = {(sr, sc)}\n    q = deque([(sr, sc, 0)])\n    while q:\n        r, c, d = q.popleft()\n        if (r, c) != function md(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
}
/* ---------- Python highlighter ---------- */
const KW = new Set("def return if elif else for while in not and or is None True False import from as class pass break continue lambda global nonlocal try except finally with yield del assert raise".split(" "));
const BI = new Set("len range enumerate min max sum sorted set dict list tuple print abs float int str zip isinstance any all map reversed".split(" "));
function hlLine(line) {
  let out = "", i = 0;
  while (i < line.length) {
    const ch = line[i];
    if (ch === "#") { out += `<span class="c">${esc(line.slice(i))}</span>`; break; }
    if (ch === "'" || ch === '"') {
      let j = i + 1; while (j < line.length && line[j] !== ch) { if (line[j] === "\\") j++; j++; }
      out += `<span class="s">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue;
    }
    if (/[0-9]/.test(ch) && !/[A-Za-z_]/.test(line[i - 1] || "")) {
      let j = i; while (j < line.length && /[0-9_.]/.test(line[j])) j++;
      out += `<span class="n">${esc(line.slice(i, j))}</span>`; i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i; while (j < line.length && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      out += KW.has(w) ? `<span class="k">${w}</span>` : BI.has(w) ? `<span class="f">${w}</span>` : esc(w);
      i = j; continue;
    }
    out += esc(ch); i++;
  }
  return out;
}

/* ---------- save code ---------- */
function crc32(str) { let c, crc = 0xFFFFFFFF; for (let i = 0; i < str.length; i++) { c = (crc ^ str.charCodeAt(i)) & 0xFF; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; crc = (crc >>> 8) ^ c; } return (crc ^ 0xFFFFFFFF) >>> 0; }
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4))));
function makeCode() {
  const base = today();
  const lv = S.lv.map((l, i) => {
    const ids = LEVELS[i].tasks.map(t => t.id);
    let mask = 0; ids.forEach((id, j) => { if (l.tasks[id] && l.tasks[id].done) mask |= 1 << j; });
    return [l.stage, l.seen, l.viz ? 1 : 0, mask, l.hints, l.tries, l.stars, l.day ? base - l.day : -1];
  });
  const payload = JSON.stringify({ d: base, l: lv, i: S.iv.length });
  const body = b64u(payload), sum = crc32(body).toString(36).padStart(7, "0").slice(-4);
  return ("AQ1" + body + sum).match(/.{1,6}/g).join("-");
}
function readCode(txt) {
  const raw = txt.replace(/[\s-]/g, "");
  if (!raw.startsWith("AQ1") || raw.length < 12) throw new Error("Это не код Algo Quest: он должен начинаться с AQ1.");
  const body = raw.slice(3, -4), sum = raw.slice(-4);
  if (crc32(body).toString(36).padStart(7, "0").slice(-4) !== sum) throw new Error("Код повреждён: проверь, что он скопирован полностью и без опечаток.");
  const p = JSON.parse(unb64u(body)), st = freshState();
  p.l.forEach((a, i) => {
    if (!st.lv[i]) return;
    const l = st.lv[i]; [l.stage, l.seen, , , l.hints, l.tries, l.stars] = a; l.viz = !!a[2]; l.card = 0;
    LEVELS[i].tasks.forEach((t, j) => { if (a[3] & (1 << j)) l.tasks[t.id] = { done: true, h: 0 }; });
    l.day = a[7] >= 0 ? p.d - a[7] : 0;
  });
  st.iv = Array.from({ length: p.i || 0 }, () => ({ day: p.d, imported: true }));
  return st;
}

/* lesson */
function renderLesson(i) {
  const L = LEVELS[i], l = S.lv[i], cards = L.cards;
  let c = VIEW.card !== undefined ? VIEW.card : Math.min(l.card, cards.length - 1);
  const draw = () => {
    VIEW.card = c; l.card = c; l.seen = Math.max(l.seen, c); save();
    const card = cards[c], last = c === cards.length - 1;
    $("#stage").innerHTML = `<div class="lesson">
      <nav class="toc" aria-label="Карточки урока">${cards.map((k, j) => `<button data-c="${j}" class="${j === c ? "on" : ""} ${j <= l.seen && j !== c ? "seen" : ""}" ${j > l.seen + 1 && l.stage === 0 ? "disabled" : ""}>${esc(k.title)}</button>`).join("")}</nav>
      <article class="card"><div class="eyebrow">Карточка ${c + 1} из ${cards.length}</div><h2>${esc(card.title)}</h2>
        <div class="prose">${card.html}</div>
        <div class="card-nav"><button class="btn" id="prev" ${c === 0 ? "disabled" : ""}>← Назад</button>
        ${last ? `<button class="btn primary" id="finish">${l.stage > 0 ? "К интерактиву →" : "Урок прочитан — к интерактиву →"}</button>` : `<button class="btn primary" id="next">Дальше →</button>`}</div>
      </article></div>`;
    highlightIn($("#stage"));
    $("#stage").querySelectorAll(".toc button").forEach(b => b.onclick = () => { c = +b.dataset.c; draw(); window.scrollTo(0, 0); });
    $("#prev").onclick = () => { c--; draw(); window.scrollTo(0, 0); };
    if (last) $("#finish").onclick = () => { advance(i, 1); VIEW.stage = 1; VIEW.card = c; renderLevel(); window.scrollTo(0, 0); };
    else $("#next").onclick = () => { c++; draw(); window.scrollTo(0, 0); };
  };
  draw();
}

  if (!arr.length || arr.some(x => !Number.isInteger(x))) throw new Error("Введи целые числа через запятую, например: 3, 1, 4");
  if (arr.length > 20) throw new Error("Не больше 20 чисел — иначе шаги не поместятся.");

}

def _norm(v, mode):

    ${qs.map((j, n) => { const q = L.test[j]; const ord = shuffle(q.options.map((o, k) => k)); return `<div style="margin-top:18px"><b>${n + 1}. ${md(q.q)}</b><div class="opts">${ord.map(k => `<button class="opt" data-q="${n}" data-k="${k}">${md(q.options[k])}</button>`).join("")}</div></div>`; }).join("")}

function finishIV(why) {

  save(); renderReport(); window.scrollTo(0, 0);
}
function gradeIV() {

  const rows = IV.probs.map((P, k) => {

    const solve = D.solved ? (D.hints <= 1 && D.tech ? 2 : D.hints <= 3 ? 1 : 0) : 0;
    const comm = (D.asked.filter(j => P.clarify[j][2]).length === P.clarify.filter(q => q[2]).length ? 1 : 0) + (D.example ? 0.5 : 0) + (D.brute ? 0.5 : 0);
    const code = D.solved ? (D.submits <= 1 && !D.slow ? 2 : D.submits <= 3 ? 1 : 0) : 0;

  });

    ["Коммуникация", avg("comm"), "ключевые уточняющие вопросы, свой пример, брутфорс до оптимизации"],
    ["Код", avg("code"), "тесты с первой отправки, тест на скорость"],
    ["Тестирование", avg("test"), "запуск на примерах до отправки, верно названная итоговая сложность"]];
  const strong = crit.filter(c => c[1] >= 1.5).length, weak = crit.filter(c => c[1] < 1).length;
  const verdict = rows.every(r => r.D.solved) && weak === 0 && strong >= 2 ? "hire" : "no hire";
  return { rows, crit: crit.map(c => [c[0], sig(c[1]), c[2]]), verdict };
}

function parseTreeList(s) {
  const a = s.replace(/[\[\]]/g, "").split(/[\s,]+/).filter(Boolean).map(x => /^(null|none|-)$/i.test(x) ? null : Number(x));
  if (!a.length || a.some(x => x !== null && !Number.isInteger(x))) throw new Error("Числа через запятую, пустой узел — null.");
  if (a.length > 31) throw new Error("Не больше 31 элемента (5 уровней).");
  return a;
}
function parseEdges(s, needW) {
  const out = s.split(/[,;]+/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(\d+)\s*[-–>]\s*(\d+)(?:\s*:\s*(\d+))?$/);
    if (!m || (needW && m[3] === undefined)) throw new Error(needW ? "Рёбра вида 0-1:4 через запятую." : "Рёбра вида 0-1 через запятую.");
    return [+m[1], +m[2], m[3] === undefined ? 1 : +m[3]];
  });
  const n = Math.max(...out.flatMap(e => [e[0], e[1]])) + 1;
  if (n > 10) throw new Error("Вершины от 0 до 9."); if (out.length > 16) throw new Error("Не больше 16 рёбер.");
  return [n, out];
}

  code: ["def get(self, key):", "    if key not in self.d: return -1", "    self.d.move_to_end(key); return self.d[key]", "def put(self, key, value):", "    if key in self.d: self.d.move_to_end(key)", "    self.d[key] = value", "    if len(self.d) > self.cap:", "        self.d.popitem(last=False)"],
  frames(s) {
    const cmds = s.split(",").map(x => x.trim().split(/\s+/)).filter(x => x[0]);
    if (!cmds.length || cmds.length > 14 || cmds.some(c => !((c[0] === "get" && c.length === 2) || (c[0] === "put" && c.length === 3)) || c.slice(1).some(v => !/^-?\d+$/.test(v)))) throw new Error("Команды вида put 1 1, get 1 — до 14 штук.");
    const cap = 2, order = [], val = {}, fr = [];
    const snap = (line, note, mk) => fr.push(F({ boxes: [B("порядок: старые слева → свежие справа", order.map(k => `${k}:${val[k]}`), mk)], map: Object.fromEntries(order.map(k => [k, val[k]])), line, note }));
    snap(0, "Кеш пуст, ёмкость 2.");
    cmds.forEach(([op, k, v]) => {
      if (op === "get") {
        if (!(k in val)) { snap(1, `get ${k}: ключа нет → -1.`); return; }
        order.splice(order.indexOf(k), 1); order.push(k); snap(2, `get ${k} → ${val[k]}. Ключ стал самым свежим — в конец.`, [order.length - 1]);
      } else {
        if (k in val) order.splice(order.indexOf(k), 1);
        order.push(k); val[k] = v;
        if (order.length > cap) { const old = order.shift(); delete val[old]; snap(7, `put ${k} ${v}: переполнение — выбрасываем самый старый ключ ${old}.`, [order.length - 1]); }
        else snap(5, `put ${k} ${v}: кладём в конец.`, [order.length - 1]);
      }
    });
    return fr;
  }
};
VIZ.quickselect = {

  code: ["while True:", "    p = a[hi]                 # опорный (Ломуто)", "    i = lo", "    for j in range(lo, hi):", "        if a[j] < p: a[i], a[j] = a[j], a[i]; i += 1", "    a[i], a[hi] = a[hi], a[i]", "    if i == k - 1: return a[i]", "    elif i < k - 1: lo = i + 1", "    else: hi = i - 1"],
  frames(s) {

    let lo = 0, hi = a.length - 1; const fr = [];
    while (true) {

      fr.push(F({ arr: a.slice(), range: [lo, hi], ptr: { p: hi }, line: 1, vars: { k, p }, note: `Ищем в [${lo}..${hi}]. Опорный — ${p}.` }));
      for (let j = lo; j < hi; j++) if (a[j] < p) { [a[i], a[j]] = [a[j], a[i]]; i++; }
      [a[i], a[hi]] = [a[hi], a[i]];

      if (i < k - 1) { lo = i + 1; fr.push(F({ arr: a.slice(), range: [lo, hi], line: 7, vars: { k }, note: `k − 1 = ${k - 1} > ${i}: ищем только справа.` })); }

    }
  }
};
VIZ.intdp = {
  title: "ДП по отрезкам: лопание шариков", input: "3, 1, 5, 8", hint: "До 5 шариков",
  code: ["a = [1] + nums + [1]", "for length in range(2, n):", "    for l in range(0, n - length):", "        r = l + length", "        for k in range(l + 1, r):", "            dp[l][r] = max(dp[l][r],", "                dp[l][k] + a[l]*a[k]*a[r] + dp[k][r])"],

    const a = [1, ...nums, 1], n = a.length, dp = [...Array(n)].map(() => Array(n).fill(0)), fr = [], hdr = a.map((v, i) => `${i}:${v}`), done = new Set();

    }

  }

VIZ.fenwick = {
  title: "Дерево Фенвика", input: "3, 2, -1, 6, 5, 4, -3, 3", hint: "До 16 чисел",
  code: ["def add(i, d):", "    while i <= n:", "        t[i] += d; i += i & -i", "def pref(i):", "    s = 0", "    while i > 0:", "        s += t[i]; i -= i & -i", "    return s"],
  frames(s) {
    const a = parseList(s); if (a.length > 16) throw new Error("Не больше 16 чисел."); const n = a.length, t = Array(n + 1).fill(0), fr = [];
    const cover = i => `${i - (i & -i) + 1}..${i}`;
    const snap = (mk, line, note, vars) => fr.push(F({ arr: a, boxes: [B("t[i] (индекс с 1; отрезок a[" + "l..i])", t.slice(1).map((v, j) => `${v}`), mk.map(i => i - 1)), B("отрезок, за который отвечает t[i]", t.slice(1).map((_, j) => cover(j + 1)), mk.map(i => i - 1))], vars, line, note }));
    a.forEach((x, j) => { let i = j + 1; const path = []; while (i <= n) { t[i] += x; path.push(i); i += i & -i; } if (j < 4 || j === n - 1) snap(path, 2, `add(${j + 1}, ${x}): обновили t[${path.join("], t[")}] — шаг i += i & -i.`); });
    snap([], 0, `Построено за O(n log n). Каждое t[i] покрывает i & -i элементов.`);
    const q = n; let i = q, sum = 0; const path = [];
    while (i > 0) { sum += t[i]; path.push(i); i -= i & -i; }
    snap(path, 6, `pref(${q}) = ${path.map(p => "t[" + p + "]").join(" + ")} = ${sum}: шагов столько, сколько единиц в двоичной записи ${q}.`, { "сумма": sum });
    const mid = Math.max(1, n >> 1); i = mid; sum = 0; const p2 = [];
    while (i > 0) { sum += t[i]; p2.push(i); i -= i & -i; }

    return fr;
  }
};

      while (i - p[i] - 1 >= 0 && i + p[i] + 1 < n && t[i - p[i] - 1] === t[i + p[i] + 1]) p[i]++;

    return fr;
  }

VIZ.sweep = {

    const ev = []; iv.forEach(([a, b], k) => { ev.push([a, 1, k]); ev.push([b, -1, k]); }); ev.sort((x, y) => x[0] - y[0] || x[1] - y[1]);

    });
    fr.push(F({ ivals: iv, ivLabel: "Встречи", resLabel: "Идут сейчас", res: [], cur: -1, vars: { best }, line: 5, note: `Нужно комнат: ${best} — максимум одновременных встреч. O(n log n).` }));

VIZ.bridges = {
