ения — целые от 0 до k и k невелико, можно посчитать, сколько раз встречается каждое значение, и выписать их по порядку: O(n + k), без сравнений.<\/p>\n<pre><code class=\"language-python\">def counting_sort(a, k):\n    count = [0] * (k + 1)\n    for x in a:\n        count[x] += 1\n    res = []\n    for v in range(k + 1):\n        res.extend([v] * count[v])\n    return res\n\nassert counting_sort([2, 0, 2, 1, 1, 0], 2) == [0, 0, 1, 1, 2, 2]\n<\/code><\/pre>\n<p>Задача 75 просит отсортировать 0, 1, 2 <strong>за один проход на месте<\/strong>. Это разбиение на три части — «флаг Нидерландов» Дейкстры. Три указателя: low — граница нулей, mid — текущий, high — граница двоек.<\/p>\n<pre><code class=\"language-python\">def sort_colors(a):\n    low, mid, high = 0, 0, len(a) - 1\n    while mid &lt;= high:\n        if a[mid] == 0:\n            a[low], a[mid] = a[mid], a[low]\n            low += 1\n            mid += 1\n        elif a[mid] == 1:\n            mid += 1\n        else:\n            a[mid], a[high] = a[high], a[mid]\n            high -= 1                    # mid не двигаем: пришедший элемент ещё не проверен\n    return a\n\nassert sort_colors([2, 0, 2, 1, 1, 0]) == [0, 0, 1, 1, 2, 2]\nassert sort_colors([2, 0, 1]) == [0, 1, 2]\n<\/code><\/pre>\n<p>Инвариант: a[0..low−1] — нули, a[low..mid−1] — единицы, a[mid..high] — не проверено, a[high+1..] — двойки. Цикл идёт, пока непроверенная часть не пуста.<\/p>"}, {"title": "Сортировка по своему правилу", "html": "<p>В 90 % случаев хватает <code>key<\/code> (глава 3). Но иногда порядок двух элементов определяется только их <strong>парным<\/strong> сравнением. Задача 179 «Largest Number»: составить из чисел самое большое число. «9» должно идти раньше «34», а «3» раньше «30», потому что «330» &gt; «303». Правило: a раньше b, если a + b &gt; b + a как строки.<\/p>\n<pre><code class=\"language-python\">from functools import cmp_to_key\n\ndef largest_number(nums):\n    s = [str(x) for x in nums]\n    def cmp(a, b):\n        if a + b &gt; b + a:\n            return -1                    # a должен идти раньше\n        if a + b &lt; b + a:\n            return 1\n        return 0\n    s.sort(key=cmp_to_key(cmp))\n    res = ''.join(s)\n    return '0' if res[0] == '0' else res\n\nassert largest_number([3, 30, 34, 5, 9]) == &quot;9534330&quot;\nassert largest_number([0, 0]) == &quot;0&quot;\n<\/code><\/pre>\n<p>Ещё два частых сценария: отсортировать интервалы по началу (глава 11) и отсортировать по частоте, затем по значению — <code>sorted(nums, key=lambda x: (-freq[x], x))<\/code>.<\/p>"}, {"title": "Типичные ошибки", "html": "<ul>\n<li>Называть быструю сортировку O(n log n) без оговорки про худший случай O(n²).<\/li>\n<li>Брать первый или последний элемент как pivot без рандомизации — на отсортированном входе O(n²) и глубокая рекурсия.<\/li>\n<li>В слиянии писать <code>&lt;<\/code> вместо <code>&lt;=<\/code> — сортировка перестаёт быть стабильной.<\/li>\n<li>В «Sort Colors» сдвигать mid после обмена с high — пришедший справа элемент остаётся непроверенным.<\/li>\n<li>Забывать, что <code>list.sort()<\/code> меняет исходный список, — если исходный порядок ещё нужен, работать с копией.<\/li>\n<\/ul>"}, {"title": "Реши на LeetCode", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>912. Sort an Array (написать слиянием)<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>75. Sort Colors<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>215. Kth Largest Element in an Array<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>179. Largest Number<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>148. Sort List (слиянием на списке)<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>315. Count of Smaller Numbers After Self<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "viz": "partition", "tasks": [{"id": "9-table", "type": "choice", "title": "Гарантия O(n log n)", "q": "Какая сортировка работает за O(n log n) **в худшем** случае?", "options": ["Быстрая сортировка", "Сортировка слиянием", "Сортировка вставками", "Пузырьком"], "answer": 1, "hints": ["Худший случай быстрой — когда pivot неудачный.", "У вставок худший случай — обратный порядок.", "Какая сортировка всегда делит ровно пополам?", "log n уровней по O(n) работы.", "Слиянием."], "expl": "Слияние всегда делит пополам: log n уровней по O(n). Быстрая в худшем случае O(n²), вставками — O(n²)."}, {"id": "9-stable", "type": "choice", "title": "Стабильность", "q": "Что гарантирует стабильная сортировка?", "options": ["Работает за O(n log n)", "Не использует доп. память", "Элементы с равными ключами сохраняют исходный порядок", "Не падает на пустом массиве"], "answer": 2, "hints": ["Речь о равных элементах.", "Отсортируй людей по возрасту — что с людьми одного возраста?", "Стабильная не переставляет их между собой.", "Это свойство, а не скорость.", "Порядок равных сохраняется."], "expl": "Стабильность — сохранение порядка элементов с равными ключами. Важна при сортировке в несколько проходов и по ключу."}, {"id": "9-trace", "type": "trace", "title": "Трассировка разбиения", "q": "Заполни таблицу для разбиения Ломуто [7, 2, 9, 1, 5] с pivot = 5 (последний). i — граница «меньших pivot».", "code": "pivot = a[hi]\ni = lo\nfor j in range(lo, hi):\n    if a[j] < pivot:\n        a[i], a[j] = a[j], a[i]\n        i += 1\na[i], a[hi] = a[hi], a[i]", "columns": ["j", "a[j]", "a[j] < 5?", "i после шага"], "rows": [[0, 7, "нет", 0], [1, 2, null, null], [2, 9, null, null], [3, 1, null, null]], "answer": [[0, 7, "нет", 0], [1, 2, "да", 1], [2, 9, "нет", 1], [3, 1, "да", 2]], "hints": ["i растёт только когда a[j] < pivot.", "2 < 5 — обмен и i = 1.", "9 не меньше 5 — i не меняется.", "1 < 5 — обмен и i = 2.", "Ответы: да/1, нет/1, да/2."], "expl": "После цикла i = 2, и pivot 5 встаёт на индекс 2 — своё итоговое место: [2, 1, 5, 7, 9]."}, {"id": "9-c-quick", "type": "complexity", "title": "Быстрая сортировка: худший случай", "q": "Быстрая сортировка с pivot = последний элемент на уже отсортированном массиве. Назови время и память стека.", "code": "def quick_sort(a, lo, hi):\n    if lo < hi:\n        p = partition(a, lo, hi)   # pivot = a[hi]\n        quick_sort(a, lo, p - 1)\n        quick_sort(a, p + 1, hi)", "t": "O(n²)", "m": "O(n)", "hints": ["Где окажется pivot на отсортированном массиве?", "Последний элемент — максимум, он встаёт в конец.", "Левая часть короче всего на 1, правая пустая.", "n + (n−1) + … — арифметическая прогрессия, глубина n.", "Время O(n²), стек O(n)."], "expl": "Pivot всегда максимум: части n−1 и 0. Сумма разбиений ~n²/2, глубина рекурсии n. Случайный pivot это лечит."}, {"id": "9-code-75", "type": "code", "title": "Sort Colors", "q": "Массив из 0, 1, 2. Отсортируй его на месте за один проход без подсчёта и верни.", "fn": "sort_colors", "starter": "def sort_colors(a):\n    # отсортируй a на месте\n    return a\n", "leetcode": 75, "tests": [{"args": [[2, 0, 2, 1, 1, 0]], "exp": [0, 0, 1, 1, 2, 2], "hidden": false}, {"args": [[2, 0, 1]], "exp": [0, 1, 2], "hidden": false}, {"args": [[1]], "exp": [1], "hidden": true, "case": "один элемент"}, {"args": [[2, 2, 0, 0]], "exp": [0, 0, 2, 2], "hidden": true, "case": "без единиц"}, {"args": [[2, 1, 2]], "exp": [1, 2, 2], "hidden": true, "case": "двойка приходит справа"}], "ref": "def sort_colors(a):\n    low, mid, high = 0, 0, len(a) - 1\n    while mid <= high:\n        if a[mid] == 0:\n            a[low], a[mid] = a[mid], a[low]\n            low += 1\n            mid += 1\n        elif a[mid] == 1:\n            mid += 1\n        else:\n            a[mid], a[high] = a[high], a[mid]\n            high -= 1\n    return a\n", "hints": ["Три группы — три указателя.", "low — где кончаются нули, high — где начинаются двойки.", "mid — текущий непроверенный.", "0 → обмен с low, сдвинуть low и mid; 2 → обмен с high, сдвинуть только high.", "После обмена с high пришедший элемент ещё не проверен — mid не двигаем."], "expl": "Флаг Нидерландов: a[0..low) — нули, [low..mid) — единицы, (high..] — двойки. Ошибка — сдвигать mid после обмена с high."}, {"id": "9-code-215", "type": "code", "title": "k-й наибольший", "q": "Верни k-й по величине элемент nums (k = 1 — максимум). Среднее время должно быть лучше O(n log n).", "fn": "find_kth_largest", "starter": "def find_kth_largest(nums, k):\n    pass\n", "leetcode": 215, "tests": [{"args": [[3, 2, 1, 5, 6, 4], 2], "exp": 5, "hidden": false}, {"args": [[3, 2, 3, 1, 2, 4, 5, 5, 6], 4], "exp": 4, "hidden": false}, {"args": [[1], 1], "exp": 1, "hidden": true, "case": "один элемент"}, {"args": [[7, 7, 7], 2], "exp": 7, "hidden": true, "case": "одинаковые"}], "ref": "import heapq\n\ndef find_kth_largest(nums, k):\n    h = []\n    for x in nums:\n        heapq.heappush(h, x)\n        if len(h) > k:\n            heapq.heappop(h)\n    return h[0]\n", "hints": ["Сортировка — O(n log n). Можно ли не сортировать всё?", "Куча размера k: O(n log k).", "Или quickselect: после разбиения pivot на своём месте.", "Идём только в ту часть, где лежит индекс n − k.", "Осторожно с дубликатами: set их убивает."], "expl": "Куча размера k — O(n log k), quickselect — O(n) в среднем. Через set ломаются дубликаты."}, {"id": "9-code-179", "type": "code", "title": "Самое большое число", "q": "Расставь неотрицательные числа так, чтобы склейка дала самое большое число. Верни строку.", "fn": "largest_number", "starter": "from functools import cmp_to_key\n\ndef largest_number(nums):\n    pass\n", "leetcode": 179, "tests": [{"args": [[10, 2]], "exp": "210", "hidden": false}, {"args": [[3, 30, 34, 5, 9]], "exp": "9534330", "hidden": false}, {"args": [[0, 0]], "exp": "0", "hidden": true, "case": "одни нули"}, {"args": [[1]], "exp": "1", "hidden": true, "case": "одно число"}, {"args": [[34, 3]], "exp": "343", "hidden": true, "case": "общий префикс"}], "ref": "from functools import cmp_to_key\n\ndef largest_number(nums):\n    s = [str(x) for x in nums]\n    s.sort(key=cmp_to_key(lambda a, b: -1 if a + b > b + a else (1 if a + b < b + a else 0)))\n    r = ''.join(s)\n    return '0' if r[0] == '0' else r\n", "hints": ["Обычная сортировка строк по убыванию ошибается на 3 и 30.", "Порядок двух чисел определяется их склейкой.", "a раньше b, если a + b > b + a.", "Нужен компаратор: functools.cmp_to_key.", "Не забудь случай, когда всё — нули."], "expl": "Парное правило «a + b > b + a» задаёт порядок; cmp_to_key превращает его в ключ. Ответ «00» нужно превратить в «0»."}], "test": [{"q": "Нижняя граница для сортировок сравнениями:", "options": ["O(n)", "~n log n сравнений", "O(log n)", "O(n²)"], "answer": 1}, {"q": "Сортировка вставками на почти отсортированном массиве:", "options": ["O(n²)", "Близко к O(n)", "O(n log n)", "Не работает"], "answer": 1}, {"q": "Где окажется pivot после разбиения?", "options": ["В начале", "На своём итоговом месте в отсортированном массиве", "В конце", "Случайно"], "answer": 1}, {"q": "Средняя сложность quickselect:", "options": ["O(n log n)", "O(n)", "O(log n)", "O(n²)"], "answer": 1}, {"q": "Сортировка подсчётом подходит, когда:", "options": ["Значения — строки", "Значения — небольшие целые от 0 до k", "Нужна O(1) память всегда", "Массив повёрнут"], "answer": 1}, {"q": "Зачем в слиянии сравнение `<=`, а не `<`?", "options": ["Быстрее", "Сохраняет стабильность", "Иначе бесконечный цикл", "Без разницы"], "answer": 1}, {"q": "Как защитить быструю сортировку от O(n²) на отсортированном входе?", "options": ["Брать первый элемент", "Случайный pivot", "Сортировать дважды", "Никак"], "answer": 1}]}, {"title": "Глава 10. Бинарный поиск", "short": "Бинарный поиск", "part": "Часть III · Сортировка и поиск", "cards": [{"title": "Интуиция: угадай число", "html": "<p>Бинарный поиск отвечает на вопрос за O(log n), каждым сравнением отбрасывая половину кандидатов. Идея простая, но это одна из самых «ошибкоопасных» тем собеса: перепутанные границы, бесконечный цикл, промах на единицу. Поэтому главное в главе — <strong>один шаблон<\/strong>, который работает всегда, и умение увидеть бинарный поиск там, где массива нет вовсе.<\/p><h4>Интуиция: угадай число<\/h4><p>Загадано число от 1 до 100. Спрашивая «больше 50?», мы одним вопросом отбрасываем половину вариантов. 100 → 50 → 25 → … → 1: хватит 7 вопросов. Для 10⁹ вариантов — 30 вопросов. Это и есть log₂ n из главы 2.<\/p>\n<p>Условие, без которого это не работает: ответ на вопрос должен быть <strong>монотонным<\/strong>. Если для числа x ответ «да», то и для всех больших x — «да». Тогда все варианты выглядят как полоса «нет, нет, нет, да, да, да», и бинарный поиск ищет <strong>границу<\/strong> между «нет» и «да».<\/p>"}, {"title": "Как узнать задачу · Универсальный шаблон: первый «да»", "html": "<ul>\n<li>Массив отсортирован, и нужно найти элемент, позицию вставки, первое или последнее вхождение.<\/li>\n<li>n до 10⁹ или ограничение «за O(log n)».<\/li>\n<li>«Найди минимальное / максимальное X, при котором выполнимо условие», и при большем X условие тоже выполнимо (поиск по ответу).<\/li>\n<li>«Отсортированный, но повёрнутый массив».<\/li>\n<\/ul><h4>Универсальный шаблон: первый «да»<\/h4><p>Вместо трёх разных версий бинарного поиска запомни одну: найти <strong>первый индекс, где условие истинно<\/strong>. Полуинтервал [lo, hi): hi указывает за последний кандидат.<\/p>\n<pre><code class=\"language-python\">def first_true(lo, hi, ok):\n    # ok(x) монотонна: False ... False True ... True на [lo, hi)\n    while lo &lt; hi:\n        mid = (lo + hi) // 2\n        if ok(mid):\n            hi = mid           # mid подходит — ответ mid или левее\n        else:\n            lo = mid + 1       # mid не подходит — ответ строго правее\n    return lo                  # если True нигде нет, вернётся hi\n<\/code><\/pre>\n<p><strong>Почему цикл всегда заканчивается.<\/strong> mid = (lo + hi) // 2 всегда строго меньше hi, поэтому <code>hi = mid<\/code> уменьшает отрезок, а <code>lo = mid + 1<\/code> — тоже. Отрезок сжимается каждый шаг, бесконечного цикла нет.<\/p>\n<p><strong>Инвариант:<\/strong> всё левее lo — «нет», всё начиная с hi — «да». Когда lo == hi, это и есть граница.<\/p>\n<p>Все классические варианты — частные случаи шаблона:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Условие ok(i)<\/th>\n<th>Ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>позиция вставки x (bisect_left)<\/td>\n<td>a[i] &gt;= x<\/td>\n<td>first_true(0, n, ...)<\/td>\n<\/tr>\n<tr>\n<td>первое вхождение x<\/td>\n<td>a[i] &gt;= x<\/td>\n<td>i, если i &lt; n и a[i] == x, иначе −1<\/td>\n<\/tr>\n<tr>\n<td>последнее вхождение x<\/td>\n<td>a[i] &gt; x<\/td>\n<td>first_true(...) − 1, если там x<\/td>\n<\/tr>\n<tr>\n<td>сколько элементов &lt; x<\/td>\n<td>a[i] &gt;= x<\/td>\n<td>сам индекс<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Трассировка: первое вхождение 2 в [1, 2, 2, 2, 5]", "html": "<p>ok(i) = a[i] &gt;= 2. Полоса значений: F T T T T.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>lo<\/th>\n<th>hi<\/th>\n<th>mid<\/th>\n<th>a[mid]<\/th>\n<th>ok?<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>5<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>да<\/td>\n<td>hi = 2<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>2<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>да<\/td>\n<td>hi = 1<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>нет<\/td>\n<td>lo = 1<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>стоп: ответ 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code class=\"language-python\">def search_range(a, x):\n    def first(cond):\n        lo, hi = 0, len(a)\n        while lo &lt; hi:\n            mid = (lo + hi) // 2\n            if cond(a[mid]):\n                hi = mid\n            else:\n                lo = mid + 1\n        return lo\n    l = first(lambda v: v &gt;= x)\n    if l == len(a) or a[l] != x:\n        return [-1, -1]\n    r = first(lambda v: v &gt; x) - 1\n    return [l, r]\n\nassert search_range([5, 7, 7, 8, 8, 10], 8) == [3, 4]\nassert search_range([5, 7, 7, 8, 8, 10], 6) == [-1, -1]\nassert search_range([], 0) == [-1, -1]\n<\/code><\/pre>\n<p>Это задача 34. Два прогона шаблона: первый ≥ x и первый &gt; x.<\/p>"}, {"title": "Классический поиск с тремя ветками", "html": "<p>На собесах часто пишут и эту версию — для «есть ли x». Отрезок закрытый [lo, hi], поэтому условие <code>lo &lt;= hi<\/code> и сдвиги <code>mid ± 1<\/code>.<\/p>\n<pre><code class=\"language-python\">def binary_search(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo &lt;= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == x:\n            return mid\n        if a[mid] &lt; x:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n\nassert binary_search([-1, 0, 3, 5, 9, 12], 9) == 4\nassert binary_search([-1, 0, 3, 5, 9, 12], 2) == -1\n<\/code><\/pre>\n<p>Главное — <strong>не смешивать<\/strong> две схемы: полуинтервал [lo, hi) ↔ <code>while lo &lt; hi<\/code> ↔ <code>hi = mid<\/code>; закрытый [lo, hi] ↔ <code>while lo &lt;= hi<\/code> ↔ <code>hi = mid − 1<\/code>.<\/p>"}, {"title": "Повёрнутый массив: задачи 153 и 33", "html": "<p>Отсортированный массив «повернули»: [4, 5, 6, 7, 0, 1, 2]. Монотонности по значениям нет, но есть монотонное условие: <strong>a[i] &lt;= a[−1]<\/strong> — ложно на левом «куске» (4, 5, 6, 7) и истинно на правом (0, 1, 2). Первый «да» — минимум (задача 153).<\/p>\n<pre><code class=\"language-python\">def find_min(a):\n    lo, hi = 0, len(a) - 1\n    while lo &lt; hi:\n        mid = (lo + hi) // 2\n        if a[mid] &lt;= a[hi]:\n            hi = mid            # минимум в [lo, mid]\n        else:\n            lo = mid + 1        # минимум правее mid\n    return a[lo]\n\nassert find_min([4, 5, 6, 7, 0, 1, 2]) == 0\nassert find_min([11, 13, 15, 17]) == 11\nassert find_min([2, 1]) == 1\n<\/code><\/pre>\n<p>Задача 33 (найти target в повёрнутом массиве): на каждом шаге <strong>одна из половин<\/strong> [lo, mid] или [mid, hi] обязательно отсортирована. Проверяем, лежит ли target в отсортированной половине, — если да, идём туда, иначе в другую.<\/p>\n<pre><code class=\"language-python\">def search_rotated(a, target):\n    lo, hi = 0, len(a) - 1\n    while lo &lt;= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == target:\n            return mid\n        if a[lo] &lt;= a[mid]:                    # левая половина отсортирована\n            if a[lo] &lt;= target &lt; a[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                   # правая половина отсортирована\n            if a[mid] &lt; target &lt;= a[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n\nassert search_rotated([4, 5, 6, 7, 0, 1, 2], 0) == 4\nassert search_rotated([4, 5, 6, 7, 0, 1, 2], 3) == -1\nassert search_rotated([1], 1) == 0\n<\/code><\/pre>"}, {"title": "Поиск по ответу", "html": "<p>Самая мощная форма бинарного поиска: ищем не элемент массива, а <strong>значение ответа<\/strong>. Подходит, когда:<\/p>\n<ol>\n<li>Ответ — число в известном диапазоне [lo, hi].<\/li>\n<li>Есть быстрая проверка <code>can(x)<\/code>: «выполнимо ли условие при ответе x?»<\/li>\n<li>Проверка монотонна: если можно при x, то можно и при большем x (или наоборот).<\/li>\n<\/ol>\n<p>Задача 875 «Koko Eating Bananas»: стопки бананов piles, за час Коко съедает до k бананов из одной стопки. Найти минимальную скорость k, чтобы успеть за h часов.<\/p>\n<ul>\n<li>Диапазон: k от 1 до max(piles) — при max(piles) каждая стопка съедается за час.<\/li>\n<li>Проверка: часов при скорости k = сумма ⌈p / k⌉ ≤ h. Это O(n).<\/li>\n<li>Монотонность: большая скорость — не больше часов.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">def min_eating_speed(piles, h):\n    def can(k):\n        return sum((p + k - 1) // k for p in piles) &lt;= h   # (p + k - 1) // k = ceil(p / k)\n    lo, hi = 1, max(piles)\n    while lo &lt; hi:\n        mid = (lo + hi) // 2\n        if can(mid):\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo\n\nassert min_eating_speed([3, 6, 7, 11], 8) == 4\nassert min_eating_speed([30, 11, 23, 4, 20], 5) == 30\nassert min_eating_speed([30, 11, 23, 4, 20], 6) == 23\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> для [3, 6, 7, 11], h = 8:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>lo<\/th>\n<th>hi<\/th>\n<th>mid<\/th>\n<th>Часов при mid<\/th>\n<th>can?<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>11<\/td>\n<td>6<\/td>\n<td>1 + 1 + 2 + 2 = 6<\/td>\n<td>да<\/td>\n<td>hi = 6<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>6<\/td>\n<td>3<\/td>\n<td>1 + 2 + 3 + 4 = 10<\/td>\n<td>нет<\/td>\n<td>lo = 4<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>6<\/td>\n<td>5<\/td>\n<td>1 + 2 + 2 + 3 = 8<\/td>\n<td>да<\/td>\n<td>hi = 5<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>5<\/td>\n<td>4<\/td>\n<td>1 + 2 + 2 + 3 = 8<\/td>\n<td>да<\/td>\n<td>hi = 4<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>4<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>ответ 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Сложность:<\/strong> O(n · log(max)). Перебор всех скоростей дал бы O(n · max) — при max = 10⁹ это невозможно.<\/p>\n<p>Тот же каркас решает 1011 «Capacity To Ship Packages» (минимальная грузоподъёмность), 410 «Split Array Largest Sum», 69 «Sqrt(x)» (первое k с k² &gt; x, минус 1) и многие другие. Каждый раз нужно ответить: <strong>какой диапазон, какая проверка, почему она монотонна<\/strong>.<\/p>"}, {"title": "Сложность · Типичные ошибки", "html": "<p>O(log n) шагов; при поиске по ответу — O(log(диапазона)) × стоимость проверки. Память O(1) в итеративной версии, O(log n) в рекурсивной (глава 4).<\/p><h4>Типичные ошибки<\/h4><ul>\n<li>Смешать схемы: <code>while lo &lt;= hi<\/code> вместе с <code>hi = mid<\/code> — бесконечный цикл при lo == hi.<\/li>\n<li><code>lo = mid<\/code> вместо <code>lo = mid + 1<\/code> при mid = (lo + hi) // 2 — при hi = lo + 1 mid == lo, отрезок не сжимается.<\/li>\n<li>Забыть проверить, что найденный индекс в границах и элемент действительно равен x.<\/li>\n<li>В поиске по ответу неверный диапазон: lo = 0 приводит к делению на ноль в проверке, а слишком маленький hi — к ответу, которого нет.<\/li>\n<li>Не доказать монотонность проверки. Если её нет, бинарный поиск по ответу неприменим.<\/li>\n<\/ul>"}, {"title": "Реши на LeetCode", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>704. Binary Search<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>35. Search Insert Position<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>69. Sqrt(x)<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>34. Find First and Last Position<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>153. Find Minimum in Rotated Sorted Array<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>33. Search in Rotated Sorted Array<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>875. Koko Eating Bananas<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>1011. Capacity To Ship Packages<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>4. Median of Two Sorted Arrays<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "viz": "binsearch", "tasks": [{"id": "10-trace", "type": "trace", "title": "Трассировка: первый «да»", "q": "Найди первое вхождение 2 в [1, 2, 2, 2, 5] шаблоном «первый да», ok(i) = a[i] >= 2.", "code": "lo, hi = 0, len(a)\nwhile lo < hi:\n    mid = (lo + hi) // 2\n    if a[mid] >= 2:\n        hi = mid\n    else:\n        lo = mid + 1", "columns": ["lo", "hi", "mid", "ok?"], "rows": [[0, 5, 2, "да"], [0, null, null, null], [null, 1, null, null]], "answer": [[0, 5, 2, "да"], [0, 2, 1, "да"], [0, 1, 0, "нет"]], "hints": ["После «да» hi = mid.", "Вторая строка: lo = 0, hi = 2, mid = 1.", "a[1] = 2 ≥ 2 — да, hi = 1.", "Третья строка: lo = 0, hi = 1, mid = 0, a[0] = 1 — нет.", "Затем lo = 1 = hi — ответ 1."], "expl": "Отрезок сжимается: [0,5) → [0,2) → [0,1) → [1,1). Ответ — индекс 1."}, {"id": "10-bug", "type": "bug", "title": "Найди баг: бесконечный цикл", "q": "Функция зависает на a = [1, 3], x = 3. Найди строку с ошибкой.", "code": ["def first_ge(a, x):", "    lo, hi = 0, len(a)", "    while lo < hi:", "        mid = (lo + hi) // 2", "        if a[mid] >= x:", "            hi = mid", "        else:", "            lo = mid", "    return lo"], "line": 7, "fixes": ["            lo = mid + 1", "            hi = mid - 1", "            lo = mid - 1"], "fix": 0, "hints": ["Пройди руками: lo = 0, hi = 2.", "mid = 1? Нет: на шаге с lo = 0, hi = 1 mid = 0.", "a[0] = 1 < 3 → lo = mid = 0 — ничего не изменилось.", "mid строго меньше hi, но может быть равен lo.", "Нужно lo = mid + 1."], "expl": "При hi = lo + 1 mid == lo, и `lo = mid` не сдвигает границу. Правильно `lo = mid + 1`: mid не подходит, ответ правее."}, {"id": "10-choice", "type": "choice", "title": "Поиск по ответу", "q": "«Минимальная грузоподъёмность корабля, чтобы перевезти посылки по порядку за D дней». Что ищем бинарным поиском?", "options": ["Индекс посылки", "Значение грузоподъёмности в диапазоне [max(weights), sum(weights)]", "Число дней", "Медиану весов"], "answer": 1, "hints": ["Ответ — число. В каком диапазоне?", "Меньше самой тяжёлой посылки нельзя.", "При sum(weights) всё уедет за день.", "Если при C успеваем, то и при большей C успеваем — монотонность.", "Бинарный поиск по C с жадной проверкой за O(n)."], "expl": "Поиск по ответу: диапазон [max, sum], проверка — жадно грузим посылки по порядку и считаем дни, монотонность — большая вместимость не хуже."}, {"id": "10-code-35", "type": "code", "title": "Позиция вставки", "q": "a отсортирован по возрастанию, без повторов. Верни индекс x, а если его нет — индекс, куда его вставить. O(log n).", "fn": "search_insert", "starter": "def search_insert(a, x):\n    pass\n", "leetcode": 35, "tests": [{"args": [[1, 3, 5, 6], 5], "exp": 2, "hidden": false}, {"args": [[1, 3, 5, 6], 2], "exp": 1, "hidden": false}, {"args": [[1, 3, 5, 6], 7], "exp": 4, "hidden": true, "case": "больше всех"}, {"args": [[1, 3, 5, 6], 0], "exp": 0, "hidden": true, "case": "меньше всех"}, {"args": [[], 5], "exp": 0, "hidden": true, "case": "пустой"}], "speed": {"gen": "ARGS=[list(range(0, 400000, 2)), 399999]", "repeat": 2000}, "ref": "def search_insert(a, x):\n    lo, hi = 0, len(a)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if a[mid] >= x:\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo\n", "hints": ["Ищем первый индекс, где a[i] >= x.", "Шаблон «первый да» на [0, n).", "hi = len(a), а не len(a) − 1: ответ может быть n.", "a[mid] >= x → hi = mid, иначе lo = mid + 1.", "Вернуть lo."], "expl": "Это bisect_left. Частая ошибка — hi = len(a) − 1: тогда ответ n («больше всех») недостижим."}, {"id": "10-code-153", "type": "code", "title": "Минимум повёрнутого массива", "q": "Отсортированный массив без повторов повернули. Найди минимум за O(log n).", "fn": "find_min", "starter": "def find_min(a):\n    pass\n", "leetcode": 153, "tests": [{"args": [[3, 4, 5, 1, 2]], "exp": 1, "hidden": false}, {"args": [[4, 5, 6, 7, 0, 1, 2]], "exp": 0, "hidden": false}, {"args": [[11, 13, 15, 17]], "exp": 11, "hidden": true, "case": "не повёрнут"}, {"args": [[2, 1]], "exp": 1, "hidden": true, "case": "два элемента"}, {"args": [[5]], "exp": 5, "hidden": true, "case": "один"}], "speed": {"gen": "n=200000\nARGS=[list(range(n//2, n)) + list(range(n//2))]", "repeat": 2000}, "ref": "def find_min(a):\n    lo, hi = 0, len(a) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if a[mid] <= a[hi]:\n            hi = mid\n        else:\n            lo = mid + 1\n    return a[lo]\n", "hints": ["Монотонное условие: a[i] <= a[−1].", "Левый кусок больше последнего элемента, правый — нет.", "Минимум — первый индекс правого куска.", "Сравнивай a[mid] с a[hi].", "a[mid] <= a[hi] → hi = mid, иначе lo = mid + 1."], "expl": "Сравнение с a[hi] однозначно определяет кусок. Сравнение с a[lo] ломается на неповёрнутом массиве."}, {"id": "10-code-875", "type": "code", "title": "Коко и бананы", "q": "piles — стопки бананов, за час Коко съедает до k бананов из одной стопки. Найди минимальное k, чтобы успеть за h часов (h ≥ len(piles)).", "fn": "min_eating_speed", "starter": "def min_eating_speed(piles, h):\n    pass\n", "leetcode": 875, "tests": [{"args": [[3, 6, 7, 11], 8], "exp": 4, "hidden": false}, {"args": [[30, 11, 23, 4, 20], 5], "exp": 30, "hidden": false}, {"args": [[30, 11, 23, 4, 20], 6], "exp": 23, "hidden": true, "case": "чуть больше часов"}, {"args": [[1000000000], 2], "exp": 500000000, "hidden": true, "case": "огромная стопка"}, {"args": [[1, 1, 1], 3], "exp": 1, "hidden": true, "case": "минимальная скорость"}], "speed": {"gen": "ARGS=[[10**9]*1000, 10**6]"}, "ref": "def min_eating_speed(piles, h):\n    lo, hi = 1, max(piles)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if sum((p + mid - 1) // mid for p in piles) <= h:\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo\n", "hints": ["Перебор скоростей от 1 — до 10⁹ шагов.", "Если при k успеваем, то и при большем — монотонно.", "Диапазон k: от 1 до max(piles).", "Проверка: sum(ceil(p / k)) <= h.", "ceil(p / k) = (p + k − 1) // k."], "expl": "Поиск по ответу: O(n log max). Линейный перебор k не проходит на огромных стопках."}, {"id": "10-c", "type": "choice", "title": "Сложность поиска по ответу", "q": "Бинарный поиск скорости в задаче про бананы: n стопок, M = max(piles). Какая сложность?", "options": ["O(n)", "O(n · log M)", "O(M)", "O(n · M)"], "answer": 1, "hints": ["Сколько итераций у бинарного поиска?", "Диапазон [1, M] делится пополам: log M итераций.", "Сколько стоит одна проверка?", "Проверка проходит все стопки: O(n).", "O(n · log M)."], "expl": "log M итераций по O(n) на проверку. Перебор всех скоростей дал бы O(n · M)."}], "test": [{"q": "Что нужно, чтобы бинарный поиск работал?", "options": ["Массив из положительных чисел", "Монотонное условие: нет…нет, да…да", "Чётная длина", "Уникальные элементы"], "answer": 1}, {"q": "Шаблон «первый да» на [lo, hi): если ok(mid), то:", "options": ["lo = mid + 1", "hi = mid", "hi = mid − 1", "lo = mid"], "answer": 1}, {"q": "Последнее вхождение x через шаблон:", "options": ["первый a[i] >= x", "первый a[i] > x, минус 1", "первый a[i] == x", "последний a[i] < x"], "answer": 1}, {"q": "Сколько шагов бинарного поиска на 10⁹ элементах?", "options": ["~10", "~30", "~1000", "~10⁹"], "answer": 1}, {"q": "`while lo <= hi` идёт вместе с:", "options": ["hi = mid", "hi = mid − 1 и lo = mid + 1", "lo = mid", "hi = mid + 1"], "answer": 1}, {"q": "В повёрнутом массиве на каждом шаге:", "options": ["Обе половины отсортированы", "Хотя бы одна половина отсортирована", "Ни одна не отсортирована", "Минимум всегда в середине"], "answer": 1}, {"q": "Три вещи для поиска по ответу:", "options": ["Массив, индекс, значение", "Диапазон, проверка can(x), монотонность проверки", "Сортировка, хеш, стек", "lo, hi, mid"], "answer": 1}]}, {"title": "Глава 11. Интервалы", "short": "Интервалы", "part": "Часть III · Сортировка и поиск", "cards": [{"title": "Введение", "html": "<p>Задачи на интервалы — встречи, бронирования, отрезки на прямой — почти всегда решаются одной фразой: <strong>отсортируй, а потом пройди слева направо<\/strong>. После сортировки по началу пересекаться могут только соседние в каком-то смысле интервалы, и сложная двумерная картина превращается в один проход. Отдельный приём — <strong>sweep line<\/strong>: разбить интервалы на события «начало» и «конец» и идти по времени.<\/p>"}, {"title": "Когда интервалы пересекаются", "html": "<p>Интервалы [a, b] и [c, d] пересекаются, если <strong>a ≤ d и c ≤ b<\/strong>. Проще запомнить отрицание: они <strong>не<\/strong> пересекаются, если один целиком левее другого: b &lt; c или d &lt; a.<\/p>\n<pre><code class=\"language-text\">[a ─────── b]                    пересекаются: a ≤ d и c ≤ b\n       [c ─────── d]\n\n[a ── b]        [c ── d]         не пересекаются: b &lt; c\n<\/code><\/pre>\n<p>На собесе обязательно уточни: касание концами ([1, 3] и [3, 5]) — это пересечение или нет? В задаче 56 — да, в задачах про встречи «конец в 3 и начало в 3» обычно не конфликтуют.<\/p>"}, {"title": "Как узнать задачу · 11.1. Слияние интервалов (задача 56)", "html": "<ul>\n<li>Входные данные — пары (начало, конец): встречи, брони, отрезки, воздушные шары.<\/li>\n<li>«Объедини», «вставь», «сколько нужно комнат», «сколько удалить, чтобы не пересекались».<\/li>\n<li>«Максимальное число одновременных событий» — sweep line.<\/li>\n<\/ul><h4>11.1. Слияние интервалов (задача 56)<\/h4><p>Отсортируем по началу. Тогда текущий интервал может пересечься только с <strong>последним<\/strong> в ответе: все более ранние кончились ещё раньше, иначе они были бы слиты с последним.<\/p>\n<pre><code class=\"language-python\">def merge(intervals):\n    intervals = sorted(intervals, key=lambda x: x[0])\n    res = []\n    for start, end in intervals:\n        if res and start &lt;= res[-1][1]:          # пересекается с последним\n            res[-1][1] = max(res[-1][1], end)    # расширяем последний\n        else:\n            res.append([start, end])\n    return res\n\nassert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> на [[1, 3], [2, 6], [8, 10], [15, 18]]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Интервал<\/th>\n<th>Последний в res<\/th>\n<th>Пересекаются?<\/th>\n<th>res после шага<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[1, 3]<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>[[1, 3]]<\/td>\n<\/tr>\n<tr>\n<td>[2, 6]<\/td>\n<td>[1, 3]<\/td>\n<td>2 ≤ 3, да<\/td>\n<td>[[1, 6]]<\/td>\n<\/tr>\n<tr>\n<td>[8, 10]<\/td>\n<td>[1, 6]<\/td>\n<td>8 &gt; 6, нет<\/td>\n<td>[[1, 6], [8, 10]]<\/td>\n<\/tr>\n<tr>\n<td>[15, 18]<\/td>\n<td>[8, 10]<\/td>\n<td>нет<\/td>\n<td>[[1, 6], [8, 10], [15, 18]]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Важная деталь — <code>max(res[-1][1], end)<\/code>: интервал [2, 3] целиком внутри [1, 4], и просто взять его конец было бы ошибкой (третий тест). Сложность O(n log n) из-за сортировки, сам проход O(n).<\/p>"}, {"title": "11.2. Вставка интервала (задача 57)", "html": "<p>Интервалы уже отсортированы и не пересекаются; нужно вставить новый. Три фазы прохода: интервалы целиком <strong>левее<\/strong> нового — копируем; пересекающиеся — <strong>сливаем<\/strong> с новым; целиком <strong>правее<\/strong> — копируем.<\/p>\n<pre><code class=\"language-python\">def insert(intervals, new):\n    res, i, n = [], 0, len(intervals)\n    s, e = new\n    while i &lt; n and intervals[i][1] &lt; s:          # левее\n        res.append(intervals[i]); i += 1\n    while i &lt; n and intervals[i][0] &lt;= e:         # пересекаются — расширяем новый\n        s = min(s, intervals[i][0])\n        e = max(e, intervals[i][1])\n        i += 1\n    res.append([s, e])\n    res.extend(intervals[i:])                     # правее\n    return res\n\nassert insert([[1, 3], [6, 9]], [2, 5]) == [[1, 5], [6, 9]]\nassert insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]) == [[1, 2], [3, 10], [12, 16]]\nassert insert([], [5, 7]) == [[5, 7]]\n<\/code><\/pre>\n<p>O(n) без сортировки — потому что вход уже отсортирован.<\/p>"}, {"title": "11.3. Жадный выбор: сортировка по концу (задача 435)", "html": "<p>«Удалить минимум интервалов, чтобы остальные не пересекались» = «оставить максимум непересекающихся». Классическая жадность (глава 26): из всех интервалов выгоднее всего взять тот, что <strong>заканчивается раньше всех<\/strong> — он оставляет больше места остальным. Поэтому сортируем <strong>по концу<\/strong>.<\/p>\n<pre><code class=\"language-python\">def erase_overlap_intervals(intervals):\n    intervals = sorted(intervals, key=lambda x: x[1])\n    kept, last_end = 0, float('-inf')\n    for s, e in intervals:\n        if s &gt;= last_end:            # не пересекается с последним взятым\n            kept += 1\n            last_end = e\n    return len(intervals) - kept\n\nassert erase_overlap_intervals([[1, 2], [2, 3], [3, 4], [1, 3]]) == 1\nassert erase_overlap_intervals([[1, 2], [1, 2], [1, 2]]) == 2\nassert erase_overlap_intervals([[1, 2], [2, 3]]) == 0\n<\/code><\/pre>\n<p><strong>Почему по концу, а не по началу.<\/strong> Пример [[1, 10], [2, 3], [4, 5]]: по началу первым возьмём [1, 10] и потеряем оба коротких. По концу возьмём [2, 3] и [4, 5] — два интервала вместо одного.<\/p>\n<p>Задача 452 «Minimum Number of Arrows to Burst Balloons» — тот же приём: стрела в конце самого рано кончающегося шара лопает все шары, начавшиеся не позже этой точки.<\/p>"}, {"title": "11.4. Sweep line: сколько нужно переговорок (задача 253)", "html": "<p>Даны встречи [start, end). Сколько нужно комнат, чтобы провести все? Ответ — <strong>максимальное число встреч, идущих одновременно<\/strong>. Разобьём каждую встречу на два события: в start +1 комната, в end −1. Отсортируем события по времени и пройдём, считая текущую загрузку. Это тот же «разностный массив» из главы 5, только по событиям, а не по массиву координат.<\/p>\n<pre><code class=\"language-python\">def min_meeting_rooms(intervals):\n    events = []\n    for s, e in intervals:\n        events.append((s, 1))\n        events.append((e, -1))\n    events.sort()                 # при равном времени (t, -1) идёт раньше (t, 1)\n    cur = best = 0\n    for t, d in events:\n        cur += d\n        best = max(best, cur)\n    return best\n\nassert min_meeting_rooms([[0, 30], [5, 10], [15, 20]]) == 2\nassert min_meeting_rooms([[7, 10], [2, 4]]) == 1\nassert min_meeting_rooms([[1, 5], [5, 10]]) == 1\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> на [[0, 30], [5, 10], [15, 20]]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Событие<\/th>\n<th>cur<\/th>\n<th>best<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(0, +1)<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>(5, +1)<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>(10, −1)<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>(15, +1)<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>(20, −1)<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>(30, −1)<\/td>\n<td>0<\/td>\n<td>2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Тонкость равных времён.<\/strong> Встреча [1, 5) кончается, и в 5 начинается [5, 10) — комната освобождается и сразу занимается. Сортировка кортежей ставит (5, −1) раньше (5, 1), поэтому cur не подскакивает до 2. Если касание считается конфликтом — порядок нужен обратный.<\/p>\n<p><strong>Альтернатива с кучей.<\/strong> Сортируем встречи по началу, в min-куче храним концы идущих встреч. Перед новой встречей освобождаем комнаты, чьи встречи уже кончились (heap[0] ≤ start). Размер кучи в любой момент — число занятых комнат.<\/p>\n<pre><code class=\"language-python\">import heapq\n\ndef min_meeting_rooms_heap(intervals):\n    ends = []\n    for s, e in sorted(intervals):\n        if ends and ends[0] &lt;= s:\n            heapq.heapreplace(ends, e)     # освободили комнату и заняли её\n        else:\n            heapq.heappush(ends, e)        # нужна новая комната\n    return len(ends)\n\nassert min_meeting_rooms_heap([[0, 30], [5, 10], [15, 20]]) == 2\n<\/code><\/pre>\n<p>Оба решения O(n log n).<\/p>"}, {"title": "Сводка приёмов", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вопрос<\/th>\n<th>Сортировка<\/th>\n<th>Проход<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>объединить пересекающиеся<\/td>\n<td>по началу<\/td>\n<td>сравнивать с последним в ответе<\/td>\n<\/tr>\n<tr>\n<td>вставить в отсортированные<\/td>\n<td>не нужна<\/td>\n<td>три фазы: левее, пересекаются, правее<\/td>\n<\/tr>\n<tr>\n<td>максимум непересекающихся / минимум удалений<\/td>\n<td>по концу<\/td>\n<td>жадно брать, если начало ≥ последнего конца<\/td>\n<\/tr>\n<tr>\n<td>сколько одновременно / сколько комнат<\/td>\n<td>события по времени<\/td>\n<td>+1 / −1, максимум суммы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Типичные ошибки", "html": "<ul>\n<li>Забыть отсортировать интервалы — слияние перестаёт работать.<\/li>\n<li>При слиянии брать конец нового интервала вместо max(конца последнего, конца нового).<\/li>\n<li>Сортировать по началу в задаче на максимум непересекающихся.<\/li>\n<li>Не уточнить, пересекаются ли интервалы, касающиеся концами, — от этого зависят <code>&lt;<\/code> или <code>&lt;=<\/code> и порядок событий.<\/li>\n<li>Изменять входной список, когда это не разрешено, — <code>sorted()<\/code> вместо <code>.sort()<\/code>.<\/li>\n<\/ul>"}, {"title": "Реши на LeetCode", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>252. Meeting Rooms (можно ли посетить все)<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>56. Merge Intervals<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>57. Insert Interval<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>435. Non-overlapping Intervals<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>452. Minimum Number of Arrows to Burst Balloons<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>253. Meeting Rooms II<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>986. Interval List Intersections<\/td>\n<td>M<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "viz": "intervals", "tasks": [{"id": "11-overlap", "type": "choice", "title": "Пересекаются ли", "q": "Когда интервалы [a, b] и [c, d] (касание концами считается пересечением) пересекаются?", "options": ["a < c", "a ≤ d и c ≤ b", "b < c", "a == c"], "answer": 1, "hints": ["Проще условие «не пересекаются».", "Не пересекаются, если один целиком левее другого.", "b < c или d < a.", "Отрицание: b ≥ c и d ≥ a.", "a ≤ d и c ≤ b."], "expl": "Не пересекаются ⇔ b < c или d < a. Отрицание: a ≤ d и c ≤ b."}, {"id": "11-trace", "type": "trace", "title": "Трассировка слияния", "q": "Заполни res после каждого шага для merge([[1, 3], [2, 6], [8, 10], [15, 18]]).", "code": "intervals.sort()\nres = []\nfor s, e in intervals:\n    if res and s <= res[-1][1]:\n        res[-1][1] = max(res[-1][1], e)\n    else:\n        res.append([s, e])", "columns": ["интервал", "пересекается с последним?", "последний в res"], "rows": [["[1, 3]", "—", "[1, 3]"], ["[2, 6]", null, null], ["[8, 10]", null, null], ["[15, 18]", null, null]], "answer": [["[1, 3]", "—", "[1, 3]"], ["[2, 6]", "да", "[1, 6]"], ["[8, 10]", "нет", "[8, 10]"], ["[15, 18]", "нет", "[15, 18]"]], "hints": ["2 ≤ 3 — пересекается.", "Конец становится max(3, 6) = 6.", "8 > 6 — новый интервал.", "15 > 10 — новый интервал.", "[1, 6], [8, 10], [15, 18]."], "expl": "После сортировки по началу сравниваем только с последним: [1,3]+[2,6] → [1,6], остальные отдельно."}, {"id": "11-code-56", "type": "code", "title": "Слияние интервалов", "q": "Объедини все пересекающиеся интервалы (касание — пересечение). Верни список по возрастанию начала.", "fn": "merge", "starter": "def merge(intervals):\n    pass\n", "leetcode": 56, "tests": [{"args": [[[1, 3], [2, 6], [8, 10], [15, 18]]], "exp": [[1, 6], [8, 10], [15, 18]], "hidden": false}, {"args": [[[1, 4], [4, 5]]], "exp": [[1, 5]], "hidden": false}, {"args": [[[1, 4], [2, 3]]], "exp": [[1, 4]], "hidden": true, "case": "вложенный"}, {"args": [[[5, 6], [1, 2]]], "exp": [[1, 2], [5, 6]], "hidden": true, "case": "не отсортировано"}, {"args": [[[1, 4], [0, 4]]], "exp": [[0, 4]], "hidden": true, "case": "одинаковые концы"}], "speed": {"gen": "ARGS=[[[i, i + 1] for i in range(0, 200000, 2)]]"}, "ref": "def merge(intervals):\n    res = []\n    for s, e in sorted(intervals, key=lambda x: x[0]):\n        if res and s <= res[-1][1]:\n            res[-1][1] = max(res[-1][1], e)\n        else:\n            res.append([s, e])\n    return res\n", "hints": ["Сначала отсортируй по началу.", "Тогда новый интервал может пересечься только с последним в ответе.", "Пересекается, если start <= res[−1][1].", "Конец — max двух концов: интервал может быть вложенным.", "Иначе добавить новый интервал."], "expl": "Сортировка + проход: O(n log n). Ошибки — забыть сортировку или взять конец без max."}, {"id": "11-code-435", "type": "code", "title": "Минимум удалений", "q": "Верни минимальное число интервалов, которые нужно удалить, чтобы остальные не пересекались (касание концами — не пересечение).", "fn": "erase_overlap_intervals", "starter": "def erase_overlap_intervals(intervals):\n    pass\n", "leetcode": 435, "tests": [{"args": [[[1, 2], [2, 3], [3, 4], [1, 3]]], "exp": 1, "hidden": false}, {"args": [[[1, 2], [1, 2], [1, 2]]], "exp": 2, "hidden": false}, {"args": [[[1, 10], [2, 3], [4, 5]]], "exp": 1, "hidden": true, "case": "длинный в начале"}, {"args": [[[1, 2], [2, 3]]], "exp": 0, "hidden": true, "case": "касание"}], "speed": {"gen": "ARGS=[[[i, i + 2] for i in range(100000)]]"}, "ref": "def erase_overlap_intervals(intervals):\n    kept, last = 0, float('-inf')\n    for s, e in sorted(intervals, key=lambda x: x[1]):\n        if s >= last:\n            kept += 1\n            last = e\n    return len(intervals) - kept\n", "hints": ["Удалить минимум = оставить максимум непересекающихся.", "Жадно: какой интервал выгоднее взять первым?", "Тот, что заканчивается раньше всех.", "Сортируй по концу.", "Берём, если s >= конец последнего взятого."], "expl": "Жадность по концу: O(n log n). Сортировка по началу ошибается на [[1,10],[2,3],[4,5]]."}, {"id": "11-code-253", "type": "code", "title": "Сколько переговорок", "q": "Встречи [start, end) — полуинтервалы. Верни минимальное число комнат, чтобы провести все встречи.", "fn": "min_meeting_rooms", "starter": "def min_meeting_rooms(intervals):\n    pass\n", "leetcode": 253, "tests": [{"args": [[[0, 30], [5, 10], [15, 20]]], "exp": 2, "hidden": false}, {"args": [[[7, 10], [2, 4]]], "exp": 1, "hidden": false}, {"args": [[[1, 5], [5, 10]]], "exp": 1, "hidden": true, "case": "касание"}, {"args": [[[1, 4], [2, 5], [3, 6]]], "exp": 3, "hidden": true, "case": "все вместе"}, {"args": [[]], "exp": 0, "hidden": true, "case": "пусто"}], "speed": {"gen": "ARGS=[[[i, i + 50] for i in range(100000)]]"}, "ref": "def min_meeting_rooms(intervals):\n    ev = []\n    for s, e in intervals:\n        ev.append((s, 1))\n        ev.append((e, -1))\n    ev.sort()\n    cur = best = 0\n    for t, d in ev:\n        cur += d\n        best = max(best, cur)\n    return best\n", "hints": ["Ответ — максимум одновременно идущих встреч.", "Разбей встречи на события: начало +1, конец −1.", "Отсортируй события по времени.", "При равном времени конец должен идти раньше начала.", "Кортеж (t, −1) меньше (t, 1) — сортировка сделает это сама."], "expl": "Sweep line: O(n log n). Если начала обрабатываются раньше концов в одно время, касание [1,5) и [5,10) даст 2 вместо 1."}, {"id": "11-sort-key", "type": "choice", "title": "По какому ключу сортировать", "q": "Задача: «наибольшее число встреч, которые можно посетить, если нельзя быть на двух сразу». Сортировка:", "options": ["По началу", "По концу", "По длине", "Не нужна"], "answer": 1, "hints": ["Это максимум непересекающихся интервалов.", "Какой интервал выгоднее взять первым?", "Короткий в начале — не всегда.", "Кончающийся раньше всех оставляет больше места.", "По концу."], "expl": "Максимум непересекающихся — жадность по концу (как в задаче 435)."}, {"id": "11-predict", "type": "predict", "title": "Что вернёт", "q": "Что выведет код?", "code": "def merge(iv):\n    res = []\n    for s, e in sorted(iv):\n        if res and s <= res[-1][1]:\n            res[-1][1] = max(res[-1][1], e)\n        else:\n            res.append([s, e])\n    return res\n\nprint(merge([[6, 8], [1, 9], [2, 4], [4, 7]]))", "answer": "[[1, 9]]", "hints": ["Сначала сортировка по началу.", "[1, 9], [2, 4], [4, 7], [6, 8].", "[1, 9] поглощает всё, что начинается не позже 9.", "max сохраняет конец 9.", "[[1, 9]]."], "expl": "После сортировки первым идёт [1, 9], и все остальные внутри него — ответ один интервал."}], "test": [{"q": "Первый шаг почти любой задачи на интервалы:", "options": ["Хеш-таблица", "Сортировка", "Рекурсия", "Стек"], "answer": 1}, {"q": "При слиянии новый конец последнего интервала:", "options": ["конец нового", "max(конец последнего, конец нового)", "min(…)", "начало нового"], "answer": 1}, {"q": "Вставка интервала в отсортированный список без пересечений стоит:", "options": ["O(n log n)", "O(n)", "O(log n)", "O(n²)"], "answer": 1}, {"q": "Минимум удалений до непересекающихся — сортировка:", "options": ["по началу", "по концу", "по длине", "по середине"], "answer": 1}, {"q": "Sweep line для переговорок: событие конца встречи даёт:", "options": ["+1", "−1", "0", "×2"], "answer": 1}, {"q": "Почему (5, −1) обрабатывается раньше (5, 1)?", "options": ["Случайно", "Кортежи сравниваются по второму элементу при равном первом", "Так быстрее", "Это ошибка"], "answer": 1}, {"q": "Решение с кучей для переговорок хранит в куче:", "options": ["Начала встреч", "Концы идущих встреч", "Длительности", "Индексы"], "answer": 1}]}, {"title": "Глава 12. Стек", "short": "Стек", "part": "Часть IV · Линейные структуры", "cards": [{"title": "Идея и когда применять", "html": "<p>Стек — «последним пришёл, первым ушёл»: <code>append<\/code> и <code>pop<\/code> с конца списка за O(1).<\/p>\n<p>Сигналы в условии: <strong>парные скобки и вложенность<\/strong>, «отмена последнего действия», вычисление выражений, «ближайший больший / меньший слева или справа».<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сигнал<\/th>\n<th>Решение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>скобки, вложенность<\/td>\n<td>стек открытых элементов<\/td>\n<\/tr>\n<tr>\n<td>ближайший больший справа<\/td>\n<td>монотонный стек<\/td>\n<\/tr>\n<tr>\n<td>обратная польская запись<\/td>\n<td>стек операндов<\/td>\n<\/tr>\n<tr>\n<td>«удалить соседние пары»<\/td>\n<td>стек как результат<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Шаблон: правильные скобки (задача 20)", "html": "<pre><code class=\"language-python\">def is_valid(s):\n    pairs = {')': '(', ']': '[', '}': '{'}\n    st = []\n    for ch in s:\n        if ch in pairs:\n            if not st or st[-1] != pairs[ch]:\n                return False\n            st.pop()\n        else:\n            st.append(ch)\n    return not st\n<\/code><\/pre>\n<p>Закрывающая скобка должна совпасть с <strong>последней<\/strong> открытой. В конце стек обязан быть пустым: строка <code>\"((\"<\/code> не валидна.<\/p>"}, {"title": "Монотонный стек", "html": "<p>Задача «для каждого дня — через сколько дней станет теплее» (739). Храним в стеке <strong>индексы<\/strong>, чьи значения убывают. Новый элемент «выталкивает» всех меньших — для них он и есть ближайший больший справа.<\/p>\n<pre><code class=\"language-python\">def daily_temperatures(t):\n    res = [0] * len(t)\n    st = []                        # индексы, температуры по убыванию\n    for i, x in enumerate(t):\n        while st and t[st[-1]] &lt; x:\n            j = st.pop()\n            res[j] = i - j\n        st.append(i)\n    return res\n<\/code><\/pre>\n<p>Каждый индекс кладётся и снимается один раз — <strong>O(n)<\/strong>, хотя внутри for есть while (как в главе 7).<\/p>"}, {"title": "Сложность и ошибки", "html": "<p>Все операции O(1), монотонный стек — O(n) на весь проход, память O(n).<\/p>\n<ul>\n<li>Пустой стек: перед <code>st[-1]<\/code> и <code>pop()<\/code> проверь <code>if st<\/code>.<\/li>\n<li>Забыть проверить, что стек пуст в конце (скобки).<\/li>\n<li>В монотонном стеке хранить значения вместо индексов, когда нужен ответ «через сколько».<\/li>\n<li>Перепутать направление монотонности: для «ближайшего большего» стек убывающий.<\/li>\n<\/ul>"}], "viz": "mstack", "tasks": [{"id": "12-c1", "type": "choice", "title": "Скобки", "q": "Какая структура нужна для проверки скобочной последовательности?", "options": ["Очередь", "Стек", "Куча", "Множество"], "answer": 1, "hints": ["Какая скобка должна закрыться первой?", "Последняя открытая.", "Последним пришёл — первым ушёл.", "Это свойство стека.", "Стек."], "expl": "Закрывающая скобка парится с последней открытой — это LIFO, то есть стек."}, {"id": "12-p1", "type": "predict", "title": "Монотонный стек", "q": "Что выведет код?", "code": "def dt(t):\n    res = [0] * len(t)\n    st = []\n    for i, x in enumerate(t):\n        while st and t[st[-1]] < x:\n            j = st.pop()\n            res[j] = i - j\n        st.append(i)\n    return res\n\nprint(dt([73, 74, 75, 71, 69, 72, 76, 73]))", "answer": "[1, 1, 4, 2, 1, 1, 0, 0]", "hints": ["Для 73 следующий больший — 74 через 1 день.", "Для 75 — 76 через 4 дня.", "71 → 72 через 2.", "69 → 72 через 1.", "Последние два без ответа: 0."], "expl": "Каждый день ждёт в стеке, пока не придёт более тёплый."}, {"id": "12-k1", "type": "code", "title": "Правильные скобки", "q": "Строка из ()[]{}. Верни True, если скобки расставлены правильно.", "fn": "is_valid", "starter": "def is_valid(s):\n    pass\n", "tests": [{"args": ["()[]{}"], "exp": true, "hidden": false, "case": ""}, {"args": ["(]"], "exp": false, "hidden": false, "case": ""}, {"args": ["([)]"], "exp": false, "hidden": true, "case": "перекрытие"}, {"args": ["(("], "exp": false, "hidden": true, "case": "не закрыта"}, {"args": [""], "exp": true, "hidden": true, "case": "пустая"}, {"args": ["]"], "exp": false, "hidden": true, "case": "закрывающая первой"}], "ref": "def is_valid(s):\n    pairs = {')': '(', ']': '[', '}': '{'}\n    st = []\n    for ch in s:\n        if ch in pairs:\n            if not st or st[-1] != pairs[ch]:\n                return False\n            st.pop()\n        else:\n            st.append(ch)\n    return not st\n", "hints": ["Открывающие клади в стек.", "Закрывающая должна совпасть с вершиной.", "Словарь пар упростит проверку.", "Пустой стек при закрывающей — ошибка.", "В конце стек должен быть пуст."], "expl": "Стек открытых скобок: O(n). Частые ошибки — не проверить пустой стек и пустоту в конце.", "compare": "exact", "leetcode": 20}, {"id": "12-k2", "type": "code", "title": "Дни до потепления", "q": "Для каждого дня верни, через сколько дней станет теплее (0, если никогда). O(n).", "fn": "daily_temperatures", "starter": "def daily_temperatures(t):\n    pass\n", "tests": [{"args": [[73, 74, 75, 71, 69, 72, 76, 73]], "exp": [1, 1, 4, 2, 1, 1, 0, 0], "hidden": false, "case": ""}, {"args": [[30, 40, 50, 60]], "exp": [1, 1, 1, 0], "hidden": false, "case": ""}, {"args": [[60, 50, 40]], "exp": [0, 0, 0], "hidden": true, "case": "убывает"}, {"args": [[50, 50]], "exp": [0, 0], "hidden": true, "case": "равные"}], "ref": "def daily_temperatures(t):\n    res = [0] * len(t)\n    st = []\n    for i, x in enumerate(t):\n        while st and t[st[-1]] < x:\n            j = st.pop()\n            res[j] = i - j\n        st.append(i)\n    return res\n", "hints": ["Брутфорс — для каждого дня искать вправо, O(n²).", "Нужен ближайший больший справа.", "Монотонный стек индексов с убывающими температурами.", "Новый день выталкивает всех холоднее себя.", "res[j] = i − j при выталкивании."], "expl": "Монотонный стек: каждый индекс входит и выходит один раз — O(n).", "compare": "exact", "leetcode": 739, "speed": {"gen": "ARGS=[list(range(100000, 0, -1))]"}}, {"id": "12-k3", "type": "code", "title": "Обратная польская запись", "q": "Вычисли выражение в обратной польской записи (список токенов). Деление — с округлением к нулю.", "fn": "eval_rpn", "starter": "def eval_rpn(tokens):\n    pass\n", "tests": [{"args": [["2", "1", "+", "3", "*"]], "exp": 9, "hidden": false, "case": ""}, {"args": [["4", "13", "5", "/", "+"]], "exp": 6, "hidden": false, "case": ""}, {"args": [["7", "-2", "/"]], "exp": -3, "hidden": true, "case": "деление к нулю"}, {"args": [["5"]], "exp": 5, "hidden": true, "case": "одно число"}], "ref": "def eval_rpn(tokens):\n    st = []\n    for t in tokens:\n        if t in '+-*/' and len(t) == 1:\n            b = st.pop(); a = st.pop()\n            if t == '+': st.append(a + b)\n            elif t == '-': st.append(a - b)\n            elif t == '*': st.append(a * b)\n            else: st.append(int(a / b))\n        else:\n            st.append(int(t))\n    return st[-1]\n", "hints": ["Числа кладём в стек.", "Оператор берёт два последних числа.", "Порядок важен: сначала снимаем b, потом a.", "a // b округляет вниз, а нужно к нулю.", "int(a / b)."], "expl": "Стек операндов: O(n). Подвох — деление отрицательных: int(a / b), а не a // b.", "compare": "exact", "leetcode": 150}], "test": [{"q": "Стек работает по принципу:", "options": ["FIFO", "LIFO", "по приоритету", "случайно"], "answer": 1}, {"q": "Сложность монотонного стека на массиве длины n:", "options": ["O(n²)", "O(n)", "O(n log n)", "O(log n)"], "answer": 1}, {"q": "Для «ближайшего большего справа» стек хранит значения:", "options": ["возрастающие", "убывающие", "случайные", "только равные"], "answer": 1}, {"q": "Строка «((» после прохода оставляет стек:", "options": ["пустым", "непустым — ответ False", "с ошибкой", "с одним элементом и ответ True"], "answer": 1}, {"q": "Почему в задаче 739 в стеке индексы, а не температуры?", "options": ["Так быстрее", "Нужно посчитать расстояние i − j", "Температуры повторяются", "Без разницы"], "answer": 1}]}, {"title": "Глава 13. Очередь и дек", "short": "Очередь и дек", "part": "Часть IV · Линейные структуры", "cards": [{"title": "Идея и когда применять", "html": "<p>Очередь — «первым пришёл, первым ушёл»: <code>deque.append<\/code> и <code>popleft<\/code> за O(1) (глава 3). Дек — добавление и удаление с обоих концов.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сигнал<\/th>\n<th>Решение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>обход «волнами», минимум шагов<\/td>\n<td>очередь (BFS, глава 21)<\/td>\n<\/tr>\n<tr>\n<td>максимум / минимум в скользящем окне<\/td>\n<td>монотонный дек<\/td>\n<\/tr>\n<tr>\n<td>последние k событий<\/td>\n<td>deque(maxlen=k)<\/td>\n<\/tr>\n<tr>\n<td>задачи-симуляции «по кругу»<\/td>\n<td>очередь<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Монотонный дек: максимум в окне (задача 239)", "html": "<p>Нужен максимум каждого окна длины k за O(n). Храним в деке <strong>индексы<\/strong>, значения по ним убывают. Тогда голова дека — максимум окна.<\/p>\n<pre><code class=\"language-python\">from collections import deque\n\ndef max_sliding_window(nums, k):\n    dq, res = deque(), []\n    for i, x in enumerate(nums):\n        if dq and dq[0] &lt;= i - k:        # голова вышла из окна\n            dq.popleft()\n        while dq and nums[dq[-1]] &lt;= x:  # меньшие больше никогда не станут максимумом\n            dq.pop()\n        dq.append(i)\n        if i &gt;= k - 1:\n            res.append(nums[dq[0]])\n    return res\n<\/code><\/pre>\n<p>Элемент, меньший нового, уже <strong>никогда<\/strong> не будет максимумом: новый правее и проживёт в окне дольше. Поэтому его можно выбросить.<\/p>"}, {"title": "Сложность и ошибки", "html": "<p>Каждый индекс входит и выходит из дека один раз — <strong>O(n)<\/strong>, память O(k).<\/p>\n<ul>\n<li>Хранить значения вместо индексов — не узнать, вышел ли элемент из окна.<\/li>\n<li>Забыть удалить голову, вышедшую за окно.<\/li>\n<li>Использовать <code>list.pop(0)<\/code> вместо <code>deque.popleft()<\/code> — O(n) на операцию.<\/li>\n<li>Куча тоже решает 239, но за O(n log n) и с ленивым удалением.<\/li>\n<\/ul>"}], "viz": "dequemax", "tasks": [{"id": "13-c1", "type": "choice", "title": "Монотонный дек", "q": "Почему элемент меньше нового можно выбросить из дека?", "options": ["Он уже вышел из окна", "Новый правее и больше — старый никогда не станет максимумом", "Так экономится память", "Нельзя"], "answer": 1, "hints": ["Сравни их сроки жизни в окне.", "Новый элемент выйдет из окна позже.", "И он больше.", "Пока старый в окне, новый тоже там.", "Старый никогда не будет максимумом."], "expl": "Новый элемент больше и проживёт в окне дольше — старый бесполезен."}, {"id": "13-p1", "type": "predict", "title": "Максимум в окне", "q": "Что выведет код?", "code": "from collections import deque\ndef msw(nums, k):\n    dq, res = deque(), []\n    for i, x in enumerate(nums):\n        if dq and dq[0] <= i - k:\n            dq.popleft()\n        while dq and nums[dq[-1]] <= x:\n            dq.pop()\n        dq.append(i)\n        if i >= k - 1:\n            res.append(nums[dq[0]])\n    return res\n\nprint(msw([1, 3, -1, -3, 5, 3, 6, 7], 3))", "answer": "[3, 3, 5, 5, 6, 7]", "hints": ["Окна длины 3: [1,3,−1], [3,−1,−3], …", "Максимум первого — 3.", "Второго — 3.", "Затем 5, 5, 6, 7.", "[3, 3, 5, 5, 6, 7]."], "expl": "Шесть окон, у каждого максимум — голова дека."}, {"id": "13-k1", "type": "code", "title": "Максимум в скользящем окне", "q": "Верни максимум каждого окна длины k. O(n).", "fn": "max_sliding_window", "starter": "from collections import deque\n\ndef max_sliding_window(nums, k):\n    pass\n", "tests": [{"args": [[1, 3, -1, -3, 5, 3, 6, 7], 3], "exp": [3, 3, 5, 5, 6, 7], "hidden": false, "case": ""}, {"args": [[1], 1], "exp": [1], "hidden": false, "case": ""}, {"args": [[9, 8, 7, 6], 2], "exp": [9, 8, 7], "hidden": true, "case": "убывает"}, {"args": [[1, 2, 3], 3], "exp": [3], "hidden": true, "case": "окно — весь массив"}], "ref": "from collections import deque\n\ndef max_sliding_window(nums, k):\n    dq, res = deque(), []\n    for i, x in enumerate(nums):\n        if dq and dq[0] <= i - k:\n            dq.popleft()\n        while dq and nums[dq[-1]] <= x:\n            dq.pop()\n        dq.append(i)\n        if i >= k - 1:\n            res.append(nums[dq[0]])\n    return res\n", "hints": ["Брутфорс max(nums[i:i+k]) — O(n·k).", "Нужен дек индексов с убывающими значениями.", "Удали голову, если она вышла из окна.", "Перед добавлением выбрось с хвоста всех меньших.", "Голова дека — максимум окна."], "expl": "Монотонный дек: O(n).", "compare": "exact", "leetcode": 239, "speed": {"gen": "ARGS=[list(range(100000)), 50000]"}}, {"id": "13-k2", "type": "code", "title": "Недавние вызовы", "q": "Дан отсортированный список моментов вызовов times. Для каждого верни, сколько вызовов было за последние 3000 мс включительно ([t − 3000, t]).", "fn": "recent_counts", "starter": "from collections import deque\n\ndef recent_counts(times):\n    pass\n", "tests": [{"args": [[1, 100, 3001, 3002]], "exp": [1, 2, 3, 3], "hidden": false, "case": ""}, {"args": [[5]], "exp": [1], "hidden": false, "case": ""}, {"args": [[1, 2, 3, 6000]], "exp": [1, 2, 3, 1], "hidden": true, "case": "старые ушли"}], "ref": "from collections import deque\n\ndef recent_counts(times):\n    q, res = deque(), []\n    for t in times:\n        q.append(t)\n        while q[0] < t - 3000:\n            q.popleft()\n        res.append(len(q))\n    return res\n", "hints": ["Нужно окно по времени.", "Новые вызовы добавляем в конец.", "Старые удаляем с начала.", "Очередь: append + popleft.", "Ответ — длина очереди."], "expl": "Очередь как окно по времени: O(n).", "compare": "exact", "leetcode": 933}], "test": [{"q": "Очередь работает по принципу:", "options": ["LIFO", "FIFO", "по приоритету", "по ключу"], "answer": 1}, {"q": "Сложность максимума в окне через монотонный дек:", "options": ["O(n·k)", "O(n)", "O(n log n)", "O(k)"], "answer": 1}, {"q": "В деке для максимума окна хранят:", "options": ["значения по возрастанию", "индексы, значения по которым убывают", "только максимум", "все элементы окна по порядку"], "answer": 1}, {"q": "Почему не list.pop(0)?", "options": ["Ошибка", "Это O(n) из-за сдвига", "Удаляет конец", "Нельзя у списка"], "answer": 1}, {"q": "Где ответ в монотонном деке для максимума?", "options": ["В хвосте", "В голове", "В середине", "Нужно искать"], "answer": 1}]}, {"title": "Глава 14. Связные списки", "short": "Связные списки", "part": "Часть IV · Линейные структуры", "cards": [{"title": "Идея и когда применять", "html": "<p>Связный список — цепочка узлов: у каждого значение <code>val<\/code> и ссылка <code>next<\/code>. Доступа по индексу нет (O(n)), зато вставка и удаление при известном узле — O(1).<\/p>\n<pre><code class=\"language-python\">class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n<\/code><\/pre>\n<p>На собесе почти все задачи сводятся к трём приёмам: <strong>разворот<\/strong> указателей, <strong>быстрый и медленный<\/strong> указатели, <strong>фиктивная голова<\/strong> (dummy).<\/p>"}, {"title": "Разворот списка (задача 206)", "html": "<p>Идём по списку и разворачиваем каждую стрелку назад. Нужны три указателя: prev, cur и сохранённый next.<\/p>\n<pre><code class=\"language-python\">def reverse_list(head):\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next     # запомнить, куда шли\n        cur.next = prev    # развернуть стрелку\n        prev, cur = cur, nxt\n    return prev\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>prev<\/th>\n<th>cur<\/th>\n<th>Список<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>None<\/td>\n<td>1<\/td>\n<td>1→2→3<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>1←… 2→3<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>2<\/td>\n<td>3<\/td>\n<td>1←2 … 3<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>3<\/td>\n<td>None<\/td>\n<td>1←2←3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>O(n) времени, O(1) памяти. Без <code>nxt<\/code> мы потеряли бы остаток списка.<\/p>"}, {"title": "Быстрый и медленный: цикл и середина", "html": "<p>fast шагает на 2, slow на 1.<\/p>\n<ul>\n<li><strong>Середина<\/strong> (876): когда fast дошёл до конца, slow — в середине.<\/li>\n<li><strong>Цикл<\/strong> (141, алгоритм Флойда): если есть цикл, fast догонит slow внутри него.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">def has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False\n<\/code><\/pre>\n<p>Почему догонит: внутри цикла расстояние между ними сокращается на 1 за шаг.<\/p>"}, {"title": "Фиктивная голова и слияние (задача 21)", "html": "<p>Dummy-узел перед головой убирает особый случай «изменилась голова».<\/p>\n<pre><code class=\"language-python\">def merge_two(l1, l2):\n    dummy = tail = ListNode()\n    while l1 and l2:\n        if l1.val &lt;= l2.val:\n            tail.next, l1 = l1, l1.next\n        else:\n            tail.next, l2 = l2, l2.next\n        tail = tail.next\n    tail.next = l1 or l2\n    return dummy.next\n<\/code><\/pre>\n<p>Удалить n-й с конца (19): fast уходит вперёд на n шагов, затем оба идут до конца — slow стоит перед удаляемым.<\/p>"}, {"title": "Ошибки", "html": "<ul>\n<li>Потерять ссылку на остаток списка, не сохранив <code>next<\/code>.<\/li>\n<li>Обратиться к <code>fast.next.next<\/code>, не проверив <code>fast.next<\/code>.<\/li>\n<li>Забыть dummy, когда может удалиться или смениться голова.<\/li>\n<li>Сравнивать узлы по значению (<code>==<\/code>) там, где нужен один и тот же объект (<code>is<\/code>).<\/li>\n<\/ul>"}], "viz": "llrev", "tasks": [{"id": "14-c1", "type": "choice", "title": "Разворот", "q": "Зачем при развороте списка сохранять cur.next в переменную?", "options": ["Для скорости", "После cur.next = prev ссылка на остаток потеряется", "Так требует Python", "Не нужно"], "answer": 1, "hints": ["Что меняет строка cur.next = prev?", "Стрелка теперь смотрит назад.", "А куда идти дальше?", "Остаток списка больше не достижим.", "Поэтому next сохраняют заранее."], "expl": "После разворота стрелки остаток списка недостижим — его нужно запомнить в nxt."}, {"id": "14-c2", "type": "choice", "title": "Середина", "q": "Как найти середину списка за один проход?", "options": ["Посчитать длину, потом пройти половину — это два прохода", "slow шагает на 1, fast на 2; когда fast в конце, slow в середине", "Рекурсией", "Через хеш-таблицу"], "answer": 1, "hints": ["Два указателя с разной скоростью.", "Один в два раза быстрее.", "Он пройдёт весь список…", "…пока второй пройдёт половину.", "Быстрый и медленный."], "expl": "fast вдвое быстрее — slow окажется в середине."}, {"id": "14-c3", "type": "choice", "title": "Цикл", "q": "Почему в алгоритме Флойда быстрый указатель обязательно догонит медленный в цикле?", "options": ["Случайно", "Внутри цикла расстояние между ними сокращается на 1 каждый шаг", "fast прыгает в начало", "Не всегда догонит"], "answer": 1, "hints": ["Оба в цикле.", "fast делает 2 шага, slow — 1.", "Расстояние меняется на 1 за шаг.", "Рано или поздно станет 0.", "Встретятся."], "expl": "Разница скоростей 1 — расстояние уменьшается на 1 за шаг и обнулится."}, {"id": "14-k1", "type": "code", "title": "Разворот списка", "q": "Список передан как Python-список значений. Построй из него узлы ListNode, разверни связный список указателями prev/cur и верни значения в новом порядке.", "fn": "reverse_values", "starter": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n\ndef reverse_values(vals):\n    pass\n", "tests": [{"args": [[1, 2, 3, 4, 5]], "exp": [5, 4, 3, 2, 1], "hidden": false, "case": ""}, {"args": [[1, 2]], "exp": [2, 1], "hidden": false, "case": ""}, {"args": [[]], "exp": [], "hidden": true, "case": "пустой"}, {"args": [[7]], "exp": [7], "hidden": true, "case": "один узел"}], "ref": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n\ndef reverse_values(vals):\n    head = None\n    for v in reversed(vals):\n        head = ListNode(v, head)\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev, cur = cur, nxt\n    out = []\n    while prev:\n        out.append(prev.val)\n        prev = prev.next\n    return out\n", "hints": ["Сначала построй список узлов.", "prev = None, cur = head.", "Сохрани nxt = cur.next.", "Разверни: cur.next = prev; сдвинь prev и cur.", "В конце голова — prev."], "expl": "Разворот тремя указателями: O(n), O(1) памяти.", "compare": "exact", "leetcode": 206}, {"id": "14-k2", "type": "code", "title": "n-й с конца", "q": "Значения списка vals; удали n-й узел с конца (1 ≤ n ≤ длины) за один проход двумя указателями и верни значения.", "fn": "remove_nth", "starter": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n\ndef remove_nth(vals, n):\n    pass\n", "tests": [{"args": [[1, 2, 3, 4, 5], 2], "exp": [1, 2, 3, 5], "hidden": false, "case": ""}, {"args": [[1], 1], "exp": [], "hidden": false, "case": ""}, {"args": [[1, 2], 2], "exp": [2], "hidden": true, "case": "удаляется голова"}, {"args": [[1, 2], 1], "exp": [1], "hidden": true, "case": "удаляется хвост"}], "ref": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n\ndef remove_nth(vals, n):\n    dummy = ListNode()\n    t = dummy\n    for v in vals:\n        t.next = ListNode(v); t = t.next\n    fast = slow = dummy\n    for _ in range(n):\n        fast = fast.next\n    while fast.next:\n        fast, slow = fast.next, slow.next\n    slow.next = slow.next.next\n    out, c = [], dummy.next\n    while c:\n        out.append(c.val); c = c.next\n    return out\n", "hints": ["Голова может удалиться — нужен dummy.", "fast уходит вперёд на n шагов.", "Затем fast и slow идут вместе.", "Когда fast.next is None, slow — перед удаляемым.", "slow.next = slow.next.next."], "expl": "Отставание на n шагов даёт позицию с конца за один проход; dummy убирает особый случай головы.", "compare": "exact", "leetcode": 19}], "test": [{"q": "Доступ к k-му элементу связного списка:", "options": ["O(1)", "O(k)", "O(log n)", "O(n²)"], "answer": 1}, {"q": "Зачем dummy-узел?", "options": ["Ускорить", "Убрать особый случай, когда меняется голова", "Хранить длину", "Для цикла"], "answer": 1}, {"q": "Память при развороте списка указателями:", "options": ["O(n)", "O(1)", "O(log n)", "O(n²)"], "answer": 1}, {"q": "Условие цикла быстрого указателя:", "options": ["while fast", "while fast and fast.next", "while slow", "while True"], "answer": 1}, {"q": "Слияние двух отсортированных списков стоит:", "options": ["O(n·m)", "O(n + m)", "O(log n)", "O(n log n)"], "answer": 1}]}, {"title": "Глава 15. Куча: задачи", "short": "Куча: задачи", "part": "Часть IV · Линейные структуры", "cards": [{"title": "Когда куча", "html": "<p>Устройство кучи — в главе 3. Здесь — задачи. Сигнал: <strong>много раз нужен минимум или максимум из меняющегося набора<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Приём<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>k наибольших / k-й наибольший<\/td>\n<td>min-куча размера k<\/td>\n<\/tr>\n<tr>\n<td>слить k отсортированных списков<\/td>\n<td>куча из голов списков<\/td>\n<\/tr>\n<tr>\n<td>медиана потока<\/td>\n<td>две кучи: max-куча левой половины, min-куча правой<\/td>\n<\/tr>\n<tr>\n<td>расписание по приоритету, Дейкстра<\/td>\n<td>куча пар (приоритет, элемент)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Слияние k списков (задача 23)", "html": "<p>В куче лежат текущие головы всех списков. Достаём минимум, кладём следующий элемент из того же списка.<\/p>\n<pre><code class=\"language-python\">import heapq\n\ndef merge_k(lists):\n    h = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]\n    heapq.heapify(h)\n    res = []\n    while h:\n        val, i, j = heapq.heappop(h)\n        res.append(val)\n        if j + 1 &lt; len(lists[i]):\n            heapq.heappush(h, (lists[i][j + 1], i, j + 1))\n    return res\n<\/code><\/pre>\n<p>N элементов всего, куча размера k: <strong>O(N log k)<\/strong>. Индекс списка i в кортеже нужен, чтобы при равных значениях не сравнивать сами объекты.<\/p>"}, {"title": "Медиана потока (задача 295)", "html": "<p>Левая половина — max-куча (храним −x), правая — min-куча. Держим размеры равными или левую на 1 больше. Медиана — вершина левой или среднее двух вершин.<\/p>\n<pre><code class=\"language-python\">import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.lo, self.hi = [], []          # lo — max-куча через -x\n    def add(self, x):\n        heapq.heappush(self.lo, -x)\n        heapq.heappush(self.hi, -heapq.heappop(self.lo))   # перекинуть максимум левой\n        if len(self.hi) &gt; len(self.lo):\n            heapq.heappush(self.lo, -heapq.heappop(self.hi))\n    def median(self):\n        if len(self.lo) &gt; len(self.hi):\n            return -self.lo[0]\n        return (-self.lo[0] + self.hi[0]) / 2\n<\/code><\/pre>\n<p>add — O(log n), median — O(1).<\/p>"}, {"title": "Ошибки", "html": "<ul>\n<li>Забыть знак минус у max-кучи при чтении вершины.<\/li>\n<li>Кортежи с равным приоритетом без счётчика — сравнение объектов падает.<\/li>\n<li>Сортировать каждый раз вместо кучи — O(n log n) на запрос.<\/li>\n<li>Путать: для k <strong>наибольших<\/strong> нужна <strong>min<\/strong>-куча размера k.<\/li>\n<\/ul>"}], "viz": "heap", "tasks": [{"id": "15-c1", "type": "choice", "title": "k наибольших", "q": "Для k наибольших элементов используют:", "options": ["max-кучу из всех элементов", "min-кучу размера k", "стек", "дек"], "answer": 1, "hints": ["Что вытеснять, когда в куче k + 1 элементов?", "Самый маленький из лучших.", "Его надо быстро находить.", "Минимум — в min-куче.", "min-куча размера k."], "expl": "В корне min-кучи — худший из k лучших; его и вытесняем."}, {"id": "15-c2", "type": "choice", "title": "Слияние k списков", "q": "Сложность слияния k отсортированных списков с N элементами через кучу:", "options": ["O(N·k)", "O(N log k)", "O(N log N)", "O(k)"], "answer": 1, "hints": ["Сколько элементов в куче одновременно?", "Не больше k.", "Операция с кучей — O(log k).", "Всего N извлечений.", "O(N log k)."], "expl": "N операций по O(log k)."}, {"id": "15-k1", "type": "code", "title": "Слить k списков", "q": "Слей k отсортированных списков в один отсортированный. Используй кучу.", "fn": "merge_k", "starter": "import heapq\n\ndef merge_k(lists):\n    pass\n", "tests": [{"args": [[[1, 4, 5], [1, 3, 4], [2, 6]]], "exp": [1, 1, 2, 3, 4, 4, 5, 6], "hidden": false, "case": ""}, {"args": [[]], "exp": [], "hidden": false, "case": ""}, {"args": [[[], [1]]], "exp": [1], "hidden": true, "case": "пустые списки"}, {"args": [[[2], [1], [3]]], "exp": [1, 2, 3], "hidden": true, "case": "по одному"}], "ref": "import heapq\n\ndef merge_k(lists):\n    h = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]\n    heapq.heapify(h)\n    res = []\n    while h:\n        v, i, j = heapq.heappop(h)\n        res.append(v)\n        if j + 1 < len(lists[i]):\n            heapq.heappush(h, (lists[i][j + 1], i, j + 1))\n    return res\n", "hints": ["В куче — текущие головы списков.", "Кортеж (значение, номер списка, позиция).", "Достань минимум — добавь его в ответ.", "Положи следующий элемент того же списка.", "Пустые списки пропусти при старте."], "expl": "Куча голов: O(N log k).", "compare": "exact", "leetcode": 23}, {"id": "15-k2", "type": "code", "title": "Медиана потока", "q": "Числа приходят по одному. Верни список медиан после каждого добавления (для чётного количества — среднее двух средних, float).", "fn": "running_median", "starter": "import heapq\n\ndef running_median(nums):\n    pass\n", "tests": [{"args": [[5, 15, 1, 3]], "exp": [5, 10.0, 5, 4.0], "hidden": false, "case": ""}, {"args": [[1, 2, 3]], "exp": [1, 1.5, 2], "hidden": false, "case": ""}, {"args": [[2, 2]], "exp": [2, 2.0], "hidden": true, "case": "равные"}], "ref": "import heapq\n\ndef running_median(nums):\n    lo, hi, res = [], [], []\n    for x in nums:\n        heapq.heappush(lo, -x)\n        heapq.heappush(hi, -heapq.heappop(lo))\n        if len(hi) > len(lo):\n            heapq.heappush(lo, -heapq.heappop(hi))\n        res.append(-lo[0] if len(lo) > len(hi) else (-lo[0] + hi[0]) / 2)\n    return res\n", "hints": ["Две кучи: левая половина и правая.", "Левая — max-куча (храни −x).", "Добавь в левую, перекинь её максимум в правую.", "Если правая стала больше — верни один обратно.", "Медиана — вершина левой или среднее вершин."], "expl": "Две кучи: O(log n) на элемент.", "compare": "float_list", "leetcode": 295}], "test": [{"q": "Медиана потока хранится в:", "options": ["одной куче", "двух кучах: max-куча слева и min-куча справа", "отсортированном списке", "стеке"], "answer": 1}, {"q": "Зачем в кортеже кучи индекс списка?", "options": ["Для красоты", "Чтобы при равных значениях не сравнивать сами объекты", "Чтобы ускорить", "Не нужен"], "answer": 1}, {"q": "k-й наибольший через кучу размера k стоит:", "options": ["O(n log k)", "O(n²)", "O(k)", "O(log n)"], "answer": 0}, {"q": "Вершина max-кучи через heapq с −x читается как:", "options": ["h[0]", "−h[0]", "h[-1]", "max(h)"], "answer": 1}, {"q": "Куча нужна, когда:", "options": ["нужен доступ по индексу", "много раз нужен минимум/максимум меняющегося набора", "нужен порядок вставки", "нужна проверка «было ли»"], "answer": 1}]}, {"title": "Глава 16. Обходы дерева", "short": "Обходы дерева", "part": "Часть V · Деревья", "cards": [{"title": "Бинарное дерево и обходы", "html": "<p>У узла бинарного дерева значение и до двух детей.<\/p>\n<pre><code class=\"language-python\">class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n<\/code><\/pre>\n<p>Обходы различаются тем, <strong>когда<\/strong> обрабатывается сам узел относительно детей (глава 4, «до» и «после» вызова):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обход<\/th>\n<th>Порядок<\/th>\n<th>Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pre-order<\/td>\n<td>узел, левое, правое<\/td>\n<td>копирование дерева, передача данных вниз<\/td>\n<\/tr>\n<tr>\n<td>in-order<\/td>\n<td>левое, узел, правое<\/td>\n<td>у BST даёт отсортированный порядок<\/td>\n<\/tr>\n<tr>\n<td>post-order<\/td>\n<td>левое, правое, узел<\/td>\n<td>ответ собирается из детей: высота, размер<\/td>\n<\/tr>\n<tr>\n<td>level-order (BFS)<\/td>\n<td>по уровням<\/td>\n<td>«по уровням», ближайший к корню<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Рекурсивные обходы", "html": "<pre><code class=\"language-python\">def inorder(node, out):\n    if node is None:\n        return\n    inorder(node.left, out)\n    out.append(node.val)       # переставь эту строку — получишь pre- или post-order\n    inorder(node.right, out)\n<\/code><\/pre>\n<pre><code class=\"language-text\">        4\n      /   \\\n     2     6        pre:  4 2 1 3 6\n    / \\   /
