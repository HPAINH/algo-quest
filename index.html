>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Без доп. памяти<\/th>\n<th>С доп. памятью<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>есть ли дубликат<\/td>\n<td>сортировка: O(n log n) время, O(1) память<\/td>\n<td>set: O(n) время, O(n) память<\/td>\n<\/tr>\n<tr>\n<td>пара с суммой target<\/td>\n<td>сортировка + два указателя: O(n log n), O(1)<\/td>\n<td>dict: O(n), O(n)<\/td>\n<\/tr>\n<tr>\n<td>числа Фибоначчи<\/td>\n<td>рекурсия: O(2ⁿ), O(n) стек<\/td>\n<td>мемоизация: O(n), O(n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Если интервьюер просит «без дополнительной памяти» — это подсказка уйти от хеш-таблицы к сортировке, двум указателям или изменению массива на месте.<\/p>"}, {"title": "Амортизированная сложность", "html": "<p>list.append в Python иногда копирует весь массив в новый, вдвое больший, — это O(n). Но такое происходит редко: после копирования следующие n вставок дешёвые. В сумме n вставок стоят O(n), то есть O(1) на одну «в среднем по последовательности». Это и называют амортизированной O(1).<\/p><h4>Амортизация на трассировке<\/h4><p>У списка есть <strong>вместимость<\/strong> (capacity) — сколько ячеек памяти выделено заранее. Пока есть свободные ячейки, append просто кладёт элемент — O(1). Когда места нет, выделяется новый блок большего размера и все элементы копируются туда — O(текущего размера).<\/p>\n<p>Упрощённая модель: вместимость удваивается. Проследим 9 вставок:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>append №<\/th>\n<th>Вместимость до<\/th>\n<th>Места хватило?<\/th>\n<th>Копирований<\/th>\n<th>Вместимость после<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>0<\/td>\n<td>нет<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>1<\/td>\n<td>нет<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>2<\/td>\n<td>нет<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>4<\/td>\n<td>да<\/td>\n<td>0<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>4<\/td>\n<td>нет<\/td>\n<td>4<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>6–8<\/td>\n<td>8<\/td>\n<td>да<\/td>\n<td>0<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>8<\/td>\n<td>нет<\/td>\n<td>8<\/td>\n<td>16<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Всего копирований: 1 + 2 + 4 + 8 = 15 на 9 вставок. В общем случае копирования образуют ряд 1 + 2 + 4 + … + n/2 + n &lt; 2n (как во фрагменте 3 выше). Значит, n вставок стоят меньше n + 2n = 3n операций — O(n) суммарно, <strong>O(1) на одну вставку в среднем по последовательности<\/strong>.<\/p>\n<p>Важно отличать два «средних»:<\/p>\n<ul>\n<li><strong>амортизированное O(1)<\/strong> (append) — гарантия для <em>любой<\/em> последовательности операций: дорогие шаги редки и оплачиваются дешёвыми;<\/li>\n<li><strong>O(1) в среднем<\/strong> (dict) — ожидание по случайности хешей: на неудачных данных может быть хуже.<\/li>\n<\/ul>\n<p><strong>Проверь сам.<\/strong> В CPython вместимость растёт не ровно вдвое, а примерно в 1,125 раза плюс константа, но рост всё равно геометрический, поэтому вывод тот же. Увидеть моменты расширения можно так (точные числа зависят от версии Python):<\/p>\n<pre><code class=\"language-python\">import sys\n\na = []\nprev = sys.getsizeof(a)\nfor i in range(40):\n    a.append(i)\n    size = sys.getsizeof(a)\n    if size != prev:\n        print(&quot;расширение при длине&quot;, len(a))\n        prev = size\n# Python 3.13: 1, 5, 9, 17, 25, 33\n<\/code><\/pre>\n<p><strong>Почему insert(0, x) не амортизируется.<\/strong> Вставка в начало сдвигает <em>все<\/em> элементы на одну позицию вправо — каждый раз, а не изредка. n вставок в начало стоят 1 + 2 + … + n ≈ n²/2 — O(n) на каждую. Поэтому для очереди нужен <code>deque<\/code>.<\/p>"}, {"title": "Типичные ошибки", "html": "<ul>\n<li>Считать <code>x in list<\/code> за O(1) — это O(n). За O(1) работает только <code>x in set<\/code> и <code>x in dict<\/code>.<\/li>\n<li>Забывать стоимость срезов: <code>arr[1:]<\/code> копирует массив — O(n).<\/li>\n<li>Забывать сортировку в начале решения: она сразу даёт O(n log n).<\/li>\n<li>Говорить «O(2n)» — константы отбрасываются, правильно O(n).<\/li>\n<\/ul>"}], "viz": "growth", "tasks": [{"id": "2-c-A", "type": "complexity", "title": "Фрагмент A", "q": "Назови сложность по времени и памяти.", "code": "for i in range(n):\n    for j in range(5):\n        work()", "t": "O(n)", "m": "O(1)", "hints": ["Сколько раз выполнится work()?", "Внутренний цикл всегда 5 итераций.", "5 — константа, она не зависит от n.", "5n → константу отбрасываем.", "Время O(n), память O(1)."], "expl": "Внутренний цикл — константа 5, всего 5n вызовов → O(n). Новых структур нет → O(1) памяти."}, {"id": "2-c-B", "type": "complexity", "title": "Фрагмент B", "q": "Назови сложность по времени и памяти.", "code": "for i in range(n):\n    j = i\n    while j > 0:\n        j //= 2", "t": "O(n log n)", "m": "O(1)", "hints": ["Сколько шагов делает while для одного i?", "j делится пополам до нуля.", "Это log i шагов.", "Сумма log 1 + … + log n ≈ n log n.", "Время O(n log n), память O(1)."], "expl": "Для каждого i деление пополам делает ~log i шагов; сумма по всем i ≈ n log n."}, {"id": "2-c-C", "type": "complexity", "title": "Фрагмент C (ловушка)", "q": "Назови сложность по времени и памяти.", "code": "i = n\nwhile i > 0:\n    for j in range(i):\n        work()\n    i //= 2", "t": "O(n)", "m": "O(1)", "hints": ["Внешний цикл — log n раз, но не спеши перемножать.", "Посчитай, сколько раз всего выполнится work().", "Внутренний цикл: n, потом n/2, потом n/4…", "n + n/2 + n/4 + … < 2n.", "Время O(n), память O(1)."], "expl": "Суммарно n + n/2 + n/4 + … < 2n операций — убывающая геометрическая прогрессия. Перемножать «log n × n» здесь неверно."}, {"id": "2-c-D", "type": "complexity", "title": "Фрагмент D", "q": "Назови сложность по времени и памяти.", "code": "for i in range(n):\n    for j in range(i * i):\n        work()", "t": "O(n³)", "m": "O(1)", "hints": ["Внутренний цикл зависит от i.", "Для i он делает i² итераций.", "Сумма 0² + 1² + … + (n−1)².", "Это ≈ n³ / 3.", "Время O(n³), память O(1)."], "expl": "0² + 1² + … + (n−1)² ≈ n³/3 → O(n³)."}, {"id": "2-c-in", "type": "complexity", "title": "Скрытая стоимость", "q": "Один цикл — значит O(n)? Назови сложность.", "code": "result = []\nfor x in a:            # len(a) = n\n    if x not in result:\n        result.append(x)", "t": "O(n²)", "m": "O(n)", "hints": ["Что делает `x not in result` для списка?", "Проверка `in` по списку перебирает элементы.", "Это скрытый внутренний цикл до n шагов.", "n раз по O(n).", "Время O(n²), память O(n) на result."], "expl": "`in` по списку — проход за O(n), он внутри цикла по n → O(n²). С множеством seen было бы O(n)."}, {"id": "2-c-G", "type": "complexity", "title": "Рекурсия с двумя вызовами", "q": "Назови сложность по времени и памяти (память — с учётом стека вызовов).", "code": "def f(n):\n    if n <= 1:\n        return\n    f(n - 1)\n    f(n - 1)", "t": "O(2ⁿ)", "m": "O(n)", "hints": ["Каждый вызов порождает два новых.", "Нарисуй дерево вызовов: 1, 2, 4, 8, …", "Уровней n — всего ~2ⁿ вызовов.", "В стеке одновременно лежит только одна ветка.", "Время O(2ⁿ), память O(n)."], "expl": "Дерево вызовов из ~2ⁿ узлов, но одновременно в стеке не больше n кадров."}, {"id": "2-limit", "type": "choice", "title": "Ограничения", "q": "n ≤ 2·10⁵. Какая сложность — разумный максимум для решения?", "options": ["O(n²)", "O(n log n)", "O(2ⁿ)", "O(n³)"], "answer": 1, "hints": ["Python делает ~10⁷ простых операций в секунду.", "Посчитай n² при n = 2·10⁵.", "(2·10⁵)² = 4·10¹⁰ — больше часа.", "n log n ≈ 2·10⁵ · 18 ≈ 3,6·10⁶.", "O(n log n) или быстрее."], "expl": "4·10¹⁰ операций у O(n²) — это ~4000 секунд. O(n log n) ≈ 3,6·10⁶ — доли секунды."}, {"id": "2-predict", "type": "predict", "title": "Сколько раз выполнится строка", "q": "Что выведет код?", "code": "n = 5\ncount = 0\nfor i in range(n):\n    for j in range(i + 1, n):\n        count += 1\nprint(count)", "answer": "10", "hints": ["Внутренний цикл зависит от i.", "i = 0 → 4 итерации, i = 1 → 3, …", "4 + 3 + 2 + 1 + 0.", "Это n(n−1)/2.", "10."], "expl": "Внутренний цикл делает 4 + 3 + 2 + 1 + 0 = 10 = n(n−1)/2 итераций — поэтому такой цикл O(n²)."}, {"id": "2-amort", "type": "choice", "title": "Амортизация", "q": "Почему list.append — O(1), хотя иногда список копируется целиком?", "options": ["Копирование выполняется параллельно", "Копирования редки: при росте вдвое их суммарная стоимость меньше 2n на n вставок", "Python не копирует список никогда", "O(1) только в лучшем случае"], "answer": 1, "hints": ["Как часто происходит расширение?", "Вместимость растёт геометрически.", "Копирования: 1 + 2 + 4 + … + n.", "Эта сумма меньше 2n.", "Дорогие шаги редки и «размазываются» по дешёвым."], "expl": "Копирования образуют ряд 1 + 2 + 4 + … < 2n, поэтому n вставок стоят O(n) — O(1) на одну в среднем по последовательности."}], "test": [{"q": "3n² + 5n + 100 — это:", "options": ["O(n)", "O(n²)", "O(n³)", "O(100)"], "answer": 1}, {"q": "Какая сложность у `x in set_of_items`?", "options": ["O(n)", "O(log n)", "O(1) в среднем", "O(n log n)"], "answer": 2}, {"q": "Сколько примерно раз 10⁶ можно поделить пополам до 1?", "options": ["~6", "~20", "~1000", "~500 000"], "answer": 1}, {"q": "Цикл while внутри for, указатель l в while только растёт и не сбрасывается. Итог:", "options": ["O(n²)", "O(n)", "O(n log n)", "O(log n)"], "answer": 1}, {"q": "Срез arr[1:] стоит:", "options": ["O(1)", "O(n)", "O(log n)", "бесплатно"], "answer": 1}, {"q": "Почему insert(0, x) у list — O(n)?", "options": ["Нужно найти место", "Все элементы сдвигаются вправо", "Список копируется в новый", "Это O(1)"], "answer": 1}, {"q": "Рекурсия глубины n без доп. структур тратит памяти:", "options": ["O(1)", "O(n)", "O(n²)", "O(log n)"], "answer": 1}]}, {"title": "Глава 3. Структуры данных Python и их сложности", "short": "Структуры данных Python и их сложности", "part": "Часть I · Фундамент", "cards": [{"title": "Как выбрать структуру", "html": "<p>Правильный выбор встроенной структуры часто и есть оптимизация: заменить список на множество — значит превратить O(n²) в O(n). Эту таблицу нужно знать наизусть.<\/p><h4>Как выбрать структуру<\/h4><p>Структуру выбирают не по названию задачи, а по тому, <strong>какой вопрос алгоритм чаще всего задаёт данным<\/strong>. Определи самую частую операцию — и возьми структуру, где она быстрая.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Самая частая операция<\/th>\n<th>Структура<\/th>\n<th>Стоимость<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>взять элемент по номеру<\/td>\n<td>list<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>«встречался ли x?»<\/td>\n<td>set<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>«сколько раз встретился x?» / «где был x?»<\/td>\n<td>dict, Counter<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>добавить и забрать с конца (последний пришёл — первый ушёл)<\/td>\n<td>list как стек<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>добавить в конец, забрать из начала (очередь)<\/td>\n<td>deque<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>забрать минимум / максимум, пока элементы добавляются<\/td>\n<td>heapq<\/td>\n<td>O(log n)<\/td>\n<\/tr>\n<tr>\n<td>найти место в отсортированном массиве<\/td>\n<td>list + bisect<\/td>\n<td>O(log n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Пример: как одна замена убирает цикл.<\/strong> Нужно найти все элементы a, которые есть в b (длины n и m).<\/p>\n<pre><code class=\"language-python\"># со списком: для каждого x проход по b\ndef common_slow(a, b):\n    return [x for x in a if x in b]       # O(n·m)\n\n# с множеством: проверка за O(1)\ndef common_fast(a, b):\n    sb = set(b)                           # O(m)\n    return [x for x in a if x in sb]      # O(n)\n<\/code><\/pre>\n<p>Код отличается одной строкой, а при n = m = 10⁵ это 10¹⁰ операций против 2·10⁵ — «17 минут» против «мгновенно» (глава 2). Цена — O(m) дополнительной памяти на множество.<\/p>\n<p>Вывод: прежде чем изобретать хитрый алгоритм, проверь, нет ли в коде медленной операции, которую можно заменить быстрой за счёт другой структуры.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Структура<\/th>\n<th>Операция<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>list<\/td>\n<td>arr[i], arr[i] = x, len, append, pop()<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>list<\/td>\n<td>insert(0, x), pop(0), x in arr, remove, срез<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>list<\/td>\n<td>sort<\/td>\n<td>O(n log n)<\/td>\n<\/tr>\n<tr>\n<td>dict<\/td>\n<td>d[k], d[k] = v, k in d, del d[k]<\/td>\n<td>O(1) в среднем<\/td>\n<\/tr>\n<tr>\n<td>set<\/td>\n<td>add, remove, x in s<\/td>\n<td>O(1) в среднем<\/td>\n<\/tr>\n<tr>\n<td>set<\/td>\n<td>a &amp; b, a | b<\/td>\n<td>O(len(a) + len(b))<\/td>\n<\/tr>\n<tr>\n<td>deque<\/td>\n<td>append, appendleft, pop, popleft<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>deque<\/td>\n<td>dq[i] в середине<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>heapq<\/td>\n<td>heappush, heappop<\/td>\n<td>O(log n)<\/td>\n<\/tr>\n<tr>\n<td>heapq<\/td>\n<td>heap[0] (минимум), heapify<\/td>\n<td>O(1), O(n)<\/td>\n<\/tr>\n<tr>\n<td>str<\/td>\n<td>s[i], len<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>str<\/td>\n<td>s + t, s[a:b], ''.join(parts)<\/td>\n<td>O(длины результата)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "list — динамический массив", "html": "<p>Элементы лежат подряд в памяти, поэтому доступ по индексу мгновенный, а вставка в начало сдвигает все элементы. Если нужна очередь — не используй <code>pop(0)<\/code>, используй <code>deque<\/code>.<\/p><h4>Как list устроен в памяти<\/h4><p>Список — это непрерывный блок ячеек одинакового размера. В каждой ячейке лежит ссылка на объект (8 байт). Поэтому адрес i-й ячейки вычисляется одной формулой, без перебора:<\/p>\n<pre class=\"formula\"><code>\\text{адрес}(i) = \\text{адрес начала} + i \\cdot 8\n<\/code><\/pre>\n<p>Отсюда O(1) у <code>arr[i]<\/code> и <code>arr[i] = x<\/code>: неважно, 10 элементов в списке или 10⁶ — формула одна.<\/p>"}, {"title": "Трассировка: почему insert(0, x) — O(n)", "section": "list — динамический массив", "html": "<p>Вставим 9 в начало списка [3, 1, 4, 1, 5]. Ячейки должны остаться непрерывными, поэтому каждый элемент сдвигается на одну позицию вправо, начиная с конца:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>Действие<\/th>\n<th>Ячейки 0–5<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>исходно<\/td>\n<td>3 1 4 1 5 _<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>сдвиг 5 из ячейки 4 в 5<\/td>\n<td>3 1 4 1 5 5<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>сдвиг 1 из 3 в 4<\/td>\n<td>3 1 4 1 1 5<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>сдвиг 4 из 2 в 3<\/td>\n<td>3 1 4 4 1 5<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>сдвиг 1 из 1 в 2<\/td>\n<td>3 1 1 4 1 5<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>сдвиг 3 из 0 в 1<\/td>\n<td>3 3 1 4 1 5<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>запись 9 в ячейку 0<\/td>\n<td>9 3 1 4 1 5<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Пять сдвигов для пяти элементов — O(n). Так же работают <code>pop(0)<\/code> (сдвиг влево) и <code>remove(x)<\/code> (поиск + сдвиг). А <code>append<\/code> и <code>pop()<\/code> работают с концом списка и ничего не сдвигают — O(1).<\/p>"}, {"title": "list как стек · Ловушки, на которых ошибаются на собесе", "html": "<p>Стек — «последним пришёл, первым ушёл». Конец списка идеально подходит: обе операции O(1).<\/p>\n<pre><code class=\"language-python\">stack = []\nstack.append(1)      # положить\nstack.append(2)\ntop = stack[-1]      # посмотреть верх: 2\nstack.pop()          # снять верх: 2\nif not stack:        # проверка на пустоту\n    pass\n<\/code><\/pre><h4>Ловушки, на которых ошибаются на собесе<\/h4><p><strong>1. Двумерный список через умножение.<\/strong><\/p>\n<pre><code class=\"language-python\">grid = [[0] * 3] * 3      # три ссылки на ОДИН и тот же внутренний список\ngrid[0][0] = 1\nprint(grid)               # [[1, 0, 0], [1, 0, 0], [1, 0, 0]] — изменились все строки\n\ngrid = [[0] * 3 for _ in range(3)]   # правильно: три разных списка\n<\/code><\/pre>\n<p><strong>2. Присваивание — это не копия.<\/strong><\/p>\n<pre><code class=\"language-python\">a = [1, 2, 3]\nb = a          # b и a — один и тот же список\nb.append(4)\nprint(a)       # [1, 2, 3, 4]\n\nc = a[:]       # поверхностная копия, O(n); то же: list(a), a.copy()\n<\/code><\/pre>\n<p>В backtracking (глава 25) это частая ошибка: в ответ добавляют <code>path<\/code> вместо <code>path[:]<\/code>, и все ответы потом оказываются одним и тем же изменённым списком.<\/p>\n<p><strong>3. sort() против sorted().<\/strong> <code>arr.sort()<\/code> сортирует на месте и возвращает None. <code>sorted(arr)<\/code> возвращает новый список, исходный не трогает. Запись <code>arr = arr.sort()<\/code> превращает arr в None.<\/p>\n<p><strong>4. Удаление элементов во время прохода.<\/strong> Если удалять из списка, по которому идёт <code>for<\/code>, индексы сдвигаются и элементы пропускаются. Правильно — собрать новый список: <code>arr = [x for x in arr if x != 0]<\/code>.<\/p>\n<p><strong>5. Отрицательные индексы.<\/strong> <code>arr[-1]<\/code> — последний элемент, <code>arr[-2]<\/code> — предпоследний. Удобно, но при вычисляемом индексе <code>arr[i - 1]<\/code> с i = 0 ты молча получишь последний элемент вместо ошибки.<\/p>"}, {"title": "dict и set — хеш-таблицы", "html": "<p>Ключ прогоняется через хеш-функцию, которая сразу указывает ячейку. Поэтому поиск O(1) в среднем (в худшем при коллизиях O(n), на собесе это упоминают, но считают O(1)). Ключом может быть только неизменяемый объект: int, str, tuple — но не list.<\/p>\n<pre><code class=\"language-python\">from collections import Counter, defaultdict\n\ncnt = Counter(&quot;abracadabra&quot;)      # {'a': 5, 'b': 2, 'r': 2, 'c': 1, 'd': 1}\ncnt.most_common(2)                # [('a', 5), ('b', 2)]\n\ngroups = defaultdict(list)        # нет KeyError для нового ключа\nfor word in [&quot;eat&quot;, &quot;tea&quot;, &quot;tan&quot;]:\n    groups[tuple(sorted(word))].append(word)\n<\/code><\/pre>"}, {"title": "Как работает хеш-таблица", "section": "dict и set — хеш-таблицы", "html": "<p>Внутри dict и set — массив ячеек. Чтобы понять, в какую ячейку положить ключ, Python вычисляет <strong>хеш<\/strong> — целое число, полученное из ключа, — и берёт остаток от деления на число ячеек:<\/p>\n<pre class=\"formula\"><code>\\text{ячейка} = \\text{hash}(\\text{key}) \\bmod \\text{размер таблицы}\n<\/code><\/pre>\n<p>Дальше — как с list: по номеру ячейки доступ мгновенный. Поэтому поиск не перебирает элементы, а сразу идёт в нужное место.<\/p>\n<p><strong>Трассировка (упрощённо).<\/strong> Таблица из 8 ячеек, ключи — целые числа (у небольших int в Python hash(x) = x).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Операция<\/th>\n<th>hash % 8<\/th>\n<th>Что происходит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>add(5)<\/td>\n<td>5<\/td>\n<td>ячейка 5 свободна — кладём<\/td>\n<\/tr>\n<tr>\n<td>add(2)<\/td>\n<td>2<\/td>\n<td>ячейка 2 свободна — кладём<\/td>\n<\/tr>\n<tr>\n<td>add(13)<\/td>\n<td>5<\/td>\n<td><strong>коллизия<\/strong>: ячейка 5 занята числом 5 — ищем следующую свободную, кладём в другую<\/td>\n<\/tr>\n<tr>\n<td>13 in s<\/td>\n<td>5<\/td>\n<td>в ячейке 5 лежит 5 ≠ 13 — проверяем следующую по тому же правилу, находим 13<\/td>\n<\/tr>\n<tr>\n<td>7 in s<\/td>\n<td>7<\/td>\n<td>ячейка 7 пуста — сразу ответ «нет»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Коллизии и худший случай.<\/strong> Если много ключей попадает в одну ячейку, поиск превращается в перебор цепочки — O(n). Хорошая хеш-функция раскладывает ключи равномерно, поэтому на практике цепочки короткие и операции O(1) в среднем.<\/p>\n<p><strong>Расширение.<\/strong> Когда таблица заполняется примерно на 2/3, Python создаёт таблицу больше и перекладывает все ключи. Это O(n), но редко — тот же принцип амортизации, что у append (глава 2).<\/p>"}, {"title": "Почему ключ должен быть неизменяемым", "section": "dict и set — хеш-таблицы", "html": "<p>Хеш вычисляется из содержимого ключа в момент вставки. Если бы содержимое ключа можно было изменить, его хеш стал бы другим, и при поиске Python пошёл бы в другую ячейку — ключ «потерялся бы». Поэтому изменяемые объекты запрещены как ключи:<\/p>\n<pre><code class=\"language-python\">d = {}\nd[(1, 2)] = &quot;ok&quot;          # tuple неизменяем — можно\nd[&quot;abc&quot;] = &quot;ok&quot;           # str неизменяема — можно\nd[[1, 2]] = &quot;no&quot;          # TypeError: unhashable type: 'list'\nd[(1, [2])] = &quot;no&quot;        # TypeError: tuple внутри содержит list\n<\/code><\/pre>\n<p>На собесе это встречается, когда ключом нужно сделать набор значений — например, частоты букв в задаче Group Anagrams (глава 8). Список превращают в кортеж: <code>tuple(counts)<\/code>. Множество — в <code>frozenset<\/code>.<\/p>"}, {"title": "Операции над множествами", "section": "dict и set — хеш-таблицы", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Операция<\/th>\n<th>Запись<\/th>\n<th>Результат для a = {1, 2, 3}, b = {2, 3, 4}<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>пересечение<\/td>\n<td>a &amp; b<\/td>\n<td>{2, 3}<\/td>\n<td>O(min(len(a), len(b)))<\/td>\n<\/tr>\n<tr>\n<td>объединение<\/td>\n<td>a | b<\/td>\n<td>{1, 2, 3, 4}<\/td>\n<td>O(len(a) + len(b))<\/td>\n<\/tr>\n<tr>\n<td>разность<\/td>\n<td>a - b<\/td>\n<td>{1}<\/td>\n<td>O(len(a))<\/td>\n<\/tr>\n<tr>\n<td>симметрическая разность<\/td>\n<td>a ^ b<\/td>\n<td>{1, 4}<\/td>\n<td>O(len(a) + len(b))<\/td>\n<\/tr>\n<tr>\n<td>подмножество<\/td>\n<td>a &lt;= b<\/td>\n<td>False<\/td>\n<td>O(len(a))<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>remove(x)<\/code> бросает KeyError, если x нет; <code>discard(x)<\/code> — нет. На собесе безопаснее discard.<\/p>"}, {"title": "Counter и defaultdict подробно", "section": "dict и set — хеш-таблицы", "html": "<p>Оба — словари с удобным поведением для отсутствующих ключей.<\/p>\n<pre><code class=\"language-python\">from collections import Counter, defaultdict\n\n# подсчёт тремя способами — результат одинаковый\ns = &quot;abracadabra&quot;\n\nd = {}\nfor ch in s:\n    d[ch] = d.get(ch, 0) + 1        # get со значением по умолчанию\n\ndd = defaultdict(int)               # int() == 0\nfor ch in s:\n    dd[ch] += 1                     # нет KeyError для нового ключа\n\nc = Counter(s)\nassert d == dd == c == {'a': 5, 'b': 2, 'r': 2, 'c': 1, 'd': 1}\n\nc['z']                  # 0 — отсутствующий ключ не вызывает ошибку\nc.most_common(1)        # [('a', 5)]\nCounter(&quot;aab&quot;) - Counter(&quot;ab&quot;)    # Counter({'a': 1}) — вычитание частот\n\ngraph = defaultdict(list)           # список смежности графа\ngraph[1].append(2)\nvisited_by_group = defaultdict(set)\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Инструмент<\/th>\n<th>Когда брать<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>dict<\/code> + <code>get(k, 0)<\/code><\/td>\n<td>если нельзя импортировать или нужен обычный dict<\/td>\n<\/tr>\n<tr>\n<td><code>defaultdict(int)<\/code><\/td>\n<td>подсчёт с ручным обновлением в цикле<\/td>\n<\/tr>\n<tr>\n<td><code>defaultdict(list)<\/code><\/td>\n<td>группировка, графы<\/td>\n<\/tr>\n<tr>\n<td><code>Counter<\/code><\/td>\n<td>частоты целиком, сравнение частот, top-k<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Порядок ключей в dict (Python 3.7+) совпадает с порядком вставки — это можно использовать, но на собесе лучше явно сказать, что ты на это опираешься.<\/p>"}, {"title": "deque — двусторонняя очередь", "html": "<p>O(1) добавление и удаление с обоих концов. Основа BFS и монотонной очереди.<\/p>\n<pre><code class=\"language-python\">from collections import deque\nq = deque([1, 2])\nq.append(3)       # [1, 2, 3]\nq.popleft()       # 1, осталось [2, 3]\n<\/code><\/pre><h4>Почему для очереди нужен deque, а не list<\/h4><p>Очередь — «первым пришёл, первым ушёл»: добавляем в конец, забираем из начала. У list забрать из начала — <code>pop(0)<\/code>, а это O(n) из-за сдвига всех элементов. Замер на 200 000 элементов (опустошить очередь целиком):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Способ<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>list.pop(0)<\/code><\/td>\n<td>\\~3,6 с<\/td>\n<\/tr>\n<tr>\n<td><code>deque.popleft()<\/code><\/td>\n<td>\\~0,02 с<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Разница больше чем в 100 раз, и она растёт с n: у list суммарно O(n²), у deque — O(n).<\/p>\n<p><strong>Почему deque быстрый.<\/strong> Внутри deque — цепочка блоков фиксированного размера, а не один непрерывный массив. Добавить или убрать элемент с любого конца — значит изменить только крайний блок, ничего не сдвигая. Плата за это — доступ по индексу в середине: <code>dq[i]<\/code> идёт по блокам, O(n).<\/p>"}, {"title": "Основные операции", "section": "deque — двусторонняя очередь", "html": "<pre><code class=\"language-python\">from collections import deque\n\ndq = deque([1, 2, 3])\ndq.append(4)          # [1, 2, 3, 4]   — в конец\ndq.appendleft(0)      # [0, 1, 2, 3, 4] — в начало\ndq.pop()              # 4, [0, 1, 2, 3]\ndq.popleft()          # 0, [1, 2, 3]\ndq[0], dq[-1]         # (1, 3) — концы за O(1)\n\nlast3 = deque(maxlen=3)   # хранит только 3 последних элемента\nfor x in [1, 2, 3, 4, 5]:\n    last3.append(x)       # старые вытесняются слева\n# last3 == deque([3, 4, 5])\n<\/code><\/pre>"}, {"title": "Шаблон BFS — главное применение deque", "section": "deque — двусторонняя очередь", "html": "<p>Поиск в ширину обходит граф «волнами»: сначала соседи старта, потом соседи соседей. Очередь гарантирует, что ближние вершины обработаются раньше дальних. Подробно — в главе 21, здесь важно увидеть роль deque.<\/p>\n<pre><code class=\"language-python\">from collections import deque\n\ndef bfs(graph, start):\n    dist = {start: 0}\n    queue = deque([start])\n    while queue:\n        v = queue.popleft()            # O(1), а не pop(0)\n        for u in graph[v]:\n            if u not in dist:\n                dist[u] = dist[v] + 1\n                queue.append(u)\n    return dist\n\ngraph = {1: [2, 3], 2: [4], 3: [4], 4: []}\nassert bfs(graph, 1) == {1: 0, 2: 1, 3: 1, 4: 2}\n<\/code><\/pre>\n<p>Каждая вершина попадает в очередь один раз, поэтому с deque BFS работает за O(V + E). С <code>list.pop(0)<\/code> он стал бы O(V² + E) — частая скрытая ошибка на собесе.<\/p>"}, {"title": "heapq — двоичная куча (минимальная)", "html": "<p>Список, в котором <code>heap[0]<\/code> всегда наименьший. Максимальной кучи в Python нет — кладут числа со знаком минус.<\/p>\n<pre><code class=\"language-python\">import heapq\nh = []\nfor x in [5, 1, 8, 3]:\n    heapq.heappush(h, x)\nheapq.heappop(h)                 # 1\nheapq.nlargest(2, [5, 1, 8, 3])  # [8, 5]\n# max-куча — отдельная куча, где хранят -x (разбор ниже)\n<\/code><\/pre><h4>Как куча устроена внутри<\/h4><p>Куча — это двоичное дерево, где <strong>каждый родитель не больше своих детей<\/strong>. Поэтому минимум всегда в корне. Дерево хранится прямо в списке, без указателей: для элемента с индексом i<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Кто<\/th>\n<th>Индекс<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>левый ребёнок<\/td>\n<td>2i + 1<\/td>\n<\/tr>\n<tr>\n<td>правый ребёнок<\/td>\n<td>2i + 2<\/td>\n<\/tr>\n<tr>\n<td>родитель<\/td>\n<td>(i − 1) // 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Список [1, 3, 8, 5] — это дерево:<\/p>\n<pre><code class=\"language-text\">        1          индекс 0\n      /   \\\n     3     8       индексы 1, 2\n    /\n   5               индекс 3\n<\/code><\/pre>\n<p>Куча <strong>не отсортирована целиком<\/strong>: гарантирован только минимум в h[0]. Например, h[2] = 8 больше, чем h[3] = 5. Ошибка «куча — это отсортированный список» встречается часто.<\/p>\n<p>Высота дерева из n элементов — log₂ n. Все операции двигают элемент по одному пути от корня к листу или обратно, поэтому они O(log n).<\/p>"}, {"title": "Трассировка heappush: «всплытие»", "section": "heapq — двоичная куча (минимальная)", "html": "<p>Новый элемент ставится в конец списка и поднимается, пока он меньше родителя. Вставляем 5, 1, 8, 3:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вставка<\/th>\n<th>Ставим в конец<\/th>\n<th>Сравнение с родителем<\/th>\n<th>Куча после<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>[5]<\/td>\n<td>родителя нет<\/td>\n<td>[5]<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>[5, 1]<\/td>\n<td>1 &lt; 5 → обмен<\/td>\n<td>[1, 5]<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>[1, 5, 8]<\/td>\n<td>8 &gt; 1 → стоп<\/td>\n<td>[1, 5, 8]<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>[1, 5, 8, 3]<\/td>\n<td>3 &lt; 5 → обмен; 3 &gt; 1 → стоп<\/td>\n<td>[1, 3, 8, 5]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Трассировка heappop: «погружение»", "section": "heapq — двоичная куча (минимальная)", "html": "<p>Забираем корень (минимум). На его место ставим последний элемент и опускаем вниз: меняем с <strong>меньшим<\/strong> из детей, пока он больше ребёнка.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>Список<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>[1, 3, 8, 5]<\/td>\n<td>забираем 1, последний элемент 5 ставим в корень<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>[5, 3, 8]<\/td>\n<td>дети 3 и 8, меньший 3 &lt; 5 → обмен<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>[3, 5, 8]<\/td>\n<td>у 5 нет детей → стоп; вернули 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "heapify — почему O(n), а не O(n log n) · Max-куча и кортежи с приоритетом", "html": "<p><code>heapq.heapify(arr)<\/code> превращает список в кучу на месте. Кажется, что это n вставок по log n. Но heapify идёт снизу вверх, и большинство элементов — листья или почти листья: им нужно опуститься на 0–1 уровень. Только корню нужно log n шагов. Сумма всех погружений получается O(n). Вывод для собеса: если все элементы известны сразу, heapify выгоднее n отдельных heappush.<\/p><h4>Max-куча и кортежи с приоритетом<\/h4><p>В heapq только min-куча. Для максимума храни в <strong>отдельной<\/strong> куче числа со знаком минус и меняй знак при чтении:<\/p>\n<pre><code class=\"language-python\">import heapq\n\nmax_heap = []\nfor x in [5, 1, 8, 3]:\n    heapq.heappush(max_heap, -x)\nlargest = -max_heap[0]              # 8\nlargest = -heapq.heappop(max_heap)  # 8\n<\/code><\/pre>\n<p>Если элементам нужен приоритет, кладут кортеж: кортежи сравниваются по первому элементу, при равенстве — по второму. Чтобы при равных приоритетах Python не пытался сравнить сами объекты (это может вызвать TypeError), добавляют счётчик:<\/p>\n<pre><code class=\"language-python\">import heapq\nfrom itertools import count\n\ntasks = []\nc = count()\nheapq.heappush(tasks, (2, next(c), &quot;написать отчёт&quot;))\nheapq.heappush(tasks, (1, next(c), &quot;срочный баг&quot;))\npriority, _, task = heapq.heappop(tasks)   # (1, ..., &quot;срочный баг&quot;)\n<\/code><\/pre>\n<p>Так же устроен алгоритм Дейкстры (глава 23): в куче лежат пары (расстояние, вершина).<\/p>"}, {"title": "Top-k: куча размера k", "section": "heapq — двоичная куча (минимальная)", "html": "<p>Задача «найди k наибольших» — классика на кучу. Держим <strong>min-кучу из k элементов<\/strong>: в её корне — самый маленький из текущих k лучших. Новый элемент вытесняет его, если он больше.<\/p>\n<pre><code class=\"language-python\">import heapq\n\ndef top_k(nums, k):\n    heap = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) &gt; k:\n            heapq.heappop(heap)       # выкидываем самый маленький\n    return sorted(heap, reverse=True)\n\nassert top_k([5, 1, 8, 3, 9, 2], 3) == [9, 8, 5]\n<\/code><\/pre>\n<p>Время O(n log k), память O(k). Сравни с сортировкой: O(n log n) и O(n). При k намного меньше n — заметный выигрыш, а при потоке данных, который не помещается в память, это единственный вариант.<\/p>"}, {"title": "Полезные мелочи для собеса", "html": "<ul>\n<li><code>float('inf')<\/code> — бесконечность для начальных значений минимума.<\/li>\n<li><code>sorted(arr, key=lambda x: (x[1], -x[0]))<\/code> — сортировка по нескольким ключам.<\/li>\n<li><code>enumerate(arr)<\/code> — индекс и значение; <code>zip(a, b)<\/code> — параллельный проход.<\/li>\n<li><code>bisect.bisect_left(arr, x)<\/code> — бинарный поиск из стандартной библиотеки.<\/li>\n<li>Строки неизменяемы: собирай части в список и делай <code>''.join(parts)<\/code> — это O(n), а <code>s += c<\/code> в цикле может давать O(n²).<\/li>\n<\/ul>"}, {"title": "bisect: бинарный поиск без ошибок на единицу", "section": "Полезные мелочи для собеса", "html": "<p><code>bisect<\/code> работает только с <strong>отсортированным<\/strong> списком и возвращает позицию, куда можно вставить x, не нарушив порядок. Разница между двумя функциями — в том, что делать с равными элементами.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вызов на [1, 2, 2, 2, 5]<\/th>\n<th>Результат<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>bisect_left(a, 2)<\/code><\/td>\n<td>1<\/td>\n<td>первая позиция, где a[i] ≥ 2<\/td>\n<\/tr>\n<tr>\n<td><code>bisect_right(a, 2)<\/code><\/td>\n<td>4<\/td>\n<td>первая позиция, где a[i] &gt; 2<\/td>\n<\/tr>\n<tr>\n<td><code>bisect_left(a, 3)<\/code><\/td>\n<td>4<\/td>\n<td>3 нет — место между 2 и 5<\/td>\n<\/tr>\n<tr>\n<td><code>bisect_left(a, 0)<\/code><\/td>\n<td>0<\/td>\n<td>меньше всех<\/td>\n<\/tr>\n<tr>\n<td><code>bisect_left(a, 6)<\/code><\/td>\n<td>5<\/td>\n<td>больше всех — за концом<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Полезные следствия:<\/p>\n<pre><code class=\"language-python\">from bisect import bisect_left, bisect_right\n\na = [1, 2, 2, 2, 5]\ncount_2 = bisect_right(a, 2) - bisect_left(a, 2)    # 3 — сколько двоек, O(log n)\n\ni = bisect_left(a, 2)\nfound = i &lt; len(a) and a[i] == 2                     # есть ли x в массиве\n\nless_than_3 = bisect_left(a, 3)                      # 4 элемента меньше 3\n<\/code><\/pre>\n<p>Оба вызова O(log n). А вот <code>bisect.insort(a, x)<\/code> (вставка с сохранением порядка) — O(n): поиск быстрый, но сама вставка в list сдвигает элементы.<\/p>"}, {"title": "sorted с key", "section": "Полезные мелочи для собеса", "html": "<p><code>key<\/code> — функция, которая для каждого элемента возвращает значение, по которому сравнивать. Если key возвращает кортеж, сортировка идёт по первому полю, при равенстве — по второму и т.д.<\/p>\n<pre><code class=\"language-python\">people = [(&quot;Аня&quot;, 25), (&quot;Борис&quot;, 20), (&quot;Вера&quot;, 25)]\n\nsorted(people, key=lambda p: p[1])           # по возрасту по возрастанию\nsorted(people, key=lambda p: (-p[1], p[0]))  # по возрасту убыв., при равенстве по имени\n# [('Аня', 25), ('Вера', 25), ('Борис', 20)]\n\nintervals = [[1, 3], [8, 10], [2, 6]]\nintervals.sort(key=lambda x: x[0])           # по началу — основа главы 11\n<\/code><\/pre>\n<p>Минус перед числом даёт обратный порядок только для этого поля. Для строк минус не работает — тогда сортируют в два прохода (сортировка в Python <strong>стабильная<\/strong>: равные элементы сохраняют прежний порядок).<\/p>"}, {"title": "Строки", "section": "Полезные мелочи для собеса", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Как<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>собрать строку из частей<\/td>\n<td><code>''.join(parts)<\/code><\/td>\n<td>O(общей длины)<\/td>\n<\/tr>\n<tr>\n<td>код символа и обратно<\/td>\n<td><code>ord('a')<\/code> = 97, <code>chr(97)<\/code> = 'a'<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>индекс буквы в алфавите<\/td>\n<td><code>ord(ch) - ord('a')<\/code><\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>только буквы и цифры<\/td>\n<td><code>ch.isalnum()<\/code><\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>нижний регистр<\/td>\n<td><code>s.lower()<\/code><\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>развернуть<\/td>\n<td><code>s[::-1]<\/code><\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>разбить на слова<\/td>\n<td><code>s.split()<\/code><\/td>\n<td>O(n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Строка неизменяема: <code>s[0] = 'x'<\/code> вызовет ошибку. Если строку нужно менять посимвольно — преврати в список <code>list(s)<\/code>, измени и собери обратно через join.<\/p>"}, {"title": "Частые ошибки по всей главе", "section": "Полезные мелочи для собеса", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ошибка<\/th>\n<th>Последствие<\/th>\n<th>Как правильно<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>x in list<\/code> внутри цикла<\/td>\n<td>скрытое O(n²)<\/td>\n<td><code>set<\/code> для проверок<\/td>\n<\/tr>\n<tr>\n<td><code>list.pop(0)<\/code> для очереди<\/td>\n<td>O(n) на операцию<\/td>\n<td><code>deque.popleft()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>[[0] * m] * n<\/code><\/td>\n<td>все строки — один объект<\/td>\n<td><code>[[0] * m for _ in range(n)]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>res.append(path)<\/code> в переборе<\/td>\n<td>все ответы — один список<\/td>\n<td><code>res.append(path[:])<\/code><\/td>\n<\/tr>\n<tr>\n<td>list как ключ dict<\/td>\n<td>TypeError<\/td>\n<td><code>tuple(lst)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>-x<\/code> в общей min-куче вместе с положительными<\/td>\n<td>max-куча не работает<\/td>\n<td>отдельная куча, все значения со знаком минус<\/td>\n<\/tr>\n<tr>\n<td>считать кучу отсортированной<\/td>\n<td>неверный порядок при обходе<\/td>\n<td>только <code>h[0]<\/code> гарантированно минимум<\/td>\n<\/tr>\n<tr>\n<td><code>s += ch<\/code> в цикле<\/td>\n<td>O(n²) в худшем случае<\/td>\n<td>список + <code>''.join<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>arr = arr.sort()<\/code><\/td>\n<td>arr становится None<\/td>\n<td><code>arr.sort()<\/code> или <code>arr = sorted(arr)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Реши на LeetCode", "html": "<p>Каждая задача тренирует одну структуру. Цель — не столько решить, сколько объяснить, почему выбрана именно эта структура и какова сложность каждой операции.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Структура<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>349. Intersection of Two Arrays<\/td>\n<td>set<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>20. Valid Parentheses<\/td>\n<td>стек<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>933. Number of Recent Calls<\/td>\n<td>deque<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>232. Implement Queue using Stacks<\/td>\n<td>два стека, амортизация<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>703. Kth Largest Element in a Stream<\/td>\n<td>куча размера k<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>705. Design HashSet<\/td>\n<td>устройство хеш-таблицы<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>1046. Last Stone Weight<\/td>\n<td>max-куча<\/td>\n<td>E<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Критерий готовности к главе 4:<\/strong> ты по памяти воспроизводишь таблицу сложностей из начала главы, объясняешь устройство list, хеш-таблицы и кучи и для каждой ситуации из практики называешь структуру с обоснованием.<\/p>"}], "viz": "heap", "tasks": [{"id": "3-pick-1", "type": "choice", "title": "Выбери структуру", "q": "Проверять, посещали ли уже клетку сетки (r, c).", "options": ["list из кортежей", "set из кортежей", "deque", "heapq"], "answer": 1, "hints": ["Какая операция самая частая?", "«Было ли?» — проверка принадлежности.", "У списка `in` — O(n).", "У множества `in` — O(1).", "set из кортежей (r, c)."], "expl": "Проверка «было ли» — O(1) у множества. Кортеж неизменяем, поэтому может быть элементом set."}, {"id": "3-pick-2", "type": "choice", "title": "Выбери структуру", "q": "Обрабатывать заявки строго в порядке поступления.", "options": ["list с pop(0)", "deque с append и popleft", "set", "heapq"], "answer": 1, "hints": ["Это очередь: первым пришёл — первым ушёл.", "У list pop(0) сдвигает все элементы.", "Нужна структура с O(1) с обоих концов.", "deque.", "append + popleft."], "expl": "pop(0) у list — O(n); deque даёт O(1) на popleft."}, {"id": "3-pick-3", "type": "choice", "title": "Выбери структуру", "q": "Каждый раз брать самую срочную задачу из пополняемого списка.", "options": ["Отсортировать список после каждой вставки", "heapq с кортежами (приоритет, счётчик, задача)", "dict", "deque"], "answer": 1, "hints": ["Нужен минимум, пока элементы добавляются.", "Сортировка после каждой вставки — O(n log n) каждый раз.", "Есть структура с O(log n) на вставку и извлечение минимума.", "Это куча.", "heapq с кортежами (приоритет, счётчик, задача)."], "expl": "Куча даёт O(log n) на вставку и извлечение минимума; счётчик в кортеже не даёт сравнивать сами задачи."}, {"id": "3-grid", "type": "predict", "title": "Ловушка двумерного списка", "q": "Что выведет код?", "code": "grid = [[0] * 3] * 3\ngrid[0][0] = 1\nprint(grid[1][0])", "answer": "1", "hints": ["Что делает `* 3` со списком списков?", "Умножение повторяет ссылки, а не копирует.", "Все три строки — один и тот же список.", "Изменение grid[0] видно в grid[1].", "Выведет 1."], "expl": "`[[0]*3]*3` — три ссылки на один внутренний список. Правильно: `[[0]*3 for _ in range(3)]`."}, {"id": "3-heap", "type": "predict", "title": "Куча после вставок", "q": "Что выведет код?", "code": "import heapq\nh = []\nfor x in [5, 1, 8, 3]:\n    heapq.heappush(h, x)\nprint(h)", "answer": "[1, 3, 8, 5]", "hints": ["Куча не отсортирована целиком.", "Новый элемент ставится в конец и всплывает, пока меньше родителя.", "Родитель индекса i — (i − 1) // 2.", "После 5, 1, 8: [1, 5, 8]. Вставка 3: она меньше родителя 5.", "[1, 3, 8, 5]."], "expl": "5 → [5]; 1 всплывает → [1, 5]; 8 → [1, 5, 8]; 3 меньше родителя 5 → обмен → [1, 3, 8, 5]."}, {"id": "3-bisect", "type": "predict", "title": "bisect с дубликатами", "q": "Что выведет код?", "code": "from bisect import bisect_left, bisect_right\na = [1, 2, 2, 2, 5]\nprint(bisect_left(a, 2), bisect_right(a, 2))", "answer": "1 4", "hints": ["bisect_left — первая позиция, где a[i] ≥ x.", "bisect_right — первая позиция, где a[i] > x.", "Двойки стоят на позициях 1, 2, 3.", "Первая ≥ 2 — индекс 1, первая > 2 — индекс 4.", "1 4."], "expl": "bisect_left(a, 2) = 1, bisect_right(a, 2) = 4; разность 3 — число двоек."}, {"id": "3-code-common", "type": "code", "title": "Общие элементы", "q": "Верни список элементов a, которые есть в b, в порядке следования в a. Длины до 10⁵ — нужно O(n + m).", "fn": "common", "starter": "def common(a, b):\n    pass\n", "tests": [{"args": [[1, 2, 3, 4], [3, 4, 5]], "exp": [3, 4], "hidden": false}, {"args": [[], [1]], "exp": [], "hidden": false}, {"args": [[5, 5, 1], [5]], "exp": [5, 5], "hidden": true, "case": "повторы в a"}, {"args": [[1, 2], []], "exp": [], "hidden": true, "case": "пустой b"}], "speed": {"gen": "ARGS=[list(range(100000)), list(range(50000, 150000))]"}, "ref": "def common(a, b):\n    sb = set(b)\n    return [x for x in a if x in sb]\n", "hints": ["Брутфорс `x in b` для списка — O(n·m).", "Что ускоряет проверку «есть ли x в b»?", "Множество.", "Построй set(b) один раз, O(m).", "sb = set(b); return [x for x in a if x in sb]."], "expl": "set(b) за O(m) и n проверок по O(1) — итого O(n + m). Версия с `in b` по списку — O(n·m) и не проходит тест на скорость."}, {"id": "3-code-topk", "type": "code", "title": "k наибольших через кучу", "q": "Верни k наибольших чисел nums в порядке убывания. Используй кучу размера k: O(n log k).", "fn": "top_k", "starter": "import heapq\n\ndef top_k(nums, k):\n    pass\n", "tests": [{"args": [[5, 1, 8, 3, 9, 2], 3], "exp": [9, 8, 5], "hidden": false}, {"args": [[1], 1], "exp": [1], "hidden": false}, {"args": [[4, 4, 4, 1], 2], "exp": [4, 4], "hidden": true, "case": "повторы"}, {"args": [[-1, -5, -3], 2], "exp": [-1, -3], "hidden": true, "case": "отрицательные"}], "ref": "import heapq\n\ndef top_k(nums, k):\n    h = []\n    for x in nums:\n        heapq.heappush(h, x)\n        if len(h) > k:\n            heapq.heappop(h)\n    return sorted(h, reverse=True)\n", "hints": ["Нужна min-куча или max-куча?", "Держи min-кучу из k лучших: в корне — худший из них.", "Новый элемент кладём, и если куча стала больше k — выкидываем минимум.", "В конце в куче ровно k наибольших, но не по порядку.", "Верни sorted(h, reverse=True)."], "expl": "Min-куча размера k хранит k наибольших; корень — самый маленький из них, его и вытесняем. Куча не отсортирована — в конце сортируем k элементов."}], "test": [{"q": "Сложность dict[key] = value:", "options": ["O(n)", "O(1) в среднем", "O(log n)", "O(n log n)"], "answer": 1}, {"q": "Почему list нельзя сделать ключом dict?", "options": ["Он слишком большой", "Он изменяем — его хеш мог бы измениться", "Ключом может быть только строка", "Можно, просто медленно"], "answer": 1}, {"q": "heap[0] в heapq — это:", "options": ["Максимум", "Минимум", "Последний добавленный", "Медиана"], "answer": 1}, {"q": "Как получить max-кучу в Python?", "options": ["heapq.maxheap()", "Хранить -x в отдельной куче", "Отсортировать по убыванию", "Использовать deque"], "answer": 1}, {"q": "arr = arr.sort() — что окажется в arr?", "options": ["Отсортированный список", "None", "Исходный список", "Ошибка"], "answer": 1}, {"q": "Почему heapify — O(n), а не O(n log n)?", "options": ["Она не сравнивает элементы", "Большинство элементов — листья, им почти не нужно опускаться", "Она использует сортировку подсчётом", "Это O(n log n)"], "answer": 1}, {"q": "BFS с list.pop(0) вместо deque.popleft() даёт:", "options": ["Ту же сложность", "Лишний O(n) на каждую операцию очереди", "Неверный ответ", "Ускорение"], "answer": 1}]}, {"title": "Глава 4. Рекурсия и стек вызовов", "short": "Рекурсия и стек вызовов", "part": "Часть I · Фундамент", "cards": [{"title": "Интуиция: как думать рекурсивно", "html": "<p>Рекурсия — функция, которая решает задачу, вызывая себя на задаче меньшего размера. На ней построены обходы деревьев, DFS, backtracking, сортировка слиянием и ДП с мемоизацией, поэтому её нужно понимать механически, а не «на веру».<\/p><h4>Интуиция: как думать рекурсивно<\/h4><p><strong>Аналогия с очередью.<\/strong> Ты стоишь в длинной очереди и хочешь узнать свой номер. Посчитать всех впереди долго. Вместо этого ты спрашиваешь человека перед собой: «Какой у тебя номер?» Он не знает и спрашивает своего соседа, тот — своего… Первый в очереди знает ответ сразу: «Я первый». Ответ передаётся назад: «я второй», «я третий»… Ты получаешь номер соседа и прибавляешь 1.<\/p>\n<p>В этой истории есть всё, что нужно рекурсии:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Элемент рекурсии<\/th>\n<th>В очереди<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>задача меньшего размера<\/td>\n<td>тот же вопрос, но человеку ближе к началу<\/td>\n<\/tr>\n<tr>\n<td>базовый случай<\/td>\n<td>первый в очереди знает ответ без вопросов<\/td>\n<\/tr>\n<tr>\n<td>рекурсивный шаг<\/td>\n<td>«мой номер = номер соседа + 1»<\/td>\n<\/tr>\n<tr>\n<td>путь «вниз»<\/td>\n<td>вопросы передаются вперёд к началу очереди<\/td>\n<\/tr>\n<tr>\n<td>путь «вверх»<\/td>\n<td>ответы возвращаются назад<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code class=\"language-python\">def my_number(people_ahead):\n    if people_ahead == 0:              # я первый\n        return 1\n    return my_number(people_ahead - 1) + 1\n<\/code><\/pre>"}, {"title": "Принцип доверия", "section": "Интуиция: как думать рекурсивно", "html": "<p>Главная трудность новичков — пытаться в голове проследить все вызовы до самого дна. Для написания кода это не нужно. Рассуждай так: <strong>«предположим, функция уже правильно работает для меньшего входа. Как из её ответа получить ответ для текущего?»<\/strong> Это тот же принцип, что у математической индукции: доказали базу и переход — значит, верно для всех n.<\/p>\n<p>Трассировка всех вызовов нужна для другого — для <em>проверки<\/em> кода и подсчёта сложности. Писать — с доверием, проверять — трассировкой.<\/p>"}, {"title": "Три вопроса для любой рекурсии", "section": "Интуиция: как думать рекурсивно", "html": "<p>Прежде чем писать код, ответь письменно на три вопроса:<\/p>\n<ol>\n<li><strong>Что функция принимает и что возвращает?<\/strong> Сформулируй одной фразой: «sum_from(arr, i) возвращает сумму элементов arr начиная с индекса i». Без точной формулировки нельзя довериться вызову.<\/li>\n<li><strong>Какой вход настолько мал, что ответ очевиден?<\/strong> Это базовый случай: пустой список, n = 0, None вместо узла дерева.<\/li>\n<li><strong>Как свести задачу к меньшей?<\/strong> Какой меньший вызов сделать и как из его ответа получить свой.<\/li>\n<\/ol>\n<p>Если на какой-то вопрос нет чёткого ответа — код писать рано.<\/p>"}, {"title": "Две обязательные части", "html": "<ol>\n<li><strong>Базовый случай<\/strong> — вход настолько мал, что ответ известен без рекурсии (n == 0, пустой список, лист дерева).<\/li>\n<li><strong>Рекурсивный шаг<\/strong> — свести задачу к меньшей и <em>доверять<\/em>, что вызов на меньшей задаче вернёт верный ответ.<\/li>\n<\/ol>\n<pre><code class=\"language-python\">def factorial(n):\n    if n &lt;= 1:                 # базовый случай\n        return 1\n    return n * factorial(n - 1)  # шаг: n! = n * (n-1)!\n<\/code><\/pre>"}, {"title": "Три вопроса на трёх примерах", "section": "Две обязательные части", "html": "<p><strong>Пример 1. Сумма элементов списка<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вопрос<\/th>\n<th>Ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Что принимает и возвращает?<\/td>\n<td>sum_from(arr, i) — сумма arr[i], arr[i+1], …, arr[n−1]<\/td>\n<\/tr>\n<tr>\n<td>Базовый случай<\/td>\n<td>i == len(arr): элементов не осталось, сумма 0<\/td>\n<\/tr>\n<tr>\n<td>Сведение<\/td>\n<td>arr[i] + сумма всего, что правее: sum_from(arr, i + 1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code class=\"language-python\">def sum_from(arr, i=0):\n    if i == len(arr):\n        return 0\n    return arr[i] + sum_from(arr, i + 1)\n\nassert sum_from([3, 1, 4]) == 8\n<\/code><\/pre>\n<p>Обрати внимание: передаём <strong>индекс<\/strong>, а не срез <code>arr[1:]<\/code>. Срез копирует список на каждом вызове и превращает O(n) в O(n²) (подробно — в разделе ошибок ниже).<\/p>\n<p><strong>Пример 2. Разворот строки<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вопрос<\/th>\n<th>Ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Что принимает и возвращает?<\/td>\n<td>reverse(s) — строка s задом наперёд<\/td>\n<\/tr>\n<tr>\n<td>Базовый случай<\/td>\n<td>длина 0 или 1 — строка совпадает со своим разворотом<\/td>\n<\/tr>\n<tr>\n<td>Сведение<\/td>\n<td>развернуть всё, кроме первого символа, и приписать первый символ в конец<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code class=\"language-python\">def reverse(s):\n    if len(s) &lt;= 1:\n        return s\n    return reverse(s[1:]) + s[0]\n\nassert reverse(&quot;abc&quot;) == &quot;cba&quot;\n<\/code><\/pre>\n<p>Проверка доверием: пусть reverse(\"bc\") правильно вернул \"cb\". Тогда \"cb\" + \"a\" = \"cba\" — верно. Этот код учебный: из-за срезов и склеек он O(n²); в реальной задаче пишут <code>s[::-1]<\/code>.<\/p>\n<p><strong>Пример 3. Глубина бинарного дерева<\/strong> (задача 104, разбирается в главе 16)<\/p>\n<p>У дерева естественная рекурсивная структура: каждый узел — корень своего поддерева. Поэтому рекурсия для деревьев — основной инструмент.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вопрос<\/th>\n<th>Ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Что принимает и возвращает?<\/td>\n<td>depth(node) — число уровней в поддереве с корнем node<\/td>\n<\/tr>\n<tr>\n<td>Базовый случай<\/td>\n<td>node is None: пустое дерево, глубина 0<\/td>\n<\/tr>\n<tr>\n<td>Сведение<\/td>\n<td>1 (сам узел) + большая из глубин левого и правого поддеревьев<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code class=\"language-python\">class Node:\n    def __init__(self, val, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef depth(node):\n    if node is None:\n        return 0\n    return 1 + max(depth(node.left), depth(node.right))\n\n#     1\n#    / \\\n#   2   3\n#  /\n# 4\ntree = Node(1, Node(2, Node(4)), Node(3))\nassert depth(tree) == 3\n<\/code><\/pre>\n<p>Здесь видно, почему доверие так важно: проследить все вызовы на большом дереве в голове невозможно, а рассуждение «глубину поддеревьев мне вернут, я беру максимум и добавляю 1» — простое и верное.<\/p>"}, {"title": "Трассировка: стек вызовов factorial(4)", "html": "<p>Каждый вызов кладёт кадр на стек и ждёт ответа от следующего. Ответы «всплывают» в обратном порядке.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>Стек (верх справа)<\/th>\n<th>Что происходит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>f(4)<\/td>\n<td>ждёт f(3)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>f(4) f(3)<\/td>\n<td>ждёт f(2)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>f(4) f(3) f(2)<\/td>\n<td>ждёт f(1)<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>f(4) f(3) f(2) f(1)<\/td>\n<td>базовый случай → 1<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>f(4) f(3) f(2)<\/td>\n<td>2 · 1 = 2<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>f(4) f(3)<\/td>\n<td>3 · 2 = 6<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>f(4)<\/td>\n<td>4 · 6 = 24<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Глубина стека — 4, поэтому память O(n), даже если в коде нет списков.<\/p>"}, {"title": "Что хранится в кадре стека", "section": "Трассировка: стек вызовов factorial(4)", "html": "<p>Каждый вызов функции получает свой <strong>кадр<\/strong> (frame) — запись в стеке вызовов. В кадре лежат:<\/p>\n<ul>\n<li>аргументы этого вызова (у каждого вызова factorial своё n);<\/li>\n<li>локальные переменные;<\/li>\n<li>место, куда вернуться, когда вызов закончится (в какую строку вызвавшей функции).<\/li>\n<\/ul>\n<p>Кадры независимы: n = 4 в первом вызове и n = 3 во втором — разные переменные, они не перезаписывают друг друга. Пока вызов ждёт ответа от вложенного, его кадр лежит в стеке и занимает память. Отсюда O(глубины) памяти.<\/p>"}, {"title": "Работа «до» и «после» вызова", "section": "Трассировка: стек вызовов factorial(4)", "html": "<p>Код до рекурсивного вызова выполняется <strong>на пути вниз<\/strong>, код после — <strong>на пути вверх<\/strong>, в обратном порядке.<\/p>\n<pre><code class=\"language-python\">def show(n):\n    if n == 0:\n        return\n    print(&quot;до&quot;, n)       # на пути вниз\n    show(n - 1)\n    print(&quot;после&quot;, n)    # на пути вверх\n\nshow(3)\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>Стек (верх справа)<\/th>\n<th>Что печатается<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>show(3)<\/td>\n<td>до 3<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>show(3) show(2)<\/td>\n<td>до 2<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>show(3) show(2) show(1)<\/td>\n<td>до 1<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>show(3) show(2) show(1) show(0)<\/td>\n<td>— базовый случай, возврат<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>show(3) show(2) show(1)<\/td>\n<td>после 1<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>show(3) show(2)<\/td>\n<td>после 2<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>show(3)<\/td>\n<td>после 3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Вывод: до 3, до 2, до 1, после 1, после 2, после 3.<\/p>\n<p>Это не просто курьёз. От того, где стоит действие относительно рекурсивного вызова, зависит порядок обхода дерева (pre-order и post-order, глава 16), а в backtracking «после» — это место, где отменяют сделанный выбор (глава 25).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Где действие<\/th>\n<th>Порядок выполнения<\/th>\n<th>Где встретится<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>до вызова<\/td>\n<td>сверху вниз, от корня к листьям<\/td>\n<td>pre-order обход, передача данных вниз (текущий путь, сумма)<\/td>\n<\/tr>\n<tr>\n<td>после вызова<\/td>\n<td>снизу вверх, от листьев к корню<\/td>\n<td>post-order обход, сбор ответа из детей (высота, сумма поддерева)<\/td>\n<\/tr>\n<tr>\n<td>и до, и после<\/td>\n<td>выбор → рекурсия → отмена выбора<\/td>\n<td>backtracking<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Дерево рекурсии и экспоненциальный взрыв", "html": "<p>Если функция вызывает себя <em>дважды<\/em>, число вызовов растёт как дерево.<\/p>\n<pre><code class=\"language-python\">def fib(n):\n    if n &lt; 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n<\/code><\/pre>\n<p>fib(5) вызывает fib(4) и fib(3), fib(4) снова вызывает fib(3) — одна и та же подзадача считается много раз. Число вызовов ≈ 2ⁿ, сложность O(2ⁿ). Лечится запоминанием ответов (мемоизацией) — это вход в динамическое программирование (глава 27):<\/p>\n<pre><code class=\"language-python\">from functools import lru_cache\n\n@lru_cache(maxsize=None)\ndef fib(n):\n    if n &lt; 2:\n        return n\n    return fib(n - 1) + fib(n - 2)   # теперь O(n): каждое n считается один раз\n<\/code><\/pre>"}, {"title": "Дерево вызовов fib(5)", "section": "Дерево рекурсии и экспоненциальный взрыв", "html": "<pre><code class=\"language-text\">                     fib(5)\n                /            \\\n           fib(4)            fib(3)\n          /      \\           /     \\\n      fib(3)    fib(2)    fib(2)  fib(1)\n      /    \\     /   \\     /   \\\n  fib(2) fib(1) f(1) f(0) f(1) f(0)\n  /    \\\nf(1)  f(0)\n<\/code><\/pre>\n<p>Сколько раз вычисляется каждое значение:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Аргумент<\/th>\n<th>fib(5)<\/th>\n<th>fib(4)<\/th>\n<th>fib(3)<\/th>\n<th>fib(2)<\/th>\n<th>fib(1)<\/th>\n<th>fib(0)<\/th>\n<th>Всего<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Вызовов<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>3<\/td>\n<td>5<\/td>\n<td>3<\/td>\n<td>15<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>fib(2) считается трижды, хотя ответ каждый раз один и тот же. С ростом n повторов становится катастрофически много:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>n<\/th>\n<th>Вызовов без мемоизации<\/th>\n<th>Вызовов с мемоизацией<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>15<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>177<\/td>\n<td>19<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>21 891<\/td>\n<td>39<\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>2 692 537<\/td>\n<td>59<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Мемоизация вручную", "section": "Дерево рекурсии и экспоненциальный взрыв", "html": "<p><code>@lru_cache<\/code> удобен, но на собесе полезно уметь написать то же руками: перед вычислением проверяем, нет ли ответа в словаре, после вычисления — сохраняем.<\/p>\n<pre><code class=\"language-python\">def fib(n, memo=None):\n    if memo is None:\n        memo = {}\n    if n &lt; 2:\n        return n\n    if n in memo:                 # уже считали — возвращаем сразу\n        return memo[n]\n    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)\n    return memo[n]\n\nassert fib(30) == 832040\n<\/code><\/pre>\n<p><strong>Трассировка fib(5) с мемоизацией.<\/strong> Левая ветка спускается до дна и заполняет словарь; правые ветки берут готовые ответы.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Порядок<\/th>\n<th>Вызов<\/th>\n<th>Что происходит<\/th>\n<th>memo после<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>fib(5)<\/td>\n<td>нет в memo, вызывает fib(4)<\/td>\n<td>{}<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>fib(4)<\/td>\n<td>нет в memo, вызывает fib(3)<\/td>\n<td>{}<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>fib(3)<\/td>\n<td>нет в memo, вызывает fib(2)<\/td>\n<td>{}<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>fib(2)<\/td>\n<td>вызывает fib(1) и fib(0) → 1 + 0<\/td>\n<td>{2: 1}<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>fib(1) из fib(3)<\/td>\n<td>базовый случай → 1<\/td>\n<td>{2: 1, 3: 2}<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>fib(2) из fib(4)<\/td>\n<td><strong>есть в memo<\/strong> → 1<\/td>\n<td>{2: 1, 3: 2, 4: 3}<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>fib(3) из fib(5)<\/td>\n<td><strong>есть в memo<\/strong> → 2<\/td>\n<td>{…, 5: 5}<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Каждое значение вычисляется один раз: O(n) по времени и O(n) по памяти (словарь + глубина стека).<\/p>\n<p>Почему <code>memo=None<\/code>, а не <code>memo={}<\/code> в сигнатуре: значение по умолчанию создаётся один раз при определении функции и разделяется между всеми вызовами. В этой задаче это бы даже работало, но в других приводит к трудноуловимым ошибкам (см. раздел ошибок).<\/p>\n<p>Следующий шаг — отказаться от рекурсии совсем и считать снизу вверх: <code>a, b = 0, 1; for _ in range(n): a, b = b, a + b<\/code>. Это O(n) времени и O(1) памяти. Переход «рекурсия → мемоизация → таблица снизу вверх» — основа динамического программирования (глава 27).<\/p>"}, {"title": "Как считать сложность рекурсии", "html": "<p>Время = (число вызовов) × (работа внутри одного вызова без учёта рекурсивных). Память = максимальная глубина стека + дополнительные структуры.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Схема<\/th>\n<th>Пример<\/th>\n<th>Время<\/th>\n<th>Память стека<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>один вызов, n − 1<\/td>\n<td>факториал, обход списка<\/td>\n<td>O(n)<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>один вызов, n / 2<\/td>\n<td>бинарный поиск рекурсивно<\/td>\n<td>O(log n)<\/td>\n<td>O(log n)<\/td>\n<\/tr>\n<tr>\n<td>два вызова, n / 2, + O(n) работы<\/td>\n<td>сортировка слиянием<\/td>\n<td>O(n log n)<\/td>\n<td>O(log n)<\/td>\n<\/tr>\n<tr>\n<td>два вызова, n − 1<\/td>\n<td>наивный fib<\/td>\n<td>O(2ⁿ)<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Метод уровней: как получить сложность любой рекурсии", "section": "Как считать сложность рекурсии", "html": "<p>Нарисуй дерево вызовов (хотя бы мысленно) и ответь на три вопроса:<\/p>\n<ol>\n<li>Сколько <strong>уровней<\/strong> в дереве? (= глубина рекурсии = память стека)<\/li>\n<li>Сколько <strong>вызовов на каждом уровне<\/strong>?<\/li>\n<li>Сколько <strong>работы делает один вызов<\/strong> без учёта вложенных?<\/li>\n<\/ol>\n<p>Время = сумма по уровням: (вызовов на уровне) × (работа одного вызова).<\/p>\n<p><strong>Пример 1. Быстрое возведение в степень<\/strong> (задача 50). Наивно x · x · … · x — это n умножений, O(n). Идея: xⁿ = (x^(n/2))², то есть достаточно вычислить половинную степень и возвести её в квадрат.<\/p>\n<pre><code class=\"language-python\">def power(x, n):\n    if n == 0:\n        return 1\n    half = power(x, n // 2)        # ОДИН вызов, результат сохраняем\n    if n % 2 == 0:\n        return half * half\n    return half * half * x         # нечётное n: x^n = x^(n//2) * x^(n//2) * x\n\nassert power(2, 10) == 1024 and power(3, 5) == 243\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вопрос<\/th>\n<th>Ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Уровней<\/td>\n<td>n делится пополам на каждом уровне → log₂ n<\/td>\n<\/tr>\n<tr>\n<td>Вызовов на уровне<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>Работа одного вызова<\/td>\n<td>1–2 умножения, O(1)<\/td>\n<\/tr>\n<tr>\n<td>Итог<\/td>\n<td>время O(log n), память стека O(log n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ловушка.<\/strong> Если написать <code>return power(x, n // 2) * power(x, n // 2)<\/code>, то вызовов на каждом уровне станет вдвое больше: 1, 2, 4, …, n. Вызовов получается порядка n (для n = 1024 — 4 095), и вся оптимизация пропала: O(n). Одна лишняя копия вызова меняет класс сложности, поэтому результат вложенного вызова сохраняют в переменную.<\/p>\n<p><strong>Пример 2. Сортировка слиянием<\/strong> (глава 9). Делим массив пополам, рекурсивно сортируем половины, сливаем за O(длины). Для n = 8:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Уровень<\/th>\n<th>Вызовов<\/th>\n<th>Размер куска<\/th>\n<th>Работа на уровне<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>1<\/td>\n<td>8<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>2 · 4 = 8<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>4<\/td>\n<td>2<\/td>\n<td>4 · 2 = 8<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>8<\/td>\n<td>1<\/td>\n<td>8 · 1 = 8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На каждом уровне суммарно n работы, уровней log₂ n + 1. Итог O(n log n). Память стека O(log n), плюс O(n) на вспомогательные массивы слияния.<\/p>\n<p><strong>Пример 3. Наивный fib.<\/strong> Уровней n, на уровне k до 2ᵏ вызовов, работа O(1). Сумма 1 + 2 + 4 + … + 2ⁿ ≈ 2ⁿ⁺¹ — O(2ⁿ). Память — только глубина O(n), потому что в стеке одновременно лежит лишь одна ветка дерева, а не всё дерево.<\/p>"}, {"title": "Сводка через рекуррентные соотношения", "section": "Как считать сложность рекурсии", "html": "<p>T(n) — время работы на входе размера n. Запись рекурсии в виде формулы помогает сразу узнать знакомый случай:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Соотношение<\/th>\n<th>Что значит<\/th>\n<th>Итог<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>T(n) = T(n−1) + O(1)<\/td>\n<td>один вызов на n−1, константная работа<\/td>\n<td>O(n)<\/td>\n<td>факториал, сумма списка<\/td>\n<\/tr>\n<tr>\n<td>T(n) = T(n−1) + O(n)<\/td>\n<td>один вызов на n−1, линейная работа<\/td>\n<td>O(n²)<\/td>\n<td>рекурсия со срезом arr[1:]<\/td>\n<\/tr>\n<tr>\n<td>T(n) = T(n/2) + O(1)<\/td>\n<td>один вызов на половину<\/td>\n<td>O(log n)<\/td>\n<td>бинарный поиск, быстрая степень<\/td>\n<\/tr>\n<tr>\n<td>T(n) = 2T(n/2) + O(1)<\/td>\n<td>два вызова на половины<\/td>\n<td>O(n)<\/td>\n<td>обход дерева, неверная степень<\/td>\n<\/tr>\n<tr>\n<td>T(n) = 2T(n/2) + O(n)<\/td>\n<td>два вызова на половины, линейная работа<\/td>\n<td>O(n log n)<\/td>\n<td>сортировка слиянием<\/td>\n<\/tr>\n<tr>\n<td>T(n) = 2T(n−1) + O(1)<\/td>\n<td>два вызова на n−1<\/td>\n<td>O(2ⁿ)<\/td>\n<td>наивный fib, все подмножества<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Особенности Python", "html": "<p>Лимит глубины рекурсии по умолчанию — 1000. При n до 10⁵ рекурсивный DFS упадёт с RecursionError. Варианты: <code>sys.setrecursionlimit(10**6)<\/code> (может не спасти от переполнения стека интерпретатора) или переписать на явный стек — этот приём понадобится в главах 16 и 21.<\/p>\n<pre><code class=\"language-python\"># сумма элементов вложенного списка: рекурсивно и через явный стек\ndef nested_sum(x):\n    if isinstance(x, int):\n        return x\n    return sum(nested_sum(y) for y in x)\n\ndef nested_sum_iter(x):\n    total, stack = 0, [x]\n    while stack:\n        cur = stack.pop()\n        if isinstance(cur, int):\n            total += cur\n        else:\n            stack.extend(cur)\n    return total\n\nassert nested_sum([1, [2, [3, 4]], 5]) == nested_sum_iter([1, [2, [3, 4]], 5]) == 15\n<\/code><\/pre>"}, {"title": "Когда рекурсия падает", "section": "Особенности Python", "html": "<pre><code class=\"language-python\">def sum_from(arr, i=0):\n    if i == len(arr):\n        return 0\n    return arr[i] + sum_from(arr, i + 1)\n\nsum_from(list(range(10_000)))   # RecursionError: maximum recursion depth exceeded\n<\/code><\/pre>\n<p>Алгоритм верный, но глубина 10 000 больше лимита в 1 000. Опасные ситуации на собесе:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ситуация<\/th>\n<th>Глубина рекурсии<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>обход связного списка рекурсией<\/td>\n<td>n<\/td>\n<\/tr>\n<tr>\n<td>DFS по «вытянутому» дереву (каждый узел — один ребёнок)<\/td>\n<td>n<\/td>\n<\/tr>\n<tr>\n<td>DFS по сетке 1000 × 1000 (заливка, острова)<\/td>\n<td>до 10⁶<\/td>\n<\/tr>\n<tr>\n<td>DFS по графу-цепочке<\/td>\n<td>V<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На самом собесе обычно достаточно <strong>сказать<\/strong>: «рекурсия здесь глубины до n; при больших n в Python упрёмся в лимит, тогда перепишу на явный стек». Это сильный сигнал. Но уметь переписать нужно.<\/p>"}, {"title": "Рецепт: рекурсия → цикл с явным стеком", "section": "Особенности Python", "html": "<p>Рекурсия сама хранит «что ещё осталось сделать» в стеке вызовов. Мы заводим свой стек и кладём туда то же самое — аргументы отложенных вызовов.<\/p>\n<ol>\n<li>Создай стек и положи в него аргументы первого вызова.<\/li>\n<li>Пока стек не пуст: достань элемент.<\/li>\n<li>Если это базовый случай — обработай и продолжай.<\/li>\n<li>Иначе — сделай работу текущего вызова и положи в стек аргументы «рекурсивных вызовов».<\/li>\n<\/ol>\n<p><strong>Пример: глубина дерева без рекурсии.<\/strong> В стеке храним пары (узел, его уровень).<\/p>\n<pre><code class=\"language-python\">def depth_iter(root):\n    best = 0\n    stack = [(root, 1)]\n    while stack:\n        node, level = stack.pop()\n        if node is None:                 # базовый случай\n            continue\n        best = max(best, level)\n        stack.append((node.right, level + 1))   # «рекурсивные вызовы»\n        stack.append((node.left, level + 1))\n    return best\n\ntree = Node(1, Node(2, Node(4)), Node(3))\nassert depth_iter(tree) == depth(tree) == 3\n<\/code><\/pre>\n<p>Заметь: правого ребёнка кладём первым, чтобы левый оказался сверху стека и обработался раньше — так порядок обхода совпадает с рекурсивным (сначала левое поддерево).<\/p>\n<p><strong>Ограничение рецепта.<\/strong> Он легко работает, когда ответ собирается «по пути вниз» (передаём уровень, текущую сумму). Если ответ собирается «снизу вверх» из ответов детей (post-order), понадобится хранить в стеке ещё и флаг «дети уже обработаны». Это разберём в главе 16.<\/p>"}, {"title": "Второй способ — поднять лимит · Типичные ошибки", "html": "<pre><code class=\"language-python\">import sys\nsys.setrecursionlimit(10**6)\n<\/code><\/pre>\n<p>Это снимает ограничение Python, но не увеличивает реальный стек процесса: при глубине порядка 10⁵–10⁶ программа может аварийно завершиться без понятной ошибки. На собесе этот способ можно упомянуть, но надёжный ответ — явный стек.<\/p><h4>Типичные ошибки<\/h4><ul>\n<li>Нет базового случая или он недостижим → бесконечная рекурсия.<\/li>\n<li>Забыть <code>return<\/code> перед рекурсивным вызовом — функция вернёт None.<\/li>\n<li>Передавать срезы <code>arr[1:]<\/code> в каждый вызов — скрытое O(n) на вызов, итог O(n²). Передавай индексы.<\/li>\n<li>Не учитывать стек в памяти.<\/li>\n<\/ul>"}, {"title": "Каждая ошибка на коде", "section": "Типичные ошибки", "html": "<p><strong>1. Недостижимый базовый случай.<\/strong><\/p>\n<pre><code class=\"language-python\">def count_down_by_two(n):\n    if n == 0:\n        return &quot;готово&quot;\n    return count_down_by_two(n - 2)\n\ncount_down_by_two(4)   # 4 → 2 → 0: работает\ncount_down_by_two(3)   # 3 → 1 → -1 → -3 → ... RecursionError\n<\/code><\/pre>\n<p>Базовый случай есть, но при нечётном n шаг его перепрыгивает. Проверяй: <strong>каждый ли путь уменьшения входа приходит в базовый случай?<\/strong> Исправление — <code>if n &lt;= 0<\/code>.<\/p>\n<p><strong>2. Забытый return.<\/strong><\/p>\n<pre><code class=\"language-python\">def sum_from(arr, i=0):\n    if i == len(arr):\n        return 0\n    arr[i] + sum_from(arr, i + 1)    # результат вычислен и выброшен\n\nsum_from([1, 2])   # TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'\n<\/code><\/pre>\n<p>Функция без return возвращает None. Самый глубокий вызов вернул 0, следующий посчитал сумму, но не вернул её — и вызов выше получил None. На собесе ошибка находится трассировкой: «а что вернёт эта функция, если дойдёт до последней строки?»<\/p>\n<p><strong>3. Срезы вместо индексов.<\/strong><\/p>\n<pre><code class=\"language-python\">def sum_slice(arr):\n    if not arr:\n        return 0\n    return arr[0] + sum_slice(arr[1:])   # копия n-1, n-2, ... элементов\n<\/code><\/pre>\n<p>Каждый вызов копирует остаток массива: n−1 + n−2 + … ≈ n²/2 операций — <strong>O(n²) по времени<\/strong>. Хуже того, все эти копии одновременно живут в кадрах стека — <strong>O(n²) по памяти<\/strong>. Версия с индексом (пример 1 выше) делает то же за O(n) и O(n).<\/p>\n<p><strong>4. Общий изменяемый аргумент по умолчанию.<\/strong><\/p>\n<pre><code class=\"language-python\">def collect(n, acc=[]):        # список создаётся ОДИН раз при определении функции\n    if n == 0:\n        return acc\n    acc.append(n)\n    return collect(n - 1, acc)\n\ncollect(2)   # [2, 1]\ncollect(2)   # [2, 1, 2, 1] — второй вызов продолжил тот же список\n<\/code><\/pre>\n<p>Исправление — <code>acc=None<\/code> и <code>if acc is None: acc = []<\/code> в начале функции, как в мемоизации выше.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ошибка<\/th>\n<th>Симптом<\/th>\n<th>Как найти на собесе<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>недостижимый базовый случай<\/td>\n<td>RecursionError<\/td>\n<td>проверить вход, который «перепрыгивает» базу (нечётное, отрицательное)<\/td>\n<\/tr>\n<tr>\n<td>забытый return<\/td>\n<td>None или TypeError<\/td>\n<td>спросить себя «что вернётся из последней строки?»<\/td>\n<\/tr>\n<tr>\n<td>срезы в аргументах<\/td>\n<td>медленно, много памяти<\/td>\n<td>искать <code>[1:]<\/code>, <code>[:mid]<\/code> в вызовах<\/td>\n<\/tr>\n<tr>\n<td>изменяемый аргумент по умолчанию<\/td>\n<td>ответы «копятся» между вызовами<\/td>\n<td>никогда не писать <code>=[]<\/code> и <code>={}<\/code> в сигнатуре<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Реши на LeetCode", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>509. Fibonacci Number<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>206. Reverse Linked List (рекурсивно)<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>50. Pow(x, n)<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>21. Merge Two Sorted Lists (рекурсивно)<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>394. Decode String<\/td>\n<td>M<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "viz": "stack", "tasks": [{"id": "4-mystery", "type": "predict", "title": "Что напечатает", "q": "Что выведет код? (Числа через пробел.)", "code": "def mystery(n):\n    if n <= 0:\n        return\n    mystery(n - 1)\n    print(n, end=' ')\n    mystery(n - 1)\n\nmystery(3)", "answer": "1 2 1 3 1 2 1", "hints": ["Сначала реши для n = 1.", "mystery(1): ничего, печать 1, ничего → «1».", "mystery(2) = mystery(1), 2, mystery(1) → «1 2 1».", "mystery(3) = mystery(2), 3, mystery(2).", "1 2 1 3 1 2 1."], "expl": "Вывод для n — это «вывод для n−1, затем n, затем снова вывод для n−1». Всего 2ⁿ⁺¹ − 1 вызовов."}, {"id": "4-digits", "type": "predict", "title": "Сумма цифр", "q": "Что выведет код?", "code": "def f(n):\n    if n == 0:\n        return 0\n    return n % 10 + f(n // 10)\n\nprint(f(1234))", "answer": "10", "hints": ["n % 10 — последняя цифра.", "n // 10 — число без последней цифры.", "f складывает последнюю цифру и f от остатка.", "4 + 3 + 2 + 1.", "10."], "expl": "Функция считает сумму цифр. Вызовов столько, сколько цифр: O(log n)."}, {"id": "4-fibcalls", "type": "predict", "title": "Сколько вызовов", "q": "Сколько раз вызовется fib при fib(5)?", "code": "calls = 0\ndef fib(n):\n    global calls\n    calls += 1\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nfib(5)\nprint(calls)", "answer": "15", "hints": ["Посчитай C(n) = 1 + C(n−1) + C(n−2).", "C(0) = C(1) = 1.", "C(2) = 3, C(3) = 5.", "C(4) = 9.", "C(5) = 1 + 9 + 5 = 15."], "expl": "C(n) = 1 + C(n−1) + C(n−2): 1, 1, 3, 5, 9, 15. С мемоизацией было бы 9."}, {"id": "4-bug", "type": "bug", "title": "Найди баг: сумма списка", "q": "Функция должна вернуть сумму элементов, но sum_from([1, 2]) падает с TypeError. Найди строку с ошибкой.", "code": ["def sum_from(arr, i=0):", "    if i == len(arr):", "        return 0", "    arr[i] + sum_from(arr, i + 1)"], "line": 3, "fixes": ["    return arr[i] + sum_from(arr, i + 1)", "    return sum_from(arr, i + 1)", "    arr[i] += sum_from(arr, i + 1)"], "fix": 0, "hints": ["Что возвращает функция, если дошла до последней строки?", "Функция без return возвращает None.", "Сумма вычисляется, но никуда не передаётся.", "Вызов выше получает None и падает на int + None.", "Добавь return в последней строке."], "expl": "Забытый return: результат вычислен и выброшен, функция вернула None, а вызов выше упал на int + None."}, {"id": "4-pow-c", "type": "complexity", "title": "Неверная быстрая степень", "q": "Назови сложность по времени и памяти стека.", "code": "def power(x, n):\n    if n == 0:\n        return 1\n    r = power(x, n // 2) * power(x, n // 2)\n    return r if n % 2 == 0 else r * x", "t": "O(n)", "m": "O(log n)", "hints": ["Сколько рекурсивных вызовов в одном вызове?", "Два вызова на n/2.", "Уровней log n, но вызовов на уровне 1, 2, 4, …", "На последнем уровне ~n вызовов, сумма ~2n.", "Время O(n), память O(log n)."], "expl": "Два вызова на половину: 1 + 2 + 4 + … ≈ n вызовов → O(n). Глубина — log n. Если сохранить результат в переменную и вызывать один раз, будет O(log n)."}, {"id": "4-order", "type": "order", "title": "Рекурсия → явный стек", "q": "Расставь шаги рецепта перевода рекурсии в цикл.", "items": ["Создать стек и положить аргументы первого вызова", "Пока стек не пуст — достать элемент", "Если это базовый случай — обработать и продолжить", "Иначе сделать работу и положить в стек аргументы «рекурсивных вызовов»"], "hints": ["Стек нужен до цикла.", "Цикл работает, пока есть необработанные элементы.", "Сначала проверяем базовый случай.", "Вместо рекурсивного вызова — push в стек.", "Создать → достать → база → push."], "expl": "Стек хранит аргументы отложенных вызовов — то же, что рекурсия хранит в стеке вызовов."}, {"id": "4-code-pow", "type": "code", "title": "Pow(x, n)", "q": "Вычисли xⁿ за O(log n). n — целое, может быть отрицательным (x⁻ⁿ = 1 / xⁿ). x ≠ 0, если n < 0.", "fn": "my_pow", "starter": "def my_pow(x, n):\n    pass\n", "leetcode": 50, "compare": "float", "tests": [{"args": [2, 10], "exp": 1024, "hidden": false}, {"args": [2, -2], "exp": 0.25, "hidden": false}, {"args": [5, 0], "exp": 1, "hidden": true, "case": "n = 0"}, {"args": [1.0001, 100000], "exp": 22015.456048527, "hidden": true, "case": "большая степень"}, {"args": [3, 5], "exp": 243, "hidden": true, "case": "нечётная степень"}], "speed": {"gen": "ARGS=[1.0, 2**31 - 1]"}, "ref": "def my_pow(x, n):\n    def p(x, n):\n        if n == 0:\n            return 1\n        h = p(x, n // 2)\n        return h * h if n % 2 == 0 else h * h * x\n    return 1 / p(x, -n) if n < 0 else p(x, n)\n", "hints": ["Наивно — n умножений. Как уменьшить задачу вдвое?", "xⁿ = (x^(n/2))².", "Для нечётного n ещё раз умножь на x.", "Вызывай рекурсию ОДИН раз и сохрани результат в переменную.", "Отрицательное n: верни 1 / power(x, −n)."], "expl": "Быстрое возведение: один вызов на n // 2 — log n уровней, O(log n). Цикл на 2³¹ умножений не проходит тест на скорость."}, {"id": "4-code-depth", "type": "code", "title": "Глубина вложенного списка", "q": "Дан вложенный список из чисел и списков. Верни максимальную глубину вложенности: [1, 2] → 1, [1, [2, [3]]] → 3, [] → 1.", "fn": "max_depth", "starter": "def max_depth(x):\n    pass\n", "tests": [{"args": [[1, 2]], "exp": 1, "hidden": false}, {"args": [[1, [2, [3]]]], "exp": 3, "hidden": false}, {"args": [[]], "exp": 1, "hidden": true, "case": "пустой список"}, {"args": [[[[]], 1]], "exp": 3, "hidden": true, "case": "пустые вложенные"}, {"args": [[1, [2], [[3, [4]]]]], "exp": 4, "hidden": true, "case": "несколько веток"}, {"args": [[[[1]], [2]]], "exp": 3, "hidden": true, "case": "глубокая ветка не последняя"}], "ref": "def max_depth(x):\n    best = 0\n    for y in x:\n        if isinstance(y, list):\n            best = max(best, max_depth(y))\n    return 1 + best\n", "hints": ["Что функция принимает и возвращает? Список → его глубина.", "Базовый случай: в списке нет вложенных списков → 1.", "Глубина = 1 + максимум глубин вложенных списков.", "Пройди по элементам и возьми max по спискам.", "best = max(best, max_depth(y)) для списков y; return 1 + best."], "expl": "Три вопроса рекурсии: depth(x) = 1 + max(depth(y)) по вложенным спискам. Ошибочная версия берёт последний, а не максимальный."}], "test": [{"q": "Чего не хватает в рекурсии, которая падает с RecursionError на любом входе?", "options": ["return", "Достижимого базового случая", "Мемоизации", "Цикла"], "answer": 1}, {"q": "Принцип доверия в рекурсии — это:", "options": ["Не тестировать код", "Считать, что вызов на меньшем входе вернёт верный ответ", "Доверять интервьюеру", "Использовать lru_cache"], "answer": 1}, {"q": "Код ПОСЛЕ рекурсивного вызова выполняется:", "options": ["Сверху вниз, до вызова", "На пути вверх, в обратном порядке", "Никогда", "Параллельно"], "answer": 1}, {"q": "T(n) = 2T(n/2) + O(n) — это
