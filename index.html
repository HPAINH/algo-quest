:", "options": ["O(n)", "O(n log n)", "O(n²)", "O(log n)"], "answer": 1}, {"q": "Почему передавать arr[1:] в рекурсию плохо?", "options": ["Это неверно работает", "Каждый срез копирует массив — O(n²) времени и памяти", "Срезы нельзя передавать", "Это быстрее индексов"], "answer": 1}, {"q": "Мемоизация fib снижает время с O(2ⁿ) до:", "options": ["O(n²)", "O(n)", "O(log n)", "O(1)"], "answer": 1}, {"q": "Почему нельзя писать def f(acc=[]) ?", "options": ["Синтаксическая ошибка", "Список создаётся один раз и копит данные между вызовами", "Это медленно", "Можно"], "answer": 1}]}, {"title": "Глава 5. Префиксные суммы и разностный массив", "short": "Префиксные суммы и разностный массив", "part": "Часть II · Базовые техники на массивах и строках", "cards": [{"title": "Идея", "html": "<p>Префиксная сумма позволяет за O(1) получить сумму любого отрезка массива после одного прохода за O(n). Вместо того чтобы каждый раз складывать элементы заново, мы один раз запоминаем накопленные суммы.<\/p><h4>Идея<\/h4><p>prefix[i] — сумма первых i элементов. Тогда сумма отрезка [l, r] включительно — это «всё до r» минус «всё до l»:<\/p>\n<pre class=\"formula\"><code>\\text{prefix}[i] = a_0 + a_1 + \\dots + a_{i-1}, \\qquad \\text{sum}(l, r) = \\text{prefix}[r+1] - \\text{prefix}[l]\n<\/code><\/pre>\n<p>prefix имеет длину n + 1 и начинается с 0 — так не нужно отдельно обрабатывать отрезки, начинающиеся с индекса 0.<\/p>"}, {"title": "Идея на пальцах: одометр", "section": "Идея", "html": "<p>В машине есть одометр — он показывает, сколько километров пройдено с самого начала. Чтобы узнать длину отрезка пути между двумя городами, не нужно складывать все участки дороги: достаточно вычесть показание одометра в первом городе из показания во втором.<\/p>\n<p>Префиксный массив — это одометр для массива: prefix[i] показывает «сколько набежало» от начала до позиции i. Сумма любого отрезка — разность двух показаний.<\/p>"}, {"title": "Трассировка построения", "section": "Идея", "html": "<p>a = [3, 1, 4, 1, 5]. Каждый новый prefix — предыдущий плюс очередной элемент:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>i<\/th>\n<th>a[i]<\/th>\n<th>prefix[i + 1] = prefix[i] + a[i]<\/th>\n<th>prefix после шага<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>—<\/td>\n<td>—<\/td>\n<td>prefix[0] = 0<\/td>\n<td>[0]<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>3<\/td>\n<td>0 + 3 = 3<\/td>\n<td>[0, 3]<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>3 + 1 = 4<\/td>\n<td>[0, 3, 4]<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>4<\/td>\n<td>4 + 4 = 8<\/td>\n<td>[0, 3, 4, 8]<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>1<\/td>\n<td>8 + 1 = 9<\/td>\n<td>[0, 3, 4, 8, 9]<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>5<\/td>\n<td>9 + 5 = 14<\/td>\n<td>[0, 3, 4, 8, 9, 14]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Смысл каждой ячейки:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Индекс в prefix<\/th>\n<th>0<\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<th>4<\/th>\n<th>5<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Значение<\/td>\n<td>0<\/td>\n<td>3<\/td>\n<td>4<\/td>\n<td>8<\/td>\n<td>9<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>Сумма каких элементов<\/td>\n<td>никаких<\/td>\n<td>a[0]<\/td>\n<td>a[0..1]<\/td>\n<td>a[0..2]<\/td>\n<td>a[0..3]<\/td>\n<td>a[0..4]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Запрос суммы на примере", "section": "Идея", "html": "<p>Сумма a[1..3] = 1 + 4 + 1 = 6. Через префиксы: «всё до индекса 3 включительно» минус «всё до индекса 1, не включая его» = prefix[4] − prefix[1] = 9 − 3 = 6.<\/p>\n<pre><code class=\"language-text\">индексы a:      0   1   2   3   4\na:            [ 3 | 1 | 4 | 1 | 5 ]\n                    └─────────┘      нужный отрезок a[1..3]\nprefix[4] = 9 :  3 + 1 + 4 + 1       всё до a[3] включительно\nprefix[1] = 3 :  3                   лишнее — то, что левее a[1]\nразность     :      1 + 4 + 1 = 6\n<\/code><\/pre>"}, {"title": "Зачем длина n + 1 и ноль в начале · Брутфорс против префиксов", "html": "<p>prefix[0] = 0 означает «сумма пустого начала». Без него отрезок, начинающийся с индекса 0, пришлось бы обрабатывать отдельным if: формула prefix[r + 1] − prefix[l] при l = 0 даёт prefix[r + 1] − 0 — работает без исключений. Сдвиг на единицу (prefix[i] = сумма <em>первых i<\/em> элементов) — плата за отсутствие особых случаев.<\/p><h4>Брутфорс против префиксов<\/h4><p>Пусть массив длины n и q запросов суммы на отрезке.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Подход<\/th>\n<th>Подготовка<\/th>\n<th>Один запрос<\/th>\n<th>Всего при n = q = 10⁵<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>складывать каждый раз<\/td>\n<td>—<\/td>\n<td>O(n)<\/td>\n<td>O(n·q) = 10¹⁰ — не успеет<\/td>\n<\/tr>\n<tr>\n<td>префиксные суммы<\/td>\n<td>O(n)<\/td>\n<td>O(1)<\/td>\n<td>O(n + q) = 2·10⁵ — мгновенно<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Цена — O(n) дополнительной памяти и важное ограничение: массив <strong>не должен меняться<\/strong> между запросами. Если элементы обновляются, префиксы придётся пересчитывать (для этого существуют дерево отрезков и дерево Фенвика — на собесах junior-уровня они встречаются редко).<\/p>"}, {"title": "Как узнать задачу · Шаблон", "html": "<ul>\n<li>Много запросов «сумма на отрезке».<\/li>\n<li>«Количество подмассивов с суммой k / суммой, кратной k».<\/li>\n<li>«Индекс равновесия» — сумма слева равна сумме справа.<\/li>\n<li>Есть отрицательные числа (скользящее окно тогда не работает, а префиксы — да).<\/li>\n<\/ul><h4>Шаблон<\/h4><pre><code class=\"language-python\">def build_prefix(a):\n    prefix = [0] * (len(a) + 1)\n    for i, x in enumerate(a):\n        prefix[i + 1] = prefix[i] + x\n    return prefix\n\na = [3, 1, 4, 1, 5]\np = build_prefix(a)          # [0, 3, 4, 8, 9, 14]\nassert p[4] - p[1] == 1 + 4 + 1   # сумма a[1..3] = 6\n<\/code><\/pre>"}, {"title": "Шаблон в задаче 303 «Range Sum Query – Immutable»", "section": "Шаблон", "html": "<p>Условие: класс получает массив, затем много раз вызывается <code>sum_range(left, right)<\/code>. Это ровно сценарий «подготовка один раз, запросы за O(1)».<\/p>\n<pre><code class=\"language-python\">class NumArray:\n    def __init__(self, nums):\n        self.prefix = [0] * (len(nums) + 1)\n        for i, x in enumerate(nums):\n            self.prefix[i + 1] = self.prefix[i] + x\n\n    def sum_range(self, left, right):\n        return self.prefix[right + 1] - self.prefix[left]\n\nna = NumArray([-2, 0, 3, -5, 2, -1])\nassert na.sum_range(0, 2) == 1      # -2 + 0 + 3\nassert na.sum_range(2, 5) == -1     # 3 - 5 + 2 - 1\n<\/code><\/pre>\n<p>На собесе в таких задачах-«классах» явно разделяй сложность: конструктор O(n), каждый запрос O(1), память O(n).<\/p>"}, {"title": "Задача 724 «Find Pivot Index»: префикс без массива", "section": "Шаблон", "html": "<p>Найти индекс i, где сумма элементов слева равна сумме справа (сам a[i] не входит ни туда, ни туда). Если таких несколько — самый левый, если нет — вернуть −1.<\/p>\n<p>Наблюдение: зная общую сумму total и сумму слева left, сумму справа считаем без отдельного массива: right = total − left − a[i]. Значит, достаточно одной переменной вместо всего prefix.<\/p>\n<pre><code class=\"language-python\">def pivot_index(nums):\n    total = sum(nums)\n    left = 0\n    for i, x in enumerate(nums):\n        if left == total - left - x:\n            return i\n        left += x                   # обновляем ПОСЛЕ проверки: x не входит в «слева»\n    return -1\n\nassert pivot_index([1, 7, 3, 6, 5, 6]) == 3\nassert pivot_index([1, 2, 3]) == -1\nassert pivot_index([2, 1, -1]) == 0   # слева пусто (0), справа 1 + (-1) = 0\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> на [1, 7, 3, 6, 5, 6], total = 28:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>i<\/th>\n<th>x<\/th>\n<th>left<\/th>\n<th>right = 28 − left − x<\/th>\n<th>Равны?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>27<\/td>\n<td>нет<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>7<\/td>\n<td>1<\/td>\n<td>20<\/td>\n<td>нет<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>3<\/td>\n<td>8<\/td>\n<td>17<\/td>\n<td>нет<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>6<\/td>\n<td>11<\/td>\n<td>11<\/td>\n<td><strong>да → 3<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Время O(n), память O(1). Общий урок: если префиксы нужны только <strong>по порядку, слева направо<\/strong>, массив не нужен — хватает бегущей суммы.<\/p>"}, {"title": "Ключевой приём: префиксы + хеш-таблица", "html": "<p>Задача 560 «Subarray Sum Equals K»: сколько непрерывных подмассивов имеют сумму k. Брутфорс по всем парам (l, r) — O(n²).<\/p>\n<p>Наблюдение: подмассив (l, r] имеет сумму k, если prefix[r] − prefix[l] = k, то есть prefix[l] = prefix[r] − k. Значит, идя слева направо, достаточно знать, <em>сколько раз раньше<\/em> встречалась сумма prefix − k. Это хранится в словаре.<\/p>\n<pre><code class=\"language-python\">from collections import defaultdict\n\ndef subarray_sum(nums, k):\n    seen = defaultdict(int)\n    seen[0] = 1          # пустой префикс: подмассив может начинаться с индекса 0\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        ans += seen[pref - k]\n        seen[pref] += 1\n    return ans\n<\/code><\/pre>"}, {"title": "Почему это работает: вывод по шагам", "section": "Ключевой приём: префиксы + хеш-таблица", "html": "<ol>\n<li><strong>Брутфорс.<\/strong> Подмассив задаётся началом l и концом r. Перебор всех пар и подсчёт суммы — O(n³); с префиксами сумма пары за O(1), итого O(n²).<\/li>\n<li><strong>Переписываем условие.<\/strong> Сумма a[l..r] = prefix[r + 1] − prefix[l]. Условие «сумма равна k» превращается в: prefix[l] = prefix[r + 1] − k.<\/li>\n<li><strong>Фиксируем правый конец.<\/strong> Для текущего конца значение prefix[r + 1] известно (это бегущая сумма pref). Вопрос «сколько подходящих начал l» превращается в вопрос «сколько раз среди <em>предыдущих<\/em> префиксов встречалось число pref − k».<\/li>\n<li><strong>Отвечаем за O(1).<\/strong> Храним словарь «значение префикса → сколько раз встречалось». Проверка — один поиск в словаре.<\/li>\n<\/ol>\n<p>Итог: один проход, на каждом шаге O(1) операций — <strong>O(n) время, O(n) память<\/strong>.<\/p>"}, {"title": "Это та же идея, что Two Sum", "section": "Ключевой приём: префиксы + хеш-таблица", "html": "<p>В Two Sum (глава 8) для каждого x мы ищем среди <em>прошлых<\/em> элементов число target − x. Здесь для каждого префикса pref ищем среди <em>прошлых<\/em> префиксов число pref − k. Разница только в том, что вместо самих элементов в словарь кладём префиксные суммы, а вместо «есть/нет» считаем количество.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Two Sum<\/th>\n<th>Subarray Sum = K<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Что перебираем<\/td>\n<td>элементы x<\/td>\n<td>префиксы pref<\/td>\n<\/tr>\n<tr>\n<td>Что ищем в прошлом<\/td>\n<td>target − x<\/td>\n<td>pref − k<\/td>\n<\/tr>\n<tr>\n<td>Что храним в словаре<\/td>\n<td>значение → индекс<\/td>\n<td>префикс → сколько раз<\/td>\n<\/tr>\n<tr>\n<td>Ответ<\/td>\n<td>пара индексов<\/td>\n<td>сумма найденных количеств<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Этот мостик полезно проговорить на собесе: он показывает, что ты не заучил решение, а видишь общий приём.<\/p>"}, {"title": "Почему скользящее окно здесь ломается", "section": "Ключевой приём: префиксы + хеш-таблица", "html": "<p>Окно (глава 7) сжимает левую границу, когда сумма стала слишком большой, — в расчёте, что расширение окна только увеличивает сумму. С отрицательными числами это неверно.<\/p>\n<p>Пример: nums = [2, −1], k = 1. Правильный ответ — 1 (весь массив: 2 − 1 = 1).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг окна<\/th>\n<th>Окно<\/th>\n<th>Сумма<\/th>\n<th>Решение окна<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>r = 0<\/td>\n<td>[2]<\/td>\n<td>2<\/td>\n<td>больше k → сжать<\/td>\n<\/tr>\n<tr>\n<td>сжали<\/td>\n<td>[]<\/td>\n<td>0<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>r = 1<\/td>\n<td>[−1]<\/td>\n<td>−1<\/td>\n<td>меньше k → расширять дальше некуда<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Окно выкинуло 2 раньше, чем пришло −1, которое «исправило бы» сумму, и ответ 0 вместо 1. Префиксы + словарь не делают предположений о знаках, поэтому работают всегда.<\/p>"}, {"title": "Трассировка: nums = [1, 2, 1, 2, 1], k = 3", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>x<\/th>\n<th>pref<\/th>\n<th>ищем pref − k<\/th>\n<th>найдено<\/th>\n<th>ans<\/th>\n<th>seen после шага<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>−2<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>{0:1, 1:1}<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>3<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>+ {3:1}<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>4<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>+ {4:1}<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>6<\/td>\n<td>3<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>+ {6:1}<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>7<\/td>\n<td>4<\/td>\n<td>1<\/td>\n<td>4<\/td>\n<td>+ {7:1}<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ответ 4: [1,2], [2,1], [1,2], [2,1]. Время O(n), память O(n).<\/p>"}, {"title": "Вариации приёма «префикс + словарь»", "html": "<p>Один и тот же каркас решает целое семейство задач. Меняется только то, <strong>что<\/strong> кладём в словарь и <strong>что<\/strong> ищем.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Ключ словаря<\/th>\n<th>Значение<\/th>\n<th>Что ищем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>количество подмассивов с суммой k<\/td>\n<td>префикс<\/td>\n<td>сколько раз встречался<\/td>\n<td>pref − k<\/td>\n<\/tr>\n<tr>\n<td>самый длинный подмассив с суммой k<\/td>\n<td>префикс<\/td>\n<td><strong>первый<\/strong> индекс<\/td>\n<td>pref − k<\/td>\n<\/tr>\n<tr>\n<td>количество подмассивов с суммой, кратной k<\/td>\n<td><strong>остаток<\/strong> префикса по k<\/td>\n<td>сколько раз<\/td>\n<td>тот же остаток<\/td>\n<\/tr>\n<tr>\n<td>самый длинный отрезок с равным числом 0 и 1<\/td>\n<td>префикс после замены 0 → −1<\/td>\n<td>первый индекс<\/td>\n<td>тот же префикс (сумма 0)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "1. Самый длинный подмассив с суммой k", "section": "Вариации приёма «префикс + словарь»", "html": "<p>Теперь нужна не сумма количеств, а максимальная длина. Длина отрезка = i − (индекс начала), и чтобы она была максимальной, начало должно быть как можно левее. Поэтому для каждого значения префикса храним <strong>первый<\/strong> индекс, где он появился, и не перезаписываем его.<\/p>\n<pre><code class=\"language-python\">def longest_subarray_sum_k(nums, k):\n    first = {0: -1}               # пустой префикс «стоит» перед индексом 0\n    pref = best = 0\n    for i, x in enumerate(nums):\n        pref += x\n        if pref - k in first:\n            best = max(best, i - first[pref - k])\n        if pref not in first:     # запоминаем только первое появление\n            first[pref] = i\n    return best\n\nassert longest_subarray_sum_k([1, -1, 5, -2, 3], 3) == 4   # [1, -1, 5, -2]\n<\/code><\/pre>"}, {"title": "2. Сумма, кратная k (задача 974)", "section": "Вариации приёма «префикс + словарь»", "html": "<p>Наблюдение из арифметики: разность двух чисел делится на k тогда и только тогда, когда у них <strong>одинаковые остатки<\/strong> от деления на k. Значит, ищем пары префиксов с одинаковым остатком.<\/p>\n<pre><code class=\"language-python\">def subarrays_div_by_k(nums, k):\n    count = {0: 1}\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        r = pref % k            # в Python остаток всегда в [0, k), даже для отрицательных\n        ans += count.get(r, 0)\n        count[r] = count.get(r, 0) + 1\n    return ans\n\nassert subarrays_div_by_k([4, 5, 0, -2, -3, 1], 5) == 7\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> на [4, 5, 0, −2, −3, 1], k = 5:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>x<\/th>\n<th>pref<\/th>\n<th>pref % 5<\/th>\n<th>count[r] до шага<\/th>\n<th>ans<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>9<\/td>\n<td>4<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>9<\/td>\n<td>4<\/td>\n<td>2<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>−2<\/td>\n<td>7<\/td>\n<td>2<\/td>\n<td>0<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>−3<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<td>3<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>5<\/td>\n<td>0<\/td>\n<td>1 (пустой префикс)<\/td>\n<td>7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Важно для других языков: в Java и C++ <code>-3 % 5<\/code> даёт −3, и остаток приходится исправлять <code>(pref % k + k) % k<\/code>. В Python этого делать не нужно, но на собесе стоит упомянуть, что ты об этом знаешь.<\/p>"}, {"title": "3. Равное число 0 и 1 (задача 525)", "section": "Вариации приёма «префикс + словарь»", "html": "<p>Заменим каждый 0 на −1. Тогда «нулей и единиц поровну» ⇔ «сумма отрезка равна 0» ⇔ «два префикса равны». Это вариация 1 с k = 0.<\/p>\n<pre><code class=\"language-python\">def find_max_length(nums):\n    first = {0: -1}\n    pref = best = 0\n    for i, x in enumerate(nums):\n        pref += 1 if x == 1 else -1\n        if pref in first:\n            best = max(best, i - first[pref])\n        else:\n            first[pref] = i\n    return best\n\nassert find_max_length([0, 1, 0]) == 2\nassert find_max_length([0, 0, 1, 0, 0, 0, 1, 1]) == 6\n<\/code><\/pre>\n<p>Приём «заменить значения так, чтобы условие стало суммой» встречается часто — запомни его.<\/p>"}, {"title": "4. Префиксы не только для сумм: задача 238", "section": "Вариации приёма «префикс + словарь»", "html": "<p>«Product of Array Except Self»: для каждого i вернуть произведение всех элементов, кроме a[i], <strong>без деления<\/strong> и за O(n). Ответ для i = (произведение всех левее i) × (произведение всех правее i). Это префиксное и суффиксное произведения.<\/p>\n<pre><code class=\"language-python\">def product_except_self(nums):\n    n = len(nums)\n    res = [1] * n\n    left = 1\n    for i in range(n):              # проход слева: res[i] = произведение левее i\n        res[i] = left\n        left *= nums[i]\n    right = 1\n    for i in range(n - 1, -1, -1):  # проход справа: домножаем на произведение правее i\n        res[i] *= right\n        right *= nums[i]\n    return res\n\nassert product_except_self([1, 2, 3, 4]) == [24, 12, 8, 6]\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>i<\/th>\n<th>nums[i]<\/th>\n<th>левее (1-й проход)<\/th>\n<th>правее (2-й проход)<\/th>\n<th>res[i]<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>2·3·4 = 24<\/td>\n<td>24<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>2<\/td>\n<td>1<\/td>\n<td>3·4 = 12<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>3<\/td>\n<td>1·2 = 2<\/td>\n<td>4<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>4<\/td>\n<td>1·2·3 = 6<\/td>\n<td>1<\/td>\n<td>6<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Время O(n), дополнительная память O(1) (выходной массив не считается). Накапливать префиксом можно любую операцию: сумму, произведение, XOR, максимум. Но получить значение на отрезке «вычитанием двух префиксов» можно только для обратимых операций — суммы и XOR; для максимума так не выйдет.<\/p>"}, {"title": "Разностный массив", "html": "<p>Обратная задача: много операций «прибавить v ко всем элементам на отрезке [l, r]», а значения нужны в конце. Вместо O(длины отрезка) на операцию делаем O(1): diff[l] += v, diff[r + 1] −= v, а в конце восстанавливаем массив префиксной суммой по diff.<\/p>\n<pre><code class=\"language-python\">def apply_ranges(n, updates):     # updates: список (l, r, v)\n    diff = [0] * (n + 1)\n    for l, r, v in updates:\n        diff[l] += v\n        diff[r + 1] -= v\n    res, cur = [], 0\n    for i in range(n):\n        cur += diff[i]\n        res.append(cur)\n    return res\n\nassert apply_ranges(5, [(1, 3, 2), (2, 4, 3)]) == [0, 2, 5, 5, 3]\n<\/code><\/pre>"}, {"title": "Идея разностного массива: выключатели", "section": "Разностный массив", "html": "<p>Представь коридор с лампами. Операция «прибавить v на отрезке [l, r]» — это как включить в точке l прибавку v и выключить её после r. Вместо того чтобы обходить все лампы отрезка, мы ставим только две отметки: «+v здесь начинается» и «−v здесь заканчивается». В конце идём по коридору слева направо и суммируем отметки — бегущая сумма и есть итоговое значение каждой позиции.<\/p>\n<p>Префиксная сумма и разностный массив — взаимно обратные операции: префикс от diff даёт массив, а diff — это разности соседних элементов массива.<\/p>"}, {"title": "Трассировка", "section": "Разностный массив", "html": "<p>n = 5, обновления: (1, 3, +2) и (2, 4, +3).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>diff (индексы 0–5)<\/th>\n<th>Пояснение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>начало<\/td>\n<td>[0, 0, 0, 0, 0, 0]<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>(1, 3, +2)<\/td>\n<td>[0, 2, 0, 0, −2, 0]<\/td>\n<td>+2 с позиции 1, −2 с позиции 4<\/td>\n<\/tr>\n<tr>\n<td>(2, 4, +3)<\/td>\n<td>[0, 2, 3, 0, −2, −3]<\/td>\n<td>+3 с позиции 2, −3 с позиции 5<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Восстанавливаем бегущей суммой:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>i<\/th>\n<th>diff[i]<\/th>\n<th>cur = cur + diff[i]<\/th>\n<th>Проверка: какие прибавки действуют<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>никаких<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>+2<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>3<\/td>\n<td>5<\/td>\n<td>+2, +3<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>0<\/td>\n<td>5<\/td>\n<td>+2, +3<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>−2<\/td>\n<td>3<\/td>\n<td>+3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Результат [0, 2, 5, 5, 3]. diff имеет длину n + 1, чтобы запись в diff[r + 1] при r = n − 1 не выходила за границы.<\/p>\n<p><strong>Сложность.<\/strong> Наивно: каждое обновление O(длины отрезка), всего O(n·q). С diff: каждое обновление O(1), восстановление O(n), всего O(n + q).<\/p>"}, {"title": "Задача 1094 «Car Pooling»", "section": "Разностный массив", "html": "<p>Машина едет по прямой. Поездка [num, from, to]: num пассажиров садятся в точке from и выходят в точке to. Можно ли выполнить все поездки, если в машине не больше capacity мест?<\/p>\n<p>Это разностный массив по точкам дороги: в from число пассажиров растёт на num, в to — уменьшается. Тонкость: в точке to пассажиры <strong>уже вышли<\/strong>, поэтому отрезок занятых мест — [from, to − 1], и минус ставится в to, а не в to + 1.<\/p>\n<pre><code class=\"language-python\">def car_pooling(trips, capacity):\n    diff = [0] * 1001                 # по условию точки от 0 до 1000\n    for num, start, end in trips:\n        diff[start] += num\n        diff[end] -= num              # в точке end уже вышли\n    load = 0\n    for change in diff:\n        load += change\n        if load &gt; capacity:\n            return False\n    return True\n\nassert car_pooling([[2, 1, 5], [3, 3, 7]], 4) is False   # в точках 3–4 едут 5 человек\nassert car_pooling([[2, 1, 5], [3, 3, 7]], 5) is True\nassert car_pooling([[2, 1, 5], [3, 5, 7]], 3) is True    # вторые садятся, когда первые вышли\n<\/code><\/pre>\n<p>Время O(n + L), где L — длина дороги (1001), память O(L). Если координаты огромные (до 10⁹), массив не завести — тогда сортируют события (точка, изменение) и идут по ним; это приём sweep line из главы 11.<\/p>"}, {"title": "Двумерные префиксы (кратко)", "html": "<p>Для матрицы P[i][j] — сумма прямоугольника от (0,0) до (i−1, j−1). Сумма любого прямоугольника — комбинация четырёх значений P по формуле включений-исключений. Задача 304 «Range Sum Query 2D».<\/p><h4>Двумерные префиксы подробно<\/h4><p>P[i][j] — сумма прямоугольника из первых i строк и первых j столбцов (тот же сдвиг на единицу, что в одномерном случае: P имеет размер (m + 1) × (n + 1), нулевые строка и столбец — нули).<\/p>\n<p><strong>Построение.<\/strong> Новая клетка = значение матрицы + прямоугольник сверху + прямоугольник слева − их пересечение, которое посчитано дважды:<\/p>\n<pre class=\"formula\"><code>P[i+1][j+1] = M[i][j] + P[i][j+1] + P[i+1][j] - P[i][j]\n<\/code><\/pre>\n<p><strong>Запрос<\/strong> суммы прямоугольника с углами (r1, c1) и (r2, c2) включительно: большой прямоугольник до правого нижнего угла минус полоса сверху, минус полоса слева, плюс угол, вычтенный дважды:<\/p>\n<pre class=\"formula\"><code>\\text{sum} = P[r_2+1][c_2+1] - P[r_1][c_2+1] - P[r_2+1][c_1] + P[r_1][c_1]\n<\/code><\/pre>\n<pre><code class=\"language-text\">┌─────────┬───────────┐\n│    A    │     B     │   A + B        = P[r1][c2+1]     (полоса сверху)\n├─────────┼───────────┤   A + C        = P[r2+1][c1]     (полоса слева)\n│    C    │  НУЖНОЕ   │   A            = P[r1][c1]       (угол)\n│         │           │   A+B+C+НУЖНОЕ = P[r2+1][c2+1]\n└─────────┴───────────┘\nНУЖНОЕ = (A+B+C+НУЖНОЕ) − (A+B) − (A+C) + A\n<\/code><\/pre>\n<pre><code class=\"language-python\">def build_prefix_2d(matrix):\n    m, n = len(matrix), len(matrix[0])\n    P = [[0] * (n + 1) for _ in range(m + 1)]\n    for i in range(m):\n        for j in range(n):\n            P[i + 1][j + 1] = matrix[i][j] + P[i][j + 1] + P[i + 1][j] - P[i][j]\n    return P\n\ndef region_sum(P, r1, c1, r2, c2):\n    return P[r2 + 1][c2 + 1] - P[r1][c2 + 1] - P[r2 + 1][c1] + P[r1][c1]\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> для матрицы<\/p>\n<pre><code class=\"language-text\">1 2 3\n4 5 6\n7 8 9\n<\/code><\/pre>\n<p>P (строка 0 и столбец 0 — нули):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>P<\/th>\n<th>0<\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>0<\/strong><\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>0<\/td>\n<td>5<\/td>\n<td>12<\/td>\n<td>21<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>0<\/td>\n<td>12<\/td>\n<td>27<\/td>\n<td>45<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Проверка одной клетки: P[2][2] = M[1][1] + P[1][2] + P[2][1] − P[1][1] = 5 + 3 + 5 − 1 = 12 = 1 + 2 + 4 + 5. Верно.<\/p>\n<p>Запрос правого нижнего квадрата 2 × 2, (r1, c1) = (1, 1), (r2, c2) = (2, 2): P[3][3] − P[1][3] − P[3][1] + P[1][1] = 45 − 6 − 12 + 1 = 28 = 5 + 6 + 8 + 9. Верно.<\/p>\n<p>Построение O(m·n), запрос O(1), память O(m·n).<\/p>"}, {"title": "Сложность · Типичные ошибки", "html": "<p>Построение O(n), запрос O(1), память O(n). Разностный массив: O(1) на обновление, O(n) на восстановление.<\/p><h4>Типичные ошибки<\/h4><ul>\n<li>Забыть <code>seen[0] = 1<\/code> — теряются подмассивы, начинающиеся с начала.<\/li>\n<li>Добавить <code>seen[pref] += 1<\/code> <em>до<\/em> проверки — подмассив нулевой длины засчитается при k = 0.<\/li>\n<li>Путать prefix длины n и n + 1 → ошибки на единицу в индексах.<\/li>\n<\/ul>"}, {"title": "Каждая ошибка на коде", "section": "Типичные ошибки", "html": "<p><strong>1. Забыт seen[0] = 1.<\/strong><\/p>\n<pre><code class=\"language-python\">def subarray_sum_bug(nums, k):\n    seen = defaultdict(int)          # нет seen[0] = 1\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        ans += seen[pref - k]\n        seen[pref] += 1\n    return ans\n\nsubarray_sum_bug([3], 3)   # 0, а правильно 1\n<\/code><\/pre>\n<p>Подмассив [3] начинается с индекса 0, и для него нужен «префикс до начала» со значением 0. Без seen[0] = 1 теряются все подмассивы, начинающиеся с начала массива.<\/p>\n<p><strong>2. Запись в словарь до проверки.<\/strong><\/p>\n<pre><code class=\"language-python\">    for x in nums:\n        pref += x\n        seen[pref] += 1              # записали текущий префикс...\n        ans += seen[pref - k]        # ...и при k = 0 нашли его же\n\n# nums = [1, 2], k = 0: ответ 2, а правильно 0\n<\/code><\/pre>\n<p>При k = 0 ищем pref − 0 = pref — и находим только что записанный текущий префикс, то есть «подмассив» нулевой длины. Правило: сначала ищем среди <strong>прошлых<\/strong>, потом добавляем текущий — как в Two Sum.<\/p>\n<p><strong>3. Префикс длины n и тихая ошибка отрицательного индекса.<\/strong><\/p>\n<pre><code class=\"language-python\">a = [3, 1, 4, 1, 5]\ninclusive = [3, 4, 8, 9, 14]          # inclusive[i] = сумма a[0..i]\n\ndef range_sum(l, r):\n    return inclusive[r] - inclusive[l - 1]\n\nrange_sum(1, 3)   # 9 - 3 = 6, верно\nrange_sum(0, 2)   # 8 - inclusive[-1] = 8 - 14 = -6, а правильно 8\n<\/code><\/pre>\n<p>При l = 0 индекс l − 1 = −1, и Python молча берёт <strong>последний<\/strong> элемент вместо ошибки. Вот почему стандарт — prefix длины n + 1 с нулём в начале.<\/p>\n<p><strong>4. diff длины n.<\/strong> Запись <code>diff[r + 1] -= v<\/code> при r = n − 1 выйдет за границы — IndexError. Длина diff всегда n + 1 (или обновление с проверкой <code>if r + 1 &lt; n<\/code>).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ошибка<\/th>\n<th>Когда проявляется<\/th>\n<th>Тест, который её ловит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>нет seen[0] = 1<\/td>\n<td>подмассив с начала массива<\/td>\n<td>[3], k = 3 → 1<\/td>\n<\/tr>\n<tr>\n<td>запись до проверки<\/td>\n<td>k = 0<\/td>\n<td>[1, 2], k = 0 → 0<\/td>\n<\/tr>\n<tr>\n<td>prefix длины n<\/td>\n<td>отрезок с l = 0<\/td>\n<td>сумма a[0..2]<\/td>\n<\/tr>\n<tr>\n<td>diff длины n<\/td>\n<td>отрезок до конца массива<\/td>\n<td>обновление с r = n − 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Реши на LeetCode", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>303. Range Sum Query – Immutable<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>724. Find Pivot Index<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>560. Subarray Sum Equals K<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>238. Product of Array Except Self<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>974. Subarray Sums Divisible by K<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>1094. Car Pooling (разностный массив)<\/td>\n<td>M<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "viz": "prefix", "tasks": [{"id": "5-trace", "type": "trace", "title": "Трассировка: префикс + словарь", "q": "Заполни пустые клетки для subarray_sum([1, 2, 1, 2, 1], k = 3).", "code": "def subarray_sum(nums, k):\n    seen = {0: 1}\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        ans += seen.get(pref - k, 0)\n        seen[pref] = seen.get(pref, 0) + 1\n    return ans\n", "columns": ["x", "pref", "pref − k", "найдено", "ans"], "rows": [[1, 1, -2, 0, 0], [2, 3, 0, null, null], [1, null, null, null, 2], [2, 6, null, 1, null], [1, null, 4, null, null]], "answer": [[1, 1, -2, 0, 0], [2, 3, 0, 1, 1], [1, 4, 1, 1, 2], [2, 6, 3, 1, 3], [1, 7, 4, 1, 4]], "hints": ["pref — бегущая сумма.", "«Найдено» — сколько раз раньше встречался pref − k.", "seen стартует с {0: 1}.", "На x = 2 (второй шаг) pref − k = 0, а 0 есть в seen один раз.", "pref: 1, 3, 4, 6, 7; ans: 0, 1, 2, 3, 4."], "expl": "pref растёт: 1, 3, 4, 6, 7. Каждый раз pref − k находится в словаре ровно один раз (кроме первого шага), поэтому ответ 4."}, {"id": "5-code-560", "type": "code", "title": "Подмассивы с суммой k", "q": "Верни количество непрерывных подмассивов nums с суммой ровно k. Числа могут быть отрицательными, n до 10⁵.", "fn": "subarray_sum", "starter": "def subarray_sum(nums, k):\n    pass\n", "leetcode": 560, "tests": [{"args": [[1, 1, 1], 2], "exp": 2, "hidden": false}, {"args": [[1, 2, 3], 3], "exp": 2, "hidden": false}, {"args": [[3], 3], "exp": 1, "hidden": true, "case": "подмассив с начала"}, {"args": [[1, 2], 0], "exp": 0, "hidden": true, "case": "k = 0"}, {"args": [[1, -1, 0], 0], "exp": 3, "hidden": true, "case": "отрицательные и нули"}, {"args": [[2, -1], 1], "exp": 1, "hidden": true, "case": "окно бы ошиблось"}], "speed": {"gen": "import random\nrandom.seed(2)\nARGS=[[random.randint(-50,50) for _ in range(100000)], 7]"}, "ref": "def subarray_sum(nums, k):\n    seen = {0: 1}\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        ans += seen.get(pref - k, 0)\n        seen[pref] = seen.get(pref, 0) + 1\n    return ans\n", "hints": ["Есть отрицательные — окно не подойдёт.", "Сумма отрезка = prefix[r] − prefix[l].", "Для текущего pref ищи, сколько раз раньше был pref − k.", "Храни словарь «префикс → сколько раз»; начальное значение {0: 1}.", "Сначала ans += seen[pref − k], потом seen[pref] += 1."], "expl": "Префиксы + словарь: O(n) времени и памяти. Без {0: 1} теряются подмассивы от начала; двойной цикл O(n²) не проходит тест на скорость."}, {"id": "5-gap", "type": "gap", "title": "Заполни пропуск", "q": "Впиши пропущенную строку так, чтобы функция работала верно.", "fn": "subarray_sum", "template": "def subarray_sum(nums, k):\n    seen = {}\n    ____\n    pref = ans = 0\n    for x in nums:\n        pref += x\n        ans += seen.get(pref - k, 0)\n        seen[pref] = seen.get(pref, 0) + 1\n    return ans\n", "tests": [{"args": [[3], 3], "exp": 1, "hidden": false}, {"args": [[1, 1, 1], 2], "exp": 2, "hidden": false}, {"args": [[1, 2, 3], 6], "exp": 1, "hidden": true, "case": "весь массив"}], "ref_fill": "seen[0] = 1", "hints": ["Чего не хватает словарю в начале?", "Подмассив может начинаться с индекса 0.", "Для него нужен «префикс до начала».", "Его значение — 0, и он встречался 1 раз.", "seen[0] = 1"], "expl": "seen[0] = 1 — «пустой префикс». Без него теряются все подмассивы, начинающиеся с начала массива."}, {"id": "5-code-724", "type": "code", "title": "Индекс равновесия", "q": "Верни самый левый индекс i, где сумма элементов слева равна сумме справа (nums[i] не входит ни туда, ни туда). Если такого нет — −1.", "fn": "pivot_index", "starter": "def pivot_index(nums):\n    pass\n", "leetcode": 724, "tests": [{"args": [[1, 7, 3, 6, 5, 6]], "exp": 3, "hidden": false}, {"args": [[1, 2, 3]], "exp": -1, "hidden": false}, {"args": [[2, 1, -1]], "exp": 0, "hidden": true, "case": "слева пусто"}, {"args": [[0]], "exp": 0, "hidden": true, "case": "один элемент"}, {"args": [[-1, -1, 0, 1, 1, 0]], "exp": 5, "hidden": true, "case": "справа пусто"}], "speed": {"gen": "ARGS=[[1]*100000]"}, "ref": "def pivot_index(nums):\n    total = sum(nums)\n    left = 0\n    for i, x in enumerate(nums):\n        if left == total - left - x:\n            return i\n        left += x\n    return -1\n", "hints": ["Брутфорс считает суммы слева и справа заново — O(n²).", "Сумма справа = total − left − nums[i].", "Достаточно бегущей суммы left.", "Обновляй left ПОСЛЕ проверки.", "total = sum(nums); for i, x: if left == total − left − x: return i; left += x."], "expl": "Одна переменная вместо массива префиксов: O(n) времени, O(1) памяти."}, {"id": "5-bug", "type": "bug", "title": "Найди баг: k = 0", "q": "subarray_sum([1, 2], 0) возвращает 2 вместо 0. Найди строку с ошибкой.", "code": ["def subarray_sum(nums, k):", "    seen = {0: 1}", "    pref = ans = 0", "    for x in nums:", "        pref += x", "        seen[pref] = seen.get(pref, 0) + 1", "        ans += seen.get(pref - k, 0)", "    return ans"], "line": 5, "fixes": ["Поменять местами строки 6 и 7: сначала искать, потом записывать", "Убрать seen = {0: 1}", "Заменить pref - k на pref + k"], "fix": 0, "hints": ["При k = 0 что ищем? pref − 0 = pref.", "А pref только что записали в словарь.", "Значит, находим самих себя — «подмассив» нулевой длины.", "Ищем только среди прошлых префиксов.", "Сначала поиск, потом запись — как в Two Sum."], "expl": "Запись до проверки: при k = 0 находится только что добавленный текущий префикс. Сначала ищем среди прошлых, потом добавляем."}, {"id": "5-predict-diff", "type": "predict", "title": "Разностный массив", "q": "Что выведет код?", "code": "n = 5\ndiff = [0] * (n + 1)\nfor l, r, v in [(1, 3, 2), (2, 4, 3)]:\n    diff[l] += v\n    diff[r + 1] -= v\nres, cur = [], 0\nfor i in range(n):\n    cur += diff[i]\n    res.append(cur)\nprint(res)", "answer": "[0, 2, 5, 5, 3]", "hints": ["Первое обновление прибавляет 2 к позициям 1–3.", "Второе прибавляет 3 к позициям 2–4.", "Позиция 0 не затронута.", "Позиции 2 и 3 получают оба обновления.", "[0, 2, 5, 5, 3]."], "expl": "Отметки +v в l и −v в r + 1, затем бегущая сумма: [0, 2, 5, 5, 3]."}, {"id": "5-code-238", "type": "code", "title": "Произведение кроме себя", "q": "Верни список, где ответ[i] — произведение всех элементов nums, кроме nums[i]. Без деления, за O(n).", "fn": "product_except_self", "starter": "def product_except_self(nums):\n    pass\n", "leetcode": 238, "tests": [{"args": [[1, 2, 3, 4]], "exp": [24, 12, 8, 6], "hidden": false}, {"args": [[-1, 1, 0, -3, 3]], "exp": [0, 0, 9, 0, 0], "hidden": false}, {"args": [[0, 0]], "exp": [0, 0], "hidden": true, "case": "два нуля"}, {"args": [[2, 3]], "exp": [3, 2], "hidden": true, "case": "два элемента"}], "speed": {"gen": "ARGS=[[1]*100000]"}, "ref": "def product_except_self(nums):\n    n = len(nums)\n    res = [1] * n\n    left = 1\n    for i in range(n):\n        res[i] = left\n        left *= nums[i]\n    right = 1\n    for i in range(n - 1, -1, -1):\n        res[i] *= right\n        right *= nums[i]\n    return res\n", "hints": ["Ответ = (произведение слева) × (произведение справа).", "Это префиксное и суффиксное произведения.", "Первый проход слева: res[i] = произведение левее i.", "Второй проход справа: домножай на произведение правее i.", "Две бегущие переменные left и right."], "expl": "Префикс × суффикс за два прохода: O(n) времени, O(1) доп. памяти. Деление ломается на нулях."}, {"id": "5-tech", "type": "choice", "title": "Окно или префиксы?", "q": "«Сколько подмассивов имеют сумму ровно k? Числа от −10⁴ до 10⁴». Что выбрать?", "options": ["Скользящее окно", "Префиксные суммы + словарь", "Два указателя после сортировки", "Бинарный поиск"], "answer": 1, "hints": ["Есть ли отрицательные числа?", "С отрицательными сумма окна не монотонна.", "Окно может выкинуть элемент раньше, чем придёт «исправляющий».", "Нужен приём, не зависящий от знаков.", "Префиксы + словарь."], "expl": "Отрицательные ломают монотонность, окно ошибается. Префиксы + словарь работают для любых знаков. Сортировка разрушает непрерывность отрезков."}], "test": [{"q": "prefix = [0, 3, 4, 8, 9, 14]. Сумма a[1..3] равна:", "options": ["prefix[3] − prefix[1]", "prefix[4] − prefix[1]", "prefix[4] − prefix[0]", "prefix[3]"], "answer": 1}, {"q": "Зачем prefix длины n + 1 с нулём в начале?", "options": ["Для скорости", "Чтобы отрезки с l = 0 не требовали отдельного случая", "Так требует Python", "Чтобы хранить n"], "answer": 1}, {"q": "Подмассив с суммой, кратной k, — это пара префиксов с:", "options": ["Одинаковыми значениями", "Одинаковыми остатками от деления на k", "Разницей k", "Суммой k"], "answer": 1}, {"q": "Самый длинный подмассив с суммой k: что хранить в словаре?", "options": ["Последний индекс префикса", "Первый индекс префикса", "Количество", "Сумму"], "answer": 1}, {"q": "Разностный массив делает обновление отрезка за:", "options": ["O(длины отрезка)", "O(1)", "O(log n)", "O(n)"], "answer": 1}, {"q": "Запрос суммы прямоугольника по 2D-префиксам стоит:", "options": ["O(1)", "O(m·n)", "O(m + n)", "O(log n)"], "answer": 0}, {"q": "Equal 0 и 1 (задача 525) сводится к сумме 0, если:", "options": ["Удалить нули", "Заменить 0 на −1", "Отсортировать", "Умножить на 2"], "answer": 1}]}, {"title": "Глава 6. Два указателя", "short": "Два указателя", "part": "Часть II · Базовые техники на массивах и строках", "cards": [{"title": "Интуиция: таблица всех пар", "html": "<p>Два указателя заменяют перебор всех пар O(n²) одним проходом O(n): два индекса движутся по массиву, и на каждом шаге хотя бы один сдвигается, отбрасывая заведомо бесполезные варианты.<\/p><h4>Интуиция: таблица всех пар<\/h4><p>Возьмём отсортированный a = [1, 3, 4, 6, 8] и target = 10. Брутфорс проверяет все пары (i, j), i &lt; j — запишем их суммы в таблицу:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>i \\ j<\/th>\n<th>j=1 (3)<\/th>\n<th>j=2 (4)<\/th>\n<th>j=3 (6)<\/th>\n<th>j=4 (8)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>i=0 (1)<\/strong><\/td>\n<td>4<\/td>\n<td>5<\/td>\n<td>7<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td><strong>i=1 (3)<\/strong><\/td>\n<td><\/td>\n<td>7<\/td>\n<td>9<\/td>\n<td>11<\/td>\n<\/tr>\n<tr>\n<td><strong>i=2 (4)<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><strong>10<\/strong><\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td><strong>i=3 (6)<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>14<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Поскольку массив отсортирован, в каждой строке суммы растут <strong>слева направо<\/strong>, а в каждом столбце — <strong>сверху вниз<\/strong>. Это ключевое свойство.<\/p>\n<p>Встречные указатели начинают с правого верхнего угла (l = 0, r = 4) и на каждом шаге вычёркивают целую строку или столбец:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>(l, r)<\/th>\n<th>Сумма<\/th>\n<th>Вывод<\/th>\n<th>Что вычёркиваем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>(0, 4)<\/td>\n<td>9 &lt; 10<\/td>\n<td>это самая большая сумма в строке 0 — вся строка меньше 10<\/td>\n<td>строку l = 0 → l = 1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>(1, 4)<\/td>\n<td>11 &gt; 10<\/td>\n<td>это самая маленькая сумма в оставшемся столбце 4 — весь столбец больше 10<\/td>\n<td>столбец r = 4 → r = 3<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>(1, 3)<\/td>\n<td>9 &lt; 10<\/td>\n<td>строка 1 в оставшейся части вся меньше 10<\/td>\n<td>строку l = 1 → l = 2<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>(2, 3)<\/td>\n<td>10<\/td>\n<td>найдено<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>За 4 шага вместо 10 проверок брутфорса. В общем случае каждый шаг убирает одну строку или столбец, а их всего n — поэтому <strong>O(n) шагов<\/strong>, и ни одна вычеркнутая клетка не могла быть ответом.<\/p>\n<p><strong>Общий вопрос для любой задачи на два указателя:<\/strong> почему элемент, от которого мы отходим, больше не может участвовать в ответе? Если на него есть чёткий ответ — техника применима. Если нет — скорее всего, нужна другая (хеш-таблица, префиксы).<\/p>"}, {"title": "Три разновидности", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вид<\/th>\n<th>Как движутся<\/th>\n<th>Типичная задача<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Встречные<\/td>\n<td>l с начала, r с конца, навстречу<\/td>\n<td>пара с суммой в отсортированном массиве, палиндром<\/td>\n<\/tr>\n<tr>\n<td>Быстрый и медленный (в одну сторону)<\/td>\n<td>slow — куда писать, fast — что читать<\/td>\n<td>удалить дубликаты, сдвинуть нули<\/td>\n<\/tr>\n<tr>\n<td>По двум массивам<\/td>\n<td>i по первому, j по второму<\/td>\n<td>слияние отсортированных, пересечение<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Как узнать задачу · 6.1. Встречные указатели", "html": "<ul>\n<li>Массив <strong>отсортирован<\/strong> (или его можно отсортировать без потери смысла).<\/li>\n<li>Нужна пара/тройка с условием на сумму.<\/li>\n<li>«Изменить массив на месте, O(1) памяти».<\/li>\n<li>Сравнение с двух концов: палиндром, «контейнер с водой».<\/li>\n<\/ul><h4>6.1. Встречные указатели<\/h4><p>Задача 167 «Two Sum II»: в отсортированном массиве найти два числа с суммой target.<\/p>\n<p><strong>Почему это корректно.<\/strong> Если a[l] + a[r] &lt; target, то a[l] с <em>любым<\/em> элементом левее r тоже даст меньше target (они ещё меньше). Значит, a[l] бесполезен — двигаем l вправо. Симметрично, если сумма больше, a[r] бесполезен — двигаем r влево. Каждый шаг отбрасывает целую строку вариантов, поэтому решение не теряется.<\/p>\n<pre><code class=\"language-python\">def two_sum_sorted(a, target):\n    l, r = 0, len(a) - 1\n    while l &lt; r:\n        s = a[l] + a[r]\n        if s == target:\n            return l, r\n        if s &lt; target:\n            l += 1\n        else:\n            r -= 1\n    return None\n<\/code><\/pre>\n<p><strong>Трассировка:<\/strong> a = [1, 3, 4, 6, 8, 11], target = 10.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>l<\/th>\n<th>r<\/th>\n<th>a[l] + a[r]<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>5<\/td>\n<td>1 + 11 = 12<\/td>\n<td>больше → r = 4<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>4<\/td>\n<td>1 + 8 = 9<\/td>\n<td>меньше → l = 1<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>4<\/td>\n<td>3 + 8 = 11<\/td>\n<td>больше → r = 3<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>3<\/td>\n<td>3 + 6 = 9<\/td>\n<td>меньше → l = 2<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>3<\/td>\n<td>4 + 6 = 10<\/td>\n<td>найдено (2, 3)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Встречные указатели без суммы: задача 125 «Valid Palindrome»", "section": "6.1. Встречные указатели", "html": "<p>Проверить, является ли строка палиндромом, учитывая только буквы и цифры и игнорируя регистр. Палиндром читается одинаково с двух концов — значит, сравниваем символы, двигаясь навстречу. Здесь отбрасывать нечего: просто шагаем оба указателя, пропуская «мусорные» символы.<\/p>\n<pre><code class=\"language-python\">def is_palindrome(s):\n    l, r = 0, len(s) - 1\n    while l &lt; r:\n        while l &lt; r and not s[l].isalnum():\n            l += 1\n        while l &lt; r and not s[r].isalnum():\n            r -= 1\n        if s[l].lower() != s[r].lower():\n            return False\n        l += 1\n        r -= 1\n    return True\n\nassert is_palindrome(&quot;A man, a plan, a canal: Panama&quot;)\nassert not is_palindrome(&quot;race a car&quot;)\nassert is_palindrome(&quot; &quot;)\n<\/code><\/pre>\n<p>O(n) времени и O(1) памяти. Решение через <code>t = ''.join(c.lower() for c in s if c.isalnum()); t == t[::-1]<\/code> короче, но тратит O(n) памяти — интервьюер часто просит именно вариант без копии.<\/p>"}, {"title": "Задача 11 «Container With Most Water»", "section": "6.1. Встречные указатели", "html": "<p>Даны высоты стенок height. Выбрать две стенки так, чтобы между ними поместилось больше всего воды. Объём = ширина × высота меньшей стенки = (r − l) · min(h[l], h[r]).<\/p>\n<p><strong>Какой указатель двигать.<\/strong> Пусть h[l] &lt; h[r]. Рассмотрим любой контейнер с левой стенкой l и правой r' &lt; r. Его ширина меньше, чем у текущего, а высота не больше h[l] (её ограничивает левая стенка). Значит, все такие контейнеры <strong>хуже текущего<\/strong> — стенка l больше не нужна, двигаем l. Двигать r бессмысленно: ширина уменьшится, а высоту по-прежнему будет ограничивать низкая стенка l.<\/p>\n<pre><code class=\"language-python\">def max_area(height):\n    l, r = 0, len(height) - 1\n    best = 0\n    while l &lt; r:\n        best = max(best, (r - l) * min(height[l], height[r]))\n        if height[l] &lt; height[r]:\n            l += 1\n        else:\n            r -= 1\n    return best\n\nassert max_area([1, 8, 6, 2, 5, 4, 8, 3, 7]) == 49\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> на [1, 8, 6, 2, 5, 4, 8, 3, 7]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>l<\/th>\n<th>r<\/th>\n<th>h[l], h[r]<\/th>\n<th>Объём<\/th>\n<th>best<\/th>\n<th>Двигаем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>8<\/td>\n<td>1, 7<\/td>\n<td>8 · 1 = 8<\/td>\n<td>8<\/td>\n<td>l (1 &lt; 7)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>8<\/td>\n<td>8, 7<\/td>\n<td>7 · 7 = 49<\/td>\n<td>49<\/td>\n<td>r<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>7<\/td>\n<td>8, 3<\/td>\n<td>6 · 3 = 18<\/td>\n<td>49<\/td>\n<td>r<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>6<\/td>\n<td>8, 8<\/td>\n<td>5 · 8 = 40<\/td>\n<td>49<\/td>\n<td>r (равны — любой)<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>5<\/td>\n<td>8, 4<\/td>\n<td>4 · 4 = 16<\/td>\n<td>49<\/td>\n<td>r<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>4<\/td>\n<td>8, 5<\/td>\n<td>3 · 5 = 15<\/td>\n<td>49<\/td>\n<td>r<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>3<\/td>\n<td>8, 2<\/td>\n<td>2 · 2 = 4<\/td>\n<td>49<\/td>\n<td>r<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>2<\/td>\n<td>8, 6<\/td>\n<td>1 · 6 = 6<\/td>\n<td>49<\/td>\n<td>r → l = r, стоп<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>При равных высотах<\/strong> можно двигать любой: оба рассуждения выше применимы к каждой из стенок, и ни один пропущенный контейнер не может быть лучше текущего.<\/p>"}, {"title": "6.2. Быстрый и медленный", "html": "<p>Задача 26: удалить дубликаты из отсортированного массива на месте и вернуть новую длину. slow указывает на последний записанный уникальный элемент, fast читает массив.<\/p>\n<pre><code class=\"language-python\">def remove_duplicates(a):\n    if not a:\n        return 0\n    slow = 0\n    for fast in range(1, len(a)):\n        if a[fast] != a[slow]:\n            slow += 1\n            a[slow] = a[fast]\n    return slow + 1\n\narr = [1, 1, 2, 3, 3, 3, 4]\nk = remove_duplicates(arr)\nassert arr[:k] == [1, 2, 3, 4]\n<\/code><\/pre>"}, {"title": "Инвариант — главное в быстром и медленном", "section": "6.2. Быстрый и медленный", "html": "<p><strong>Инвариант<\/strong> — утверждение, которое верно на каждом шаге цикла. Здесь он такой: <strong>a[0..slow] — уже готовый ответ<\/strong> (уникальные элементы в правильном порядке), а всё, что правее slow, — «черновик», который можно перезаписывать. fast идёт впереди и читает элементы, которые ещё не обработаны.<\/p>\n<p>Зная инвариант, код пишется сам: если a[fast] нужно оставить — расширяем готовую часть (slow += 1) и кладём туда a[fast].<\/p>\n<p><strong>Трассировка<\/strong> remove_duplicates на [1, 1, 2, 3, 3, 3, 4]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>fast<\/th>\n<th>a[fast]<\/th>\n<th>a[slow]<\/th>\n<th>Действие<\/th>\n<th>slow<\/th>\n<th>Массив (готовая часть до черты)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>старт<\/td>\n<td>0<\/td>\n<td>1 | 1 2 3 3 3 4<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>дубль — пропуск<\/td>\n<td>0<\/td>\n<td>1 | 1 2 3 3 3 4<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>2<\/td>\n<td>1<\/td>\n<td>новое: slow = 1, a[1] = 2<\/td>\n<td>1<\/td>\n<td>1 2 | 2 3 3 3 4<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>3<\/td>\n<td>2<\/td>\n<td>новое: slow = 2, a[2] = 3<\/td>\n<td>2<\/td>\n<td>1 2 3 | 3 3 3 4<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>3<\/td>\n<td>3<\/td>\n<td>дубль<\/td>\n<td>2<\/td>\n<td>1 2 3 | 3 3 3 4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>3<\/td>\n<td>3<\/td>\n<td>дубль<\/td>\n<td>2<\/td>\n<td>1 2 3 | 3 3 3 4<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>4<\/td>\n<td>3<\/td>\n<td>новое: slow = 3, a[3] = 4<\/td>\n<td>3<\/td>\n<td>1 2 3 4 | 3 3 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Возвращаем slow + 1 = 4. Мусор правее черты задача разрешает оставить.<\/p>\n<p>Почему достаточно сравнивать с a[slow], а не со всеми уникальными? Массив отсортирован, поэтому одинаковые элементы стоят подряд, и последний записанный уникальный — единственный, с которым может совпасть a[fast].<\/p>"}, {"title": "Задача 283 «Move Zeroes»", "section": "6.2. Быстрый и медленный", "html": "<p>Сдвинуть все нули в конец, сохранив порядок ненулевых, на месте. Инвариант: <strong>a[0..slow−1] — ненулевые элементы в исходном порядке<\/strong>, slow — позиция для следующего ненулевого. Вместо записи используем обмен, чтобы нули сами «уезжали» вправо.<\/p>\n<pre><code class=\"language-python\">def move_zeroes(a):\n    slow = 0\n    for fast in range(len(a)):\n        if a[fast] != 0:\n            a[slow], a[fast] = a[fast], a[slow]\n            slow += 1\n\narr = [0, 1, 0, 3, 12]\nmove_zeroes(arr)\nassert arr == [1, 3, 12, 0, 0]\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>fast<\/th>\n<th>a[fast]<\/th>\n<th>Действие<\/th>\n<th>slow после<\/th>\n<th>Массив<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>0<\/td>\n<td>пропуск<\/td>\n<td>0<\/td>\n<td>[0, 1, 0, 3, 12]<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>обмен a[0] ↔ a[1]<\/td>\n<td>1<\/td>\n<td>[1, 0, 0, 3, 12]<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0<\/td>\n<td>пропуск<\/td>\n<td>1<\/td>\n<td>[1, 0, 0, 3, 12]<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>3<\/td>\n<td>обмен a[1] ↔ a[3]<\/td>\n<td>2<\/td>\n<td>[1, 3, 0, 0, 12]<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>12<\/td>\n<td>обмен a[2] ↔ a[4]<\/td>\n<td>3<\/td>\n<td>[1, 3, 12, 0, 0]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>O(n) времени, O(1) памяти. Порядок ненулевых сохраняется, потому что slow никогда не обгоняет fast и элементы переносятся в том порядке, в каком fast их встречает.<\/p>"}, {"title": "6.3. Сведение 3Sum к 2Sum", "html": "<p>Задача 15: найти все уникальные тройки с суммой 0. Сортируем, фиксируем первый элемент i, а для остатка решаем Two Sum II встречными указателями. Итог O(n²) вместо O(n³). Главная сложность — пропуск дубликатов.<\/p>\n<pre><code class=\"language-python\">def three_sum(nums):\n    nums.sort()\n    res = []\n    for i in range(len(nums) - 2):\n        if i &gt; 0 and nums[i] == nums[i - 1]:\n            continue                      # одинаковый первый элемент уже был\n        l, r = i + 1, len(nums) - 1\n        while l &lt; r:\n            s = nums[i] + nums[l] + nums[r]\n            if s &lt; 0:\n                l += 1\n            elif s &gt; 0:\n                r -= 1\n            else:\n                res.append([nums[i], nums[l], nums[r]])\n                l += 1\n                while l &lt; r and nums[l] == nums[l - 1]:\n                    l += 1                # пропускаем дубли второго элемента\n                r -= 1\n    return res\n\nassert three_sum([-1, 0, 1, 2, -1, -4]) == [[-1, -1, 2], [-1, 0, 1]]\n<\/code><\/pre>"}, {"title": "3Sum подробно", "section": "6.3. Сведение 3Sum к 2Sum", "html": "<p><strong>Почему можно сортировать.<\/strong> Ответ — набор троек <em>значений<\/em>, индексы не нужны. Значит, порядок элементов не важен, и сортировка ничего не ломает, зато даёт отсортированность для двух указателей и ставит одинаковые значения рядом — это упрощает борьбу с дубликатами.<\/p>\n<p><strong>Трассировка<\/strong> на [−1, 0, 1, 2, −1, −4] → после сортировки [−4, −1, −1, 0, 1, 2]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>i (значение)<\/th>\n<th>l, r<\/th>\n<th>Сумма<\/th>\n<th>Действие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0 (−4)<\/td>\n<td>1, 5<\/td>\n<td>−4 − 1 + 2 = −3<\/td>\n<td>меньше 0 → l++<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2, 5<\/td>\n<td>−3<\/td>\n<td>l++<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3, 5<\/td>\n<td>−4 + 0 + 2 = −2<\/td>\n<td>l++<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>4, 5<\/td>\n<td>−4 + 1 + 2 = −1<\/td>\n<td>l++ → l = r, конец<\/td>\n<\/tr>\n<tr>\n<td>1 (−1)<\/td>\n<td>2, 5<\/td>\n<td>−1 − 1 + 2 = 0<\/td>\n<td><strong>тройка [−1, −1, 2]<\/strong>; l → 3, r → 4<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3, 4<\/td>\n<td>−1 + 0 + 1 = 0<\/td>\n<td><strong>тройка [−1, 0, 1]<\/strong>; l → 4, r → 3, конец<\/td>\n<\/tr>\n<tr>\n<td>2 (−1)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>nums[2] == nums[1] → пропуск<\/td>\n<\/tr>\n<tr>\n<td>3 (0)<\/td>\n<td>4, 5<\/td>\n<td>0 + 1 + 2 = 3<\/td>\n<td>больше 0 → r-- → конец<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Почему пропуск одинакового i не теряет ответы.<\/strong> При первом появлении значения −1 (i = 1) указатели искали пару среди <em>всех<\/em> элементов правее, включая второе −1. При втором появлении (i = 2) они искали бы среди меньшего набора — и нашли бы только часть тех же троек. Значит, всё, что даст i = 2, уже найдено при i = 1.<\/p>\n<p><strong>Почему после найденной тройки пропускаем одинаковые nums[l].<\/strong> Если оставить l на том же значении, при тех же nums[i] и сумме 0 третий элемент обязан быть тем же — получилась бы та же тройка. Сдвинув l на новое значение, мы гарантируем новую тройку.<\/p>\n<p><strong>Дополнительная оптимизация.<\/strong> Если nums[i] &gt; 0, то все элементы правее тоже положительны и сумма трёх больше 0 — цикл можно прервать: <code>if nums[i] &gt; 0: break<\/code>. Сложность не меняется, но это хороший сигнал интервьюеру.<\/p>"}, {"title": "6.4. Указатели по двум массивам", "html": "<p>i идёт по первому массиву, j — по второму. На каждом шаге сравниваем a[i] и b[j] и двигаем тот указатель, чей элемент «отработал». Каждый указатель проходит свой массив один раз — O(n + m).<\/p><h4>Пересечение отсортированных массивов<\/h4><p>Найти общие элементы (с учётом повторов). Если a[i] &lt; b[j], то a[i] не может совпасть ни с b[j], ни с чем-то правее (там ещё больше) — двигаем i. Симметрично для j. При равенстве — нашли общий элемент, двигаем оба.<\/p>\n<pre><code class=\"language-python\">def intersect_sorted(a, b):\n    i = j = 0\n    res = []\n    while i &lt; len(a) and j &lt; len(b):\n        if a[i] &lt; b[j]:\n            i += 1\n        elif a[i] &gt; b[j]:\n            j += 1\n        else:\n            res.append(a[i])\n            i += 1\n            j += 1\n    return res\n\nassert intersect_sorted([1, 2, 2, 3, 5], [2, 2, 4, 5]) == [2, 2, 5]\n<\/code><\/pre>\n<p>O(n + m) времени и O(1) доп. памяти — лучше, чем Counter, если массивы уже отсортированы.<\/p>"}, {"title": "Задача 88 «Merge Sorted Array»: слияние с конца", "section": "6.4. Указатели по двум массивам", "html": "<p>nums1 длины m + n: первые m элементов значимые, в конце n свободных мест (нулей). nums2 длины n. Слить всё в nums1 по возрастанию, на месте.<\/p>\n<p><strong>Почему с конца.<\/strong> Если заполнять nums1 с начала, мы перезапишем его ещё не прочитанные элементы. В конце же лежат свободные места — туда можно класть самые большие элементы, ничего не теряя. Индекс записи k всегда не меньше индекса чтения i, поэтому непрочитанное никогда не затирается.<\/p>\n<pre><code class=\"language-python\">def merge(nums1, m, nums2, n):\n    i, j, k = m - 1, n - 1, m + n - 1\n    while j &gt;= 0:                          # пока не кончился nums2\n        if i &gt;= 0 and nums1[i] &gt; nums2[j]:\n            nums1[k] = nums1[i]\n            i -= 1\n        else:\n            nums1[k] = nums2[j]\n            j -= 1\n        k -= 1\n\nnums1 = [1, 2, 3, 0, 0, 0]\nmerge(nums1, 3, [2, 5, 6], 3)\nassert nums1 == [1, 2, 2, 3, 5, 6]\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>k<\/th>\n<th>nums1[i]<\/th>\n<th>nums2[j]<\/th>\n<th>Кладём в nums1[k]<\/th>\n<th>nums1 после<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>3<\/td>\n<td>6<\/td>\n<td>6 из nums2<\/td>\n<td>[1, 2, 3, 0, 0, 6]<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>3<\/td>\n<td>5<\/td>\n<td>5 из nums2<\/td>\n<td>[1, 2, 3, 0, 5, 6]<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>3<\/td>\n<td>2<\/td>\n<td>3 из nums1<\/td>\n<td>[1, 2, 3, 3, 5, 6]<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>2 из nums2 (равны — берём nums2)<\/td>\n<td>[1, 2, 2, 3, 5, 6]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>j = −1 — цикл завершён. Остаток nums1 (1, 2) уже стоит на своих местах, поэтому цикл идёт только <code>while j &gt;= 0<\/code>. Если бы кончился nums1 раньше, условие <code>i &gt;= 0<\/code> отправит все оставшиеся элементы nums2 в начало.<\/p>\n<p>O(m + n) времени, O(1) памяти. Этот же приём слияния двух отсортированных последовательностей — сердце сортировки слиянием (глава 9).<\/p>"}, {"title": "6.5. Разбор hard-задачи: 42 «Trapping Rain Water»", "html": "<p>Даны высоты столбиков шириной 1. Сколько воды задержится после дождя?<\/p>\n<pre><code class=\"language-text\">height = [4, 2, 0, 3, 2, 5]          █ — столбик, ~ — вода\n\nуровень 5                    █\nуровень 4    █   ~   ~   ~   ~   █\nуровень 3    █   ~   ~   █   ~   █\nуровень 2    █   █   ~   █   █   █\nуровень 1    █   █   ~   █   █   █\nиндекс       0   1   2   3   4   5\n\nвода над столбиками: 0, 2, 4, 1, 2, 0 → всего 9\n<\/code><\/pre>\n<p><strong>Ключевое наблюдение.<\/strong> Над столбиком i вода поднимется до уровня меньшей из двух «стен»: самого высокого столбика слева и самого высокого справа. Значит:<\/p>\n<pre class=\"formula\"><code>\\text{water}[i] = \\min(\\text{maxLeft}[i], \\text{maxRight}[i]) - h[i]\n<\/code><\/pre>\n<p>Красиво видно, как решение улучшается шаг за шагом — это ровно тот путь, который ждут на собесе:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Подход<\/th>\n<th>Идея<\/th>\n<th>Время<\/th>\n<th>Память<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>брутфорс<\/td>\n<td>для каждого i искать максимумы слева и справа заново<\/td>\n<td>O(n²)<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>префиксные максимумы<\/td>\n<td>заранее посчитать maxLeft и maxRight массивами (глава 5)<\/td>\n<td>O(n)<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>два указателя<\/td>\n<td>считать максимумы на лету с двух концов<\/td>\n<td>O(n)<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Почему работают два указателя.<\/strong> Мы всегда двигаем сторону с меньшим столбиком. Пусть h[l] &lt; h[r]. Уровень воды над l равен min(left_max, maxRight), где maxRight — максимум среди столбиков от r до конца. Покажем, что left_max ≤ maxRight, то есть уровень определяет <strong>левый<\/strong> максимум:<\/p>\n<ul>\n<li>left_max — это какой-то столбик l′ ≤ l, который мы обработали раньше (или текущий).<\/li>\n<li>В момент его обработки он был меньше правого столбика r′, иначе двигали бы правый указатель.<\/li>\n<li>Правый указатель только уменьшается, поэтому r′ ≥ r, то есть r′ лежит в правой части и maxRight ≥ h[r′] &gt; left_max.<\/li>\n<\/ul>\n<p>Значит, воду над l можно посчитать прямо сейчас как left_max − h[l] и сдвинуть l. Симметрично для правой стороны.<\/p>\n<pre><code class=\"language-python\">def trap(height):\n    l, r = 0, len(height) - 1\n    left_max = right_max = 0\n    water = 0\n    while l &lt; r:\n        if height[l] &lt; height[r]:\n            left_max = max(left_max, height[l])\n            water += left_max - height[l]\n            l += 1\n        else:\n            right_max = max(right_max, height[r])\n            water += right_max - height[r]\n            r -= 1\n    return water\n\nassert trap([4, 2, 0, 3, 2, 5]) == 9\nassert trap([0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]) == 6\n<\/code><\/pre>\n<p><strong>Трассировка<\/strong> на [4, 2, 0, 3, 2, 5]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>l<\/th>\n<th>r<\/th>\n<th>h[l] vs h[r]<\/th>\n<th>Кого считаем<\/th>\n<th>left_max / right_max<\/th>\n<th>+вода<\/th>\n<th>water<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>5<\/td>\n<td>4 &lt; 5<\/td>\n<td>l<\/td>\n<td>4 / 0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>5<\/td>\n<td>2 &lt; 5<\/td>\n<td>l<\/td>\n<td>4 / 0<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>5<\/td>\n<td>0 &lt; 5<\/td>\n<td>l<\/td>\n<td>4 / 0<\/td>\n<td>4<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>5<\/td>\n<td>3 &lt; 5<\/td>\n<td>l<\/td>\n<td>4 / 0<\/td>\n<td>1<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>5<\/td>\n<td>2 &lt; 5<\/td>\n<td>l<\/td>\n<td>4 / 0<\/td>\n<td>2<\/td>\n<td>9<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>l = r = 5 — конец, ответ 9. Последний столбик (самый высокий) воду не держит — он сам стенка.<\/p>"}, {"title": "Сложность · Типичные ошибки", "html": "<p>Встречные и быстрый/медленный — O(n) время, O(1) память (каждый указатель проходит массив не больше одного раза). Если нужна сортировка — O(n log n). 3Sum — O(n²).<\/p><h4>Типичные ошибки<\/h4><ul>\n<li>Условие <code>while l &lt;= r<\/code> вместо <code>l &lt; r<\/code> в задаче на пару — элемент складывается сам с собой.<\/li>\n<li>Применять встречные указатели к неотсортированному массиву.<\/li>\n<li>В 3Sum забыть пропуск дубликатов или пропускать их до записи ответа.<\/li>\n<li>Не объяснить, <em>почему<\/em> сдвиг указателя не теряет ответ, — это частый вопрос интервьюера.<\/li>\n<\/ul>"}, {"title": "Каждая ошибка на коде", "section": "Типичные ошибки", "html": "<p>Все результаты ниже получены реальным запуском ошибочных версий.<\/p>\n<p><strong>1. <code>while l &lt;= r<\/code> в задаче на пару.<\/strong> two_sum_sorted([1, 5], 2) возвращает (0, 0): при l = r элемент 1 сложился сам с собой. Для пары разных элементов условие строго <code>l &lt; r<\/code>. (<code>l &lt;= r<\/code> нужно в других задачах — например, в бинарном поиске, глава 10.)<\/p>\n<p><strong>2. Двигать не тот указатель в Container With Most Water.<\/strong> Если двигать более высокую стенку, на [1, 8, 6, 2, 5, 4, 8, 3, 7] получается 8 вместо 49: алгоритм уходит от стенки 8 раньше, чем дошёл до лучшей пары. Именно поэтому важно <em>доказательство<\/em> выбора, а не угадывание.<\/p>\n<p><strong>3. Нет пропуска дубликатов в 3Sum.<\/strong> На [−1, 0, 1, 2, −1, −4] без пропусков ответ [[−1, −1, 2], [−1, 0, 1], [−1, 0, 1]] — тройка [−1, 0, 1] найдена дважды, от двух разных −1.<\/p>\n<p><strong>4. Слияние останавливается, когда кончился любой массив.<\/strong><\/p>\n<pre><code class=\"language-python\">while i &gt;= 0 and j &gt;= 0:      # ошибка: остаток nums2 не перенесётся\n    ...\n# merge([4, 5, 6, 0, 0, 0], 3, [1, 2, 3], 3) → [4, 5, 6, 4, 5, 6]\n<\/code><\/pre>\n<p>nums1 закончился первым, а элементы 1, 2, 3 из nums2 так и не были записаны. Правильное условие — <code>while j &gt;= 0<\/code> с проверкой <code>i &gt;= 0<\/code> внутри.<\/p>\n<p><strong>5. Внутренний while без <code>l &lt; r<\/code>.<\/strong> В Valid Palindrome на строке \".,\" цикл <code>while not s[l].isalnum(): l += 1<\/code> пробегает всю строку и выходит за границы — IndexError. Любой вложенный цикл, двигающий указатель, должен проверять границу.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ошибка<\/th>\n<th>Тест, который её ловит<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>l &lt;= r<\/code> в паре<\/td>\n<td>[1, 5], target = 2 → None<\/td>\n<\/tr>\n<tr>\n<td>двигать высокую стенку<\/td>\n<td>[1, 8, 6, 2, 5, 4, 8, 3, 7] → 49<\/td>\n<\/tr>\n<tr>\n<td>нет пропуска дубликатов<\/td>\n<td>[−1, 0, 1, 2, −1, −4] → 2 тройки<\/td>\n<\/tr>\n<tr>\n<td><code>while i &gt;= 0 and j &gt;= 0<\/code> в слиянии<\/td>\n<td>nums1 = [4, 5, 6], nums2 = [1, 2, 3]<\/td>\n<\/tr>\n<tr>\n<td>нет <code>l &lt; r<\/code> во вложенном while<\/td>\n<td>строка только из знаков: \".,\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Реши на LeetCode", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Уровень<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>125. Valid Palindrome<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>283. Move Zeroes<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>88. Merge Sorted Array (указатели с конца)<\/td>\n<td>E<\/td>\n<\/tr>\n<tr>\n<td>167. Two Sum II<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>11. Container With Most Water<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>15. 3Sum<\/td>\n<td>M<\/td>\n<\/tr>\n<tr>\n<td>42. Trapping Rain Water<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "viz": "twoptr", "tasks": [{"id": "6-trace", "type": "trace", "title": "Трассировка: встречные указатели", "q": "Заполни таблицу для two_sum_sorted([1, 3, 4, 6, 8, 11], target = 10).", "code": "def two_sum_sorted(a, target):\n    l, r = 0, len(a) - 1\n    while l < r:\n        s = a[l] + a[r]\n        if s == target:\n            return l, r\n        if s < target:\n            l += 1\n        else:\n            r -= 1", "columns": ["l", "r", "a[l] + a[r]"], "rows": [[0, 5, 12], [0, null, 9], [null, 4, null], [1, null, null], [null, 3, 10]], "answer": [[0, 5, 12], [0, 4, 9], [1, 4, 11], [1, 3, 9], [2, 3, 10]], "hints": ["Сумма больше target — двигаем r влево.", "Сумма меньше — двигаем l вправо.", "После 12 > 10: r = 4, сумма 1 + 8 = 9.", "9 < 10: l = 1, сумма 3 + 8 = 11.", "Дальше (1, 3) = 9 и (2, 3) = 10."], "expl": "Каждый шаг вычёркивает строку или столбец таблицы пар: (0,5)=12 → (0,4)=9 → (1,4)=11 → (1,3)=9 → (2,3)=10."}, {"id": "6-code-167", "type": "code", "title": "Two Sum в отсортированном", "q": "Массив a отсортирован по неубыванию. Верни [l, r] (индексы с нуля, l < r) двух чисел с суммой target. Ответ гарантированно существует и единственен. O(n), O(1) памяти.", "fn": "two_sum_sorted", "starter": "def two_sum_sorted(a, target):\n    pass\n", "leetcode": 167, "tests": [{"args": [[1, 3, 4, 6, 8, 11], 10], "exp": [2, 3], "hidden": false}, {"args": [[2, 7, 11, 15], 9], "exp": [0, 1], "hidden": false}, {"args": [[-3, -1, 0, 2], -4], "exp": [0, 1], "hidden": true, "case": "отрицательные"}, {"args": [[1, 5], 6], "exp": [0, 1], "hidden": true, "case": "два элемента"}], "speed": {"gen": "ARGS=[list(range(100000)), 199997]"}, "ref": "def two_sum_sorted(a, target):\n    l, r = 0, len(a) - 1\n    while l < r:\n        s = a[l] + a[r]\n        if s == target:\n            return [l, r]\n        if s < target:\n            l += 1\n        else:\n            r -= 1\n", "hints": ["Массив отсортирован — используй это.", "Начни с двух концов: l = 0, r = n − 1.", "Сумма мала → нужен элемент побольше.", "Сумма велика → нужен элемент поменьше.", "s < target: l += 1; s > target: r −= 1."], "expl": "Встречные указатели: каждый шаг отбрасывает элемент, который не может быть в ответе. O(n), O(1)."}, {"id": "6-code-283", "type": "code", "title": "Сдвинуть нули", "q": "Перемести все нули в конец, сохранив порядок остальных элементов. Измени список на месте и верни его.", "fn": "move_zeroes", "starter": "def move_zeroes(a):\n    # измени a на месте\n    return a\n", "leetcode": 283, "tests": [{"args": [[0, 1, 0, 3, 12]], "exp": [1, 3, 12, 0, 0], "hidden": false}, {"args": [[0]], "exp": [0], "hidden": false}, {"args": [[1, 2]], "exp": [1, 2], "hidden": true, "case": "нет нулей"}, {"args": [[0, 0, 1]], "exp": [1, 0, 0], "hidden": true, "case": "нули в начале"}], "speed": {"gen": "ARGS=[[0,1]*50000]"}, "ref": "def move_zeroes(a):\n    slow = 0\n    for fast in range(len(a)):\n        if a[fast] != 0:\n            a[slow], a[fast] = a[fast], a[slow]\n            slow += 1\n    return a\n", "hints": ["Нужны два указателя в одну сторону.", "slow — куда положить следующий ненулевой.", "fast читает все элементы по порядку.", "Встретил ненулевой — поменяй a[slow] и a[fast], сдвинь slow.", "Инвариант: a[0..slow−1] — ненулевые в исходном порядке."], "expl": "Быстрый и медленный указатели с обменом: O(n), O(1). pop(i) из середины — O(n) за раз, к тому же пропускает подряд идущие нули."}, {"id": "6-container", "type": "choice", "title": "Какой указатель двигать", "q": "Container With Most Water: h[l] = 3, h[r] = 8. Какой указатель двигать?", "options": ["r — правую, она выше", "l — левую, она ниже", "Оба сразу", "Любой — неважно"], "answer": 1, "hints": ["Объём = ширина × min(h[l], h[r]).", "Высоту ограничивает меньшая стенка.", "Все контейнеры с левой стенкой и более близкой правой — уже и не выше.", "Значит, они не лучше текущего.", "Левая стенка больше не нужна — двигаем l."], "expl": "Любой контейнер с низкой стенкой l и более близкой правой стенкой хуже текущего: ширина меньше, высота ≤ h[l]."}, {"id": "6-code-11", "type": "code", "title": "Контейнер с водой", "q": "Даны высоты стенок height. Выбери две стенки так, чтобы между ними поместилось больше всего воды: (r − l) · min(height[l], height[r]). Верни максимальный объём. O(n).", "fn": "max_area", "starter": "def max_area(height):\n    pass\n", "leetcode": 11, "tests": [{"args": [[1, 8, 6, 2, 5, 4, 8, 3, 7]], "exp": 49, "hidden": false}, {"args": [[1, 1]], "exp": 1, "hidden": false}, {"args": [[4, 3, 2, 1, 4]], "exp": 16, "hidden": true, "case": "крайние стенки"}, {"args": [[1, 2, 1]], "exp": 2, "hidden": true, "case": "три стенки"}], "speed": {"gen": "import random\nrandom.seed(3)\nARGS=[[random.randint(0,10000) for _ in range(100000)]]"}, "ref": "def max_area(height):\n    l, r = 0, len(height) - 1\n    best = 0\n    while l < r:\n        best = max(best, (r - l) * min(height[l], height[r]))\n        if height[l] < height[r]:\n            l += 1\n        else:\n            r -= 1\n    return best\n", "hints": ["Начни с самой широкой пары: l = 0, r = n − 1.", "Объём ограничен меньшей стенкой.", "Двигать высокую стенку бессмысленно.", "Двигай указатель с меньшей высотой.", "if h[l] < h[r]: l += 1 else: r −= 1."], "expl": "Двигаем низкую стенку: все пропущенные контейнеры с ней не лучше текущего. Если двигать высокую — на примере получится 8 вместо 49."}, {"id": "6-bug", "type": "bug", "title": "Найди баг: пара сама с собой", "q": "two_sum_sorted([1, 5], 2) возвращает (0, 0), хотя пары нет. Найди строку с ошибкой.", "code": ["def two_sum_sorted(a, target):", "    l, r = 0, len(a) - 1", "    while l <= r:", "        s = a[l] + a[r]", "        if s == target:", "            return l, r", "        if s < target:", "            l += 1", "        else:", "            r -= 1"], "line": 2, "fixes": ["    while l < r:", "    while l != r + 1:", "    while r > 0:"], "fix": 0, "hints": ["Когда l == r, какую пару мы проверяем?", "Элемент складывается сам с собой.", "1 + 1 = 2 — «нашли» пару.", "Для пары разных элементов l должен быть строго меньше r.", "while l < r."], "expl": "При l == r элемент складывается сам с собой. Для пары условие строго l < r."}, {"id": "6-code-15", "type": "code", "title": "3Sum", "q": "Верни все уникальные тройки [a, b, c] из nums с суммой 0. Каждая тройка по возрастанию, порядок троек — любой. n до 3000, нужно O(n²).", "fn": "three_sum", "starter": "def three_sum(nums):\n    pass\n", "leetcode": 15, "compare": "sorted", "tests": [{"args": [[-1, 0, 1, 2, -1, -4]], "exp": [[-1, -1, 2], [-1, 0, 1]], "hidden": false}, {"args": [[0, 0, 0, 0]], "exp": [[0, 0, 0]], "hidden": false}, {"args": [[1, 2, -2, -1]], "exp": [], "hidden": true, "case": "нет троек"}, {"args": [[-2, 0, 1, 1, 2]], "exp": [[-2, 0, 2], [-2, 1, 1]], "hidden": true, "case": "дубликаты"}], "speed": {"gen": "import random\nrandom.seed(4)\nARGS=[[random.randint(-1000,1000) for _ in range(1500)]]"}, "ref": "def three_sum(nums):\n    nums = sorted(nums)\n    res = []\n    for i in range(len(nums) - 2):\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue\n        l, r = i + 1, len(nums) - 1\n        while l < r:\n            s = nums[i] + nums[l] + nums[r]\n            if s < 0:\n                l += 1\n            elif s > 0:\n                r -= 1\n            else:\n                res.append([nums[i], nums[l], nums[r]])\n                l += 1\n                while l < r and nums[l] == nums[l - 1]:\n                    l += 1\n                r -= 1\n    return res\n", "hints": ["Сначала отсортируй — индексы не нужны.", "Зафиксируй первый элемент i, для остатка реши Two Sum II.", "Встречные указатели l = i + 1, r = n − 1.", "Пропускай одинаковые nums[i] — иначе дубли троек.", "После найденной тройки сдвинь l мимо одинаковых значений."], "expl": "Сортировка + i + два указателя: O(n²). Без пропуска дубликатов одна тройка найдётся несколько раз."}, {"id": "6-code-977", "type": "code", "title": "Квадраты отсортированного массива", "q": "nums отсортирован, могут быть отрицательные. Верни отсортированные квадраты за O(n), без сортировки.", "fn": "sorted_squares", "starter": "def sorted_squares(nums):\n    pass\n", "leetcode": 977, "tests": [{"args": [[-4, -1, 0, 3, 10]], "exp": [0, 1, 9, 16, 100], "hidden": false}, {"args": [[-7, -3, 2, 3, 11]], "exp": [4, 9, 9, 49, 121], "hidden": false}, {"args": [[-5, -3, -1]], "exp": [1, 9, 25], "hidden": true, "case": "все отрицательные"}, {"args": [[2]], "exp": [4], "hidden": true, "case": "один элемент"}], "ref": "def sorted_squares(nums):\n    n = len(nums)\n    res = [0] * n\n    l, r = 0, n - 1\n    for k in range(n - 1, -1, -1):\n        if abs(nums[l]) > abs(nums[r]):\n            res[k] = nums[l] ** 2\n            l += 1\n        else:\n            res[k] = nums[r] ** 2\n            r -= 1\n    return res\n", "hints": ["Где может стоять самый большой квадрат?", "На одном из концов массива.", "Сравнивай |nums[l]| и |nums[r]|.", "Больший квадрат клади в конец ответа.", "Заполняй res с индекса n − 1 вниз."], "expl": "Самый большой квадрат — на одном из концов; встречные указатели заполняют ответ с конца. O(n)."}], "test": [{"q": "Почему в Two Sum II при сумме < target можно сдвинуть l?", "options": ["Так быстрее", "a[l] даже с самым большим a[r] даёт мало — он не войдёт в ответ", "Так требует условие", "l всегда меньше r"], "answer": 1}, {"q": "Инвариант быстрого/медленного указателя в удалении дубликатов:", "options": ["a[slow..] отсортировано", "a[0..slow] — готовый ответ", "slow == fast", "fast — последний уникальный"], "answer": 1}, {"q": "Почему слияние в задаче 88 идёт с конца?", "options": ["Так короче код", "В конце свободное место — непрочитанное не затирается", "С начала нельзя сравнивать", "Так требует сортировка"], "answer": 1}, {"q": "Сложность 3Sum через сортировку и два указателя:", "options": ["O(n)", "O(n log n)", "O(n²)", "O(n³)"], "answer": 2}, {"q": "Two Sum в НЕотсортированном массиве с возвратом индексов — лучший подход:", "options": ["Сортировка + указатели", "Хеш-таблица", "Бинарный поиск", "Окно"], "answer": 1}, {"q": "Вода над столбиком i в Trapping Rain Water:", "options": ["max(maxL, maxR) − h[i]", "min(maxL, maxR) − h[i]", "maxL − maxR", "h[i]"], "answer": 1}, {"q": "Условие цикла для пары разных элементов:", "options": ["while l <= r", "while l < r", "while r > 0", "while l <= r + 1"], "answer": 1}]}, {"title": "Глава 7. Скользящее окно", "short": "Скользящее окно", "part": "Часть II · Базовые техники на массивах и строках", "cards": [{"title": "Интуиция: гусеница", "html": "<p>Скользящее окно — это два указателя l и r, ограничивающие непрерывный отрезок, который «едет» по массиву. При сдвиге окна мы не пересчитываем его заново, а обновляем состояние: добавляем вошедший элемент и убираем вышедший. Так O(n·k) или O(n²) превращается в O(n).<\/p><h4>Интуиция: гусеница<\/h4><p>Представь гусеницу, ползущую по массиву. Голова (r) всегда ползёт вперёд и «съедает» новый элемент. Если гусенице стало плохо (окно нарушило условие), она подтягивает хвост (l), выплёвывая элементы сзади, пока не станет хорошо. Ни голова, ни хвост никогда не ползут назад.<\/p>\n<p>Окно — частный случай двух указателей из главы 6: оба указателя идут в одну сторону, а всё, что между ними, — текущий кандидат в ответ.<\/p>"}, {"title": "Чем окно лучше брутфорса", "section": "Интуиция: гусеница", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Подход<\/th>\n<th>Что делает<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>брутфорс по отрезкам<\/td>\n<td>для каждого начала l перебрать все концы r и проверить отрезок<\/td>\n<td>O(n²) (или O(n³), если проверка за O(n))<\/td>\n<\/tr>\n<tr>\n<td>фиксированное окно с пересчётом<\/td>\n<td>для каждой позиции заново считать сумму k элементов<\/td>\n<td>O(n·k)<\/td>\n<\/tr>\n<tr>\n<td>скользящее окно<\/td>\n<td>при сдвиге обновить состояние: +вошедший, −вышедший<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Что такое монотонность условия", "section": "Интуиция: гусеница", "html": "<p>Окно работает только тогда, когда «хорошесть» отрезка ведёт себя предсказуемо при его сужении или расширении. Бывает два вида:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Свойство<\/th>\n<th>Пример условия<\/th>\n<th>Что ищут<\/th>\n<th>Как ведёт себя окно<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>хороший отрезок остаётся хорошим при <strong>сужении<\/strong><\/td>\n<td>«нет повторяющихся символов»: любая часть подстроки без повторов тоже без повторов<\/td>\n<td>самый <strong>длинный<\/strong> хороший<\/td>\n<td>расширяем, пока хорошо; стало плохо — сжимаем до хорошего<\/td>\n<\/tr>\n<tr>\n<td>хороший отрезок остаётся хорошим при <strong>расширении<\/strong> (числа ≥ 0)<\/td>\n<td>«сумма ≥ target»: добавили неотрицательное число — сумма не уменьшилась<\/td>\n<td>самый <strong>короткий<\/strong> хороший<\/td>\n<td>расширяем до хорошего; пока хорошо — сжимаем, ища минимум<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Если ни одно из свойств не выполняется — окно применять нельзя. Классический пример — «сумма ровно k» с отрицательными числами: добавление элемента может как увеличить, так и уменьшить сумму, и решение о сжатии становится неверным (пример [2, −1] в главе 5).<\/p>\n<p><strong>Проверка на собесе:<\/strong> спроси себя — «если отрезок [l, r] плохой, может ли отрезок [l, r + 1] стать хорошим?» Если для задачи на максимум ответ «нет», окно подходит.<\/p>"}, {"title": "Как узнать задачу", "html": "<ul>\n<li>В условии «подмассив» или «подстрока» — то есть <strong>непрерывный<\/strong> отрезок.<\/li>\n<li>Нужен самый длинный / самый короткий / количество отрезков с условием.<\/li>\n<li>Условие <strong>монотонно<\/strong>: если отрезок «плохой», то любой его расширяющий тоже плохо
