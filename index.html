 range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i-1] == b[j-1]:\n                dp[i][j] = dp[i-1][j-1]\n            else:\n                dp[i][j] = 1 + min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1])\n    return dp[n][m]\n", "hints": ["База: dp[i][0] = i, dp[0][j] = j.", "Совпали — без операции.", "Иначе 1 + min из трёх соседей.", "Слева — вставка, сверху — удаление.", "Диагональ — замена."], "expl": "O(n·m).", "compare": "exact", "leetcode": 72}, {"id": "28-k3", "type": "code", "title": "LIS", "q": "Длина наибольшей строго возрастающей подпоследовательности. n до 10⁵ — нужно O(n log n).", "fn": "lis", "starter": "from bisect import bisect_left\n\ndef lis(nums):\n    pass\n", "tests": [{"args": [[10, 9, 2, 5, 3, 7, 101, 18]], "exp": 4, "hidden": false, "case": ""}, {"args": [[0, 1, 0, 3, 2, 3]], "exp": 4, "hidden": false, "case": ""}, {"args": [[7, 7, 7]], "exp": 1, "hidden": true, "case": "равные"}, {"args": [[]], "exp": 0, "hidden": true, "case": "пусто"}], "ref": "from bisect import bisect_left\n\ndef lis(nums):\n    tails = []\n    for x in nums:\n        k = bisect_left(tails, x)\n        if k == len(tails):\n            tails.append(x)\n        else:\n            tails[k] = x\n    return len(tails)\n", "hints": ["Храни tails — минимальные хвосты.", "bisect_left находит место x.", "За концом — удлиняем.", "Иначе заменяем на меньший.", "Ответ — len(tails)."], "expl": "Терпеливая сортировка: O(n log n).", "compare": "exact", "leetcode": 300, "speed": {"gen": "import random\nrandom.seed(1)\nARGS=[[random.randint(0, 10**9) for _ in range(100000)]]"}}, {"id": "28-k4", "type": "code", "title": "Максимальный подмассив", "q": "Максимальная сумма непустого подмассива.", "fn": "max_subarray", "starter": "def max_subarray(nums):\n    pass\n", "tests": [{"args": [[-2, 1, -3, 4, -1, 2, 1, -5, 4]], "exp": 6, "hidden": false, "case": ""}, {"args": [[5, 4, -1, 7, 8]], "exp": 23, "hidden": false, "case": ""}, {"args": [[-3, -1, -2]], "exp": -1, "hidden": true, "case": "все отрицательные"}], "ref": "def max_subarray(nums):\n    cur = best = nums[0]\n    for x in nums[1:]:\n        cur = max(x, cur + x)\n        best = max(best, cur)\n    return best\n", "hints": ["cur — лучшая сумма, заканчивающаяся здесь.", "Продолжить или начать заново: max(x, cur + x).", "best — максимум по всем cur.", "Старт с nums[0].", "Не обнуляй до 0 — все могут быть отрицательными."], "expl": "Кадане: O(n).", "compare": "exact", "leetcode": 53}], "test": [{"q": "Размер таблицы LCS для строк n и m:", "options": ["n×m", "(n+1)×(m+1)", "n+m", "n²"], "answer": 1}, {"q": "Редакционное расстояние, символы совпали:", "options": ["dp[i-1][j-1] + 1", "dp[i-1][j-1]", "0", "dp[i][j-1]"], "answer": 1}, {"q": "LIS через tails работает за:", "options": ["O(n²)", "O(n log n)", "O(n)", "O(2ⁿ)"], "answer": 1}, {"q": "Кадане решает:", "options": ["LCS", "максимальный подмассив", "размен", "LIS"], "answer": 1}, {"q": "Число путей по сетке: dp[r][c] =", "options": ["dp[r-1][c] · dp[r][c-1]", "dp[r-1][c] + dp[r][c-1]", "max(...)", "1"], "answer": 1}]}, {"title": "Глава 29. Рюкзак и размен", "short": "Рюкзак и размен", "part": "Часть VII · Перебор и ДП", "cards": [{"title": "Рюкзак 0/1 и неограниченный", "html": "<p><strong>0/1<\/strong>: каждый предмет один раз. <code>dp[w]<\/code> — лучшая ценность при вместимости w. Идём по весам <strong>справа налево<\/strong>, чтобы не взять предмет дважды.<\/p>\n<pre><code class=\"language-python\">def knapsack(weights, values, W):\n    dp = [0] * (W + 1)\n    for wt, v in zip(weights, values):\n        for w in range(W, wt - 1, -1):      # справа налево!\n            dp[w] = max(dp[w], dp[w - wt] + v)\n    return dp[W]\n<\/code><\/pre>\n<p><strong>Неограниченный<\/strong> (размен): тот же цикл <strong>слева направо<\/strong> — предмет можно брать снова.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вариант<\/th>\n<th>Порядок по w<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0/1 (416 разбиение на равные суммы)<\/td>\n<td>справа налево<\/td>\n<\/tr>\n<tr>\n<td>неограниченный (322, 518)<\/td>\n<td>слева направо<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Размен: минимум монет (322) и число способов (518)", "html": "<pre><code class=\"language-python\">def coin_change(coins, amount):\n    INF = amount + 1\n    dp = [0] + [INF] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c &lt;= a:\n                dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] != INF else -1\n\ndef change_ways(amount, coins):\n    dp = [1] + [0] * amount\n    for c in coins:                 # монеты снаружи — комбинации, не перестановки\n        for a in range(c, amount + 1):\n            dp[a] += dp[a - c]\n    return dp[amount]\n<\/code><\/pre>\n<p>Порядок циклов в 518 важен: монеты снаружи → считаем {1,2} и {2,1} один раз. Суммы снаружи → перестановки (377).<\/p>\n<p>Ошибки: в 0/1 идти слева направо; база <code>dp[0] = 0<\/code> / <code>1<\/code>; бесконечность как <code>float('inf')<\/code> в сумме даёт inf — это нормально, но сравнение с -1 забывают.<\/p>"}], "viz": "coins", "tasks": [{"id": "29-c1", "type": "choice", "title": "Направление", "q": "Почему в рюкзаке 0/1 по весам идут справа налево?", "options": ["Быстрее", "Чтобы dp[w − wt] ещё был из прошлого шага и предмет не взялся дважды", "Так красивее", "Без разницы"], "answer": 1, "hints": ["Что читает dp[w − wt]?", "Значение меньшего веса.", "Слева направо оно уже обновлено этим предметом.", "Значит, предмет учтётся дважды.", "Справа налево — нет."], "expl": "Обход справа налево читает dp[w − wt] из предыдущего предмета."}, {"id": "29-k1", "type": "code", "title": "Размен монет", "q": "Минимум монет для суммы amount или -1.", "fn": "coin_change", "starter": "def coin_change(coins, amount):\n    pass\n", "tests": [{"args": [[1, 2, 5], 11], "exp": 3, "hidden": false, "case": ""}, {"args": [[2], 3], "exp": -1, "hidden": false, "case": ""}, {"args": [[1], 0], "exp": 0, "hidden": true, "case": "сумма 0"}, {"args": [[1, 3, 4], 6], "exp": 2, "hidden": true, "case": "жадность ошибается"}], "ref": "def coin_change(coins, amount):\n    INF = amount + 1\n    dp = [0] + [INF] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a and dp[a - c] + 1 < dp[a]:\n                dp[a] = dp[a - c] + 1\n    return dp[amount] if dp[amount] != INF else -1\n", "hints": ["dp[a] — минимум монет для суммы a.", "dp[0] = 0.", "dp[a] = min(dp[a − c] + 1).", "Недостижимые — бесконечность.", "Жадность не подходит."], "expl": "Неограниченный рюкзак: O(amount·k).", "compare": "exact", "leetcode": 322}, {"id": "29-k2", "type": "code", "title": "Число способов размена", "q": "Сколько комбинаций монет дают amount (порядок не важен)?", "fn": "change_ways", "starter": "def change_ways(amount, coins):\n    pass\n", "tests": [{"args": [5, [1, 2, 5]], "exp": 4, "hidden": false, "case": ""}, {"args": [3, [2]], "exp": 0, "hidden": false, "case": ""}, {"args": [0, [7]], "exp": 1, "hidden": true, "case": "сумма 0"}, {"args": [4, [1, 2]], "exp": 3, "hidden": true, "case": "не перестановки"}], "ref": "def change_ways(amount, coins):\n    dp = [1] + [0] * amount\n    for c in coins:\n        for a in range(c, amount + 1):\n            dp[a] += dp[a - c]\n    return dp[amount]\n", "hints": ["dp[a] — число способов.", "dp[0] = 1.", "Монеты во внешнем цикле.", "dp[a] += dp[a − c].", "Иначе посчитаешь перестановки."], "expl": "O(amount·k).", "compare": "exact", "leetcode": 518}, {"id": "29-k3", "type": "code", "title": "Разбиение на равные суммы", "q": "Можно ли разбить nums на две части с равной суммой?", "fn": "can_partition", "starter": "def can_partition(nums):\n    pass\n", "tests": [{"args": [[1, 5, 11, 5]], "exp": true, "hidden": false, "case": ""}, {"args": [[1, 2, 3, 5]], "exp": false, "hidden": false, "case": ""}, {"args": [[1, 1]], "exp": true, "hidden": true, "case": "две единицы"}, {"args": [[2, 2, 3, 5]], "exp": false, "hidden": true, "case": "чётная сумма, но нельзя"}], "ref": "def can_partition(nums):\n    s = sum(nums)\n    if s % 2:\n        return False\n    t = s // 2\n    dp = [True] + [False] * t\n    for x in nums:\n        for w in range(t, x - 1, -1):\n            dp[w] = dp[w] or dp[w - x]\n    return dp[t]\n", "hints": ["Нечётная сумма — False.", "Нужна подмножество с суммой s/2.", "dp[w] — достижима ли сумма w.", "Рюкзак 0/1: справа налево.", "Ответ dp[s/2]."], "expl": "Рюкзак 0/1 с булевым dp.", "compare": "exact", "leetcode": 416}], "test": [{"q": "Неограниченный рюкзак — обход по весам:", "options": ["справа налево", "слева направо", "случайно", "по монетам"], "answer": 1}, {"q": "В 518 монеты во внешнем цикле, чтобы:", "options": ["ускорить", "считать комбинации, а не перестановки", "избежать inf", "экономить память"], "answer": 1}, {"q": "База для числа способов:", "options": ["dp[0] = 0", "dp[0] = 1", "dp[0] = inf", "нет базы"], "answer": 1}, {"q": "Сложность размена:", "options": ["O(amount · число монет)", "O(2ⁿ)", "O(amount²)", "O(log amount)"], "answer": 0}, {"q": "Разбиение на равные суммы сводится к:", "options": ["LIS", "рюкзаку 0/1 на сумму s/2", "BFS", "сортировке"], "answer": 1}]}, {"title": "Глава 30. Битовые операции", "short": "Битовые операции", "part": "Часть VIII · Приёмы и стратегия", "cards": [{"title": "Операции и трюки", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Операция<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>a &amp; b<\/code>, <code>a \\| b<\/code>, <code>a ^ b<\/code><\/td>\n<td>и, или, исключающее или<\/td>\n<\/tr>\n<tr>\n<td><code>x &lt;&lt; k<\/code>, <code>x &gt;&gt; k<\/code><\/td>\n<td>умножить / поделить на 2ᵏ<\/td>\n<\/tr>\n<tr>\n<td><code>x &amp; 1<\/code><\/td>\n<td>нечётность<\/td>\n<\/tr>\n<tr>\n<td><code>x &amp; (x - 1)<\/code><\/td>\n<td>сбросить младшую единицу<\/td>\n<\/tr>\n<tr>\n<td><code>x &amp; -x<\/code><\/td>\n<td>оставить младшую единицу<\/td>\n<\/tr>\n<tr>\n<td><code>(x &gt;&gt; k) &amp; 1<\/code><\/td>\n<td>k-й бит<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Свойства XOR: <code>a ^ a = 0<\/code>, <code>a ^ 0 = a<\/code>, коммутативен — пары взаимно уничтожаются.<\/p>"}, {"title": "Классика", "html": "<pre><code class=\"language-python\">def single_number(nums):          # 136: все по два, один — один раз\n    r = 0\n    for x in nums:\n        r ^= x\n    return r\n\ndef hamming_weight(n):            # 191: число единиц\n    c = 0\n    while n:\n        n &amp;= n - 1                # каждая итерация снимает одну единицу\n        c += 1\n    return c\n\ndef is_power_of_two(n):           # 231\n    return n &gt; 0 and n &amp; (n - 1) == 0\n\ndef missing_number(nums):         # 268: числа 0..n без одного\n    r = len(nums)\n    for i, x in enumerate(nums):\n        r ^= i ^ x\n    return r\n<\/code><\/pre>\n<p><strong>Подмножества маской<\/strong>: <code>for mask in range(1 &lt;&lt; n)<\/code> — бит i включает элемент i.<\/p>\n<p>Ошибки: в Python числа неограничены, <code>~x<\/code> и отрицательные ведут себя не как в 32-битных языках; приоритет <code>&amp;<\/code> ниже <code>==<\/code> — ставь скобки.<\/p>"}], "viz": "bits", "tasks": [{"id": "30-p1", "type": "predict", "title": "Сброс младшей единицы", "q": "Что выведет код?", "code": "x = 12\nprint(x & (x - 1))", "answer": "8", "hints": ["12 = 1100.", "11 = 1011.", "1100 & 1011.", "= 1000.", "8."], "expl": "x & (x − 1) снимает младший единичный бит: 1100 → 1000 = 8."}, {"id": "30-c1", "type": "choice", "title": "XOR", "q": "Почему XOR всех чисел даёт одиночное?", "options": ["Сортирует", "Парные взаимно уничтожаются: a ^ a = 0", "Считает сумму", "Случайно"], "answer": 1, "hints": ["a ^ a = ?", "0.", "XOR коммутативен — порядок не важен.", "Все пары дают 0.", "Остаётся одиночное."], "expl": "Пары сокращаются, 0 ^ x = x."}, {"id": "30-k1", "type": "code", "title": "Одиночное число", "q": "Каждое число встречается дважды, кроме одного. O(n) времени, O(1) памяти.", "fn": "single_number", "starter": "def single_number(nums):\n    pass\n", "tests": [{"args": [[2, 2, 1]], "exp": 1, "hidden": false, "case": ""}, {"args": [[4, 1, 2, 1, 2]], "exp": 4, "hidden": false, "case": ""}, {"args": [[-3]], "exp": -3, "hidden": true, "case": "отрицательное"}], "ref": "def single_number(nums):\n    r = 0\n    for x in nums:\n        r ^= x\n    return r\n", "hints": ["Нужна O(1) память — без словаря.", "Вспомни a ^ a = 0.", "XOR всех.", "Начни с 0.", "Ответ — результат."], "expl": "XOR: O(n), O(1).", "compare": "exact", "leetcode": 136}, {"id": "30-k2", "type": "code", "title": "Счётчик битов", "q": "Для каждого i от 0 до n верни число единиц в двоичной записи. O(n).", "fn": "count_bits", "starter": "def count_bits(n):\n    pass\n", "tests": [{"args": [2], "exp": [0, 1, 1], "hidden": false, "case": ""}, {"args": [5], "exp": [0, 1, 1, 2, 1, 2], "hidden": false, "case": ""}, {"args": [0], "exp": [0], "hidden": true, "case": "ноль"}], "ref": "def count_bits(n):\n    res = [0] * (n + 1)\n    for i in range(1, n + 1):\n        res[i] = res[i >> 1] + (i & 1)\n    return res\n", "hints": ["Связь i и i >> 1?", "i >> 1 — i без младшего бита.", "Единиц столько же плюс младший бит.", "res[i] = res[i >> 1] + (i & 1).", "ДП по битам."], "expl": "ДП по битам: O(n).", "compare": "exact", "leetcode": 338}], "test": [{"q": "x & (x − 1) делает:", "options": ["удваивает", "сбрасывает младшую единицу", "инвертирует", "ничего"], "answer": 1}, {"q": "Проверка степени двойки:", "options": ["n % 2 == 0", "n > 0 and n & (n − 1) == 0", "n & 1", "n >> 1"], "answer": 1}, {"q": "a ^ a равно:", "options": ["a", "0", "2a", "1"], "answer": 1}, {"q": "Перебор всех подмножеств маской:", "options": ["range(n)", "range(1 << n)", "range(n²)", "range(2 * n)"], "answer": 1}, {"q": "k-й бит x:", "options": ["x << k", "(x >> k) & 1", "x & k", "x ^ k"], "answer": 1}]}, {"title": "Глава 31. Математика", "short": "Математика", "part": "Часть VIII · Приёмы и стратегия", "cards": [{"title": "Простые, НОД, модуль", "html": "<p><strong>НОД<\/strong> (алгоритм Евклида): <code>gcd(a, b) = gcd(b, a % b)<\/code>, O(log). <code>lcm = a // gcd(a, b) * b<\/code>.<\/p>\n<p><strong>Решето Эратосфена<\/strong> (204): все простые до n за O(n log log n).<\/p>\n<pre><code class=\"language-python\">def count_primes(n):\n    if n &lt; 3:\n        return 0\n    is_p = [True] * n\n    is_p[0] = is_p[1] = False\n    for i in range(2, int(n ** 0.5) + 1):\n        if is_p[i]:\n            for j in range(i * i, n, i):    # с i², меньшие уже вычеркнуты\n                is_p[j] = False\n    return sum(is_p)\n<\/code><\/pre>\n<p><strong>Модуль<\/strong>: «ответ по модулю 10⁹ + 7» — бери <code>%<\/code> после каждого сложения/умножения. Быстрое возведение в степень: <code>pow(a, b, mod)<\/code> — O(log b).<\/p>"}, {"title": "Быстрая степень и прочее", "html": "<pre><code class=\"language-python\">def my_pow(x, n):                     # 50\n    if n &lt; 0:\n        x, n = 1 / x, -n\n    res = 1\n    while n:\n        if n &amp; 1:\n            res *= x\n        x *= x\n        n &gt;&gt;= 1\n    return res\n<\/code><\/pre>\n<ul>\n<li>Проверка простоты делением до √n: O(√n).<\/li>\n<li>Переполнения в Python нет, но на собесе спросят — упомяни.<\/li>\n<li>Разворот числа (7), палиндром (9): <code>%10<\/code> и <code>//10<\/code>, аккуратно со знаком.<\/li>\n<li>Случайная выборка (резервуар, 382): k-й элемент берём с вероятностью 1/k.<\/li>\n<\/ul>"}], "viz": "sieve", "tasks": [{"id": "31-c1", "type": "choice", "title": "С i²", "q": "Почему решето начинает вычёркивать с i²?", "options": ["Так быстрее и меньшие кратные уже вычеркнуты меньшими простыми", "Ошибка", "Чтобы не вычеркнуть i", "Без разницы"], "answer": 0, "hints": ["Возьми i = 5.", "10, 15, 20 — кратны 2 или 3.", "Их уже вычеркнули.", "Первое новое — 25.", "С i²."], "expl": "Кратные i меньше i² имеют меньший простой делитель и уже вычеркнуты."}, {"id": "31-p1", "type": "predict", "title": "Евклид", "q": "Что выведет код?", "code": "def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\nprint(gcd(48, 18))", "answer": "6", "hints": ["48 % 18 = 12.", "18 % 12 = 6.", "12 % 6 = 0.", "Возвращаем a.", "6."], "expl": "(48,18) → (18,12) → (12,6) → (6,0)."}, {"id": "31-k1", "type": "code", "title": "Число простых", "q": "Сколько простых строго меньше n? n до 5·10⁶.", "fn": "count_primes", "starter": "def count_primes(n):\n    pass\n", "tests": [{"args": [10], "exp": 4, "hidden": false, "case": ""}, {"args": [0], "exp": 0, "hidden": true, "case": "ноль"}, {"args": [2], "exp": 0, "hidden": true, "case": "строго меньше"}, {"args": [100], "exp": 25, "hidden": false, "case": ""}], "ref": "def count_primes(n):\n    if n < 3:\n        return 0\n    is_p = bytearray([1]) * n\n    is_p[0] = is_p[1] = 0\n    for i in range(2, int(n ** 0.5) + 1):\n        if is_p[i]:\n            is_p[i * i::i] = bytes(len(range(i * i, n, i)))\n    return sum(is_p)\n", "hints": ["Решето Эратосфена.", "Внешний цикл до √n.", "Вычёркивай с i², шаг i.", "Срез быстрее вложенного цикла.", "n < 3 — 0."], "expl": "Решето: O(n log log n).", "compare": "exact", "leetcode": 204, "speed": {"gen": "ARGS=[2000000]"}}, {"id": "31-k2", "type": "code", "title": "Быстрая степень", "q": "Верни x в степени n (целые, n может быть отрицательным) — результат как float, сравнение с точностью.", "fn": "my_pow", "starter": "def my_pow(x, n):\n    pass\n", "tests": [{"args": [2.0, 10], "exp": 1024.0, "hidden": false, "case": ""}, {"args": [2.0, -2], "exp": 0.25, "hidden": false, "case": ""}, {"args": [1.0, 2147483647], "exp": 1.0, "hidden": true, "case": "огромная степень"}, {"args": [3.0, 0], "exp": 1.0, "hidden": true, "case": "ноль"}], "ref": "def my_pow(x, n):\n    if n < 0:\n        x, n = 1 / x, -n\n    res = 1.0\n    while n:\n        if n & 1:\n            res *= x\n        x *= x\n        n >>= 1\n    return res\n", "hints": ["Наивно — n умножений, слишком много.", "x^n = (x²)^(n/2).", "Смотри на биты n.", "Бит 1 — домножь res.", "Отрицательная — 1/x."], "expl": "Возведение в квадрат: O(log n).", "compare": "float", "leetcode": 50}], "test": [{"q": "Сложность алгоритма Евклида:", "options": ["O(n)", "O(log min(a, b))", "O(√n)", "O(1)"], "answer": 1}, {"q": "Решето Эратосфена работает за:", "options": ["O(n²)", "O(n log log n)", "O(√n)", "O(log n)"], "answer": 1}, {"q": "pow(a, b, m) в Python:", "options": ["O(b)", "O(log b)", "O(1)", "O(b²)"], "answer": 1}, {"q": "Проверка простоты перебором делителей до:", "options": ["n", "√n", "n/2 обязательно", "log n"], "answer": 1}, {"q": "lcm(a, b) =", "options": ["a·b", "a // gcd(a, b) * b", "gcd(a, b)", "a + b"], "answer": 1}]}, {"title": "Глава 32. Строки", "short": "Строки", "part": "Часть VIII · Приёмы и стратегия", "cards": [{"title": "Инструменты для строк", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Приём<\/th>\n<th>Глава<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>анаграммы, частоты<\/td>\n<td>Counter / массив из 26<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>палиндром<\/td>\n<td>два указателя с краёв<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>самая длинная подстрока без повторов<\/td>\n<td>скользящее окно<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>поиск образца<\/td>\n<td><strong>KMP<\/strong> / Рабин-Карп<\/td>\n<td>32<\/td>\n<\/tr>\n<tr>\n<td>самый длинный палиндром (5)<\/td>\n<td>расширение от центра<\/td>\n<td>32<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Строки в Python неизменяемы: <code>s += c<\/code> в цикле — O(n²), собирай список и <code>''.join<\/code>.<\/p>"}, {"title": "KMP: префикс-функция", "html": "<p><code>pi[i]<\/code> — длина наибольшего собственного префикса <code>s[:i+1]<\/code>, который одновременно его суффикс. При несовпадении не откатываемся в тексте, а прыгаем по <code>pi<\/code>.<\/p>\n<pre><code class=\"language-python\">def prefix_function(s):\n    pi = [0] * len(s)\n    k = 0\n    for i in range(1, len(s)):\n        while k and s[i] != s[k]:\n            k = pi[k - 1]             # откат по уже известному\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n    return pi\n\ndef find(text, pat):              # 28\n    s = pat + '#' + text\n    pi = prefix_function(s)\n    m = len(pat)\n    for i in range(m + 1, len(s)):\n        if pi[i] == m:\n            return i - 2 * m\n    return -1\n<\/code><\/pre>\n<p>O(n + m). Для <code>aabaaab<\/code>: pi = [0,1,0,1,2,2,3].<\/p>"}, {"title": "Палиндромы от центра", "html": "<pre><code class=\"language-python\">def longest_palindrome(s):        # 5\n    best = ''\n    for c in range(len(s)):\n        for l, r in ((c, c), (c, c + 1)):     # нечётный и чётный центр\n            while l &gt;= 0 and r &lt; len(s) and s[l] == s[r]:\n                l -= 1; r += 1\n            if r - l - 1 &gt; len(best):\n                best = s[l + 1:r]\n    return best\n<\/code><\/pre>\n<p>O(n²), O(1) памяти. Ошибки: забыть чётные центры; <code>s[i:j]<\/code> в цикле — копия, O(длина).<\/p>"}], "viz": "kmp", "tasks": [{"id": "32-p1", "type": "predict", "title": "Префикс-функция", "q": "Что выведет код?", "code": "def pf(s):\n    pi, k = [0] * len(s), 0\n    for i in range(1, len(s)):\n        while k and s[i] != s[k]:\n            k = pi[k - 1]\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n    return pi\nprint(pf('abab'))", "answer": "[0, 0, 1, 2]", "hints": ["pi[0] = 0.", "'ab' — нет общего префикса-суффикса.", "'aba' — 'a', длина 1.", "'abab' — 'ab', длина 2.", "[0, 0, 1, 2]."], "expl": "Для «abab»: 0, 0, 1, 2."}, {"id": "32-c1", "type": "choice", "title": "Конкатенация", "q": "Почему s += c в цикле плохо?", "options": ["Ошибка синтаксиса", "Строки неизменяемы — каждое += копирует, O(n²)", "Медленный print", "Нормально"], "answer": 1, "hints": ["Можно ли изменить строку на месте?", "Нет.", "Значит, создаётся новая.", "Копия длины растёт.", "Сумма — квадрат."], "expl": "Каждое += создаёт новую строку; используй список и join."}, {"id": "32-k1", "type": "code", "title": "Поиск образца", "q": "Индекс первого вхождения pat в text или -1. Длины до 10⁵ — нужно линейно (KMP); text.find не используй.", "fn": "find_index", "starter": "def find_index(text, pat):\n    pass\n", "tests": [{"args": ["sadbutsad", "sad"], "exp": 0, "hidden": false, "case": ""}, {"args": ["leetcode", "leeto"], "exp": -1, "hidden": false, "case": ""}, {"args": ["aaab", "aab"], "exp": 1, "hidden": true, "case": "откат"}, {"args": ["abc", "c"], "exp": 2, "hidden": false, "case": ""}], "ref": "def find_index(text, pat):\n    s = pat + '\\x00' + text\n    pi, k = [0] * len(s), 0\n    m = len(pat)\n    for i in range(1, len(s)):\n        while k and s[i] != s[k]:\n            k = pi[k - 1]\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n        if k == m:\n            return i - 2 * m\n    return -1\n", "hints": ["Склей pat + разделитель + text.", "Посчитай префикс-функцию.", "pi[i] == len(pat) — нашли.", "Позиция: i − 2m.", "Разделитель, которого нет в строках."], "expl": "KMP: O(n + m).", "compare": "exact", "leetcode": 28, "speed": {"gen": "ARGS=['a' * 200000 + 'b', 'a' * 100000 + 'b']"}}, {"id": "32-k2", "type": "code", "title": "Самый длинный палиндром", "q": "Самая длинная палиндромная подстрока (если несколько — самая левая).", "fn": "longest_palindrome", "starter": "def longest_palindrome(s):\n    pass\n", "tests": [{"args": ["babad"], "exp": "bab", "hidden": false, "case": ""}, {"args": ["cbbd"], "exp": "bb", "hidden": false, "case": ""}, {"args": ["a"], "exp": "a", "hidden": true, "case": "один символ"}, {"args": ["abacdfgdcaba"], "exp": "aba", "hidden": true, "case": "не весь"}], "ref": "def longest_palindrome(s):\n    best = ''\n    for c in range(len(s)):\n        for l, r in ((c, c), (c, c + 1)):\n            while l >= 0 and r < len(s) and s[l] == s[r]:\n                l -= 1\n                r += 1\n            if r - l - 1 > len(best):\n                best = s[l + 1:r]\n    return best\n", "hints": ["Каждый палиндром имеет центр.", "Центров 2n − 1: символы и промежутки.", "Расширяйся, пока края равны.", "Обновляй лучший.", "Строгое > — самый левый."], "expl": "Расширение от центра: O(n²).", "compare": "exact", "leetcode": 5}], "test": [{"q": "Сложность KMP:", "options": ["O(n·m)", "O(n + m)", "O(n log m)", "O(m²)"], "answer": 1}, {"q": "Самая длинная подстрока без повторов:", "options": ["KMP", "скользящее окно", "ДП", "сортировка"], "answer": 1}, {"q": "Центров у палиндромов в строке длины n:", "options": ["n", "2n − 1", "n²", "n/2"], "answer": 1}, {"q": "Собирать строку в цикле правильно через:", "options": ["s += c", "список + ''.join", "str.replace", "f-строку"], "answer": 1}, {"q": "pi[i] — это:", "options": ["позиция совпадения", "длина наибольшего префикса, равного суффиксу", "число вхождений", "хеш"], "answer": 1}]}, {"title": "Глава 33. Стратегия собеса", "short": "Стратегия собеса", "part": "Часть VIII · Приёмы и стратегия", "cards": [{"title": "Шесть шагов на собесе", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>Что делать<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Уточнить<\/td>\n<td>входы, пределы, пустые/отрицательные, дубликаты, формат ответа<\/td>\n<td>2–3 мин<\/td>\n<\/tr>\n<tr>\n<td>2. Примеры<\/td>\n<td>разобрать свой маленький и граничный пример<\/td>\n<td>2 мин<\/td>\n<\/tr>\n<tr>\n<td>3. Брутфорс<\/td>\n<td>назвать решение «в лоб» и его сложность<\/td>\n<td>1–2 мин<\/td>\n<\/tr>\n<tr>\n<td>4. Оптимизация<\/td>\n<td>найти узкое место, подобрать технику<\/td>\n<td>5–10 мин<\/td>\n<\/tr>\n<tr>\n<td>5. Код<\/td>\n<td>писать чисто, проговаривая<\/td>\n<td>10–15 мин<\/td>\n<\/tr>\n<tr>\n<td>6. Проверка<\/td>\n<td>прогнать пример вручную, края, сложность<\/td>\n<td>5 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Говори вслух: интервьюер оценивает ход мысли не меньше кода.<\/p>"}, {"title": "Ограничения подсказывают технику", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>n<\/th>\n<th>Допустимая сложность<\/th>\n<th>Кандидаты<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>≤ 20<\/td>\n<td>O(2ⁿ), O(n!)<\/td>\n<td>перебор, backtracking, маски<\/td>\n<\/tr>\n<tr>\n<td>≤ 500<\/td>\n<td>O(n³)<\/td>\n<td>ДП по интервалам, Флойд<\/td>\n<\/tr>\n<tr>\n<td>≤ 5·10³<\/td>\n<td>O(n²)<\/td>\n<td>ДП 2D, пары<\/td>\n<\/tr>\n<tr>\n<td>≤ 10⁵–10⁶<\/td>\n<td>O(n log n), O(n)<\/td>\n<td>сортировка, куча, окно, хеш, бинпоиск<\/td>\n<\/tr>\n<tr>\n<td>≥ 10⁹<\/td>\n<td>O(log n), O(1)<\/td>\n<td>бинпоиск по ответу, математика<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ключевые слова: «отсортирован» → два указателя / бинпоиск; «подмассив» → окно / префиксы; «k наибольших» → куча; «все варианты» → backtracking; «минимум/способы» → ДП; «связность» → BFS/DFS/DSU; «зависимости» → топосорт.<\/p>"}, {"title": "Если застрял", "html": "<ul>\n<li>Реши для n = 1, 2, 3 руками и найди закономерность.<\/li>\n<li>Спроси себя: что я считаю повторно? → хеш / префикс / кеш.<\/li>\n<li>Отсортируй — часто открывает два указателя или жадность.<\/li>\n<li>Переверни задачу: идти с конца, считать дополнение.<\/li>\n<li>Предложи брутфорс и улучшай — рабочее O(n²) лучше недописанного O(n).<\/li>\n<\/ul>\n<p>Финал: проговори время и память, назови края, которые проверил, предложи тесты.<\/p>"}], "viz": "growth", "tasks": [{"id": "33-c1", "type": "choice", "title": "Ограничения", "q": "n ≤ 10⁵. Какая сложность допустима?", "options": ["O(2ⁿ)", "O(n²) с запасом", "O(n log n)", "O(n³)"], "answer": 2, "hints": ["Примерно 10⁸ операций в секунду (в Python меньше).", "n² = 10¹⁰ — много.", "n log n ≈ 1.7·10⁶.", "Это проходит.", "O(n log n)."], "expl": "При 10⁵ квадрат уже не проходит; нужно O(n log n) или O(n)."}, {"id": "33-c2", "type": "choice", "title": "k наибольших", "q": "«Найти k наибольших элементов» — первая мысль:", "options": ["ДП", "куча размера k", "DSU", "KMP"], "answer": 1, "hints": ["k наибольших.", "Нужна структура с быстрым минимумом.", "Держи k лучших.", "Min-куча размера k.", "Куча."], "expl": "Min-куча размера k: O(n log k)."}, {"id": "33-c3", "type": "choice", "title": "Первый шаг", "q": "Первое, что стоит сделать после прочтения задачи:", "options": ["писать код", "уточнить входы, ограничения и края", "назвать оптимальное решение", "молчать и думать"], "answer": 1, "hints": ["Чего не хватает в условии?", "Пределы n, пустые входы, дубликаты.", "От этого зависит техника.", "Уточнение — первый шаг.", "Уточнить."], "expl": "Уточнение задаёт ограничения и края — от них зависит решение."}, {"id": "33-c4", "type": "choice", "title": "Сумма k", "q": "«Количество подмассивов с суммой k» — техника:", "options": ["два указателя", "префиксные суммы + хеш", "бинпоиск", "куча"], "answer": 1, "hints": ["Подмассив — сумма на отрезке.", "Отрезок = разность префиксов.", "Числа могут быть отрицательными — окно не работает.", "Ищем pref − k в словаре.", "Префиксы + хеш."], "expl": "pref[j] − pref[i] = k — считаем префиксы в словаре."}], "test": [{"q": "n ≤ 20 подсказывает:", "options": ["O(n)", "перебор 2ⁿ", "O(log n)", "только хеш"], "answer": 1}, {"q": "«Отсортированный массив, найти пару»:", "options": ["ДП", "два указателя", "DSU", "BFS"], "answer": 1}, {"q": "Брутфорс на собесе стоит:", "options": ["не упоминать", "назвать с оценкой и улучшать", "сразу закодить", "скрыть"], "answer": 1}, {"q": "«Зависимости между задачами»:", "options": ["топосортировка", "KMP", "Кадане", "куча"], "answer": 0}, {"q": "Последний шаг:", "options": ["сдать молча", "прогнать пример, края и назвать сложность", "переписать на другой язык", "удалить код"], "answer": 1}]}, {"title": "Глава 34. Проектирование структур", "short": "Проектирование структур", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "Как устроены такие задачи", "html": "<p>Просят реализовать <strong>класс<\/strong> с методами за заданную сложность: <code>get/put за O(1)<\/code>, <code>getMin за O(1)<\/code>, итератор с ленивым <code>next<\/code>. Проверяют не трюк, а умение <strong>скомбинировать<\/strong> готовые структуры.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>Комбинация<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>LRU-кеш (146)<\/td>\n<td>хеш + двусвязный список<\/td>\n<td>O(1) на операцию<\/td>\n<\/tr>\n<tr>\n<td>MinStack (155)<\/td>\n<td>стек пар (значение, текущий минимум)<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>Очередь на двух стеках (232)<\/td>\n<td>входной и выходной стек<\/td>\n<td>O(1) амортизированно<\/td>\n<\/tr>\n<tr>\n<td>Итератор вложенного списка (341)<\/td>\n<td>стек итераторов<\/td>\n<td>O(1) амортизированно<\/td>\n<\/tr>\n<tr>\n<td>Randomized Set (380)<\/td>\n<td>список + словарь индексов<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Порядок ответа: уточнить операции и сложность → назвать структуры → показать, почему каждая операция O(1) → код.<\/p>"}, {"title": "LRU-кеш", "html": "<p>Нужно: <code>get(key)<\/code> и <code>put(key, value)<\/code> за O(1); при переполнении выбрасывать <strong>давно не использованный<\/strong> ключ.<\/p>\n<ul>\n<li>Словарь даёт поиск за O(1), но не помнит порядок использования.<\/li>\n<li>Двусвязный список хранит порядок и умеет удалять узел из середины за O(1), если есть ссылка на узел.<\/li>\n<li>Вместе: <code>ключ → узел<\/code>, при обращении узел переносим в конец, вытесняем из начала.<\/li>\n<\/ul>\n<p>В Python это уже собрано в <code>OrderedDict<\/code>:<\/p>\n<pre><code class=\"language-python\">from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap, self.d = capacity, OrderedDict()\n    def get(self, key):\n        if key not in self.d:\n            return -1\n        self.d.move_to_end(key)          # стал самым свежим\n        return self.d[key]\n    def put(self, key, value):\n        if key in self.d:\n            self.d.move_to_end(key)\n        self.d[key] = value\n        if len(self.d) &gt; self.cap:\n            self.d.popitem(last=False)   # самый старый — в начале\n<\/code><\/pre>\n<p>На собесе часто просят без <code>OrderedDict<\/code> — тогда пишешь узлы <code>prev/next<\/code> с фиктивными головой и хвостом.<\/p>"}, {"title": "MinStack и итераторы", "html": "<p><strong>MinStack<\/strong>: в каждом элементе стека храним минимум «до него включительно». После <code>pop<\/code> старый минимум восстанавливается сам.<\/p>\n<pre><code class=\"language-python\">def push(self, x):\n    m = min(x, self.st[-1][1]) if self.st else x\n    self.st.append((x, m))\n<\/code><\/pre>\n<p><strong>Ленивый итератор<\/strong> не разворачивает всё заранее: держит стек итераторов и находит следующий элемент только в <code>hasNext<\/code>. Память — глубина вложенности, а не размер данных.<\/p>\n<p><strong>Очередь на двух стеках<\/strong>: <code>push<\/code> в <code>inp<\/code>; при <code>pop<\/code>, если <code>out<\/code> пуст, переливаем всё из <code>inp<\/code>. Каждый элемент переливается один раз — амортизированно O(1).<\/p>\n<p>Ошибки: хранить минимум одной переменной (ломается после pop); в LRU забыть обновить порядок при <code>put<\/code> существующего ключа; <code>hasNext<\/code> с побочным эффектом, который теряет элемент при двойном вызове.<\/p>"}], "viz": "lru", "tasks": [{"id": "34-c1", "type": "choice", "title": "Двусвязный", "q": "Почему LRU-кешу нужен именно двусвязный список, а не обычный?", "options": ["Он быстрее в целом", "Удалить узел из середины за O(1) можно только зная соседа слева", "Чтобы хранить ключи", "Не нужен"], "answer": 1, "hints": ["Что делаем при get?", "Переносим узел в конец.", "Его надо вырезать из середины.", "Для этого нужен prev.", "В односвязном prev не найти за O(1)."], "expl": "Вырезание узла за O(1) требует ссылки на предыдущий — двусвязный список."}, {"id": "34-c2", "type": "choice", "title": "Один минимум", "q": "MinStack хранит минимум одной переменной. Что сломается?", "options": ["push", "getMin после pop минимума", "top", "ничего"], "answer": 1, "hints": ["Положим 3, 1, затем pop.", "Минимум был 1.", "Какой минимум теперь?", "3, но переменная помнит 1.", "Нужна история минимумов."], "expl": "После удаления минимума нужен предыдущий минимум — храним его в каждом элементе."}, {"id": "34-k1", "type": "code", "title": "LRU-кеш", "q": "Реализуй LRUCache: get(key) → значение или -1, put(key, value). Обе операции O(1). Драйвер lru_ops уже написан — он выполняет команды как на LeetCode.", "fn": "lru_ops", "starter": "class LRUCache:\n    def __init__(self, capacity):\n        pass\n\n    def get(self, key):\n        pass\n\n    def put(self, key, value):\n        pass\n\n\ndef lru_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"LRUCache\":\n            obj = LRUCache(*a); out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n", "tests": [{"args": [["LRUCache", "put", "put", "get", "put", "get", "put", "get", "get", "get"], [[2], [1, 1], [2, 2], [1], [3, 3], [2], [4, 4], [1], [3], [4]]], "exp": [null, null, null, 1, null, -1, null, -1, 3, 4], "hidden": false, "case": ""}, {"args": [["LRUCache", "put", "put", "put", "get", "get"], [[2], [1, 1], [2, 2], [1, 10], [1], [2]]], "exp": [null, null, null, null, 10, 2], "hidden": true, "case": "обновление ключа"}, {"args": [["LRUCache", "put", "put", "get", "put", "get", "get"], [[2], [1, 1], [2, 2], [1], [3, 3], [2], [1]]], "exp": [null, null, null, 1, null, -1, 1], "hidden": true, "case": "get освежает"}, {"args": [["LRUCache", "put", "get", "put", "get", "get"], [[1], [2, 1], [2], [3, 2], [2], [3]]], "exp": [null, null, 1, null, -1, 2], "hidden": true, "case": "ёмкость 1"}], "ref": "from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.d = OrderedDict()\n\n    def get(self, key):\n        if key not in self.d:\n            return -1\n        self.d.move_to_end(key)\n        return self.d[key]\n\n    def put(self, key, value):\n        if key in self.d:\n            self.d.move_to_end(key)\n        self.d[key] = value\n        if len(self.d) > self.cap:\n            self.d.popitem(last=False)\n\n\ndef lru_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"LRUCache\":\n            obj = LRUCache(*a); out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n", "hints": ["Словарь даёт O(1) поиск.", "Нужен ещё порядок использования.", "OrderedDict = словарь + двусвязный список.", "get и put существующего — move_to_end.", "Переполнение — popitem(last=False)."], "expl": "Хеш + двусвязный список: O(1) на операцию.", "compare": "exact", "leetcode": 146, "speed": {"gen": "n=100000\nops=['LRUCache']+['put','get']*n\nargs=[[50000]]\nfor i in range(n):\n    args.append([i, i]); args.append([i // 2])\nARGS=[ops, args]"}}, {"id": "34-k2", "type": "code", "title": "MinStack", "q": "Реализуй стек с push, pop, top и getMin — всё за O(1).", "fn": "min_stack_ops", "starter": "class MinStack:\n    def __init__(self):\n        pass\n\n    def push(self, x):\n        pass\n\n    def pop(self):\n        pass\n\n    def top(self):\n        pass\n\n    def getMin(self):\n        pass\n\n\ndef min_stack_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"MinStack\":\n            obj = MinStack(*a); out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n", "tests": [{"args": [["MinStack", "push", "push", "push", "getMin", "pop", "top", "getMin"], [[], [-2], [0], [-3], [], [], [], []]], "exp": [null, null, null, null, -3, null, 0, -2], "hidden": false, "case": ""}, {"args": [["MinStack", "push", "push", "getMin", "pop", "getMin"], [[], [1], [1], [], [], []]], "exp": [null, null, null, 1, null, 1], "hidden": true, "case": "повтор минимума"}, {"args": [["MinStack", "push", "push", "push", "pop", "getMin"], [[], [5], [3], [7], [], []]], "exp": [null, null, null, null, null, 3], "hidden": true, "case": "pop не минимума"}], "ref": "class MinStack:\n    def __init__(self):\n        self.st = []                 # пары (значение, минимум до него)\n\n    def push(self, x):\n        m = min(x, self.st[-1][1]) if self.st else x\n        self.st.append((x, m))\n\n    def pop(self):\n        self.st.pop()\n\n    def top(self):\n        return self.st[-1][0]\n\n    def getMin(self):\n        return self.st[-1][1]\n\n\ndef min_stack_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"MinStack\":\n            obj = MinStack(*a); out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n", "hints": ["Одной переменной для минимума мало.", "Храни минимум для каждого уровня стека.", "push: m = min(x, предыдущий минимум).", "Пары (значение, минимум).", "pop восстанавливает минимум сам."], "expl": "Стек пар: всё O(1).", "compare": "exact", "leetcode": 155}, {"id": "34-k3", "type": "code", "title": "Итератор вложенного списка", "q": "Реализуй NestedIterator над вложенными списками целых: hasNext() и next(). Не разворачивай всё в конструкторе — используй стек итераторов.", "fn": "flatten", "starter": "class NestedIterator:\n    def __init__(self, nested):\n        pass\n\n    def hasNext(self):\n        pass\n\n    def next(self):\n        pass\n\ndef flatten(nested):\n    it, out = NestedIterator(nested), []\n    while it.hasNext():\n        out.append(it.next())\n    return out\n", "tests": [{"args": [[[1, 1], 2, [1, 1]]], "exp": [1, 1, 2, 1, 1], "hidden": false, "case": ""}, {"args": [[1, [4, [6]]]], "exp": [1, 4, 6], "hidden": false, "case": ""}, {"args": [[[], [[]], 3]], "exp": [3], "hidden": true, "case": "пустые списки"}, {"args": [[]], "exp": [], "hidden": true, "case": "совсем пусто"}], "ref": "class NestedIterator:\n    def __init__(self, nested):\n        self.st = [iter(nested)]\n        self.nxt = None\n\n    def hasNext(self):\n        while self.nxt is None and self.st:\n            x = next(self.st[-1], StopIteration)\n            if x is StopIteration:\n                self.st.pop()\n            elif isinstance(x, list):\n                self.st.append(iter(x))\n            else:\n                self.nxt = x\n        return self.nxt is not None\n\n    def next(self):\n        self.hasNext()\n        x, self.nxt = self.nxt, None\n        return x\n\ndef flatten(nested):\n    it, out = NestedIterator(nested), []\n    while it.hasNext():\n        out.append(it.next())\n    return out\n", "hints": ["Стек итераторов: верхний — текущий уровень.", "hasNext ищет следующее число.", "Встретил список — положи его итератор в стек.", "Итератор кончился — сними его.", "Найденное число держи в self.nxt."], "expl": "Ленивый обход: O(1) амортизированно, память — глубина.", "compare": "exact", "leetcode": 341}], "test": [{"q": "LRU-кеш строят из:", "options": ["кучи и стека", "хеша и двусвязного списка", "массива и бинпоиска", "Trie"], "answer": 1}, {"q": "Какой элемент выбрасывает LRU при переполнении?", "options": ["самый новый", "давно не использованный", "наименьший", "случайный"], "answer": 1}, {"q": "Очередь на двух стеках: сложность pop:", "options": ["O(n) всегда", "O(1) амортизированно", "O(log n)", "O(n²)"], "answer": 1}, {"q": "MinStack хранит в каждом элементе:", "options": ["индекс", "минимум до него включительно", "максимум", "размер"], "answer": 1}, {"q": "Ленивый итератор тратит память на:", "options": ["все элементы", "глубину вложенности", "ничего", "квадрат размера"], "answer": 1}]}, {"title": "Глава 35. Quickselect", "short": "Quickselect", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "k-й элемент без полной сортировки", "html": "<p>Задача «k-й наибольший» (215): сортировка — O(n log n), куча размера k — O(n log k). <strong>Quickselect<\/strong> — O(n) в среднем.<\/p>\n<p>Идея — разбиение из быстрой сортировки (глава 9): после разбиения опорный элемент стоит на своём <strong>окончательном<\/strong> месте. Если это место — k, ответ найден; иначе продолжаем только в <strong>одной<\/strong> половине.<\/p>\n<p>Сумма работы: <code>n + n/2 + n/4 + … ≈ 2n<\/code>, то есть O(n).<\/p>\n<p>Худший случай — O(n²) при неудачных опорных; случайный выбор опорного делает его практически невозможным.<\/p>"}, {"title": "Код (трёхчастное разбиение)", "html": "<pre><code class=\"language-python\">import random\n\ndef kth_largest(nums, k):\n    target = len(nums) - k            # индекс в отсортированном по возрастанию\n    lo, hi = 0, len(nums) - 1\n    a = nums[:]\n    while True:\n        p = a[random.randint(lo, hi)]\n        lt, i, gt = lo, lo, hi        # [lo..lt) &lt; p, [lt..i) == p, (gt..hi] &gt; p\n        while i &lt;= gt:\n            if a[i] &lt; p:\n                a[lt], a[i] = a[i], a[lt]; lt += 1; i += 1\n            elif a[i] &gt; p:\n                a[i], a[gt] = a[gt], a[i]; gt -= 1\n            else:\n                i += 1\n        if target &lt; lt: hi = lt - 1\n        elif target &gt; gt: lo = gt + 1\n        else: return p\n<\/code><\/pre>\n<p>Трёхчастное разбиение спасает от массивов из одинаковых чисел (иначе O(n²)).<\/p>"}, {"title": "Когда что выбирать", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Подход<\/th>\n<th>Время<\/th>\n<th>Память<\/th>\n<th>Когда<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>сортировка<\/td>\n<td>O(n log n)<\/td>\n<td>O(n)<\/td>\n<td>просто и надёжно<\/td>\n<\/tr>\n<tr>\n<td>куча размера k<\/td>\n<td>O(n log k)<\/td>\n<td>O(k)<\/td>\n<td>поток данных, k мало<\/td>\n<\/tr>\n<tr>\n<td>quickselect<\/td>\n<td>O(n) в среднем<\/td>\n<td>O(1)<\/td>\n<td>один запрос, весь массив в памяти<\/td>\n<\/tr>\n<tr>\n<td>медиана медиан<\/td>\n<td>O(n) гарантированно<\/td>\n<td>O(log n)<\/td>\n<td>спросят теорию — назови<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Применения: k ближайших точек (973), медиана, top-k частых (347, через bucket sort или quickselect по частотам).<\/p>\n<p>Ошибки: путать k-й наибольший и k-й наименьший (индекс <code>n − k<\/code>); детерминированный опорный на отсортированном входе; рекурсия в обе половины (это уже сортировка).<\/p>"}], "viz": "quickselect", "tasks": [{"id": "35-c1", "type": "choice", "title": "Одна половина", "q": "Почему quickselect O(n), а quicksort O(n log n)?", "options": ["Разные разбиения", "Quickselect продолжает только в одной половине", "Quickselect не сравнивает", "Они одинаковы"], "answer": 1, "hints": ["Сколько половин обрабатывает quicksort?", "Обе.", "А quickselect?", "Только ту, где лежит k.", "n + n/2 + … ≈ 2n."], "expl": "Одна половина на уровень: сумма n + n/2 + … = O(n)."}, {"id": "35-c2", "type": "choice", "title": "Индекс", "q": "k-й наибольший в массиве длины n — это индекс в отсортированном по возрастанию:", "options": ["k", "k − 1", "n − k", "n − k − 1"], "answer": 2, "hints": ["1-й наибольший — максимум.", "Он на индексе n − 1.", "Подставь k = 1.", "n − k = n − 1.", "n − k."], "expl": "k-й наибольший стоит на позиции n − k по возрастанию."}, {"id": "35-k1", "type": "code", "title": "k-й наибольший", "q": "Верни k-й наибольший элемент. n до 10⁵ — нужно в среднем O(n).", "fn": "kth_largest", "starter": "import random\n\ndef kth_largest(nums, k):\n    pass\n", "tests": [{"args": [[3, 2, 1, 5, 6, 4], 2], "exp": 5, "hidden": false, "case": ""}, {"args": [[3, 2, 3, 1, 2, 4, 5, 5, 6], 4], "exp": 4, "hidden": false, "case": ""}, {"args": [[1], 1], "exp": 1, "hidden": true, "case": "один элемент"}, {"args": [[2, 2, 2, 2], 3], "exp": 2, "hidden": true, "case": "все равны"}], "ref": "import random\n\ndef kth_largest(nums, k):\n    target = len(nums) - k\n    lo, hi = 0, len(nums) - 1\n    a = nums[:]\n    while True:\n        p = a[random.randint(lo, hi)]\n        lt, i, gt = lo, lo, hi\n        while i <= gt:\n            if a[i] < p:\n                a[lt], a[i] = a[i], a[lt]\n                lt += 1\n                i += 1\n            elif a[i] > p:\n                a[i], a[gt] = a[gt], a[i]\n                gt -= 1\n            else:\n                i += 1\n        if target < lt:\n            hi = lt - 1\n        elif target > gt:\n            lo = gt + 1\n        else:\n            return p\n", "hints": ["Целевой индекс n − k.", "Случайный опорный элемент.", "Разбей на <, =, > опорного.", "Продолжай в той части, где target.", "Попал в «=» — ответ."], "expl": "Quickselect с трёхчастным разбиением: O(n) в среднем.", "compare": "exact", "leetcode": 215, "speed": {"gen": "import random\nrandom.seed(3)\nARGS=[[random.randint(-10**4, 10**4) for _ in range(100000)], 50000]"}}, {"id": "35-k2", "type": "code", "title": "k ближайших к началу координат", "q": "Верни k точек, ближайших к (0, 0), отсортированными по (расстояние, x, y).", "fn": "k_closest", "starter": "import heapq\n\ndef k_closest(points, k):\n    pass\n", "tests": [{"args": [[[1, 3], [-2, 2]], 1], "exp": [[-2, 2]], "hidden": false, "case": ""}, {"args": [[[3, 3], [5, -1], [-2, 4]], 2], "exp": [[3, 3], [-2, 4]], "hidden": false, "case": ""}, {"args": [[[0, 1], [1, 0]], 2], "exp": [[0, 1], [1, 0]], "hidden": true, "case": "равные расстояния"}], "ref": "import heapq\n\ndef k_closest(points, k):\n    best = heapq.nsmallest(k, points, key=lambda p: (p[0] ** 2 + p[1] ** 2, p[0], p[1]))\n    return best\n", "hints": ["Расстояние сравнивай без корня: x² + y².", "Нужны k наименьших.", "Куча размера k или quickselect.", "heapq.nsmallest делает кучу за тебя.", "Ключ — кортеж (dist, x, y)."], "expl": "nsmallest — куча размера k: O(n log k). Quickselect даёт O(n) в среднем.", "compare": "exact", "leetcode": 973}], "test": [{"q": "Средняя сложность quickselect:", "options": ["O(n log n)", "O(n)", "O(log n)", "O(n²)"], "answer": 1}, {"q": "Худший случай quickselect:", "options": ["O(n)", "O(n²)", "O(n log n)", "O(2ⁿ)"], "answer": 1}, {"q": "Трёхчастное разбиение защищает от:", "options": ["отрицательных чисел", "множества одинаковых элементов", "пустого массива", "переполнения"], "answer": 1}, {"q": "Для потока данных и малого k лучше:", "options": ["quickselect", "куча размера k", "сортировка", "бинпоиск"], "answer": 1}, {"q": "Опорный элемент выбирают случайно, чтобы:", "options": ["было красиво", "избежать худшего случая на неудачном входе", "экономить память", "сортировать"], "answer": 1}]}, {"title": "Глава 36. ДП по маскам и по отрезкам", "short": "ДП по маскам и по отрезкам", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "ДП по подмножествам (маскам)", "html": "<p>Когда n ≤ 20 и состояние — <strong>какое подмножество уже использовано<\/strong>, кодируем его битовой маской (глава 30). Состояний 2ⁿ, вместе с «где мы сейчас» — <code>2ⁿ · n<\/code>.<\/p>\n<p><strong>Коммивояжёр<\/strong>: <code>dp[mask][v]<\/code> — минимальная стоимость пройти вершины из <code>mask<\/code>, начав в 0 и закончив в v.<\/p>\n<pre><code class=\"language-python\">def tsp(dist):\n    n = len(dist)\n    INF = float('inf')\n    dp = [[INF] * n for _ in range(1 &lt;&lt; n)]\n    dp[1][0] = 0\n    for mask in range(1 &lt;&lt; n):\n        for v in range(n):\n            if dp[mask][v] == INF or not mask &gt;&gt; v &amp; 1:\n                continue\n            for u in range(n):\n                if not mask &gt;&gt; u &amp; 1:\n                    nm = mask | 1 &lt;&lt; u\n                    dp[nm][u] = min(dp[nm][u], dp[mask][v] + dist[v][u])\n    full = (1 &lt;&lt; n) - 1\n    return min(dp[full][v] + dist[v][0] for v in range(n))\n<\/code><\/pre>\n<p>O(2ⁿ · n²): для n = 15 это ~7·10⁶ — нормально; полный перебор 15! — нет.<\/p>"}, {"title": "ДП по отрезкам", "html": "<p><code>dp[l][r]<\/code> — ответ для отрезка <code>[l..r]<\/code>. Перебираем <strong>точку разреза<\/strong> или <strong>последнее действие<\/strong> внутри отрезка. Порядок — по возрастанию длины.<\/p>\n<p><strong>Лопание шариков<\/strong> (312): какой шарик в отрезке лопнет <strong>последним<\/strong> — тогда его соседи на момент взрыва — границы отрезка.<\/p>\n<pre><code class=\"language-python\">def max_coins(nums):\n    a = [1] + nums + [1]\n    n = len(a)\n    dp = [[0] * n for _ in range(n)]\n    for length in range(2, n):                  # длина открытого интервала\n        for l in range(0, n - length):\n            r = l + length\n            for k in range(l + 1, r):           # k лопает последним в (l, r)\n                dp[l][r] = max(dp[l][r], dp[l][k] + a[l] * a[k] * a[r] + dp[k][r])\n    return dp[0][n - 1]\n<\/code><\/pre>\n<p>O(n³). Тот же шаблон: оптимальное перемножение матриц, минимальная стоимость разрезать палку (1547), палиндромное разбиение.<\/p>"}, {"title": "Как узнать задачу", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Признак<\/th>\n<th>Техника<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>n ≤ 15–20, «посетить все», «назначить каждому»<\/td>\n<td>маска<\/td>\n<\/tr>\n<tr>\n<td>«последний / первый в отрезке», склеивание соседей<\/td>\n<td>отрезки<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 500, ответ зависит от внутреннего разреза<\/td>\n<td>отрезки, O(n³)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ошибки: в маске не проверить, что вершина уже в наборе; в отрезках идти по <code>l<\/code> и <code>r<\/code>, а не по длине — подзадачи ещё не посчитаны; в 312 думать о <strong>первом<\/strong> лопнувшем (соседи меняются, подзадачи не независимы).<\/p>"}], "viz": "intdp", "tasks": [{"id": "36-c1", "type": "choice", "title": "Состояния", "q": "Сколько состояний у ДП «маска + текущая вершина» для n вершин?", "options": ["n²", "2ⁿ · n", "n!", "2n"], "answer": 1, "hints": ["Сколько масок?", "2ⁿ.", "Для каждой — n вариантов текущей вершины.", "Перемножь.", "2ⁿ · n."], "expl": "2ⁿ подмножеств × n концов."}, {"id": "36-c2", "type": "choice", "title": "Последний", "q": "Почему в задаче про шарики перебирают последний лопнувший, а не первый?", "options": ["Так короче код", "Тогда соседи известны — границы отрезка, и половины независимы", "Первый всегда крайний", "Без разницы"], "answer": 1, "hints": ["Лопнем k первым.", "Соседи l и r станут соседями друг другу.", "Левая и правая части перестанут быть независимыми.", "А если k последний?", "Его соседи — границы отрезка."], "expl": "Последний лопнувший делит отрезок на независимые части с известными соседями."}, {"id": "36-k1", "type": "code", "title": "Коммивояжёр", "q": "dist — матрица расстояний n ≤ 12. Верни длину кратчайшего цикла из вершины 0 через все вершины обратно в 0.", "fn": "tsp", "starter": "def tsp(dist):\n    pass\n", "tests": [{"args": [[[0, 10, 15, 20], [10, 0, 35, 25], [15, 35, 0, 30], [20, 25, 30, 0]]], "exp": 80, "hidden": false, "case": ""}, {"args": [[[0, 1], [1, 0]]], "exp": 2, "hidden": false, "case": ""}, {"args": [[[0]]], "exp": 0, "hidden": true, "case": "одна вершина"}, {"args": [[[0, 1, 9], [9, 0, 1], [1, 9, 0]]], "exp": 3, "hidden": true, "case": "несимметричная"}], "ref": "def tsp(dist):\n    n = len(dist)\n    INF = float('inf')\n    dp = [[INF] * n for _ in range(1 << n)]\n    dp[1][0] = 0\n    for mask in range(1 << n):\n        for v in range(n):\n            d = dp[mask][v]\n            if d == INF:\n                continue\n            for u in range(n):\n                if not mask >> u & 1:\n                    nm = mask | 1 << u\n                    if d + dist[v][u] < dp[nm][u]:\n                        dp[nm][u] = d + dist[v][u]\n    full = (1 << n) - 1\n    return min(dp[full][v] + dist[v][0] for v in range(n))\n", "hints": ["dp[mask][v] — посетили mask, стоим в v.", "Старт: dp[1][0] = 0.", "Переход: добавь непосещённую u.", "Ответ: min(dp[full][v] + dist[v][0]).", "Перебор масок по возрастанию."], "expl": "ДП по маскам: O(2ⁿ · n²).", "compare": "exact", "speed": {"gen": "import random\nrandom.seed(5)\nn=11\nARGS=[[[0 if i==j else random.randint(1,100) for j in range(n)] for i in range(n)]]"}}, {"id": "36-k2", "type": "code", "title": "Лопание шариков", "q": "Лопнув шарик i, получаешь nums[i−1]·nums[i]·nums[i+1] (за краями — 1). Верни максимум монет.", "fn": "max_coins", "starter": "def max_coins(nums):\n    pass\n", "tests": [{"args": [[3, 1, 5, 8]], "exp": 167, "hidden": false, "case": ""}, {"args": [[1, 5]], "exp": 10, "hidden": false, "case": ""}, {"args": [[7]], "exp": 7, "hidden": true, "case": "один шарик"}, {"args": [[]], "exp": 0, "hidden": true, "case": "пусто"}], "ref": "def max_coins(nums):\n    a = [1] + nums + [1]\n    n = len(a)\n    dp = [[0] * n for _ in range(n)]\n    for length in range(2, n):\n        for l in range(0, n - length):\n            r = l + length\n            for k in range(l + 1, r):\n                v = dp[l][k] + a[l] * a[k] * a[r] + dp[k][r]\n                if v > dp[l][r]:\n                    dp[l][r] = v\n    return dp[0][n - 1]\n", "hints": ["Добавь единицы по краям.", "dp[l][r] — лучшее для шариков строго между l и r.", "k — последний лопнувший в (l, r).", "Монеты: a[l]·a[k]·a[r].", "Перебирай по длине интервала."], "expl": "ДП по отрезкам: O(n³).", "compare": "exact", "leetcode": 312}], "test": [{"q": "ДП по маскам уместно при n порядка:", "options": ["10⁵", "≤ 20", "10⁹", "любом"], "answer": 1}, {"q": "Сложность ДП коммивояжёра:", "options": ["O(n!)", "O(2ⁿ · n²)", "O(n³)", "O(n²)"], "answer": 1}, {"q": "В ДП по отрезкам считают в порядке:", "options": ["по l", "по возрастанию длины отрезка", "случайном", "по r убыванию"], "answer": 1}, {"q": "Лопание шариков: сложность", "options": ["O(n²)", "O(n³)", "O(2ⁿ)", "O(n log n)"], "answer": 1}, {"q": "Проверка «вершина u в маске»:", "options": ["mask & u", "mask >> u & 1", "mask | u", "mask ^ u"], "answer": 1}]}, {"title": "Глава 37. Дерево Фенвика и дерево отрезков", "short": "Дерево Фенвика и дерево отрезков", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "Зачем", "html": "<p>Префиксные суммы (глава 5) отвечают на сумму отрезка за O(1), но <strong>изменение<\/strong> элемента ломает их — пересчёт O(n). Когда запросов и изменений много вперемешку (10⁵ каждого), нужно O(log n) на оба.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Структура<\/th>\n<th>Запрос<\/th>\n<th>Изменение<\/th>\n<th>Что умеет<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>префиксные суммы<\/td>\n<td>O(1)<\/td>\n<td>O(n)<\/td>\n<td>статичный массив<\/td>\n<\/tr>\n<tr>\n<td><strong>Фенвик<\/strong> (BIT)<\/td>\n<td>O(log n)<\/td>\n<td>O(log n)<\/td>\n<td>суммы, количества (обратимые операции)<\/td>\n<\/tr>\n<tr>\n<td><strong>дерево отрезков<\/strong><\/td>\n<td>O(log n)<\/td>\n<td>O(log n)<\/td>\n<td>сумма, min, max, НОД, массовые изменения<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Дерево Фенвика", "html": "<p>Индексы с 1. <code>t[i]<\/code> хранит сумму отрезка длины <code>i &amp; -i<\/code> (младший бит), заканчивающегося в i.<\/p>\n<pre><code class=\"language-python\">def add(i, d):            # a[i] += d\n    while i &lt;= n:\n        t[i] += d\n        i += i &amp; -i       # к следующему отрезку, покрывающему i\n\ndef pref(i):              # сумма a[1..i]\n    s = 0\n    while i &gt; 0:\n        s += t[i]\n        i -= i &amp; -i       # отбросили младший бит\n    return s\n<\/code><\/pre>\n<p>Сумма <code>[l..r] = pref(r) − pref(l − 1)<\/code>. Оба цикла — не больше log n шагов: каждый раз меняется один бит.<\/p>\n<p>Применение кроме сумм: <strong>подсчёт инверсий<\/strong> и «сколько меньших справа» (315) — идём справа налево, <code>pref(x − 1)<\/code> считает уже встреченные меньшие x, затем <code>add(x, 1)<\/code>.<\/p>"}, {"title": "Дерево отрезков", "html": "<p>Бинарное дерево над массивом: лист — элемент, узел — агрегат детей. Хранится в массиве размера 2n (снизу вверх) или 4n (рекурсивно).<\/p>\n<pre><code class=\"language-python\">class SegTree:                      # минимум на отрезке, нерекурсивно\n    def __init__(self, a):\n        self.n = len(a)\n        self.t = [0] * self.n + a[:]\n        for i in range(self.n - 1, 0, -1):\n            self.t[i] = min(self.t[2 * i], self.t[2 * i + 1])\n    def update(self, i, v):\n        i += self.n; self.t[i] = v\n        while i &gt; 1:\n            i //= 2\n            self.t[i] = min(self.t[2 * i], self.t[2 * i + 1])\n    def query(self, l, r):          # min на [l, r)\n        res = float('inf'); l += self.n; r += self.n\n        while l &lt; r:\n            if l &amp; 1: res = min(res, self.t[l]); l += 1\n            if r &amp; 1: r -= 1; res = min(res, self.t[r])\n            l //= 2; r //= 2\n        return res\n<\/code><\/pre>\n<p>Для min/max Фенвик не подходит — операция необратима. Массовые изменения на отрезке — <strong>ленивые пометки<\/strong> (lazy propagation), это уровень олимпиад; на собесе достаточно назвать.<\/p>\n<p>Ошибки: путать индексацию с 0 и с 1 у Фенвика; полуинтервал <code>[l, r)<\/code> против <code>[l, r]<\/code>; в update Фенвика прибавлять новое значение, а не разницу.<\/p>"}], "viz": "fenwick", "tasks": [{"id": "37-c1", "type": "choice", "title": "Минимум", "q": "Почему Фенвик не годится для минимума на отрезке?", "options": ["Медленный", "Минимум необратим: нельзя «вычесть» префикс", "Нужна сортировка", "Годится"], "answer": 1, "hints": ["Как Фенвик получает отрезок [l..r]?", "pref(r) − pref(l − 1).", "Это вычитание.", "Можно ли «вычесть» минимум?", "Нет."], "expl": "Фенвик собирает отрезок разностью префиксов — нужна обратимая операция."}, {"id": "37-p1", "type": "predict", "title": "Младший бит", "q": "Что выведет код?", "code": "for i in [6, 8, 12]:\n    print(i & -i, end=' ')", "answer": "2 8 4", "hints": ["6 = 110.", "Младшая единица — 2.", "8 = 1000 → 8.", "12 = 1100 → 4.", "2 8 4"], "expl": "i & -i оставляет младший единичный бит: 6→2, 8→8, 12→4."}, {"id": "37-k1", "type": "code", "title": "Сумма на отрезке с изменениями", "q": "Реализуй NumArray: update(i, val) и sumRange(l, r) (включительно) — обе за O(log n).", "fn": "num_array_ops", "starter": "class NumArray:\n    def __init__(self, nums):\n        pass\n\n    def update(self, index, val):\n        pass\n\n    def sumRange(self, left, right):\n        pass\n\n\ndef num_array_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"NumArray\":\n            obj = NumArray(*a); out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n", "tests": [{"args": [["NumArray", "sumRange", "update", "sumRange"], [[[1, 3, 5]], [0, 2], [1, 2], [0, 2]]], "exp": [null, 9, null, 8], "hidden": false, "case": ""}, {"args": [["NumArray", "update", "update", "sumRange", "sumRange"], [[[0, 0, 0, 0]], [3, 5], [0, -2], [0, 3], [1, 2]]], "exp": [null, null, null, 3, 0], "hidden": true, "case": "отрицательные"}, {"args": [["NumArray", "update", "update", "sumRange"], [[[7]], [0, 2], [0, 4], [0, 0]]], "exp": [null, null, null, 4], "hidden": true, "case": "повторное обновление"}], "ref": "class NumArray:\n    def __init__(self, nums):\n        self.n = len(nums)\n        self.a = nums[:]\n        self.t = [0] * (self.n + 1)\n        for i, x in enumerate(nums):\n            self._add(i + 1, x)\n\n    def _add(self, i, d):\n        while i <= self.n:\n            self.t[i] += d\n            i += i & -i\n\n    def _pref(self, i):\n        s = 0\n        while i > 0:\n            s += self.t[i]\n            i -= i & -i\n        return s\n\n    def update(self, index, val):\n        self._add(index + 1, val - self.a[index])\n        self.a[index] = val\n\n    def sumRange(self, left, right):\n        return self._pref(right + 1) - self._pref(left)\n\n\ndef num_array_ops(ops, args):\n    out, obj = [], None\n    for op, a in zip(ops, args):\n        if op == \"NumArray\":\n            obj = NumArray(*a); out.append(None)\n        else:\n            out.append(getattr(obj, op)(*a))\n    return out\n", "hints": ["Префиксные суммы пересчитывать дорого.", "Дерево Фенвика: индексы с 1.", "update — прибавить разницу val − a[i].", "Храни текущий массив a.", "sumRange = pref(r + 1) − pref(l)."], "expl": "Фенвик: O(log n) на операцию.", "compare": "exact", "leetcode": 307, "speed": {"gen": "n=50000\nops=['NumArray']+['update','sumRange']*n\nargs=[[list(range(n))]]\nfor i in range(n):\n    args.append([i, 1]); args.append([0, n - 1])\nARGS=[ops, args]"}}, {"id": "37-k2", "type": "code", "title": "Сколько меньших справа", "q": "Для каждого i посчитай, сколько элементов справа от него меньше nums[i]. n до 10⁵.", "fn": "count_smaller", "starter": "def count_smaller(nums):\n    pass\n", "tests": [{"args": [[5, 2, 6, 1]], "exp": [2, 1, 1, 0], "hidden": false, "case": ""}, {"args": [[-1]], "exp": [0], "hidden": false, "case": ""}, {"args": [[-1, -1]], "exp": [0, 0], "hidden": true, "case": "равные"}, {"args": [[3, 2, 1]], "exp": [2, 1, 0], "hidden": true, "case": "убывает"}], "ref": "def count_smaller(nums):\n    vals = sorted(set(nums))\n    rank = {v: i + 1 for i, v in enumerate(vals)}\n    n = len(vals)\n    t = [0] * (n + 1)\n    res = []\n    for x in reversed(nums):\n        i = rank[x] - 1\n        s = 0\n        while i > 0:\n            s += t[i]\n            i -= i & -i\n        res.append(s)\n        i = rank[x]\n        while i <= n:\n            t[i] += 1\n            i += i & -i\n    return res[::-1]\n", "hints": ["Иди справа налево.", "Сожми значения в ранги 1..m.", "Фенвик считает, сколько уже встречено с рангом меньше.", "pref(rank − 1), потом add(rank, 1).", "Разверни ответ."], "expl": "Фенвик по рангам: O(n log n).", "compare": "exact", "leetcode": 315, "speed": {"gen": "import random\nrandom.seed(7)\nARGS=[[random.randint(-10**4, 10**4) for _ in range(100000)]]"}}], "test": [{"q": "Фенвик: сложность запроса и изменения", "options": ["O(1) и O(n)", "O(log n) и O(log n)", "O(n) и O(1)", "O(√n)"], "answer": 1}, {"q": "t[i] в Фенвике отвечает за отрезок длины:", "options": ["i", "i & -i", "log i", "1"], "answer": 1}, {"q": "Минимум на отрезке с изменениями:", "options": ["Фенвик", "дерево отрезков", "префиксные суммы", "куча"], "answer": 1}, {"q": "Массовые изменения на отрезке в дереве отрезков:", "options": ["невозможны", "ленивые пометки", "пересборка", "Фенвик"], "answer": 1}, {"q": "Индексация дерева Фенвика:", "options": ["с 0", "с 1", "с −1", "любая"], "answer": 1}]}, {"title": "Глава 38. Хеширование строк и Манакер", "short": "Хеширование строк и Манакер", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "Полиномиальный хеш", "html": "<p>Строку переводим в число: <code>h = s[0]·B^(n-1) + … + s[n-1]<\/code> по модулю M. Префиксные хеши дают хеш <strong>любой подстроки за O(1)<\/strong>:<\/p>\n<pre><code class=\"language-python\">B, M = 911382323, (1 &lt;&lt; 61) - 1\nh = [0] * (n + 1); p = [1] * (n + 1)\nfor i, c in enumerate(s):\n    h[i + 1] = (h[i] * B + ord(c)) % M\n    p[i + 1] = p[i] * B % M\n\ndef sub(l, r):                       # хеш s[l:r]\n    return (h[r] - h[l] * p[r - l]) % M\n<\/code><\/pre>\n<p><strong>Рабин-Карп<\/strong>: хеш образца сравниваем с хешем каждого окна той же длины — O(n + m). Совпадение хешей проверяем сравнением строк (коллизии редки, но возможны).<\/p>\n<p>Применения: поиск повторяющихся подстрок (187, 1044 — с бинпоиском по длине), сравнение подстрок за O(1), количество различных подстрок.<\/p>"}, {"title": "Алгоритм Манакера", "html": "<p>Все палиндромы за <strong>O(n)<\/strong> вместо O(n²) расширения от центра (глава 32). Вставляем разделители: <code>#a#b#a#<\/code> — все палиндромы становятся нечётными. <code>p[i]<\/code> — радиус палиндрома с центром i.<\/p>\n<p>Ключ: если i внутри уже найденного палиндрома <code>[c − r, c + r]<\/code>, его зеркало <code>2c − i<\/code> даёт <strong>нижнюю оценку<\/strong> <code>p[i] ≥ min(r − i, p[2c − i])<\/code>. Дальше расширяем, правая граница только растёт → O(n).<\/p>\n<pre><code class=\"language-python\">def manacher(s):\n    t = '#' + '#'.join(s) + '#'\n    n, p = len(t), [0] * len(t)\n    c = r = 0\n    for i in range(n):\n        if i &lt; r:\n            p[i] = min(r - i, p[2 * c - i])\n        while i - p[i] - 1 &gt;= 0 and i + p[i] + 1 &lt; n and t[i - p[i] - 1] == t[i + p[i] + 1]:\n            p[i] += 1\n        if i + p[i] &gt; r:\n            c, r = i, i + p[i]\n    return p                       # длина палиндрома в s = p[i]\n<\/code><\/pre>\n<p>Самый длинный палиндром — <code>max(p)<\/code>; число палиндромных подстрок (647) — <code>sum((p[i] + 1) // 2)<\/code>.<\/p>"}, {"title": "Ошибки", "html": "<ul>\n<li>Маленький модуль (10⁹ + 7) и много подстрок — коллизии по парадоксу дней рождения; бери модуль 2⁶¹ − 1 или два хеша.<\/li>\n<li>Не проверять строки при совпадении хешей в задаче, где важна точность.<\/li>\n<li>В Манакере забыть разделители — чётные палиндромы потеряются.<\/li>\n<li>Путать радиус в преобразованной строке и длину в исходной (они равны: <code>p[i]<\/code>).<\/li>\n<\/ul>"}], "viz": "manacher", "tasks": [{"id": "38-c1", "type": "choice", "title": "Разделители", "q": "Зачем в Манакере разделители #?", "options": ["Для скорости", "Чтобы чётные палиндромы стали нечётными с центром в символе", "Чтобы не было коллизий", "Не нужны"], "answer": 1, "hints": ["Где центр у «abba»?", "Между двумя b.", "Это не символ.", "#a#b#b#a# — центр в #.", "Все центры — символы."], "expl": "Разделители делают все палиндромы нечётными — один цикл по центрам."}, {"id": "38-c2", "type": "choice", "title": "Коллизия", "q": "Хеши двух подстрок совпали. Строки точно равны?", "options": ["Да", "Нет, возможна коллизия — при необходимости сравни строки", "Только при длине > 10", "Никогда"], "answer": 1, "hints": ["Хеш — число по модулю.", "Строк больше, чем чисел.", "Значит, разные строки могут совпасть.", "Это коллизия.", "Проверь строки."], "expl": "Совпадение хешей — сильный признак, но не доказательство."}, {"id": "38-k1", "type": "code", "title": "Повторяющиеся ДНК-последовательности", "q": "Верни все подстроки длины 10, встречающиеся больше одного раза (порядок не важен). Используй скользящий хеш.", "fn": "repeated_dna", "starter": "def repeated_dna(s):\n    pass\n", "tests": [{"args": ["AAAAACCCCCAAAAACCCCCCAAAAAGGGTTT"], "exp": ["AAAAACCCCC", "CCCCCAAAAA"], "hidden": false, "case": ""}, {"args": ["AAAAAAAAAAAAA"], "exp": ["AAAAAAAAAA"], "hidden": false, "case": ""}, {"args": ["ACGT"], "exp": [], "hidden": true, "case": "короче 10"}], "ref": "def repeated_dna(s):\n    code = {'A': 0, 'C': 1, 'G': 2, 'T': 3}\n    if len(s) < 10:\n        return []\n    h, mask = 0, (1 << 20) - 1\n    seen, res = set(), set()\n    for i, ch in enumerate(s):\n        h = ((h << 2) | code[ch]) & mask\n        if i >= 9:\n            if h in seen:\n                res.add(s[i - 9:i + 1])\n            seen.add(h)\n    return sorted(res)\n", "hints": ["4 буквы — 2 бита на символ.", "10 символов — 20 бит, хеш без коллизий.", "Сдвиг влево на 2 и добавить код.", "Маской отрезай старые биты.", "Видел хеш раньше — повтор."], "expl": "Скользящий хеш по 2 бита: O(n).", "compare": "sorted", "leetcode": 187}, {"id": "38-k2", "type": "code", "title": "Число палиндромных подстрок", "q": "Сколько подстрок s являются палиндромами? n до 10⁵ — нужно O(n) (Манакер).", "fn": "count_palindromes", "starter": "def count_palindromes(s):\n    pass\n", "tests": [{"args": ["abc"], "exp": 3, "hidden": false, "case": ""}, {"args": ["aaa"], "exp": 6, "hidden": false, "case": ""}, {"args": ["a"], "exp": 1, "hidden": true, "case": "один символ"}, {"args": ["abba"], "exp": 6, "hidden": true, "case": "чётный палиндром"}], "ref": "def count_palindromes(s):\n    t = '#' + '#'.join(s) + '#'\n    n, p = len(t), [0] * len(t)\n    c = r = 0\n    for i in range(n):\n        if i < r:\n            p[i] = min(r - i, p[2 * c - i])\n        while i - p[i] - 1 >= 0 and i + p[i] + 1 < n and t[i - p[i] - 1] == t[i + p[i] + 1]:\n            p[i] += 1\n        if i + p[i] > r:\n            c, r = i, i + p[i]\n    return sum((x + 1) // 2 for x in p)\n", "hints": ["Расширение от центра даст O(n²) на «aaaa…».", "Манакер: разделители #.", "Используй зеркало 2c − i.", "Расширяй только за границу r.", "Ответ: сумма (p[i] + 1) // 2."], "expl": "Манакер: O(n).", "compare": "exact", "leetcode": 647, "speed": {"gen": "ARGS=['a' * 100000]"}}], "test": [{"q": "Хеш подстроки по префиксным хешам считается за:", "options": ["O(длины)", "O(1)", "O(log n)", "O(n)"], "answer": 1}, {"q": "Рабин-Карп ищет образец за:", "options": ["O(n·m) всегда", "O(n + m) в среднем", "O(log n)", "O(m²)"], "answer": 1}, {"q": "Манакер находит все палиндромы за:", "options": ["O(n²)", "O(n)", "O(n log n)", "O(n³)"], "answer": 1}, {"q": "Против коллизий хеша:", "options": ["модуль 10", "большой модуль или двойной хеш", "сортировка", "ничего"], "answer": 1}, {"q": "p[i] в Манакере (с #) равно:", "options": ["позиции", "длине палиндрома в исходной строке", "числу #", "хешу"], "answer": 1}]}, {"title": "Глава 39. Заметающая прямая", "short": "Заметающая прямая", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "Идея", "html": "<p>Превращаем отрезки в <strong>события<\/strong> (начало, конец), сортируем по координате и идём слева направо, поддерживая текущее состояние: счётчик, кучу, множество.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Задача<\/th>\n<th>События<\/th>\n<th>Состояние<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>минимум переговорных (253)<\/td>\n<td>+1 на старте, −1 на конце<\/td>\n<td>счётчик, ответ — максимум<\/td>\n<\/tr>\n<tr>\n<td>попутчики (1094)<\/td>\n<td>+люди / −люди<\/td>\n<td>загрузка ≤ ёмкость<\/td>\n<\/tr>\n<tr>\n<td>горизонт (218)<\/td>\n<td>края зданий<\/td>\n<td>куча высот<\/td>\n<\/tr>\n<tr>\n<td>объединение прямоугольников<\/td>\n<td>вертикальные края<\/td>\n<td>дерево отрезков<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Тонкость — <strong>порядок событий с одной координатой<\/strong>: если встреча кончается в 10, а другая начинается в 10, сначала обрабатываем конец (−1), иначе посчитаем лишнюю комнату.<\/p>"}, {"title": "Минимум переговорных", "html": "<pre><code class=\"language-python\">def min_rooms(intervals):\n    ev = []\n    for s, e in intervals:\n        ev.append((s, 1))\n        ev.append((e, -1))\n    ev.sort()                    # при равных координатах −1 раньше +1\n    cur = best = 0\n    for _, d in ev:\n        cur += d\n        best = max(best, cur)\n    return best\n<\/code><\/pre>\n<p>Альтернатива — сортировка по началу + куча концов: если самая ранняя закончившаяся встреча освободила комнату к началу новой, <code>heapreplace<\/code>. O(n log n).<\/p>"}, {"title": "Горизонт (218)", "html": "<p>События — левый край (здание появилось) и правый (исчезло). В куче — высоты «живых» зданий; после каждой координаты высота горизонта = максимум кучи. Если она изменилась — новая точка.<\/p>\n<pre><code class=\"language-python\">import heapq\n\ndef skyline(buildings):\n    ev = sorted([(l, -h, r) for l, r, h in buildings] + [(r, 0, 0) for _, r, _ in buildings])\n    res, live = [], [(0, float('inf'))]       # (−высота, конец)\n    for x, nh, r in ev:\n        while live[0][1] &lt;= x:                 # ленивое удаление закончившихся\n            heapq.heappop(live)\n        if nh:\n            heapq.heappush(live, (nh, r))\n        h = -live[0][0]\n        if not res or res[-1][1] != h:\n            res.append([x, h])\n    return res\n<\/code><\/pre>\n<p>Ошибки: неверный порядок при равных x; удалять из кучи по значению (O(n)) вместо ленивого удаления по концу.<\/p>"}], "viz": "sweep", "tasks": [{"id": "39-c1", "type": "choice", "title": "Порядок событий", "q": "Встреча A заканчивается в 10, B начинается в 10. Что обработать первым?", "options": ["Начало B", "Конец A", "Без разницы", "Ни то, ни другое"], "answer": 1, "hints": ["Нужна ли A и B разные комнаты?", "Нет, A уже ушла.", "Значит, счётчик не должен вырасти.", "Сначала −1.", "Конец A."], "expl": "Конец раньше начала на той же отметке — комната переиспользуется."}, {"id": "39-k1", "type": "code", "title": "Минимум переговорных", "q": "Интервалы встреч [начало, конец). Верни минимальное число комнат.", "fn": "min_rooms", "starter": "def min_rooms(intervals):\n    pass\n", "tests": [{"args": [[[0, 30], [5, 10], [15, 20]]], "exp": 2, "hidden": false, "case": ""}, {"args": [[[7, 10], [2, 4]]], "exp": 1, "hidden": false, "case": ""}, {"args": [[[1, 5], [5, 10]]], "exp": 1, "hidden": true, "case": "конец = начало"}, {"args": [[]], "exp": 0, "hidden": true, "case": "нет встреч"}, {"args": [[[1, 10], [2, 9], [3, 8]]], "exp": 3, "hidden": true, "case": "вложенные"}], "ref": "def min_rooms(intervals):\n    ev = []\n    for s, e in intervals:\n        ev.append((s, 1))\n        ev.append((e, -1))\n    ev.sort()\n    cur = best = 0\n    for _, d in ev:\n        cur += d\n        best = max(best, cur)\n    return best\n", "hints": ["Начало — +1, конец — −1.", "Отсортируй события.", "При равной координате −1 идёт раньше (кортежи так и сортируются).", "Веди текущий счётчик.", "Ответ — его максимум."], "expl": "Заметающая прямая: O(n log n).", "compare": "exact", "leetcode": 253}, {"id": "39-k2", "type": "code", "title": "Попутчики", "q": "trips [людей, откуда, куда], машина едет по возрастанию координаты. Хватит ли capacity мест?", "fn": "car_pooling", "starter": "def car_pooling(trips, capacity):\n    pass\n", "tests": [{"args": [[[2, 1, 5], [3, 3, 7]], 4], "exp": false, "hidden": false, "case": ""}, {"args": [[[2, 1, 5], [3, 3, 7]], 5], "exp": true, "hidden": false, "case": ""}, {"args": [[[2, 1, 5], [3, 5, 7]], 3], "exp": true, "hidden": true, "case": "высадка и посадка в одной точке"}, {"args": [[[9, 0, 1]], 8], "exp": false, "hidden": true, "case": "сразу перебор"}], "ref": "def car_pooling(trips, capacity):\n    ev = []\n    for k, a, b in trips:\n        ev.append((a, k))\n        ev.append((b, -k))\n    ev.sort()\n    cur = 0\n    for _, d in ev:\n        cur += d\n        if cur > capacity:\n            return False\n    return True\n", "hints": ["Посадка — +k, высадка — −k.", "Сортировка событий.", "В одной точке сначала высадка (−k < +k).", "Проверяй загрузку после каждого события.", "Превысили — False."], "expl": "События: O(n log n).", "compare": "exact", "leetcode": 1094}, {"id": "39-k3", "type": "code", "title": "Горизонт", "q": "buildings [left, right, height]. Верни ключевые точки горизонта [x, высота].", "fn": "skyline", "starter": "import heapq\n\ndef skyline(buildings):\n    pass\n", "tests": [{"args": [[[2, 9, 10], [3, 7, 15], [5, 12, 12], [15, 20, 10], [19, 24, 8]]], "exp": [[2, 10], [3, 15], [7, 12], [12, 0], [15, 10], [20, 8], [24, 0]], "hidden": false, "case": ""}, {"args": [[[0, 2, 3], [2, 5, 3]]], "exp": [[0, 3], [5, 0]], "hidden": true, "case": "стык равных высот"}, {"args": [[[1, 2, 1], [1, 2, 2], [1, 2, 3]]], "exp": [[1, 3], [2, 0]], "hidden": true, "case": "общий левый край"}], "ref": "import heapq\n\ndef skyline(buildings):\n    ev = sorted([(l, -h, r) for l, r, h in buildings] + [(r, 0, 0) for _, r, _ in buildings])\n    res, live = [], [(0, float('inf'))]\n    for x, nh, r in ev:\n        while live[0][1] <= x:\n            heapq.heappop(live)\n        if nh:\n            heapq.heappush(live, (nh, r))\n        h = -live[0][0]\n        if not res or res[-1][1] != h:\n            res.append([x, h])\n    return res\n", "hints": ["События: левые края (−h, чтобы высокие шли первыми) и правые.", "Куча живых зданий по высоте.", "Лениво удаляй закончившиеся (конец ≤ x).", "Текущая высота — вершина кучи.", "Изменилась — добавь точку."], "expl": "Заметающая прямая + куча: O(n log n).", "compare": "exact", "leetcode": 218}], "test": [{"q": "Заметающая прямая начинается с:", "options": ["DFS", "сортировки событий", "хеша", "ДП"], "answer": 1}, {"q": "Минимум комнат — это:", "options": ["число встреч", "максимум одновременных встреч", "сумма длин", "минимум концов"], "answer": 1}, {"q": "В горизонте текущая высота берётся из:", "options": ["стека", "кучи живых зданий", "словаря", "массива"], "answer": 1}, {"q": "Ленивое удаление из кучи — это:", "options": ["удалить сразу по значению", "выбрасывать устаревшие, когда они на вершине", "пересоздать кучу", "не удалять"], "answer": 1}, {"q": "Сложность заметающей прямой обычно:", "options": ["O(n)", "O(n log n)", "O(n²)", "O(log n)"], "answer": 1}]}, {"title": "Глава 40. Продвинутые графы", "short": "Продвинутые графы", "part": "Часть IX · Продвинутые темы", "cards": [{"title": "Мосты и точки сочленения", "html": "<p><strong>Мост<\/strong> — ребро, после удаления которого граф распадается (1192 «критические соединения»). <strong>Точка сочленения<\/strong> — такая же вершина.<\/p>\n<p>Один DFS: <code>tin[v]<\/code> — время входа, <code>low[v]<\/code> — самое раннее время, достижимое из поддерева v, используя <strong>одно обратное ребро<\/strong>.<\/p>\n<ul>\n<li>ребро <code>v → u<\/code> (u — ребёнок) — <strong>мост<\/strong>, если <code>low[u] &gt; tin[v]<\/code>: из поддерева u нельзя вернуться к v или выше;<\/li>\n<li>v (не корень) — <strong>точка сочленения<\/strong>, если есть ребёнок с <code>low[u] ≥ tin[v]<\/code>; корень — если у него ≥ 2 детей в DFS.<\/li>\n<\/ul>\n<pre><code class=\"language-python\">def bridges(n, edges):\n    g = [[] for _ in range(n)]\n    for a, b in edges:\n        g[a].append(b); g[b].append(a)\n    tin, low, res, t = [-1] * n, [0] * n, [], [0]\n    def dfs(v, parent):\n        tin[v] = low[v] = t[0]; t[0] += 1\n        for u in g[v]:\n            if u == parent: continue\n            if tin[u] != -1:\n                low[v] = min(low[v], tin[u])        # обратное ребро\n            else:\n                dfs(u, v)\n                low[v] = min(low[v], low[u])\n                if low[u] &gt; tin[v]:\n                    res.append([v, u])\n    for v in range(n):\n        if tin[v] == -1: dfs(v, -1)\n    return res\n<\/code><\/pre>"}, {"title": "Компоненты сильной связности", "html": "<p>В ориентированном графе SCC — максимальные группы, где из любой вершины достижима любая. <strong>Косараю<\/strong>:<\/p>\n<ol>\n<li>DFS по графу, записываем вершины в порядке <strong>выхода<\/strong>;<\/li>\n<li>транспонируем граф (развернуть все рёбра);<\/li>\n<li>идём по вершинам в обратном порядке выхода; каждый DFS в транспонированном графе — одна SCC.<\/li>\n<\/ol>\n<p>O(V + E). Альтернатива — алгоритм Тарьяна (тот же <code>low<\/code>, один проход). Применения: сжатие графа в DAG, задачи 2-SAT, «кто кого может уведомить».<\/p>"}, {"title": "A* и итог", "html": "<p><strong>A*<\/strong> — Дейкстра с подсказкой: в
