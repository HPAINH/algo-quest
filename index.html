<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Algo Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: инженерный блокнот — бумага в тонкую клетку, одна колонка контента, путь уровней как трасса */
:root{
  --paper:#F2F4F8; --surface:#FFFFFF; --ink:#152033; --muted:#5A6577; --line:#D7DEE8; --line2:#E7ECF2;
  --accent:#2B59D9; --accent-soft:#E3EAFB; --on-accent:#FFFFFF; --mark:#D9622A; --mark-soft:#FBE7DC;
  --ok:#1E8556; --ok-soft:#DDF2E7; --bad:#BE3B34; --bad-soft:#F8E0DE; --code-bg:#F6F8FB;
  --grid:rgba(43,89,217,.055);
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --kw:#7A3EB8; --str:#1E7A50; --num:#B4561E; --com:#8390A3; --fnc:#2B59D9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131C; --surface:#151C28; --ink:#E4E9F1; --muted:#98A4B6; --line:#283447; --line2:#1D2634;
  --accent:#7D9DFF; --accent-soft:#1E2A47; --on-accent:#0E131C; --mark:#FF9A5E; --mark-soft:#3A2518;
  --ok:#4DC48F; --ok-soft:#14301F; --bad:#F2736A; --bad-soft:#3A1A18; --code-bg:#111823;
  --grid:rgba(125,157,255,.05); --kw:#C79BFF; --str:#7FD3A5; --num:#FFB07A; --com:#6E7B8F; --fnc:#8FB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131C; --surface:#151C28; --ink:#E4E9F1; --muted:#98A4B6; --line:#283447; --line2:#1D2634;
  --accent:#7D9DFF; --accent-soft:#1E2A47; --on-accent:#0E131C; --mark:#FF9A5E; --mark-soft:#3A2518;
  --ok:#4DC48F; --ok-soft:#14301F; --bad:#F2736A; --bad-soft:#3A1A18; --code-bg:#111823;
  --grid:rgba(125,157,255,.05); --kw:#C79BFF; --str:#7FD3A5; --num:#FFB07A; --com:#6E7B8F; --fnc:#8FB0FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;background:none;border:0;cursor:pointer;padding:0;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-size:13px}
.crumbs{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.top-actions{display:flex;gap:6px}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:15px;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
h1,h2,h3{text-wrap:balance;line-height:1.2}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.4vw,40px);margin:0 0 10px;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,2.6vw,26px);margin:0 0 12px}
h3{font-size:18px;margin:0 0 8px}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:600;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--line2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--mark-soft);color:var(--mark)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;margin-bottom:28px}
.hero .trace{font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto}
.trace table{border-collapse:collapse;width:100%}
.trace td,.trace th{border-bottom:1px solid var(--line2);padding:5px 8px;text-align:left;white-space:nowrap}
.trace th{color:var(--muted);font-weight:600}
.trace tr.cur td{background:var(--mark-soft)}
/* tracks */
.track{margin-top:8px}
.track-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;counter-reset:lv}
.node{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px 60px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:4px}
.node:hover:not([disabled]){border-color:var(--accent)}
.node[disabled]{cursor:not-allowed;opacity:.55}
.node .num{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.node.done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.node.cur .num{border-color:var(--accent);color:var(--accent)}
.node .t{font-weight:600;line-height:1.3}
.node .s{font-size:13px;color:var(--muted)}
.stars{color:var(--mark);letter-spacing:2px;font-size:14px}
.stars .off{color:var(--line)}
.iv-card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border:2px dashed var(--line);border-radius:14px;padding:20px;background:var(--surface)}
.iv-card.open{border-style:solid;border-color:var(--accent)}
.progressbar{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
/* level */
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 20px}
.stage{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:14px}
.stage b{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stage.done{border-color:var(--ok);color:var(--ok)}
.stage.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stage.on b{color:inherit}
.stage[disabled]{opacity:.45;cursor:not-allowed}
.lesson{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:2px}
.toc button{text-align:left;background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--muted);line-height:1.3}
.toc button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc button.seen::before{content:"✓ ";color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 26px;min-width:0}
.card h2{margin-bottom:16px}
.prose{max-width:72ch}
.prose p{margin:0 0 12px}
.prose h4{font-size:17px;margin:22px 0 8px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin:3px 0}
.prose blockquote{margin:0 0 12px;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.prose blockquote p{margin:4px 0}
.tw{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:10px}
.tw table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tw th,.tw td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.tw th{background:var(--code-bg);font-weight:600}
.tw tr:last-child td{border-bottom:0}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;margin:0 0 14px}
code{font-family:var(--f-mono);font-size:.92em}
:not(pre)>code{background:var(--code-bg);border:1px solid var(--line2);border-radius:5px;padding:0 4px}
pre.formula{text-align:center;font-size:14px}
.k{color:var(--kw);font-weight:600}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com);font-style:italic}.f{color:var(--fnc)}
.card-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.check{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
/* tasks */
.task-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:4px}
.tlist button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:14px;line-height:1.3}
.tlist button.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tlist .ic{width:20px;flex:none;text-align:center;font-family:var(--f-mono);font-size:13px}
.ic.ok{color:var(--ok)}
.type{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.fb{border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:500}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--accent-soft);color:var(--accent)}
.hints{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.hint{border:1px solid var(--line);border-left:3px solid var(--mark);background:var(--mark-soft);border-radius:8px;padding:8px 12px;font-size:15px}
.hint b{color:var(--mark)}
.expl{margin-top:16px;border:1px solid var(--ok);border-radius:12px;padding:14px 16px;background:var(--ok-soft)}
.expl h3{color:var(--ok)}
.codeview{counter-reset:ln}
.codeview{white-space:pre}
.codeview .ln{display:block;min-height:1.55em;padding-left:3.2em;position:relative;cursor:default;border-radius:4px}
.codeview .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:2.4em;text-align:right;color:var(--com)}
.codeview.pick .ln{cursor:pointer}
.codeview.pick .ln:hover{background:var(--accent-soft)}
.codeview .ln.sel{background:var(--mark-soft);outline:1px solid var(--mark)}
.codeview .ln.hl{background:var(--accent-soft)}
.order{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:6px}
.order li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
.order li span{flex:1}
.order .btn{min-height:30px;padding:2px 8px}
.ttable{border-collapse:collapse;font-family:var(--f-mono);font-size:14px}
.ttable th,.ttable td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.ttable th{background:var(--code-bg);font-family:var(--f-body);font-weight:600}
.ttable input{width:74px;font:inherit;text-align:center;border:1px solid var(--accent);border-radius:5px;padding:3px;background:var(--surface);color:var(--ink)}
.ttable input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ttable input.right{border-color:var(--ok);background:var(--ok-soft)}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{min-height:40px}
textarea.editor{width:100%;min-height:260px;font-family:var(--f-mono);font-size:14px;line-height:1.55;tab-size:4;resize:vertical;background:var(--code-bg);white-space:pre;overflow:auto}
.results{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px}
.res{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:13px;overflow-x:auto}
.res.ok{border-color:var(--ok);background:var(--ok-soft)}
.res.bad{border-color:var(--bad);background:var(--bad-soft)}
.res pre{margin:6px 0 0;background:transparent;border:0;padding:0;white-space:pre-wrap}
/* viz */
.viz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
.viz-data{display:flex;flex-direction:column;gap:14px;min-width:0}
.cells{display:flex;gap:4px;flex-wrap:wrap;padding-top:18px;padding-bottom:22px}
.cell{position:relative;min-width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-mono);font-weight:600}
.cell .ix{position:absolute;top:-17px;font-size:11px;color:var(--muted);font-weight:400}
.cell.in{background:var(--accent-soft);border-color:var(--accent)}
.cell.mk{background:var(--mark-soft);border-color:var(--mark)}
.cell.dim{opacity:.3}
.gridv{display:grid;gap:3px;margin:8px 0 14px}
.gc{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;background:var(--surface)}
.gc.wall{background:var(--ink);opacity:.75}
.gc.seen{background:var(--accent-soft);border-color:var(--accent)}
.gc.cur{background:var(--mark-soft);border-color:var(--mark);border-width:2px}
.dpt{border-collapse:collapse;font-family:var(--f-mono);font-size:13px;margin-bottom:12px}
.dpt th,.dpt td{border:1px solid var(--line);padding:5px 9px;text-align:center;min-width:26px}
.dpt td.hl{background:var(--mark-soft);border-color:var(--mark);font-weight:700}
.dpt td.dep{background:var(--accent-soft)}
.dpt td.fut{color:transparent}
.cell .pt{position:absolute;bottom:-20px;font-size:11px;color:var(--mark);font-weight:700;white-space:nowrap}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.var{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:var(--surface)}
.var b{color:var(--accent)}
.kv{border-collapse:collapse;font-family:var(--f-mono);font-size:13px}
.kv td,.kv th{border:1px solid var(--line);padding:3px 10px}
.kv th{background:var(--code-bg);font-family:var(--f-body)}
.kv tr.hl td{background:var(--mark-soft)}
.frames{display:flex;flex-direction:column-reverse;gap:4px;max-width:260px}
.frame{border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-family:var(--f-mono);font-size:13px;background:var(--surface)}
.frame.top{border-color:var(--accent);background:var(--accent-soft)}
.note{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:15px;min-height:40px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.controls input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
/* interview */
.ivgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.steps{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;font-size:14px;border:1px solid transparent}
.step .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-family:var(--f-mono);border:1px solid var(--line);background:var(--surface);flex:none}
.step.on{border-color:var(--accent);background:var(--surface)}
.step.done .d{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qa{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.qa label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);cursor:pointer}
.answer{margin-left:28px;color:var(--accent);font-size:15px}
.report td.sig{font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .panel{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.codebox{font-family:var(--f-mono);font-size:14px;word-break:break-all;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;user-select:all}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .lesson,.task-layout,.ivgrid,.viz{grid-template-columns:1fr}
  .toc,.steps{position:static;max-height:none}
  .toc{flex-direction:row;overflow-x:auto;white-space:nowrap}
  .tlist{flex-direction:row;overflow-x:auto}
  .tlist button{flex:none;max-width:220px}
  .card{padding:18px 16px}
  .iv-card{grid-template-columns:1fr}
}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" id="home-btn" aria-label="На главную"><i>AQ</i>Algo Quest</button>
  <div class="crumbs" id="crumbs"></div>
  <div class="top-actions">
    <button class="btn small ghost" id="save-btn">Код сохранения</button>
    <button class="btn small ghost" id="theme-btn">Тема</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal-root"></div>

<script>
const DATA = {"levels": [{"title": "Глава 1. Алгоритмический собес и фреймворк решения", "short": "Алгоритмический собес и фреймворк решения", "part": "Часть I · Фундамент", "cards": [{"title": "Формат секции", "html": "<p>На секции оценивают не только правильный ответ, а процесс: как ты уточняешь условие, ищешь решение, оцениваешь сложность и тестируешь код. Молча написанное верное решение часто оценивают ниже, чем проговорённое решение с одной найденной и исправленной ошибкой.<\/p><h4>Формат секции<\/h4><div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Этап<\/th>\n<th>Время<\/th>\n<th>Что делаешь<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Знакомство<\/td>\n<td>2–5 мин<\/td>\n<td>кратко о себе<\/td>\n<\/tr>\n<tr>\n<td>Задача 1<\/td>\n<td>20–25 мин<\/td>\n<td>обычно easy/medium<\/td>\n<\/tr>\n<tr>\n<td>Задача 2<\/td>\n<td>20–25 мин<\/td>\n<td>medium или усложнение первой<\/td>\n<\/tr>\n<tr>\n<td>Вопросы<\/td>\n<td>3–5 мин<\/td>\n<td>твои вопросы интервьюеру<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Код пишут в общем редакторе без запуска и автодополнения (Яндекс так делает почти всегда). Поэтому код должен быть верным «на бумаге»: проверяешь его трассировкой руками.<\/p>"}, {"title": "Что оценивает интервьюер", "html": "<p>После секции интервьюер заполняет форму по нескольким критериям и ставит итог «hire / no hire». Важно понимать: решённая задача — это только один из четырёх пунктов. Кандидат, решивший задачу молча и с подсказками, может получить оценку ниже, чем кандидат, который чуть не успел, но всё время ясно рассуждал.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Критерий<\/th>\n<th>Что проверяют<\/th>\n<th>Сильный сигнал<\/th>\n<th>Слабый сигнал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Решение задачи<\/td>\n<td>дошёл ли до верного и эффективного алгоритма<\/td>\n<td>сам нашёл оптимальное решение, объяснил, почему оно верно<\/td>\n<td>решение только брутфорсом или только с прямой подсказкой<\/td>\n<\/tr>\n<tr>\n<td>Коммуникация<\/td>\n<td>понятно ли, что ты думаешь<\/td>\n<td>проговаривает идеи, уточняет условие, согласует план<\/td>\n<td>долго молчит, отвечает «щас», пишет код без объяснений<\/td>\n<\/tr>\n<tr>\n<td>Код<\/td>\n<td>можно ли такой код взять в продакшен<\/td>\n<td>чистые имена, нет дублирования, разбито на шаги<\/td>\n<td>переменные a, b, tmp2, копипаст, путаница в индексах<\/td>\n<\/tr>\n<tr>\n<td>Тестирование<\/td>\n<td>ищет ли ошибки сам<\/td>\n<td>сам прогнал пример и краевой случай, нашёл и исправил баг<\/td>\n<td>говорит «вроде работает», баги находит интервьюер<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Отсюда главный вывод главы: на собесе ты не просто решаешь задачу, ты <strong>показываешь процесс решения<\/strong>. Фреймворк ниже — это способ сделать процесс видимым, чтобы по каждому из четырёх критериев был сильный сигнал.<\/p>\n<p><strong>Как это выглядит на практике.<\/strong> Два кандидата за 25 минут:<\/p>\n<ul>\n<li><em>Кандидат А<\/em> молча 15 минут думает, затем пишет оптимальный код. В коде ошибка на единицу в цикле, интервьюер на неё указывает, кандидат исправляет. Итог: решение есть, но коммуникация и тестирование слабые.<\/li>\n<li><em>Кандидат Б<\/em> за 3 минуты уточняет условие, называет брутфорс O(n²), затем вслух ищет улучшение и приходит к O(n). Пишет код, сам прогоняет пример, находит ту же ошибку на единицу и исправляет. Итог: сильные сигналы по всем четырём пунктам.<\/li>\n<\/ul>\n<p>Оба решили задачу, но «hire» обычно получает Б.<\/p>"}, {"title": "Фреймворк из 6 шагов", "html": "<ol>\n<li><strong>Понять условие.<\/strong> Перескажи задачу своими словами. Уточни: размер входа, диапазон значений, есть ли отрицательные числа, дубликаты, пустой вход, отсортирован ли массив, что вернуть, если ответа нет.<\/li>\n<li><strong>Примеры.<\/strong> Разбери пример из условия и придумай свой краевой: пустой массив, один элемент, все одинаковые.<\/li>\n<li><strong>Брутфорс.<\/strong> Назови самое простое решение и его сложность: «перебором всех пар — O(n²)». Это показывает, что ты понимаешь задачу, и даёт точку отсчёта.<\/li>\n<li><strong>Оптимизация.<\/strong> Найди «узкое место» брутфорса и подбери технику: лишний повторный подсчёт → префиксные суммы или хеш-таблица; перебор пар в отсортированном → два указателя; поиск в монотонной области → бинарный поиск. Согласуй идею с интервьюером <em>до<\/em> кода.<\/li>\n<li><strong>Код.<\/strong> Говорящие имена переменных, маленькие функции, без хитростей ради краткости.<\/li>\n<li><strong>Тест.<\/strong> Прогони код руками на примере и на краевом случае, назови итоговую сложность по времени и памяти.<\/li>\n<\/ol>"}, {"title": "Каждый шаг подробно", "html": "<p>Ниже — что именно происходит на каждом шаге, сколько времени он занимает и какие фразы помогают. Общий бюджет на задачу \\~25 минут.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Шаг<\/th>\n<th>Время<\/th>\n<th>Результат шага<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Понять условие<\/td>\n<td>2–3 мин<\/td>\n<td>условие пересказано, ограничения уточнены<\/td>\n<\/tr>\n<tr>\n<td>2. Примеры<\/td>\n<td>1–2 мин<\/td>\n<td>есть 1–2 своих примера, включая краевой<\/td>\n<\/tr>\n<tr>\n<td>3. Брутфорс<\/td>\n<td>1–2 мин<\/td>\n<td>названо простое решение и его сложность<\/td>\n<\/tr>\n<tr>\n<td>4. Оптимизация<\/td>\n<td>5–8 мин<\/td>\n<td>найдена идея лучше, интервьюер согласен<\/td>\n<\/tr>\n<tr>\n<td>5. Код<\/td>\n<td>7–10 мин<\/td>\n<td>код написан целиком<\/td>\n<\/tr>\n<tr>\n<td>6. Тест<\/td>\n<td>3–5 мин<\/td>\n<td>код прогнан руками, сложность названа<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Шаг 1. Понять условие", "section": "Каждый шаг подробно", "html": "<p><strong>Зачем.<\/strong> Условия на собесе часто намеренно неполные: интервьюер проверяет, спросишь ли ты. Неверно понятое условие — самая дорогая ошибка, потому что всё дальнейшее решение уходит не туда.<\/p>\n<p><strong>Что делать.<\/strong> Перескажи задачу своими словами и задай вопросы по чек-листу:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вопрос<\/th>\n<th>Почему важен<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Какой размер входа n?<\/td>\n<td>определяет допустимую сложность (глава 2)<\/td>\n<\/tr>\n<tr>\n<td>Какие значения: могут ли быть отрицательные, ноль, очень большие?<\/td>\n<td>отрицательные ломают скользящее окно, большие — переполнение в других языках<\/td>\n<\/tr>\n<tr>\n<td>Есть ли дубликаты?<\/td>\n<td>влияет на ответ и на выбор структуры<\/td>\n<\/tr>\n<tr>\n<td>Отсортирован ли вход?<\/td>\n<td>отсортированность почти всегда подсказка к решению<\/td>\n<\/tr>\n<tr>\n<td>Может ли вход быть пустым?<\/td>\n<td>краевой случай, который часто роняет код<\/td>\n<\/tr>\n<tr>\n<td>Что вернуть, если ответа нет?<\/td>\n<td>−1, None, пустой список — надо договориться<\/td>\n<\/tr>\n<tr>\n<td>Можно ли менять входные данные?<\/td>\n<td>влияет на память: решение «на месте» или копия<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Фразы.<\/strong> «Правильно я понимаю, что нужно…?», «Могут ли быть отрицательные числа?», «Если подходящей пары нет — что вернуть?».<\/p>"}, {"title": "Шаг 2. Примеры", "section": "Каждый шаг подробно", "html": "<p><strong>Зачем.<\/strong> Пример проверяет, что ты понял условие одинаково с интервьюером, и даёт тесты для шага 6. Часто именно при ручном решении примера видно идею алгоритма.<\/p>\n<p><strong>Что делать.<\/strong> Реши пример из условия руками. Придумай один свой — небольшой (5–6 элементов), но не тривиальный, и один краевой: пустой вход, один элемент, все элементы одинаковые, ответ в самом начале или в самом конце.<\/p>\n<p><strong>Фразы.<\/strong> «Давайте я проверю на своём примере: для [3, 1, 2] ответ будет 1, верно?»<\/p>"}, {"title": "Шаг 3. Брутфорс", "section": "Каждый шаг подробно", "html": "<p><strong>Зачем.<\/strong> Три причины. Первая — показать, что задача понята. Вторая — получить хоть какое-то решение: если оптимизация не придёт, брутфорс лучше, чем ничего. Третья — брутфорс указывает, <em>что<\/em> оптимизировать.<\/p>\n<p><strong>Что делать.<\/strong> Опиши самый прямой перебор одним-двумя предложениями и назови сложность. Код брутфорса писать не нужно, если интервьюер не попросил.<\/p>\n<p><strong>Фразы.<\/strong> «Самое простое — перебрать все пары, это O(n²) по времени и O(1) по памяти. При n до 10⁵ это слишком медленно, давайте улучшим».<\/p>"}, {"title": "Шаг 4. Оптимизация", "section": "Каждый шаг подробно", "html": "<p><strong>Зачем.<\/strong> Это и есть основная проверка алгоритмического мышления.<\/p>\n<p><strong>Что делать.<\/strong> Задай себе три вопроса о брутфорсе:<\/p>\n<ol>\n<li><strong>Какую работу я делаю повторно?<\/strong> Если в двойном цикле внутренний цикл каждый раз заново что-то ищет или считает — это кандидат на хеш-таблицу или префиксную сумму.<\/li>\n<li><strong>Какие варианты заведомо бесполезны?<\/strong> Если часть пар можно отбросить без проверки — это два указателя, бинарный поиск или жадность.<\/li>\n<li><strong>Что мне нужно знать о прошлом, чтобы принять решение сейчас?<\/strong> Если ответ — одно число (минимум, сумма), достаточно одной переменной и одного прохода.<\/li>\n<\/ol>\n<p>Когда идея появилась, <strong>обязательно согласуй её до кода<\/strong>: «Предлагаю такой подход… это O(n). Начинаю писать?» Если идея неверна, интервьюер скажет сразу, и ты не потратишь 10 минут на код, который придётся выбросить.<\/p>"}, {"title": "Шаг 5. Код", "section": "Каждый шаг подробно", "html": "<p><strong>Зачем.<\/strong> Проверяется умение превратить идею в аккуратный рабочий код.<\/p>\n<p><strong>Правила.<\/strong><\/p>\n<ul>\n<li>Имена по смыслу: <code>min_price<\/code>, <code>best_profit<\/code>, а не <code>m<\/code>, <code>b<\/code>.<\/li>\n<li>Сначала обработай краевые случаи (пустой вход) — одной строкой в начале.<\/li>\n<li>Пиши сверху вниз и комментируй вслух, что делает блок: «здесь я обновляю минимум, здесь — ответ».<\/li>\n<li>Если нужна вспомогательная логика — вынеси в функцию, даже маленькую.<\/li>\n<li>Не гонись за однострочниками: на собесе понятность важнее краткости.<\/li>\n<\/ul>\n<p>Сравни два варианта одного и того же кода:<\/p>\n<pre><code class=\"language-python\"># плохо: непонятно, что такое m и r\ndef f(a):\n    m, r = 10**9, 0\n    for x in a:\n        m = min(m, x); r = max(r, x - m)\n    return r\n\n# хорошо: код читается как описание алгоритма\ndef max_profit(prices):\n    min_price = float('inf')\n    best_profit = 0\n    for price in prices:\n        min_price = min(min_price, price)\n        best_profit = max(best_profit, price - min_price)\n    return best_profit\n<\/code><\/pre>\n<p>Оба работают одинаково, но второй интервьюер проверит за 10 секунд.<\/p>"}, {"title": "Шаг 6. Тест", "section": "Каждый шаг подробно", "html": "<p><strong>Зачем.<\/strong> Код без запуска почти всегда содержит мелкую ошибку. Ты должен найти её сам — это отдельный критерий оценки.<\/p>\n<p><strong>Что делать.<\/strong><\/p>\n<ol>\n<li>Прочитай код глазами строка за строкой: нет ли опечаток, все ли переменные объявлены, правильные ли границы циклов.<\/li>\n<li>Прогони свой пример из шага 2 по таблице состояний (подробно — в разделе «Как проверять код руками» ниже).<\/li>\n<li>Прогони краевой случай: пустой вход, один элемент.<\/li>\n<li>Назови итоговую сложность по времени и памяти с объяснением.<\/li>\n<\/ol>\n<p><strong>Фразы.<\/strong> «Давайте я прогоню на примере [7, 1, 5]… Пустой массив: цикл не выполнится, вернём 0 — корректно. Итог: O(n) по времени, O(1) по памяти».<\/p>"}, {"title": "Полный разбор: собеседование на одной задаче", "html": "<p>Прогоним весь фреймворк на реальной задаче — LeetCode 121 «Best Time to Buy and Sell Stock». Она не требует знания специальных техник, поэтому хорошо показывает сам процесс.<\/p>\n<p><strong>Условие от интервьюера:<\/strong> «Дан массив prices, где prices[i] — цена акции в день i. Нужно один раз купить и один раз продать так, чтобы прибыль была максимальной. Верни эту прибыль».<\/p><h4>Шаг 1. Уточняем условие<\/h4><blockquote>\n<p><strong>Кандидат:<\/strong> Правильно понимаю: выбираем день покупки i и день продажи j, причём j строго позже i, и прибыль — prices[j] − prices[i]?<\/p>\n<p><strong>Интервьюер:<\/strong> Да.<\/p>\n<p><strong>Кандидат:<\/strong> Если цены только падают и заработать нельзя — что вернуть? Отрицательное число или 0?<\/p>\n<p><strong>Интервьюер:<\/strong> 0, можно вообще не торговать.<\/p>\n<p><strong>Кандидат:<\/strong> Какой размер массива и могут ли цены быть нулевыми?<\/p>\n<p><strong>Интервьюер:<\/strong> До 10⁵ элементов, цены от 0 до 10⁴.<\/p>\n<\/blockquote>\n<p>Что дал этот шаг: мы узнали, что ответ не бывает отрицательным (иначе начальное значение было бы другим) и что n = 10⁵ — значит, O(n²) не подойдёт.<\/p>"}, {"title": "Шаг 2. Примеры", "section": "Полный разбор: собеседование на одной задаче", "html": "<blockquote>\n<p><strong>Кандидат:<\/strong> Возьму [7, 1, 5, 3, 6, 4]. Лучше всего купить за 1 (день 1) и продать за 6 (день 4) — прибыль 5. Продать за 7 нельзя: этот день раньше покупки. Краевой пример: [7, 6, 4, 3, 1] — цены падают, ответ 0.<\/p>\n<\/blockquote>\n<p>Уже здесь видно важное: ответ — это не «максимум минус минимум» (7 − 1 = 6), потому что максимум 7 стоит <em>раньше<\/em> минимума. Это ловушка, которую пример помог поймать до написания кода.<\/p>"}, {"title": "Шаг 3. Брутфорс", "section": "Полный разбор: собеседование на одной задаче", "html": "<blockquote>\n<p><strong>Кандидат:<\/strong> Самое простое — перебрать все пары (i, j) с i &lt; j и взять максимум prices[j] − prices[i]. Это O(n²) по времени и O(1) по памяти. При n = 10⁵ это 5·10⁹ операций — не уложимся. Давайте улучшать.<\/p>\n<\/blockquote>\n<pre><code class=\"language-python\">def max_profit_brute(prices):\n    best = 0\n    for i in range(len(prices)):\n        for j in range(i + 1, len(prices)):\n            best = max(best, prices[j] - prices[i])\n    return best\n<\/code><\/pre>"}, {"title": "Шаг 4. Оптимизация — рассуждение вслух", "section": "Полный разбор: собеседование на одной задаче", "html": "<p>Применяем три вопроса из шага 4.<\/p>\n<ol>\n<li><strong>Какую работу я делаю повторно?<\/strong> Зафиксируем день продажи j. Внутренний цикл перебирает все i &lt; j, чтобы найти лучший день покупки. Но лучший день покупки для j — это просто самая низкая цена среди дней до j. И для j + 1 мы ищем тот же минимум, только с одним новым элементом. Мы каждый раз заново ищем минимум — это и есть повторная работа.<\/li>\n<li><strong>Что нужно знать о прошлом?<\/strong> Только одно число — минимальную цену на текущий момент.<\/li>\n<li><strong>Вывод.<\/strong> Идём слева направо, храним <code>min_price<\/code> — минимум среди уже пройденных дней. На каждом дне считаем «если продать сегодня — какая прибыль»: <code>price - min_price<\/code>. Обновляем лучший ответ.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Кандидат:<\/strong> Предлагаю один проход: храню минимальную цену до текущего дня и на каждом дне проверяю прибыль от продажи сегодня. Это O(n) по времени и O(1) по памяти. Начинаю писать?<\/p>\n<p><strong>Интервьюер:<\/strong> Давай.<\/p>\n<\/blockquote>"}, {"title": "Шаг 5. Код", "section": "Полный разбор: собеседование на одной задаче", "html": "<pre><code class=\"language-python\">def max_profit(prices):\n    min_price = float('inf')   # самая низкая цена среди прошлых дней\n    best_profit = 0            # 0 — если торговать невыгодно\n    for price in prices:\n        min_price = min(min_price, price)\n        best_profit = max(best_profit, price - min_price)\n    return best_profit\n<\/code><\/pre>\n<p>Тонкий момент, который стоит проговорить: сначала обновляем минимум, потом считаем прибыль. Если сегодняшняя цена — новый минимум, прибыль получится 0 (купили и продали в один день). Это не нарушает условие, потому что 0 и так нижняя граница ответа.<\/p>"}, {"title": "Шаг 6. Тест · Возможное продолжение", "html": "<blockquote>\n<p><strong>Кандидат:<\/strong> Прогоню на [7, 1, 5, 3, 6, 4]. <em>(Заполняет таблицу — см. следующий раздел.)<\/em> Получаю 5 — совпадает с ожиданием. Краевые случаи: пустой массив — цикл не выполнится, вернём 0. Один элемент — прибыль 0. Убывающие цены — минимум каждый день обновляется, прибыль всё время 0. Итог: O(n) по времени, O(1) по памяти.<\/p>\n<\/blockquote><h4>Возможное продолжение<\/h4><p>Часто интервьюер даёт усложнение. Для этой задачи типичное: «А если можно совершать сколько угодно сделок?» (задача 122). Ответ: складываем все положительные разницы соседних дней, потому что любой рост можно «собрать» по кусочкам. Готовность к таким вопросам — повод решать задачи вместе с их продолжениями.<\/p>"}, {"title": "Как проверять код руками: трассировка", "html": "<p>Трассировка — это выполнение кода «вместо компьютера»: ты идёшь по строкам и записываешь значения переменных после каждой итерации в таблицу. Это главный инструмент шага 6, потому что на собесе код обычно не запускают.<\/p><h4>Метод<\/h4><ol>\n<li>Выпиши столбцами все переменные, которые меняются в цикле.<\/li>\n<li>Одна строка таблицы — одна итерация цикла.<\/li>\n<li>Записывай значения <strong>после<\/strong> выполнения тела цикла.<\/li>\n<li>В конце сравни результат с ожидаемым ответом из шага 2.<\/li>\n<\/ol>"}, {"title": "Пример: max_profit на [7, 1, 5, 3, 6, 4]", "section": "Как проверять код руками: трассировка", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Итерация<\/th>\n<th>price<\/th>\n<th>min_price<\/th>\n<th>price − min_price<\/th>\n<th>best_profit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>до цикла<\/td>\n<td>—<\/td>\n<td>inf<\/td>\n<td>—<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>7<\/td>\n<td>7<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>5<\/td>\n<td>1<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>3<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>6<\/td>\n<td>1<\/td>\n<td>5<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>4<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>5<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Результат 5 совпадает с ожидаемым. Таблицу на собесе можно писать прямо комментарием в редакторе — это нормально и выглядит профессионально.<\/p>"}, {"title": "Как трассировка ловит баг", "section": "Как проверять код руками: трассировка", "html": "<p>Представим, что кандидат написал так:<\/p>\n<pre><code class=\"language-python\">def max_profit(prices):\n    min_price = prices[0]\n    best_profit = 0\n    for i in range(1, len(prices) - 1):\n        min_price = min(min_price, prices[i])\n        best_profit = max(best_profit, prices[i] - min_price)\n    return best_profit\n<\/code><\/pre>\n<p>На примере [7, 1, 5, 3, 6, 4] этот код возвращает 5 — правильно! Цикл идёт по i = 1..4 и не смотрит на последний день, но максимум оказался на дне 4, поэтому ошибка не проявилась. <strong>Пример из условия не всегда ловит ошибку.<\/strong><\/p>\n<p>Вот почему в шаге 2 нужны <em>свои<\/em> примеры, особенно краевые. Возьмём случай, где ответ — в самом конце, [2, 1, 4]:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Итерация<\/th>\n<th>i<\/th>\n<th>prices[i]<\/th>\n<th>min_price<\/th>\n<th>best_profit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>до цикла<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>2<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Цикл <code>range(1, 2)<\/code> выполнился один раз и закончился. Ответ 0, а ожидаем 3 (купить за 1, продать за 4). Ошибка найдена: граница должна быть <code>range(1, len(prices))<\/code>.<\/p>\n<p>Второй баг ловит пустой вход: <code>prices[0]<\/code> на пустом списке бросает IndexError. Исправление — проверка в начале <code>if not prices: return 0<\/code> или начальное значение <code>float('inf')<\/code>, как в эталонном решении.<\/p>"}, {"title": "Какие тесты выбирать", "section": "Как проверять код руками: трассировка", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тип теста<\/th>\n<th>Что ловит<\/th>\n<th>Пример для этой задачи<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>пример из условия<\/td>\n<td>грубые ошибки в логике<\/td>\n<td>[7, 1, 5, 3, 6, 4] → 5<\/td>\n<\/tr>\n<tr>\n<td>ответ в начале или в конце<\/td>\n<td>ошибки на единицу в границах циклов<\/td>\n<td>[2, 1, 4] → 3<\/td>\n<\/tr>\n<tr>\n<td>пустой вход / 1 элемент<\/td>\n<td>обращение к несуществующему индексу<\/td>\n<td>[] → 0, [5] → 0<\/td>\n<\/tr>\n<tr>\n<td>«ответа нет»<\/td>\n<td>неверное начальное значение<\/td>\n<td>[5, 4, 3] → 0<\/td>\n<\/tr>\n<tr>\n<td>одинаковые элементы<\/td>\n<td>ошибки в сравнениях &lt; и &lt;=<\/td>\n<td>[3, 3, 3] → 0<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Достаточно 2–3 теста из этой таблицы: пример из условия + граница + пустой вход.<\/p>"}, {"title": "Если застрял", "html": "<p>Застрять на собесе — нормально, это случается почти со всеми. Оценивают не то, застрял ли ты, а <strong>как ты из этого выходишь<\/strong>. Худшая реакция — замолчать на 5 минут.<\/p><h4>Порядок действий<\/h4><ol>\n<li><strong>Скажи вслух, где именно застрял.<\/strong> Не «я не знаю», а «брутфорс у меня O(n²), не вижу, как убрать внутренний цикл». Это даёт интервьюеру точку, куда подсказать.<\/li>\n<li><strong>Реши маленький пример руками и следи за собой.<\/strong> Как ты, человек, находишь ответ на [7, 1, 5, 3, 6, 4]? Скорее всего, ты интуитивно «помнишь минимум слева». То, что ты делаешь в голове, и есть алгоритм.<\/li>\n<li><strong>Пройдись по таблице сигналов<\/strong> (ниже в главе): отсортирован ли массив? нужна ли пара? просят ли минимальное число шагов?<\/li>\n<li><strong>Упрости задачу.<\/strong> Реши частный случай: массив из 2 элементов, только положительные числа, k = 1. Решение частного случая часто обобщается.<\/li>\n<li><strong>Измени точку зрения.<\/strong> Перебери не «откуда начинается», а «где заканчивается» ответ; иди не слева направо, а справа налево; отсортируй вход.<\/li>\n<li><strong>Если ничего не помогает — напиши брутфорс.<\/strong> Рабочее медленное решение лучше, чем пустой редактор. Часто в процессе написания видно, что оптимизировать.<\/li>\n<\/ol>"}, {"title": "Как принимать подсказки", "section": "Если застрял", "html": "<p>Подсказка — не провал, а нормальная часть собеса. Оценка снижается умеренно, если ты её быстро понял и развил. Сильно снижается, если подсказку пришлось повторять несколько раз.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ситуация<\/th>\n<th>Плохая реакция<\/th>\n<th>Хорошая реакция<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Интервьюер: «А что, если хранить что-то о прошлых элементах?»<\/td>\n<td>молча продолжать своё<\/td>\n<td>«Хранить минимум слева? Тогда для каждого дня я сразу знаю лучшую покупку…» — развить вслух<\/td>\n<\/tr>\n<tr>\n<td>Интервьюер: «Посмотри на строку 5»<\/td>\n<td>сразу всё переписать<\/td>\n<td>прогнать строку 5 на примере и найти, что не так<\/td>\n<\/tr>\n<tr>\n<td>Интервьюер: «Можно ли быстрее?»<\/td>\n<td>«Нельзя»<\/td>\n<td>«Сейчас O(n log n) из-за сортировки. Можно ли без неё — например, хеш-таблицей?»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Вопрос «Можно ли быстрее?» не всегда означает, что можно. Иногда интервьюер проверяет, уверен ли ты в оптимальности. Если решение уже O(n) и каждый элемент нужно хотя бы прочитать, правильный ответ: «Быстрее O(n) нельзя: любой алгоритм должен посмотреть на каждый элемент хотя бы раз».<\/p>"}, {"title": "Если не хватает времени · Таблица «сигнал в условии → техника»", "html": "<p>За 5 минут до конца, если код не дописан, скажи: «Время заканчивается, давайте я опишу оставшуюся часть словами». Затем опиши, что делают недописанные блоки, и назови сложность. Полное понятное описание лучше, чем наполовину написанный код без объяснения.<\/p><h4>Таблица «сигнал в условии → техника»<\/h4><div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сигнал<\/th>\n<th>Что пробовать<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>массив отсортирован<\/td>\n<td>два указателя, бинарный поиск<\/td>\n<\/tr>\n<tr>\n<td>«подмассив/подстрока с условием»<\/td>\n<td>скользящее окно, префиксные суммы<\/td>\n<\/tr>\n<tr>\n<td>«найти пару / было ли раньше»<\/td>\n<td>хеш-таблица<\/td>\n<\/tr>\n<tr>\n<td>«k наибольших/наименьших»<\/td>\n<td>куча<\/td>\n<\/tr>\n<tr>\n<td>скобки, «ближайший больший слева/справа»<\/td>\n<td>стек, монотонный стек<\/td>\n<\/tr>\n<tr>\n<td>дерево, вложенная структура<\/td>\n<td>рекурсия, DFS<\/td>\n<\/tr>\n<tr>\n<td>«минимальное число шагов»<\/td>\n<td>BFS<\/td>\n<\/tr>\n<tr>\n<td>зависимости, порядок задач<\/td>\n<td>топологическая сортировка<\/td>\n<\/tr>\n<tr>\n<td>«все варианты / все комбинации»<\/td>\n<td>backtracking<\/td>\n<\/tr>\n<tr>\n<td>«сколько способов», «максимум/минимум по выбору»<\/td>\n<td>динамическое программирование<\/td>\n<\/tr>\n<tr>\n<td>«минимальное X, при котором выполнимо»<\/td>\n<td>бинарный поиск по ответу<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Как пользоваться таблицей сигналов", "html": "<p>Таблица — это не правило «увидел слово → применил технику», а список <strong>гипотез для проверки на шаге 4<\/strong>. Ты находишь сигнал, называешь технику и проверяешь, убирает ли она узкое место брутфорса. Сами техники подробно разобраны в следующих главах; здесь важно научиться их <em>замечать<\/em>.<\/p><h4>Как читать условие<\/h4><p>Читая условие, подчёркивай три вещи:<\/p>\n<ul>\n<li><strong>Свойство входа<\/strong>: отсортирован, только положительные числа, граф без циклов, n ≤ 20.<\/li>\n<li><strong>Что ищем<\/strong>: пару, подотрезок, число способов, минимум шагов, все варианты.<\/li>\n<li><strong>Форма ответа<\/strong>: одно число, да/нет, список, порядок.<\/li>\n<\/ul>\n<p>Эти три вещи вместе почти всегда указывают на 1–2 техники.<\/p>"}, {"title": "Разбор на примерах условий", "section": "Как пользоваться таблицей сигналов", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Условие (кратко)<\/th>\n<th>Замеченный сигнал<\/th>\n<th>Гипотеза<\/th>\n<th>Глава<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>«В <strong>отсортированном<\/strong> массиве найди два числа с суммой target»<\/td>\n<td>отсортирован + пара<\/td>\n<td>два указателя с концов<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>«Найди длину самой длинной <strong>подстроки<\/strong> без повторяющихся символов»<\/td>\n<td>непрерывный отрезок + «самый длинный»<\/td>\n<td>скользящее окно<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>«Сколько <strong>подмассивов<\/strong> имеют сумму k? Числа могут быть <strong>отрицательными<\/strong>»<\/td>\n<td>подотрезок + отрицательные<\/td>\n<td>префиксные суммы + хеш-таблица (окно не подходит)<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>«Верни <strong>k самых частых<\/strong> элементов»<\/td>\n<td>k наибольших<\/td>\n<td>куча или подсчёт с корзинами<\/td>\n<td>8, 15<\/td>\n<\/tr>\n<tr>\n<td>«Проверь, правильная ли <strong>скобочная<\/strong> последовательность»<\/td>\n<td>скобки, вложенность<\/td>\n<td>стек<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>«За какое <strong>минимальное число ходов<\/strong> конь дойдёт до клетки?»<\/td>\n<td>минимум шагов, граф без весов<\/td>\n<td>BFS<\/td>\n<td>21<\/td>\n<\/tr>\n<tr>\n<td>«Можно ли пройти все курсы, если у некоторых есть <strong>пререквизиты<\/strong>?»<\/td>\n<td>зависимости<\/td>\n<td>топологическая сортировка<\/td>\n<td>22<\/td>\n<\/tr>\n<tr>\n<td>«Верни <strong>все подмножества<\/strong> массива»<\/td>\n<td>все варианты<\/td>\n<td>backtracking<\/td>\n<td>25<\/td>\n<\/tr>\n<tr>\n<td>«<strong>Сколькими способами<\/strong> можно подняться по лестнице?»<\/td>\n<td>число способов<\/td>\n<td>динамическое программирование<\/td>\n<td>27<\/td>\n<\/tr>\n<tr>\n<td>«Найди <strong>минимальную скорость<\/strong>, при которой Коко успеет съесть бананы за h часов»<\/td>\n<td>минимальное X, при котором выполнимо<\/td>\n<td>бинарный поиск по ответу<\/td>\n<td>10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Почему «по ответу» работает: проверка гипотезы на одном примере", "section": "Как пользоваться таблицей сигналов", "html": "<p>Возьмём последнюю строку. Брутфорс — перебрать все скорости от 1 до max(piles) и для каждой проверить, успевает ли Коко. Узкое место — перебор всех скоростей. Замечаем свойство: если скорость v подходит, то и любая большая скорость подходит (есть быстрее — успеешь тем более). Значит, ответы выглядят как «нет, нет, нет, да, да, да», и границу между «нет» и «да» можно найти бинарным поиском за O(log max) проверок вместо max проверок. Так сигнал из таблицы превращается в обоснованное решение.<\/p>"}, {"title": "Когда сигналы конфликтуют · Типичные ошибки", "html": "<p>Иногда подходят две техники. Например, «пара с суммой target» в <strong>неотсортированном<\/strong> массиве: можно отсортировать и взять два указателя (O(n log n), O(1) памяти) или взять хеш-таблицу (O(n), O(n) памяти). Правильная реакция — назвать оба варианта и их компромисс, а интервьюер скажет, что ему важнее. Это само по себе сильный сигнал.<\/p><h4>Типичные ошибки<\/h4><ul>\n<li>Сразу писать код, не уточнив условие и не согласовав идею.<\/li>\n<li>Молчать: интервьюер не может подсказать, если не видит, где ты застрял.<\/li>\n<li>Не называть сложность или называть неверно.<\/li>\n<li>Не тестировать код после написания: ошибки на границах (off-by-one) находит интервьюер, а не ты.<\/li>\n<\/ul>"}], "viz": "profit", "tasks": [{"id": "1-order", "type": "order", "title": "Фреймворк из 6 шагов", "q": "Расставь шаги решения задачи на собеседовании в правильном порядке.", "items": ["Понять условие и уточнить ограничения", "Разобрать примеры, включая краевой", "Назвать брутфорс и его сложность", "Найти оптимизацию и согласовать идею", "Написать код", "Прогнать код руками и назвать сложность"], "hints": ["Код никогда не пишут первым шагом.", "Прежде чем искать быстрое решение, нужно иметь любое решение.", "Примеры разбирают до брутфорса: они проверяют понимание условия.", "Тест — всегда последний шаг: проверяют уже написанный код.", "Порядок: условие → примеры → брутфорс → оптимизация → код → тест."], "expl": "Каждый шаг опирается на предыдущий: без понятого условия примеры бессмысленны, без брутфорса неясно, что оптимизировать, а тест проверяет уже готовый код."}, {"id": "1-sig-sorted", "type": "choice", "title": "Сигнал: отсортированный массив", "q": "«В **отсортированном** массиве найди два числа с суммой target». Какую технику пробовать первой?", "options": ["Два указателя с концов", "Префиксные суммы", "BFS", "Динамическое программирование"], "answer": 0, "hints": ["Какое слово в условии самое важное?", "Отсортированность почти всегда подсказка.", "Сумма двух элементов растёт, если взять правый элемент побольше.", "Можно идти с двух концов и сдвигать один из концов.", "Встречные указатели l и r (глава 6)."], "expl": "Отсортированность + пара → встречные указатели: если сумма мала, двигаем левый, если велика — правый. O(n) вместо O(n²)."}, {"id": "1-sig-bfs", "type": "choice", "title": "Сигнал: минимум шагов", "q": "«За какое **минимальное число ходов** конь дойдёт до клетки на доске?» Что пробовать?", "options": ["Бинарный поиск", "BFS (поиск в ширину)", "Куча", "Скользящее окно"], "answer": 1, "hints": ["Ходы коня — это переходы между клетками.", "Клетки и ходы образуют граф.", "У рёбер графа нет весов — каждый ход стоит 1.", "Нужен обход «волнами»: сначала клетки на расстоянии 1, потом 2…", "BFS даёт кратчайший путь в графе без весов."], "expl": "«Минимальное число шагов» в графе без весов — это BFS: он обходит вершины в порядке расстояния от старта."}, {"id": "1-sig-dp", "type": "choice", "title": "Сигнал: сколько способов", "q": "«**Сколькими способами** можно подняться по лестнице из n ступенек, шагая на 1 или 2?» Что пробовать?", "options": ["Хеш-таблица", "Два указателя", "Динамическое программирование", "Стек"], "answer": 2, "hints": ["Ответ для n зависит от ответов для меньших n.", "Последний шаг был на 1 или на 2 ступеньки.", "ways(n) = ways(n − 1) + ways(n − 2).", "Подзадачи повторяются — их ответы стоит запоминать.", "«Сколько способов» → динамическое программирование."], "expl": "Ответ складывается из ответов подзадач: ways(n) = ways(n−1) + ways(n−2). «Сколько способов» — классический сигнал ДП."}, {"id": "1-stuck", "type": "choice", "title": "Если застрял", "q": "Ты 3 минуты не видишь, как улучшить брутфорс. Что сделать **первым**?", "options": ["Молча думать дальше, чтобы не показать слабость", "Сказать вслух, где именно застрял", "Сразу писать брутфорс без объяснений", "Попросить другую задачу"], "answer": 1, "hints": ["Интервьюер оценивает процесс, а не только ответ.", "Молчание — худшая реакция.", "Интервьюер может помочь, только если видит, в чём проблема.", "Нужно назвать конкретное узкое место.", "«Брутфорс O(n²), не вижу, как убрать внутренний цикл» — вслух."], "expl": "Чёткая формулировка проблемы вслух даёт интервьюеру точку для подсказки и показывает коммуникацию — один из 4 критериев оценки."}, {"id": "1-bug", "type": "bug", "title": "Найди баг: прибыль от акции", "q": "Функция должна вернуть максимальную прибыль от одной покупки и продажи. На [7, 1, 5, 3, 6, 4] она возвращает 5 (верно), но на [2, 1, 4] — 0 вместо 3. Найди строку с ошибкой.", "code": ["def max_profit(prices):", "    min_price = prices[0]", "    best_profit = 0", "    for i in range(1, len(prices) - 1):", "        min_price = min(min_price, prices[i])", "        best_profit = max(best_profit, prices[i] - min_price)", "    return best_profit"], "line": 3, "fixes": ["for i in range(1, len(prices)):", "for i in range(0, len(prices) - 1):", "for i in range(2, len(prices)):"], "fix": 0, "hints": ["Ответ 0 вместо 3 — какой день продажи пропущен?", "Лучший день продажи в [2, 1, 4] — последний.", "Посмотри, до какого индекса идёт цикл.", "range(1, len - 1) не включает последний индекс.", "Граница должна быть len(prices)."], "expl": "Цикл range(1, len(prices) − 1) пропускает последний день. Пример из условия не ловит баг, а тест с ответом в конце — ловит. Есть и второй баг: prices[0] падает на пустом списке."}, {"id": "1-predict", "type": "predict", "title": "Что вернёт функция", "q": "Что вернёт max_profit([7, 6, 4, 3, 1])?", "code": "def max_profit(prices):\n    min_price = float('inf')\n    best_profit = 0\n    for price in prices:\n        min_price = min(min_price, price)\n        best_profit = max(best_profit, price - min_price)\n    return best_profit\n\nprint(max_profit([7, 6, 4, 3, 1]))", "answer": "0", "hints": ["Цены только падают.", "Каждый день min_price обновляется на текущую цену.", "price − min_price тогда равно 0.", "best_profit стартует с 0 и не растёт.", "Ответ — 0."], "expl": "Цены убывают, поэтому каждый день текущая цена — новый минимум, и прибыль «купить и продать сегодня» равна 0."}, {"id": "1-code", "type": "code", "title": "Лучшее время купить и продать", "q": "Дан список цен prices, где prices[i] — цена в день i. Купи один раз и продай позже. Верни максимальную прибыль или 0, если заработать нельзя.", "fn": "max_profit", "starter": "def max_profit(prices):\n    pass\n", "leetcode": 121, "tests": [{"args": [[7, 1, 5, 3, 6, 4]], "exp": 5, "hidden": false}, {"args": [[7, 6, 4, 3, 1]], "exp": 0, "hidden": false}, {"args": [[2, 1, 4]], "exp": 3, "hidden": true, "case": "ответ в последний день"}, {"args": [[]], "exp": 0, "hidden": true, "case": "пустой список"}, {"args": [[5]], "exp": 0, "hidden": true, "case": "один элемент"}], "speed": {"gen": "import random\nrandom.seed(1)\nARGS=[[random.randint(0,10**4) for _ in range(100000)]]"}, "ref": "def max_profit(prices):\n    min_price = float('inf')\n    best = 0\n    for p in prices:\n        min_price = min(min_price, p)\n        best = max(best, p - min_price)\n    return best\n", "hints": ["Брутфорс — все пары дней, O(n²). Что в нём повторяется?", "Для дня продажи лучший день покупки — самая низкая цена раньше.", "Храни минимальную цену среди прошлых дней.", "На каждом дне: обнови минимум, посчитай price − min_price.", "min_price = inf, best = 0; for p: min_price = min(...); best = max(best, p − min_price)."], "expl": "Один проход с минимумом слева: O(n) времени, O(1) памяти. Брутфорс по парам — O(n²) и не проходит тест на скорость."}], "test": [{"q": "Кандидат решил задачу молча, а баг нашёл интервьюер. По какому критерию у него слабый сигнал?", "options": ["Решение задачи", "Тестирование", "Знание Python", "Скорость печати"], "answer": 1}, {"q": "Зачем проговаривать брутфорс, если сразу видно оптимальное решение?", "options": ["Чтобы потянуть время", "Он показывает понимание условия и даёт точку отсчёта", "Интервьюер требует писать его код", "Брутфорс всегда достаточно быстрый"], "answer": 1}, {"q": "Какой тест ловит ошибку на единицу в границе цикла?", "options": ["Пример из условия", "Случай, где ответ в самом конце массива", "Очень большой вход", "Любой случайный"], "answer": 1}, {"q": "Когда согласовывать идею с интервьюером?", "options": ["После написания кода", "До написания кода", "Не нужно согласовывать", "Только если просят"], "answer": 1}, {"q": "«Найди минимальное X, при котором условие выполнимо». Сигнал к технике:", "options": ["Бинарный поиск по ответу", "Стек", "Хеш-таблица", "Backtracking"], "answer": 0}, {"q": "До конца 5 минут, код не дописан. Что делать?", "options": ["Молча дописывать", "Описать оставшуюся часть словами и назвать сложность", "Стереть и начать заново", "Сдаться"], "answer": 1}, {"q": "«Найди все подмножества массива». Сигнал к технике:", "options": ["Backtracking", "Префиксные суммы", "Куча", "Два указателя"], "answer": 0}]}, {"title": "Глава 2. Асимптотика: оценка сложности", "short": "Асимптотика: оценка сложности", "part": "Часть I · Фундамент", "cards": [{"title": "Зачем это нужно", "html": "<p>Сложность алгоритма — это то, как растёт число операций (время) или объём памяти при росте размера входа n. Константы и младшие слагаемые отбрасывают: 3n² + 5n + 100 записывают как O(n²), потому что при больших n именно n² определяет время.<\/p><h4>Зачем это нужно<\/h4><p>На собесе тебя почти всегда спросят: «Какая сложность у решения?» Без ответа решение считается незаконченным. Асимптотика — общий язык, на котором ты и интервьюер сравниваете решения, не запуская их. Фраза «моё решение O(n), а брутфорс O(n²)» сразу объясняет, почему твой вариант лучше.<\/p>\n<p>Замерять время в секундах на собесе бессмысленно: оно зависит от компьютера, языка, нагрузки. Поэтому считают не секунды, а <strong>как число шагов растёт вместе с n<\/strong>.<\/p>"}, {"title": "Что считается «операцией»", "html": "<p>Операция — любое действие, которое выполняется за постоянное время, не зависящее от n:<\/p>\n<ul>\n<li>арифметика: <code>a + b<\/code>, <code>a * b<\/code>, <code>a // 2<\/code>;<\/li>\n<li>сравнение: <code>a &lt; b<\/code>;<\/li>\n<li>присваивание: <code>x = 5<\/code>;<\/li>\n<li>доступ по индексу: <code>arr[i]<\/code>;<\/li>\n<li>поиск или вставка в dict/set (в среднем).<\/li>\n<\/ul>\n<p>Не являются одной операцией вещи, которые внутри перебирают данные: <code>sum(arr)<\/code>, <code>max(arr)<\/code>, <code>x in list<\/code>, <code>arr.sort()<\/code>, срез <code>arr[a:b]<\/code>. Их стоимость зависит от размера данных — это частая ловушка (подробно в разборе фрагментов ниже).<\/p>\n<p>Точно считать операции не нужно: <code>a = b + c<\/code> — это 1 операция или 3? Неважно. Важна только <strong>форма роста<\/strong>: удвоили n — время удвоилось, учетверилось или почти не изменилось.<\/p>"}, {"title": "Почему отбрасывают константы и младшие слагаемые", "html": "<p>Пусть алгоритм делает 3n² + 5n + 100 операций. Посмотрим, какую долю даёт каждое слагаемое:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>n<\/th>\n<th>3n²<\/th>\n<th>5n<\/th>\n<th>100<\/th>\n<th>Всего<\/th>\n<th>Доля 3n²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>300<\/td>\n<td>50<\/td>\n<td>100<\/td>\n<td>450<\/td>\n<td>67 %<\/td>\n<\/tr>\n<tr>\n<td>100<\/td>\n<td>30 000<\/td>\n<td>500<\/td>\n<td>100<\/td>\n<td>30 600<\/td>\n<td>98 %<\/td>\n<\/tr>\n<tr>\n<td>1 000<\/td>\n<td>3 000 000<\/td>\n<td>5 000<\/td>\n<td>100<\/td>\n<td>3 005 100<\/td>\n<td>99,8 %<\/td>\n<\/tr>\n<tr>\n<td>10 000<\/td>\n<td>300 000 000<\/td>\n<td>50 000<\/td>\n<td>100<\/td>\n<td>\\~3·10⁸<\/td>\n<td>99,98 %<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Уже при n = 100 младшие слагаемые почти ничего не значат. Поэтому оставляют только старшее: O(n²).<\/p>\n<p>Коэффициент 3 тоже отбрасывают, по другой причине: он зависит от языка и железа, а не от идеи алгоритма. Главное — он не меняет <strong>класс<\/strong> роста. Сравним «плохую константу» с «плохим ростом»:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>n<\/th>\n<th>100n (O(n) с большой константой)<\/th>\n<th>n² (O(n²) без константы)<\/th>\n<th>Кто быстрее<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>1 000<\/td>\n<td>100<\/td>\n<td>n²<\/td>\n<\/tr>\n<tr>\n<td>100<\/td>\n<td>10 000<\/td>\n<td>10 000<\/td>\n<td>поровну<\/td>\n<\/tr>\n<tr>\n<td>10 000<\/td>\n<td>10⁶<\/td>\n<td>10⁸<\/td>\n<td>100n в 100 раз<\/td>\n<\/tr>\n<tr>\n<td>10⁶<\/td>\n<td>10⁸<\/td>\n<td>10¹²<\/td>\n<td>100n в 10 000 раз<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На маленьких n квадратичный алгоритм может выиграть, но на размерах из условий задач (10⁵ и больше) линейный выигрывает всегда и с огромным отрывом. Асимптотика описывает именно поведение на больших n.<\/p>"}, {"title": "Обозначения", "html": "<ul>\n<li><strong>O(f(n))<\/strong> — верхняя оценка: алгоритм работает <em>не дольше<\/em> c·f(n). На собесе «сложность» почти всегда означает O для худшего случая.<\/li>\n<li><strong>Ω(f(n))<\/strong> — нижняя оценка: <em>не быстрее<\/em>.<\/li>\n<li><strong>Θ(f(n))<\/strong> — точная оценка: и O, и Ω одновременно.<\/li>\n<\/ul><h4>Обозначения на примерах<\/h4><p>Удобная аналогия — оценка времени поездки:<\/p>\n<ul>\n<li><strong>O<\/strong> — «доеду <em>не дольше<\/em> чем за час» (потолок).<\/li>\n<li><strong>Ω<\/strong> — «доеду <em>не быстрее<\/em> чем за 20 минут» (пол).<\/li>\n<li><strong>Θ<\/strong> — «доеду ровно примерно за 40 минут» (и потолок, и пол одного порядка).<\/li>\n<\/ul>\n<p>Для функции f(n) = 3n² + 5n:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Утверждение<\/th>\n<th>Верно?<\/th>\n<th>Почему<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>f = O(n²)<\/td>\n<td>да<\/td>\n<td>растёт не быстрее n²<\/td>\n<\/tr>\n<tr>\n<td>f = O(n³)<\/td>\n<td>да, но бесполезно<\/td>\n<td>n³ — тоже потолок, просто грубый<\/td>\n<\/tr>\n<tr>\n<td>f = Ω(n²)<\/td>\n<td>да<\/td>\n<td>растёт не медленнее n²<\/td>\n<\/tr>\n<tr>\n<td>f = Ω(n)<\/td>\n<td>да, но бесполезно<\/td>\n<td>грубый пол<\/td>\n<\/tr>\n<tr>\n<td>f = Θ(n²)<\/td>\n<td>да<\/td>\n<td>и потолок, и пол — n²<\/td>\n<\/tr>\n<tr>\n<td>f = O(n)<\/td>\n<td>нет<\/td>\n<td>n² обгоняет любое c·n<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На собесе принято называть <strong>самую точную<\/strong> верхнюю оценку. Формально O(n³) для этого алгоритма верно, но ответ «O(n³)» интервьюер засчитает как ошибку. В разговорной речи «O(n²)» почти всегда означает именно Θ(n²).<\/p>"}, {"title": "Лучший, средний и худший случай", "section": "Обозначения", "html": "<p>Это отдельный вопрос от O/Ω/Θ: на каких входных данных мы считаем время. Пример — линейный поиск числа x в массиве:<\/p>\n<pre><code class=\"language-python\">def find(arr, x):\n    for i, v in enumerate(arr):\n        if v == x:\n            return i\n    return -1\n<\/code><\/pre>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Случай<\/th>\n<th>Когда<\/th>\n<th>Число сравнений<\/th>\n<th>Сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>лучший<\/td>\n<td>x стоит первым<\/td>\n<td>1<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>средний<\/td>\n<td>x в случайном месте<\/td>\n<td>\\~n/2<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>худший<\/td>\n<td>x последний или его нет<\/td>\n<td>n<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>На собесе по умолчанию называют <strong>худший случай<\/strong>: он даёт гарантию. Лучший случай почти бесполезен — «O(1), если повезёт» ничего не говорит об алгоритме.<\/p>\n<p>Исключения, где принято уточнять средний случай:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Структура / алгоритм<\/th>\n<th>Средний<\/th>\n<th>Худший<\/th>\n<th>Что говорить<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>поиск в dict / set<\/td>\n<td>O(1)<\/td>\n<td>O(n) при коллизиях<\/td>\n<td>«O(1) в среднем»<\/td>\n<\/tr>\n<tr>\n<td>быстрая сортировка<\/td>\n<td>O(n log n)<\/td>\n<td>O(n²) при плохом опорном<\/td>\n<td>«O(n log n) в среднем, O(n²) в худшем»<\/td>\n<\/tr>\n<tr>\n<td>sorted() в Python (Timsort)<\/td>\n<td>O(n log n)<\/td>\n<td>O(n log n)<\/td>\n<td>«O(n log n)»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Основные классы", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Класс<\/th>\n<th>Пример<\/th>\n<th>n = 10⁶, операций<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>O(1)<\/td>\n<td>доступ arr[i], поиск в dict<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>O(log n)<\/td>\n<td>бинарный поиск<\/td>\n<td>\\~20<\/td>\n<\/tr>\n<tr>\n<td>O(n)<\/td>\n<td>один проход по массиву<\/td>\n<td>10⁶<\/td>\n<\/tr>\n<tr>\n<td>O(n log n)<\/td>\n<td>сортировка<\/td>\n<td>\\~2·10⁷<\/td>\n<\/tr>\n<tr>\n<td>O(n²)<\/td>\n<td>все пары, два вложенных цикла<\/td>\n<td>10¹² — не успеет<\/td>\n<\/tr>\n<tr>\n<td>O(2ⁿ)<\/td>\n<td>все подмножества<\/td>\n<td>только n ≤ 20–25<\/td>\n<\/tr>\n<tr>\n<td>O(n!)<\/td>\n<td>все перестановки<\/td>\n<td>только n ≤ 10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Откуда берётся log n", "section": "Основные классы", "html": "<p>log₂ n — сколько раз n можно поделить пополам, пока не останется 1. Это ответ на вопрос «в какую степень возвести 2, чтобы получить n».<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>n<\/th>\n<th>Делим пополам до 1<\/th>\n<th>log₂ n<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>8<\/td>\n<td>8 → 4 → 2 → 1<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>1 024<\/td>\n<td>10 делений<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>10⁶<\/td>\n<td>\\~20 делений<\/td>\n<td>\\~20<\/td>\n<\/tr>\n<tr>\n<td>10⁹<\/td>\n<td>\\~30 делений<\/td>\n<td>\\~30<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Полезно запомнить: <strong>2¹⁰ ≈ 10³<\/strong>, поэтому log₂(10⁶) ≈ 20, log₂(10⁹) ≈ 30. Логарифм растёт так медленно, что O(log n) на практике почти как O(1).<\/p>\n<p>log n появляется всегда, когда алгоритм <strong>на каждом шаге отбрасывает долю данных<\/strong> (обычно половину):<\/p>\n<ul>\n<li>бинарный поиск — каждое сравнение отбрасывает половину массива;<\/li>\n<li>сбалансированное дерево — каждый шаг вниз отбрасывает половину узлов;<\/li>\n<li>куча — элемент поднимается или опускается по высоте дерева, а высота \\~log n.<\/li>\n<\/ul>\n<p>n log n — это «n раз сделать что-то за log n» или «log n уровней, на каждом O(n) работы». Так устроены сортировка слиянием (log n уровней деления, на каждом слияние за O(n)) и n вставок в кучу.<\/p>\n<p>Основание логарифма в O не пишут: log₂ n и log₁₀ n отличаются только постоянным множителем (≈3,3), а константы отбрасываются.<\/p>"}, {"title": "Сколько это в секундах", "section": "Основные классы", "html": "<p>При \\~10⁷ простых операций в секунду (чистый Python):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сложность<\/th>\n<th>n = 10³<\/th>\n<th>n = 10⁵<\/th>\n<th>n = 10⁶<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>O(log n)<\/td>\n<td>мгновенно<\/td>\n<td>мгновенно<\/td>\n<td>мгновенно<\/td>\n<\/tr>\n<tr>\n<td>O(n)<\/td>\n<td>0,0001 с<\/td>\n<td>0,01 с<\/td>\n<td>0,1 с<\/td>\n<\/tr>\n<tr>\n<td>O(n log n)<\/td>\n<td>0,001 с<\/td>\n<td>\\~0,2 с<\/td>\n<td>\\~2 с<\/td>\n<\/tr>\n<tr>\n<td>O(n²)<\/td>\n<td>0,1 с<\/td>\n<td>\\~17 мин<\/td>\n<td>\\~28 ч<\/td>\n<\/tr>\n<tr>\n<td>O(n³)<\/td>\n<td>\\~2 мин<\/td>\n<td>\\~3 года<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Для экспоненты рост по n ещё быстрее:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сложность<\/th>\n<th>n = 10<\/th>\n<th>n = 20<\/th>\n<th>n = 30<\/th>\n<th>n = 50<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>O(2ⁿ)<\/td>\n<td>мгновенно<\/td>\n<td>0,1 с<\/td>\n<td>\\~2 мин<\/td>\n<td>\\~3,5 года<\/td>\n<\/tr>\n<tr>\n<td>O(n!)<\/td>\n<td>0,4 с<\/td>\n<td>\\~7 700 лет<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Вывод из таблиц: разница между O(n) и O(n²) при n = 10⁵ — это «мгновенно» против «17 минут». Именно поэтому оптимизация с квадрата до линии — главное, что проверяют на собесе.<\/p>\n<p>Оговорка про Python: встроенные функции (<code>sorted<\/code>, <code>sum<\/code>, методы dict и set) написаны на C и работают в 10–100 раз быстрее цикла на Python. Поэтому <code>sorted()<\/code> на 10⁶ элементов занимает доли секунды, а не 2 с. Но асимптотика от этого не меняется: O(n log n) остаётся O(n log n).<\/p>"}, {"title": "Как оценивать по ограничениям", "html": "<p>Python выполняет примерно 10⁷ простых операций в секунду. Отсюда правило выбора алгоритма по размеру входа:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ограничение на n<\/th>\n<th>Допустимая сложность<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>n ≤ 10<\/td>\n<td>O(n!)<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 20<\/td>\n<td>O(2ⁿ)<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 500<\/td>\n<td>O(n³)<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 5 000<\/td>\n<td>O(n²)<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 10⁵–10⁶<\/td>\n<td>O(n log n) или O(n)<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 10⁹ и больше<\/td>\n<td>O(log n) или O(1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Если в условии n ≤ 10⁵, интервьюер почти наверняка ждёт O(n) или O(n log n), а не O(n²).<\/p>"}, {"title": "Ограничения как подсказка к решению", "section": "Как оценивать по ограничениям", "html": "<p>Ограничения работают в обе стороны: они не только запрещают медленные решения, но и <strong>подсказывают, какое решение ищут<\/strong>. Если интервьюер не назвал размер входа — спроси (глава 1, шаг 1).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ограничение в условии<\/th>\n<th>Вывод<\/th>\n<th>Скорее всего ищут<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>n ≤ 15<\/td>\n<td>можно перебрать все подмножества<\/td>\n<td>backtracking, битовые маски<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 1 000<\/td>\n<td>O(n²) проходит<\/td>\n<td>двойной цикл, ДП по парам индексов<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 10⁵<\/td>\n<td>нужно O(n log n) или O(n)<\/td>\n<td>сортировка, два указателя, хеш-таблица, окно<\/td>\n<\/tr>\n<tr>\n<td>n ≤ 10⁵ и числа до 10⁹<\/td>\n<td>нельзя заводить массив размера max значения<\/td>\n<td>хеш-таблица вместо массива-счётчика<\/td>\n<\/tr>\n<tr>\n<td>значения до 10⁹, n маленькое<\/td>\n<td>ответ можно искать перебором значения<\/td>\n<td>бинарный поиск по ответу<\/td>\n<\/tr>\n<tr>\n<td>«за O(1) памяти»<\/td>\n<td>нельзя заводить dict или копию массива<\/td>\n<td>два указателя, изменение на месте<\/td>\n<\/tr>\n<tr>\n<td>«за O(log n)»<\/td>\n<td>нельзя даже прочитать весь массив<\/td>\n<td>бинарный поиск<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Пример рассуждения.<\/strong> Условие: «найди в массиве длины до 10⁵ два числа с суммой target». Рассуждаем: n² = 10¹⁰ — не пройдёт. Значит, нужно O(n log n) (сортировка + два указателя) или O(n) (хеш-таблица). Всего за 10 секунд ограничение отсекло брутфорс и указало на два кандидата.<\/p>"}, {"title": "Как проговаривать сложность", "section": "Как оценивать по ограничениям", "html": "<p>Сложность называют в конце решения и обязательно <strong>с обоснованием<\/strong> — откуда она берётся. Голое «O(n)» звучит как угадывание.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Слабый ответ<\/th>\n<th>Сильный ответ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>«O(n)»<\/td>\n<td>«O(n) по времени: один проход, на каждом элементе O(1) операций со словарём. O(n) по памяти: в худшем случае все элементы попадут в словарь»<\/td>\n<\/tr>\n<tr>\n<td>«Вроде n log n»<\/td>\n<td>«O(n log n) из-за сортировки, дальше линейный проход двумя указателями — он O(n) и на итог не влияет. Память O(1), если не считать сортировки, которая в Python использует O(n)»<\/td>\n<\/tr>\n<tr>\n<td>«O(n²)… или O(n)?»<\/td>\n<td>«Внешний цикл n раз, внутренний while сдвигает указатель l, который за всё время сдвигается не больше n раз. Итого O(n), а не O(n²)»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Всегда называй <strong>две<\/strong> сложности: время и память. Если в задаче несколько параметров (длина строки n и размер алфавита k, число вершин V и рёбер E), сложность выражают через все: O(n·k), O(V + E).<\/p>"}, {"title": "Правила подсчёта", "html": "<ol>\n<li><strong>Последовательные блоки складываются<\/strong>: O(n) + O(n log n) = O(n log n) — берём старший.<\/li>\n<li><strong>Вложенные циклы перемножаются<\/strong>: цикл по n внутри цикла по m — O(n·m).<\/li>\n<li><strong>Цикл, где переменная делится пополам<\/strong> — O(log n).<\/li>\n<li><strong>Рекурсия<\/strong> — число вызовов × работа в одном вызове (подробно в главе 4).<\/li>\n<\/ol>\n<pre><code class=\"language-python\">def example(arr):\n    n = len(arr)\n    total = 0\n    for x in arr:          # O(n)\n        total += x\n    for i in range(n):     # O(n) * O(n) = O(n^2)\n        for j in range(i + 1, n):\n            total += arr[i] * arr[j]\n    i = n\n    while i &gt; 1:           # O(log n)\n        i //= 2\n    return total           # итого O(n^2)\n<\/code><\/pre>"}, {"title": "Разбор подсчёта на фрагментах", "section": "Правила подсчёта", "html": "<p>Универсальный метод: <strong>посчитай, сколько раз выполнится самая внутренняя строка за всё время работы<\/strong>. Не «сколько итераций у каждого цикла», а суммарно. Большинство ловушек ломаются именно этим вопросом.<\/p>\n<p><strong>Фрагмент 1. Зависимый вложенный цикл<\/strong><\/p>\n<pre><code class=\"language-python\">for i in range(n):\n    for j in range(i + 1, n):\n        print(i, j)\n<\/code><\/pre>\n<p>Внутренний цикл делает n−1, n−2, …, 1, 0 итераций. Сумма: (n−1) + (n−2) + … + 1 = n(n−1)/2 ≈ n²/2. Отбрасываем 1/2 — <strong>O(n²)<\/strong>. То, что внутренний цикл «короче», меняет только константу.<\/p>\n<p><strong>Фрагмент 2. Удвоение счётчика<\/strong><\/p>\n<pre><code class=\"language-python\">i = 1\nwhile i &lt; n:\n    i *= 2\n<\/code><\/pre>\n<p>i принимает значения 1, 2, 4, …, пока не дойдёт до n. Это log₂ n шагов — <strong>O(log n)<\/strong>. Так же <code>i //= 2<\/code> от n до 1.<\/p>\n<p><strong>Фрагмент 3. Ловушка: внутренний цикл с удвоением внешнего<\/strong><\/p>\n<pre><code class=\"language-python\">i = 1\nwhile i &lt; n:\n    for j in range(i):\n        print(j)\n    i *= 2\n<\/code><\/pre>\n<p>Кажется, что это O(n log n): внешний цикл log n раз, внутренний до n. Но посчитаем внутреннюю строку суммарно: 1 + 2 + 4 + … + 2ᵏ, где 2ᵏ &lt; n. Сумма геометрической прогрессии меньше удвоенного последнего члена, то есть меньше 2n. Итого <strong>O(n)<\/strong>.<\/p>\n<p><strong>Фрагмент 4. Ловушка: while внутри for, но указатель не сбрасывается<\/strong><\/p>\n<pre><code class=\"language-python\">l = 0\nfor r in range(n):\n    while l &lt; r and arr[l] &lt; arr[r]:\n        l += 1\n<\/code><\/pre>\n<p>Выглядит как O(n²), но l только растёт и никогда не сбрасывается. За всю работу он сдвинется не больше n раз, то есть while суммарно выполнится не больше n раз. Итого <strong>O(n)<\/strong> — это основа скользящего окна (глава 7).<\/p>\n<p><strong>Фрагмент 5. Скрытая стоимость: <code>in<\/code> по списку<\/strong><\/p>\n<pre><code class=\"language-python\">result = []\nfor x in a:\n    if x not in result:     # O(len(result)) — проход по списку!\n        result.append(x)\n<\/code><\/pre>\n<p>Один цикл, но <code>x not in result<\/code> — это скрытый внутренний цикл. Итого <strong>O(n²)<\/strong>. Исправление — множество для проверки: <code>seen = set()<\/code>, <code>if x not in seen<\/code> — O(1), итог O(n).<\/p>\n<p><strong>Фрагмент 6. Скрытая стоимость: срезы и строки<\/strong><\/p>\n<pre><code class=\"language-python\">while s:\n    s = s[1:]         # копирует оставшуюся строку\n<\/code><\/pre>\n<p>Каждый срез копирует n−1, n−2, … символов — суммарно \\~n²/2, итого <strong>O(n²)<\/strong>. Вместо срезов двигай индекс. Аналогично <code>res = res + ch<\/code> в цикле может давать O(n²): строки неизменяемы, каждая склейка создаёт новую строку. Используй список и <code>''.join(parts)<\/code>.<\/p>\n<p><strong>Фрагмент 7. Два разных входа<\/strong><\/p>\n<pre><code class=\"language-python\">for x in a:           # len(a) = n\n    print(x)\nfor y in b:           # len(b) = m\n    print(y)\n\nfor x in a:\n    for y in b:\n        print(x, y)\n<\/code><\/pre>\n<p>Первые два цикла — <strong>O(n + m)<\/strong>, вложенные — <strong>O(n·m)<\/strong>. Нельзя писать O(n), если размеры разные: m может быть гораздо больше n.<\/p>\n<p><strong>Фрагмент 8. Сортировка внутри цикла<\/strong><\/p>\n<pre><code class=\"language-python\">for q in queries:          # q запросов\n    s = sorted(arr)        # O(n log n) каждый раз\n    print(s[q])\n<\/code><\/pre>\n<p>Итого <strong>O(q · n log n)<\/strong>. Исправление — вынести сортировку из цикла: O(n log n + q).<\/p>"}, {"title": "Сводка ловушек", "section": "Правила подсчёта", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Что видишь<\/th>\n<th>Кажется<\/th>\n<th>На самом деле<\/th>\n<th>Почему<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>while внутри for, указатель не сбрасывается<\/td>\n<td>O(n²)<\/td>\n<td>O(n)<\/td>\n<td>указатель сдвигается суммарно ≤ n раз<\/td>\n<\/tr>\n<tr>\n<td>внутренний цикл по удваивающемуся i<\/td>\n<td>O(n log n)<\/td>\n<td>O(n)<\/td>\n<td>1 + 2 + 4 + … &lt; 2n<\/td>\n<\/tr>\n<tr>\n<td>один цикл с <code>x in list<\/code><\/td>\n<td>O(n)<\/td>\n<td>O(n²)<\/td>\n<td><code>in<\/code> по списку — скрытый цикл<\/td>\n<\/tr>\n<tr>\n<td>один цикл со срезом или склейкой строк<\/td>\n<td>O(n)<\/td>\n<td>O(n²)<\/td>\n<td>копирование на каждом шаге<\/td>\n<\/tr>\n<tr>\n<td>sorted / max / sum внутри цикла<\/td>\n<td>O(n)<\/td>\n<td>O(n²) и хуже<\/td>\n<td>встроенная функция проходит все данные<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"title": "Память", "html": "<p>Считают <strong>дополнительную<\/strong> память сверх входа. Новый список длины n — O(n); несколько переменных — O(1); рекурсия глубиной d — O(d) на стек вызовов (это часто забывают).<\/p><h4>Память на примерах<\/h4><p>Вопрос, который нужно задать себе: <strong>какие структуры я создаю и до какого размера они вырастают в худшем случае?<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Код<\/th>\n<th>Доп. память<\/th>\n<th>Почему<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>total = 0; for x in arr: total += x<\/code><\/td>\n<td>O(1)<\/td>\n<td>фиксированное число переменных<\/td>\n<\/tr>\n<tr>\n<td><code>arr.reverse()<\/code> или обмен двумя указателями<\/td>\n<td>O(1)<\/td>\n<td>меняем вход на месте<\/td>\n<\/tr>\n<tr>\n<td><code>arr[::-1]<\/code> или <code>sorted(arr)<\/code><\/td>\n<td>O(n)<\/td>\n<td>создаётся новый список<\/td>\n<\/tr>\n<tr>\n<td><code>seen = set(arr)<\/code><\/td>\n<td>O(n)<\/td>\n<td>до n элементов в множестве<\/td>\n<\/tr>\n<tr>\n<td><code>Counter(s)<\/code> для строки из букв a–z<\/td>\n<td>O(1) или O(k)<\/td>\n<td>не больше 26 ключей, не зависит от n<\/td>\n<\/tr>\n<tr>\n<td><code>[[0] * m for _ in range(n)]<\/code><\/td>\n<td>O(n·m)<\/td>\n<td>таблица n × m<\/td>\n<\/tr>\n<tr>\n<td>рекурсия глубиной n<\/td>\n<td>O(n)<\/td>\n<td>n кадров на стеке вызовов<\/td>\n<\/tr>\n<tr>\n<td>рекурсивный бинарный поиск<\/td>\n<td>O(log n)<\/td>\n<td>глубина рекурсии log n<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Учитывать ли ответ?<\/strong> Если задача требует вернуть список длины n, сам ответ обычно в доп. память не засчитывают. Лучше проговорить явно: «O(1) дополнительной памяти, не считая выходного массива».<\/p>\n<p><strong>Учитывать ли сортировку?<\/strong> <code>arr.sort()<\/code> в Python сортирует на месте, но внутри Timsort использует до O(n) вспомогательной памяти. На собесе достаточно сказать: «O(1) памяти, не считая сортировки» — или сразу «O(n) с учётом сортировки».<\/p>"}, {"title": "Компромисс время ↔ память", "section": "Память", "html": "<p>Очень часто время покупают за память. Это нормальная и ожидаемая сделка, но её нужно называть.<\/p>\n<div class=\"tw\"><table
